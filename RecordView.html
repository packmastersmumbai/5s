<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>PackMasters 5S — Record</title>
<style>
  /* Local aliases onto the canonical CommonStyles palette.
     This page deliberately does NOT include CommonStyles — see
     serveRecordViewFast_() in 20_EnhancedWebApp.js: it is anonymous,
     high-traffic, and skipping the include avoids parsing ~195KB of
     ZONE_CONFIG per load. Values below are copied from CommonStyles :root
     so the two stay in visual sync; the short local names are kept so the
     29 var() uses in this file are untouched.
     KEEP IN SYNC with CommonStyles.html :root. Updated 2026-08-20. */
  :root {
    --ink: #0F172A;    /* = --text-primary   */
    --ink2: #475569;   /* = --text-secondary */
    --ink3: #94A3B8;   /* = --text-muted     */
    --line: #E2E8F0;   /* = --border         */
    --line-lt: #F1F5F9;/* = --border-light   */
    --bg: #F8FAFC;     /* = --bg-page        */
    --card: #FFFFFF;   /* = --bg-card        */
    --accent: #2F9E44; /* = --pm-accent      */
    --accent-soft: #EBFBEE; /* = --score-green-bg */
    --red: #C92A2A;    /* = --score-red      */
    --red-bg: #FFF5F5; /* = --score-red-bg   */
    --amber: #E67700;  /* = --score-amber    */
    --amber-bg: #FFF3E0; /* = --score-amber-bg */
    --green: #2F9E44;  /* = --score-green    */
    --green-bg: #EBFBEE; /* = --score-green-bg */
    --r: 8px;          /* = --r              */
    --shadow: 0 1px 3px rgba(0,0,0,.06); /* = --shadow */
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--ink);
    padding: clamp(10px, 3vw, 24px) clamp(10px, 3vw, 24px) 40px;
  }
  .wrap { max-width: 620px; margin: 0 auto; }
  @media (min-width: 720px) { .wrap { max-width: 640px; } }
  @media (min-width: 1100px) { .wrap { max-width: 680px; } }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
    padding: clamp(14px, 4vw, 22px) clamp(14px, 4vw, 22px) clamp(16px, 4vw, 24px);
    box-shadow: var(--shadow);
  }
  .err { color: var(--red); font-size: 14px; padding: 40px 0; text-align: center; }

  /* Skeleton — mirrors the loaded card's shape so the layout doesn't jump
     and it reads as "already arriving" rather than a blank wait. */
  @keyframes shimmer { 0% { background-position: -200px 0; } 100% { background-position: 200px 0; } }
  .sk {
    background: linear-gradient(90deg, var(--line-lt) 25%, var(--line) 37%, var(--line-lt) 63%);
    background-size: 400px 100%; animation: shimmer 1.3s ease-in-out infinite;
    border-radius: 6px;
  }
  .sk-row { display: flex; gap: 10px; margin-bottom: 10px; }
  .sk-badge { width: 60px; height: 22px; border-radius: 20px; }
  .sk-status { width: 50px; height: 20px; border-radius: 20px; margin-left: auto; }
  .sk-id { width: 45%; height: 12px; margin-bottom: 12px; }
  .sk-title { width: 85%; height: 20px; margin-bottom: 4px; }
  .sk-title2 { width: 55%; height: 20px; margin-bottom: 18px; }
  .sk-field { width: 100%; height: 14px; margin-bottom: 14px; }
  .sk-field:nth-child(odd) { width: 70%; }

  .hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
  .badge { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 20px; }
  .badge.NCR    { background: var(--red-bg);   color: var(--red); }
  .badge.Task   { background: var(--green-bg); color: var(--green); }
  .badge.RedTag { background: var(--amber-bg); color: var(--amber); }
  .badge.GembaWalk { background: #EDE9FE; color: #6D28D9; }
  .badge.Kaizen    { background: #DBEAFE; color: #1D4ED8; }

  /* Gemba findings. A walk is a list of checks and the only thing a reader
     actually wants is which ones failed, so a failure is a full row with a red
     bar, and the passes collapse into a quiet block underneath. */
  .fh { margin: 18px 0 8px; font-size: 12.5px; font-weight: 700; color: var(--ink2);
        text-transform: uppercase; letter-spacing: .04em; }
  .fi { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px;
        border-radius: 8px; margin-bottom: 6px; font-size: 13.5px; line-height: 1.45; }
  .fi.no { background: var(--red-bg); border-left: 3px solid var(--red); }
  .fi.ok { background: #F8FAFC; border-left: 3px solid #CBD5E1; }
  .fi .fa { font-weight: 800; flex: 0 0 auto; font-size: 12px; padding-top: 1px; }
  .fi.no .fa { color: var(--red); }
  .fi.ok .fa { color: #64748B; }
  .fi .fq { color: var(--ink); }
  .fi .ftag { display: block; margin-top: 3px; font-size: 11.5px; color: var(--ink2); }
  .fmore { margin-top: 4px; font-size: 12.5px; color: var(--ink2); cursor: pointer;
           background: none; border: 0; padding: 6px 0; text-decoration: underline; }
  .tasklist { margin-top: 4px; }
  .tasklist a { display: inline-block; margin: 0 6px 6px 0; padding: 5px 10px;
                background: var(--green-bg); color: var(--green); border-radius: 6px;
                font-size: 12.5px; font-weight: 700; text-decoration: none; }
  .st {
    font-size: 11px; font-weight: 700; color: var(--ink2); padding: 3px 10px;
    border: 1px solid var(--line); border-radius: 20px; text-transform: uppercase; letter-spacing: .04em;
  }
  .id { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink3); margin-bottom: 10px; }
  .ti { font-size: 18px; font-weight: 700; line-height: 1.35; margin-bottom: 16px; }

  .tbl { width: 100%; border-collapse: collapse; }
  .tbl td { padding: 9px 0; border-top: 1px solid var(--line-lt); vertical-align: top; font-size: 13.5px; }
  .tbl td.l { color: var(--ink2); width: 36%; font-size: 12.5px; }
  .tbl td.v { color: var(--ink); }

  /* ── Photo gallery ── */
  .gal-hd {
    font-size: 12px; font-weight: 700; color: var(--ink2); text-transform: uppercase;
    letter-spacing: .04em; margin: 18px 0 8px;
  }
  .gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
  @media (min-width: 500px) { .gal { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); } }
  .gal-thumb {
    width: 100%; aspect-ratio: 1; border-radius: 10px; object-fit: cover;
    border: 1px solid var(--line); cursor: zoom-in;
    transition: transform .15s ease, box-shadow .15s ease;
    background: var(--line-lt); /* visible placeholder while the image itself loads */
  }
  .gal-thumb:hover { transform: scale(1.06); box-shadow: 0 4px 16px rgba(16,24,40,.15); }
  @media (hover: none) { .gal-thumb:hover { transform: none; box-shadow: none; } }

  .signin {
    display: block; margin-top: 12px; text-align: center; background: var(--card);
    color: var(--accent); text-decoration: none; padding: 11px; border-radius: 10px;
    font-size: 12.5px; font-weight: 600; border: 1px solid var(--line);
  }
  .foot { margin-top: 14px; text-align: center; font-size: 11px; color: var(--ink3); }

  /* ── Quick action (no login) ── */
  .qa-box {
    margin-top: 18px; padding: 14px; background: var(--accent-soft);
    border: 1px solid #cfe0ff; border-radius: 12px;
  }
  .qa-label { font-size: 11.5px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 8px; }
  .qa-name {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
    font-size: 14px; margin-bottom: 8px; font-family: inherit; box-sizing: border-box;
  }
  .qa-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .qa-btn {
    flex: 1; min-width: 110px; padding: 11px; border: none; border-radius: 9px;
    background: var(--accent); color: #fff; font-size: 13.5px; font-weight: 700; cursor: pointer;
  }
  .qa-btn:disabled { opacity: .55; cursor: default; }
  .qa-msg { font-size: 12.5px; margin-top: 8px; min-height: 16px; }
  .qa-msg.ok { color: var(--green); font-weight: 600; }
  .qa-msg.err { color: var(--red); font-weight: 600; }

  /* ── Lightbox + annotator ── */
  .lb {
    display: none; position: fixed; inset: 0; z-index: 500; background: rgba(8,8,14,.95);
    flex-direction: column; align-items: center; justify-content: center;
  }
  .lb.open { display: flex; }
  .lb-bar {
    flex: 0 0 auto; display: flex; gap: 6px; padding: 10px; background: #16161f;
    flex-wrap: wrap; align-items: center; width: 100%; box-sizing: border-box; justify-content: center;
  }
  .lb-bar button, .lb-bar select {
    padding: 8px 11px; border: 1px solid #3a3a48; border-radius: 8px; background: #24242f;
    color: #d7d9e2; font-size: 12.5px; cursor: pointer; font-family: inherit;
  }
  .lb-bar button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .lb-bar button:active { transform: scale(.95); }
  .lb-stage { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; min-height: 0; }
  .lb-stage canvas { max-width: 96vw; max-height: 100%; touch-action: none; background: #000; }
  .lb-foot { flex: 0 0 auto; display: flex; gap: 8px; padding: 10px 14px; width: 100%; box-sizing: border-box; }
  .lb-foot button {
    flex: 1; padding: 12px; border: none; border-radius: 9px; font-size: 13.5px; font-weight: 700; cursor: pointer;
  }
  .lb-close   { background: #2a2a36; color: #d7d9e2; }
  .lb-dl      { background: var(--accent); color: #fff; }
  .lb-nav {
    position: absolute; top: 50%; transform: translateY(-50%); width: 42px; height: 42px;
    border-radius: 50%; border: none; background: rgba(255,255,255,.14); color: #fff; font-size: 15px; cursor: pointer;
  }
  .lb-nav.prev { left: 10px; } .lb-nav.next { right: 10px; }
  .lb-count {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    font-family: 'JetBrains Mono', monospace; font-size: 11px; color: rgba(255,255,255,.7);
    background: rgba(0,0,0,.4); padding: 3px 10px; border-radius: 12px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="rec" class="card">
    <div class="sk-row"><div class="sk sk-badge"></div><div class="sk sk-status"></div></div>
    <div class="sk sk-id"></div>
    <div class="sk sk-title"></div>
    <div class="sk sk-title2"></div>
    <div class="sk sk-field"></div>
    <div class="sk sk-field"></div>
    <div class="sk sk-field"></div>
  </div>
  <div class="foot">PackMasters 5S · read-only</div>
</div>

<!-- ── Photo lightbox + annotate (pen / arrow / circle / text / symbol) ── -->
<div id="lb" class="lb">
  <div class="lb-bar">
    <button type="button" id="an-draw"   class="on" onclick="Annot.tool('draw')">&#9998; Pen</button>
    <button type="button" id="an-arrow"  onclick="Annot.tool('arrow')">&#10142; Arrow</button>
    <button type="button" id="an-circle" onclick="Annot.tool('circle')">&#9711; Circle</button>
    <button type="button" id="an-text"   onclick="Annot.tool('text')">A Text</button>
    <button type="button" id="an-symbol" onclick="Annot.cycleSymbol()">&#10003; Symbol</button>
    <select id="anColor" onchange="Annot.color(this.value)">
      <option value="#e74c3c">Red</option><option value="#f39c12">Amber</option>
      <option value="#2ecc71">Green</option><option value="#3498db">Blue</option><option value="#ffffff">White</option>
    </select>
    <button type="button" onclick="Annot.undo()">&#8630; Undo</button>
  </div>
  <div class="lb-stage">
    <div class="lb-count" id="lbCount"></div>
    <button type="button" class="lb-nav prev" id="lbPrev" onclick="lbStep(-1)">&#10094;</button>
    <canvas id="anCanvas"></canvas>
    <button type="button" class="lb-nav next" id="lbNext" onclick="lbStep(1)">&#10095;</button>
  </div>
  <div class="lb-foot">
    <button type="button" class="lb-close" onclick="closeLb()">Close</button>
    <button type="button" class="lb-dl" onclick="Annot.download()">&#8681; Save annotated image</button>
  </div>
</div>

<script>
var TYPE = '<?= (params && params.type) ? String(params.type).replace(/[^a-zA-Z]/g,"") : "" ?>';
var ID   = '<?= (params && params.id) ? String(params.id).replace(/[^a-zA-Z0-9\-_]/g,"") : "" ?>';
var DU   = '<?= deployUrl ?>';
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function render(rec){
  var el = document.getElementById('rec');
  if(!rec){ el.innerHTML = '<div class="err">Record not found (' + esc(TYPE) + ' ' + esc(ID) + ').</div>'; return; }
  var rows = (rec.fields||[]).filter(function(f){ return f.v!=='' && f.v!=null; })
    .map(function(f){ return '<tr><td class="l">' + esc(f.l) + '</td><td class="v">' + esc(f.v) + '</td></tr>'; }).join('');
  var zoneId = (String(rec.zone||'').match(/Z-\d+/)||[''])[0];
  var editAction = rec.type === 'NCR' ? 'capa' : 'actionlist';
  var next = 'v2=1&action=' + editAction + (zoneId ? '&zone=' + zoneId : '');

  var photos = rec.photoUrls || [];
  var fileIds = rec.photoFileIds || [];
  _lbUrls = photos; _lbFileIds = fileIds;
  var gallery = photos.length
    ? '<div class="gal-hd">Photos (' + photos.length + ')</div><div class="gal">' +
      photos.map(function(u, i){ return '<img class="gal-thumb" src="' + esc(u) + '" onclick="openLb(' + i + ')" alt="Evidence ' + (i+1) + '" loading="lazy" decoding="async">'; }).join('') +
      '</div>'
    : '';

  _currentRec = rec;
  el.innerHTML =
    '<div class="hd"><span class="badge ' + esc(rec.type).replace(/\s/g,'') + '">' + esc(rec.type) + '</span><span class="st">' + esc(rec.status) + '</span></div>' +
    '<div class="id">' + esc(rec.id) + ' · ' + esc(rec.zone) + '</div>' +
    '<div class="ti">' + esc(rec.title) + '</div>' +
    '<table class="tbl">' + rows + '</table>' +
    buildFindings_(rec) +
    buildTaskLinks_(rec) +
    gallery +
    buildQuickAction_(rec) +
    '<a class="signin" href="' + DU + '?v2=1&action=login&next=' + encodeURIComponent(next) + '" target="_top">Sign in for full access</a>';
}

/* Gemba findings. Failures are shown in full and first; passes are collapsed
   behind a toggle so a 30-question walk does not bury its two problems. */
function buildFindings_(rec){
  var f = rec.findings || [];
  /* A walk with counts but no per-question answers is a seeded/legacy row. Say
     so, rather than rendering nothing and letting the reader assume the walk
     found no problems -- the header may well claim "3 findings". */
  if (!f.length) {
    if (rec.type !== 'Gemba Walk') return '';
    return '<div class="fh">Findings</div>' +
           '<div class="fi ok"><span class="fa">—</span><span class="fq">' +
           'Per-question answers were not recorded for this walk, so the individual ' +
           'checks cannot be shown. The counts above are what was saved.</span></div>';
  }
  var fails = f.filter(function(x){ return x.fail; });
  var passes = f.filter(function(x){ return !x.fail; });

  function row(x){
    var tag = [x.sqcdp ? 'SQCDP ' + x.sqcdp : '', x.category || ''].filter(Boolean).join(' \u00b7 ');
    return '<div class="fi ' + (x.fail ? 'no' : 'ok') + '">' +
             '<span class="fa">' + esc(x.a) + '</span>' +
             '<span class="fq">' + esc(x.q) +
               (tag ? '<span class="ftag">' + esc(tag) + '</span>' : '') +
             '</span></div>';
  }

  var html = '';
  if (fails.length) {
    html += '<div class="fh">Findings \u2014 ' + fails.length + ' failed</div>' +
            fails.map(row).join('');
  }
  if (passes.length) {
    html += '<div id="passWrap" style="display:none">' +
              '<div class="fh">Passed \u2014 ' + passes.length + '</div>' +
              passes.map(row).join('') +
            '</div>' +
            '<button type="button" class="fmore" id="passToggle" onclick="togglePasses_()">' +
              'Show ' + passes.length + ' passed check' + (passes.length===1?'':'s') +
            '</button>';
  }
  if (!fails.length && passes.length) {
    html = '<div class="fh">Findings</div>' +
           '<div class="fi ok"><span class="fa">\u2713</span><span class="fq">' +
           'Every check passed on this walk.</span></div>' + html;
  }
  return html;
}

function togglePasses_(){
  var w = document.getElementById('passWrap'), b = document.getElementById('passToggle');
  if (!w || !b) return;
  var open = w.style.display !== 'none';
  w.style.display = open ? 'none' : 'block';
  b.textContent = (open ? 'Show ' : 'Hide ') + w.querySelectorAll('.fi').length + ' passed checks';
}

/* The actions a walk raised are the point of doing it — link straight to them. */
function buildTaskLinks_(rec){
  var t = rec.taskIds || [];
  if (!t.length) return '';
  return '<div class="fh">Actions raised</div><div class="tasklist">' +
    t.map(function(id){
      return '<a href="' + DU + '?v2=1&action=record&type=task&id=' + encodeURIComponent(id) +
             '" target="_top">' + esc(id) + '</a>';
    }).join('') + '</div>';
}

/* ── Quick action (no login) — narrow, safe verbs per type/status.
   Name is captured once and remembered on this device via localStorage. ── */
var _currentRec = null;
function _savedName_(){ try { return localStorage.getItem('pm5s_public_name') || ''; } catch(e){ return ''; } }
function _saveName_(n){ try { localStorage.setItem('pm5s_public_name', n); } catch(e){} }

function buildQuickAction_(rec){
  var opts = quickActionOptions_(rec);
  if (!opts.length) return '';
  var name = esc(_savedName_());
  var btns = opts.map(function(o){
    return '<button type="button" class="qa-btn" onclick="doQuickAction_(\'' + esc(o.action).replace(/'/g,"\\'") + '\',this)">' + esc(o.label) + '</button>';
  }).join('');
  return '<div class="qa-box">' +
    '<div class="qa-label">Quick action — no sign-in needed</div>' +
    '<input type="text" id="qaName" class="qa-name" placeholder="Your name" value="' + name + '" maxlength="60">' +
    '<div class="qa-btns">' + btns + '</div>' +
    '<div class="qa-msg" id="qaMsg"></div>' +
    '</div>';
}

function quickActionOptions_(rec){
  var t = rec.type, s = String(rec.status || '').toUpperCase();
  if (t === 'Task') {
    var o = [];
    if (s === 'BACKLOG' || s === 'THIS_WEEK' || s === 'OPEN') o.push({ action: 'IN_PROGRESS', label: 'Start' });
    if (s !== 'DONE' && s !== 'CLOSED') o.push({ action: 'DONE', label: 'Mark Done' });
    return o;
  }
  if (t === 'Red Tag') {
    var next = { IDENTIFIED: ['EVALUATED','Evaluate'], EVALUATED: ['DISPOSED','Dispose'], DISPOSED: ['CLOSED','Close'] }[s];
    return next ? [{ action: next[0], label: next[1] }] : [];
  }
  if (t === 'NCR' && s !== 'CLOSED') {
    return [{ action: 'ACKNOWLEDGE', label: 'Acknowledge' }];
  }
  return [];
}

function doQuickAction_(action, btn){
  var nameEl = document.getElementById('qaName');
  var name = (nameEl.value || '').trim();
  var msg = document.getElementById('qaMsg');
  if (!name) { msg.textContent = 'Enter your name first.'; msg.className = 'qa-msg err'; nameEl.focus(); return; }
  _saveName_(name);
  btn.disabled = true; var origText = btn.textContent; btn.textContent = '…';
  document.querySelectorAll('.qa-btn').forEach(function(b){ b.disabled = true; });
  var apiType = TYPE; // same type param the page loaded with
  google.script.run
    .withSuccessHandler(function(res){
      if (res && res.success) {
        msg.textContent = 'Done — thanks, ' + name + '.';
        msg.className = 'qa-msg ok';
        load(); // refresh the record to show new status
      } else {
        msg.textContent = (res && res.message) || 'Action failed.';
        msg.className = 'qa-msg err';
        btn.disabled = false; btn.textContent = origText;
        document.querySelectorAll('.qa-btn').forEach(function(b){ b.disabled = false; });
      }
    })
    .withFailureHandler(function(e){
      msg.textContent = 'Error: ' + (e && e.message || 'server error');
      msg.className = 'qa-msg err';
      btn.disabled = false; btn.textContent = origText;
      document.querySelectorAll('.qa-btn').forEach(function(b){ b.disabled = false; });
    })
    .publicRecordAction(apiType, ID, action, name);
}

/* Server-inlined record (see serveRecordViewFast_). Null when the preload was
   skipped or threw - we then fall back to the original round trip. */
var PRELOAD = <?!= (typeof preload !== 'undefined' ? preload : 'null') ?>;

function load(){
  if(!TYPE || !ID){ document.getElementById('rec').innerHTML = '<div class="err">Missing record type or id.</div>'; return; }
  if (PRELOAD) { render(PRELOAD); return; }   // no round trip: already have it
  google.script.run
    .withSuccessHandler(render)
    .withFailureHandler(function(e){ document.getElementById('rec').innerHTML = '<div class="err">Could not load record: ' + esc(e && e.message || '') + '</div>'; })
    .getPublicRecord(TYPE, ID);
}
load();

/* ══════════════════════════════════════════════════════════════════════
   Photo lightbox + annotate — pen / arrow / circle / text / symbol stamp.
   Local-only: draws over the photo and offers a "save annotated image"
   download. This page has no session, so annotations are never written
   back to the record — they're for pointing something out / exporting.
   ══════════════════════════════════════════════════════════════════════ */
var _lbUrls = [], _lbFileIds = [], _lbIdx = 0;

function _lbLoadCurrent(){
  var fid = _lbFileIds[_lbIdx];
  Annot.loading();
  if (fid) {
    // Route through the server so the canvas draws a same-origin data: URL —
    // drive.google.com/thumbnail has no CORS headers, so loading it directly
    // into the canvas would work for *display* but throw on export/annotate.
    google.script.run
      .withSuccessHandler(function(dataUrl){ Annot.load(dataUrl || _lbUrls[_lbIdx], !dataUrl); })
      .withFailureHandler(function(){ Annot.load(_lbUrls[_lbIdx], true); })
      .getPhotoAsDataUrl(fid);
  } else {
    Annot.load(_lbUrls[_lbIdx], true); // no fileId known — view-only, export disabled
  }
}
function openLb(idx){
  _lbIdx = idx;
  document.getElementById('lb').classList.add('open');
  _lbLoadCurrent();
  _lbUpdateNav();
}
function lbStep(dir){
  if (!_lbUrls.length) return;
  _lbIdx = (_lbIdx + dir + _lbUrls.length) % _lbUrls.length;
  _lbLoadCurrent();
  _lbUpdateNav();
}
function _lbUpdateNav(){
  var multi = _lbUrls.length > 1;
  document.getElementById('lbPrev').style.display = multi ? '' : 'none';
  document.getElementById('lbNext').style.display = multi ? '' : 'none';
  document.getElementById('lbCount').textContent = (_lbIdx + 1) + ' / ' + _lbUrls.length;
}
function closeLb(){ document.getElementById('lb').classList.remove('open'); }
document.addEventListener('keydown', function(e){
  var lb = document.getElementById('lb');
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape') closeLb();
  else if (e.key === 'ArrowLeft') lbStep(-1);
  else if (e.key === 'ArrowRight') lbStep(1);
});

var Annot = (function(){
  var canvas, ctx, baseImg = null, strokes = [], cur = null;
  var tool = 'draw', color = '#e74c3c', lineW = 5;
  var symbols = ['✓', '✗', '⚠']; var symIdx = 0; // check, cross, warning
  var pendingText = null; // {x,y} while composing a text annotation

  function drawOne(s){
    ctx.strokeStyle = s.color; ctx.fillStyle = s.color; ctx.lineWidth = s.lineW;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (s.type === 'draw') {
      ctx.beginPath();
      s.pts.forEach(function(p, i){ i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); });
      ctx.stroke();
    } else if (s.type === 'circle') {
      ctx.beginPath();
      ctx.ellipse((s.sx+s.ex)/2, (s.sy+s.ey)/2, Math.abs(s.ex-s.sx)/2, Math.abs(s.ey-s.sy)/2, 0, 0, 2*Math.PI);
      ctx.stroke();
    } else if (s.type === 'arrow') {
      ctx.beginPath(); ctx.moveTo(s.sx, s.sy); ctx.lineTo(s.ex, s.ey); ctx.stroke();
      var a = Math.atan2(s.ey - s.sy, s.ex - s.sx), h = 8 + s.lineW * 2;
      ctx.beginPath(); ctx.moveTo(s.ex, s.ey);
      ctx.lineTo(s.ex - h*Math.cos(a-0.4), s.ey - h*Math.sin(a-0.4));
      ctx.lineTo(s.ex - h*Math.cos(a+0.4), s.ey - h*Math.sin(a+0.4));
      ctx.closePath(); ctx.fill();
    } else if (s.type === 'text') {
      var fs = Math.max(18, Math.round(canvas.width * 0.028));
      ctx.font = 'bold ' + fs + 'px Arial';
      ctx.textBaseline = 'top';
      ctx.lineWidth = Math.max(3, fs * 0.12); ctx.strokeStyle = 'rgba(0,0,0,.55)';
      ctx.strokeText(s.text, s.x, s.y);
      ctx.fillText(s.text, s.x, s.y);
    } else if (s.type === 'symbol') {
      var sfs = Math.max(28, Math.round(canvas.width * 0.06));
      ctx.font = 'bold ' + sfs + 'px Arial'; ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
      ctx.lineWidth = Math.max(3, sfs * 0.1); ctx.strokeStyle = 'rgba(0,0,0,.55)';
      ctx.strokeText(s.glyph, s.x, s.y); ctx.fillText(s.glyph, s.x, s.y);
      ctx.textAlign = 'left';
    }
  }

  function redraw(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (baseImg) ctx.drawImage(baseImg, 0, 0, canvas.width, canvas.height);
    strokes.forEach(drawOne);
    if (cur) drawOne(cur);
  }

  function pos(ev){
    var r = canvas.getBoundingClientRect();
    var t = ev.touches && ev.touches[0] ? ev.touches[0] : ev;
    return { x: (t.clientX - r.left) * (canvas.width / r.width), y: (t.clientY - r.top) * (canvas.height / r.height) };
  }

  function down(ev){
    ev.preventDefault();
    var p = pos(ev);
    if (tool === 'text') {
      var txt = prompt('Annotation text:');
      if (txt) strokes.push({ type: 'text', color: color, x: p.x, y: p.y, text: txt });
      redraw();
      return;
    }
    if (tool === 'symbol') {
      strokes.push({ type: 'symbol', color: color, x: p.x, y: p.y, glyph: symbols[symIdx] });
      redraw();
      return;
    }
    cur = (tool === 'draw')
      ? { type: 'draw', color: color, lineW: lineW, pts: [p] }
      : { type: tool, color: color, lineW: lineW, sx: p.x, sy: p.y, ex: p.x, ey: p.y };
  }
  function move(ev){
    if (!cur) return;
    ev.preventDefault();
    var p = pos(ev);
    if (cur.type === 'draw') cur.pts.push(p); else { cur.ex = p.x; cur.ey = p.y; }
    redraw();
  }
  function up(){ if (cur) { strokes.push(cur); cur = null; redraw(); } }

  var exportBlocked = false;

  function loading(){
    canvas = document.getElementById('anCanvas'); ctx = canvas.getContext('2d');
    canvas.width = 600; canvas.height = 400;
    ctx.fillStyle = '#0c0c12'; ctx.fillRect(0, 0, 600, 400);
    ctx.fillStyle = '#666'; ctx.font = '13px Arial'; ctx.textAlign = 'center';
    ctx.fillText('Loading…', 300, 200); ctx.textAlign = 'left';
  }

  function load(url, viewOnly){
    strokes = []; cur = null; tool = 'draw'; exportBlocked = !!viewOnly;
    document.querySelectorAll('.lb-bar button[id^="an-"]').forEach(function(b){ b.classList.remove('on'); });
    document.getElementById('an-draw').classList.add('on');
    var dl = document.querySelector('.lb-dl');
    if (dl) dl.textContent = exportBlocked ? '⤓ Save (unavailable — open image link instead)' : '⤓ Save annotated image';
    canvas = document.getElementById('anCanvas'); ctx = canvas.getContext('2d');
    var img = new Image();
    img.onload = function(){
      baseImg = img;
      var maxW = Math.min(1100, img.width), scale = maxW / img.width;
      canvas.width = maxW; canvas.height = Math.round(img.height * scale);
      redraw();
    };
    img.onerror = function(){
      canvas.width = 600; canvas.height = 400;
      ctx.fillStyle = '#1a1a1a'; ctx.fillRect(0,0,600,400);
      ctx.fillStyle = '#aaa'; ctx.font = '14px Arial'; ctx.textAlign = 'center';
      ctx.fillText('Preview unavailable', 300, 200);
      ctx.textAlign = 'left';
    };
    img.src = url;
    if (!canvas._wired) {
      canvas._wired = true;
      canvas.addEventListener('mousedown', down); canvas.addEventListener('mousemove', move);
      window.addEventListener('mouseup', up);
      canvas.addEventListener('touchstart', down, { passive: false });
      canvas.addEventListener('touchmove', move, { passive: false });
      canvas.addEventListener('touchend', up);
    }
  }

  return {
    load: load,
    loading: loading,
    tool: function(t){
      tool = t;
      document.querySelectorAll('.lb-bar button[id^="an-"]').forEach(function(b){ b.classList.remove('on'); });
      var btn = document.getElementById('an-' + t);
      if (btn) btn.classList.add('on');
    },
    cycleSymbol: function(){
      symIdx = (symIdx + 1) % symbols.length;
      this.tool('symbol');
      document.getElementById('an-symbol').textContent = symbols[symIdx] + ' Symbol';
    },
    color: function(c){ color = c; },
    undo: function(){ strokes.pop(); redraw(); },
    download: function(){
      if (exportBlocked) { alert('This image could not be loaded for editing — open its original link and save from there.'); return; }
      var a = document.createElement('a');
      try {
        a.href = canvas.toDataURL('image/jpeg', 0.9);
      } catch (e) {
        alert('Could not export this image. Right-click the image → Save image instead.');
        return;
      }
      a.download = 'annotated-' + Date.now() + '.jpg';
      a.click();
    }
  };
})();
</script>
</body>
</html>
