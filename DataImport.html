<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>*{box-sizing:border-box;}body{font-family:Arial,sans-serif;margin:0;padding:20px;}.form-group{margin-bottom:16px;}.form-group label{display:block;font-weight:bold;margin-bottom:6px;}.form-group select,.form-group input{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:14px;}#preview{max-height:200px;overflow:auto;font-size:12px;border:1px solid #ddd;border-radius:8px;padding:8px;background:#f8f9fa;}table{border-collapse:collapse;width:100%;}th,td{padding:4px 6px;border:1px solid #ddd;font-size:11px;text-align:left;}th{background:#1a5276;color:white;}.btn{padding:12px 24px;background:#27ae60;color:white;border:none;border-radius:8px;font-weight:bold;cursor:pointer;width:100%;font-size:15px;}.btn:disabled{background:#ccc;}</style></head><body>
<h2 style="color:#1a5276;">Data Import</h2>
<div class="form-group"><label>Target Sheet</label><select id="targetSheet" onchange="loadHeaders()"><option value="">Select...</option><option value="DailySubmissions">DailySubmissions</option><option value="WeeklyAudit">WeeklyAudit</option></select></div>
<div class="form-group"><label>CSV File</label><input type="file" id="csvFile" accept=".csv,.tsv,.txt" onchange="parseCSV()"></div>
<div id="preview"></div>
<div id="mappingSection" style="display:none;margin-top:16px;"><h3>Column Mapping</h3><div id="mappingFields"></div></div>
<button class="btn" id="importBtn" onclick="doImport()" disabled style="margin-top:16px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="8 17 12 21 16 17"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.88 18.09A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg> Import Data</button>
<div id="importStatus" style="margin-top:12px;text-align:center;color:#999;"></div>
<script>

function escHtml(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

var csvData=[];var sheetHeaders=[];
function loadHeaders(){var sheet=document.getElementById("targetSheet").value;if(!sheet)return;google.script.run.withFailureHandler(function(e){console.error(e);var se=document.querySelector("[id$=Status]");if(se)se.innerHTML="<span style=color:#e74c3c>Error: "+escHtml(e.message)+"</span>";}).withSuccessHandler(function(h){sheetHeaders=h;buildMapping();}).getSheetHeaders(sheet);}
function parseCSV(){var file=document.getElementById("csvFile").files[0];if(!file)return;var reader=new FileReader();reader.onload=function(e){var lines=e.target.result.split("\n").map(function(l){return l.split(",").map(function(c){return c.trim().replace(/^"|"$/g,"");});});csvData=lines;showPreview();buildMapping();};reader.readAsText(file);}
function showPreview(){if(csvData.length===0)return;var html="<table><tr>";csvData[0].forEach(function(h,i){html+="<th>Col "+i+": "+h+"</th>";});html+="</tr>";for(var r=1;r<Math.min(5,csvData.length);r++){html+="<tr>";csvData[r].forEach(function(c){html+="<td>"+c+"</td>";});html+="</tr>";}html+="</table><p>"+csvData.length+" rows</p>";document.getElementById("preview").innerHTML=html;}
function buildMapping(){if(csvData.length===0||sheetHeaders.length===0)return;document.getElementById("mappingSection").style.display="block";var html="";csvData[0].forEach(function(csvCol,i){html+='<div style="margin:4px 0;display:flex;gap:8px;align-items:center;"><span style="min-width:120px;font-size:13px;">'+csvCol+'</span> → <select data-csv="'+i+'" class="mapping-sel" style="flex:1;padding:6px;border:1px solid #ddd;border-radius:4px;"><option value="-1">Skip</option>';sheetHeaders.forEach(function(sh,j){html+='<option value="'+j+'">'+sh+'</option>';});html+='</select></div>';});document.getElementById("mappingFields").innerHTML=html;document.getElementById("importBtn").disabled=false;}
function doImport(){document.getElementById("importBtn").disabled=true;document.getElementById("importStatus").textContent="Importing...";var mapping={};document.querySelectorAll(".mapping-sel").forEach(function(s){if(s.value!=="-1")mapping[s.dataset.csv]=s.value;});var rows=csvData.slice(1).filter(function(r){return r.length>1||r[0];});google.script.run.withFailureHandler(function(e){console.error(e);var se=document.querySelector("[id$=Status]");if(se)se.innerHTML="<span style=color:#e74c3c>Error: "+escHtml(e.message)+"</span>";}).withSuccessHandler(function(r){document.getElementById("importStatus").innerHTML=r.success?'<span style="color:#27ae60;">Imported '+r.importedCount+' rows'+(r.errors.length>0?'. '+r.errors.length+' errors.':'')+'</span>':'<span style="color:#e74c3c;">'+r.message+'</span>';document.getElementById("importBtn").disabled=false;}).importData(document.getElementById("targetSheet").value,rows,mapping);}
</script></body></html>
