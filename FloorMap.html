<script>
// ============================================================================
// Floor Map — client-side controller
// ============================================================================

var _isEditMode   = false;
var _zones        = [];       // working copy (mutated in edit mode)
var _origZones    = [];       // snapshot on enter edit — for cancel
var _renameZoneId = null;
var _refreshTimer = null;
var _svgNS        = "http://www.w3.org/2000/svg";

// ── Bootstrap ───────────────────────────────────────────────────────────────
window.addEventListener('load', function() {
  if (FMD && FMD.zones && FMD.zones.length > 0) {
    renderMap(FMD);
  } else {
    // Fall back to google.script.run if server data was null
    loadMapFromServer();
  }
  // Auto-refresh every 5 minutes
  _refreshTimer = setInterval(function() {
    if (!_isEditMode) loadMapFromServer();
  }, 300000);
});

// ── Data load ────────────────────────────────────────────────────────────────
function loadMapFromServer() {
  showLoading(true);
  google.script.run
    .withSuccessHandler(function(data) {
      if (data && data.zones && data.zones.length > 0) {
        renderMap(data);
      } else {
        showError("No floor map data available. Create a FloorMapConfig sheet or contact your admin.");
      }
    })
    .withFailureHandler(function(err) {
      showError(err && err.message ? err.message : "Server error loading floor map.");
    })
    .getFloorMapData();
}

function refreshMap() {
  if (_isEditMode && !confirm("Refreshing will discard unsaved edits. Continue?")) return;
  _isEditMode = false;
  syncToolbarState();
  loadMapFromServer();
}

// ── Render ───────────────────────────────────────────────────────────────────
function renderMap(data) {
  _zones = data.zones.map(function(z) { return Object.assign({}, z); });
  _origZones = [];

  // Update timestamp chip
  var ts = data.timestamp ? new Date(data.timestamp) : new Date();
  document.getElementById('fmTimestamp').textContent =
    'Updated ' + ts.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});

  var mockNote = data.isMock ? ' (mock data — FloorMapConfig sheet not found)' : '';
  document.getElementById('fmInfoChip').textContent =
    data.zones.length + ' zone' + (data.zones.length !== 1 ? 's' : '') + mockNote;

  drawSVG();
  showLoading(false);
  syncToolbarState();
}

// ── D3 SVG draw ──────────────────────────────────────────────────────────────
function drawSVG() {
  // Wait until D3 is available (deferred script)
  if (typeof d3 === 'undefined') {
    setTimeout(drawSVG, 80);
    return;
  }

  var svg = d3.select('#fm-svg');
  svg.selectAll('*').remove();

  // Floor background
  svg.append('rect')
    .attr('width', 1000).attr('height', 600)
    .attr('fill', '#F8FAFC').attr('rx', 0);

  // Grid lines (subtle)
  var gridG = svg.append('g').attr('class', 'fm-grid').attr('opacity', 0.35);
  for (var gx = 0; gx <= 1000; gx += 100) {
    gridG.append('line').attr('x1',gx).attr('y1',0).attr('x2',gx).attr('y2',600)
      .attr('stroke','#CBD5E1').attr('stroke-width',0.5);
  }
  for (var gy = 0; gy <= 600; gy += 60) {
    gridG.append('line').attr('x1',0).attr('y1',gy).attr('x2',1000).attr('y2',gy)
      .attr('stroke','#CBD5E1').attr('stroke-width',0.5);
  }

  // Floor label
  svg.append('text')
    .attr('x', 990).attr('y', 590)
    .attr('text-anchor', 'end')
    .attr('font-family', "'JetBrains Mono', monospace")
    .attr('font-size', 10)
    .attr('fill', '#CBD5E1')
    .text('FACTORY FLOOR — 5S STATUS MAP');

  // Zone groups
  var zonesG = svg.append('g').attr('class', 'fm-zones');

  _zones.forEach(function(z) {
    drawZone(zonesG, z);
  });
}

function drawZone(parent, z) {
  var g = parent.append('g')
    .attr('class', 'zone-group')
    .attr('data-id', z.id)
    .attr('cursor', _isEditMode ? 'move' : 'pointer');

  // Main rect
  var rect = g.append('rect')
    .attr('x', z.x).attr('y', z.y)
    .attr('width', z.width).attr('height', z.height)
    .attr('fill', z.color)
    .attr('fill-opacity', 0.82)
    .attr('stroke', z.color)
    .attr('stroke-width', z.hasOverdueItems ? 3 : 1.5)
    .attr('rx', 8);

  if (z.hasOverdueItems) {
    rect.attr('class', 'zone-overdue-rect');
  }

  // Zone ID
  var midX = z.x + z.width / 2;
  var midY = z.y + z.height / 2;
  var idSize = Math.max(9, Math.min(14, z.width / 8));

  g.append('text')
    .attr('class', 'zone-id-text')
    .attr('x', midX).attr('y', midY - (z.height > 80 ? 16 : 0))
    .attr('font-size', idSize)
    .text(z.id);

  // Score (only if height permits)
  if (z.height > 70) {
    var scoreSize = Math.max(16, Math.min(28, z.width / 5));
    g.append('text')
      .attr('class', 'zone-score-text')
      .attr('x', midX).attr('y', midY + (z.height > 100 ? 10 : 0))
      .attr('font-size', scoreSize)
      .text(z.score !== null ? z.score + '%' : '—');
  }

  // Label below score (only if tall enough)
  if (z.height > 110) {
    var lblSize = Math.max(8, Math.min(11, z.width / 16));
    // Trim label so it fits
    var lbl = z.label || z.id;
    if (lbl.length > 22) lbl = lbl.substring(0, 20) + '…';
    g.append('text')
      .attr('class', 'zone-label-text')
      .attr('x', midX).attr('y', midY + 32)
      .attr('font-size', lblSize)
      .text(lbl);
  }

  // Badge: open CAPAs (top-right)
  if (z.openCAPAs > 0) {
    drawBadge(g, z.x + z.width - 14, z.y + 14, z.openCAPAs, '#DC2626');
  }

  // Badge: open RedTags (top-left)
  if (z.openRedTags > 0) {
    drawBadge(g, z.x + 14, z.y + 14, z.openRedTags, '#7C3AED');
  }

  // ── Edit mode: resize handle (bottom-right corner) ──
  if (_isEditMode) {
    var hSize = 14;
    var hG = g.append('g').attr('class', 'resize-handle');
    hG.append('rect')
      .attr('x', z.x + z.width - hSize - 2)
      .attr('y', z.y + z.height - hSize - 2)
      .attr('width', hSize).attr('height', hSize)
      .attr('fill', 'rgba(255,255,255,0.7)')
      .attr('stroke', 'rgba(0,0,0,0.3)')
      .attr('stroke-width', 1)
      .attr('rx', 3);
    // grip dots
    hG.append('circle').attr('cx', z.x+z.width-8).attr('cy', z.y+z.height-8).attr('r', 1.5).attr('fill', '#64748B');
    hG.append('circle').attr('cx', z.x+z.width-12).attr('cy', z.y+z.height-8).attr('r', 1.5).attr('fill', '#64748B');
    hG.append('circle').attr('cx', z.x+z.width-8).attr('cy', z.y+z.height-12).attr('r', 1.5).attr('fill', '#64748B');

    attachResizeDrag(hG, z);
    attachDragBehavior(g, z);

    // Double-click to rename
    g.on('dblclick', function(event) {
      event.preventDefault();
      openRenameModal(z.id);
    });
  } else {
    // View mode: hover tooltip + click navigate
    g.on('mouseenter', function(event) { showTooltip(event, z); })
     .on('mousemove',  function(event) { moveTooltip(event); })
     .on('mouseleave', function()       { hideTooltip(); })
     .on('click',      function()       { navigateToZone(z.id); });
  }
}

function drawBadge(parent, cx, cy, count, color) {
  parent.append('circle')
    .attr('class','badge-circle')
    .attr('cx', cx).attr('cy', cy).attr('r', 10)
    .attr('fill', color);
  parent.append('text')
    .attr('class', 'badge-text')
    .attr('x', cx).attr('y', cy)
    .attr('font-size', count > 9 ? 8 : 10)
    .text(count > 99 ? '99+' : count);
}

// ── D3 drag for zone move ────────────────────────────────────────────────────
function attachDragBehavior(g, z) {
  var drag = d3.drag()
    .filter(function(event) {
      // Don't start drag on resize handle
      return !event.target.closest || !event.target.closest('.resize-handle');
    })
    .on('start', function(event) {
      d3.select(this).raise();
    })
    .on('drag', function(event) {
      var nx = Math.max(0, Math.min(1000 - z.width, event.x - z.width / 2));
      var ny = Math.max(0, Math.min(600 - z.height, event.y - z.height / 2));
      z.x = Math.round(nx);
      z.y = Math.round(ny);
      drawSVG();
    });

  g.call(drag);
}

function attachResizeDrag(handle, z) {
  var drag = d3.drag()
    .on('drag', function(event) {
      var newW = Math.max(60, Math.min(1000 - z.x, event.x - z.x));
      var newH = Math.max(50, Math.min(600 - z.y, event.y - z.y));
      z.width  = Math.round(newW);
      z.height = Math.round(newH);
      drawSVG();
    });
  handle.call(drag);
}

// ── Tooltip ──────────────────────────────────────────────────────────────────
function showTooltip(event, z) {
  var tt = document.getElementById('fm-tooltip');
  var scoreHtml = z.score !== null
    ? '<div class="tt-score" style="color:' + z.color + '">' + z.score + '%</div>'
    : '<div class="tt-score" style="color:#94A3B8">—</div>';

  var overdueHtml = z.hasOverdueItems
    ? '<div class="tt-overdue">⚠ Overdue items present</div>'
    : '';

  tt.innerHTML =
    '<div class="tt-id">' + escHtml(z.id) + '</div>' +
    '<div class="tt-label">' + escHtml(z.label || z.id) + '</div>' +
    scoreHtml +
    '<div class="tt-row"><span>Open CAPAs</span><span>' + z.openCAPAs + '</span></div>' +
    '<div class="tt-row"><span>Open Red Tags</span><span>' + z.openRedTags + '</span></div>' +
    overdueHtml +
    '<div class="tt-hint">Click to open zone dashboard</div>';

  tt.style.display = 'block';
  moveTooltip(event);
}

function moveTooltip(event) {
  var tt = document.getElementById('fm-tooltip');
  var x = (event.clientX || event.pageX || 0) + 18;
  var y = (event.clientY || event.pageY || 0) - 12;
  var ttW = 240, ttH = 160;
  if (x + ttW > window.innerWidth)  x = (event.clientX || event.pageX || 0) - ttW - 10;
  if (y + ttH > window.innerHeight) y = (event.clientY || event.pageY || 0) - ttH - 10;
  tt.style.left = x + 'px';
  tt.style.top  = y + 'px';
}

function hideTooltip() {
  document.getElementById('fm-tooltip').style.display = 'none';
}

// ── Navigate ─────────────────────────────────────────────────────────────────
function navigateToZone(zoneId) {
  if (DEPLOY_URL) {
    var token = getTokenFromUrl();
    var url = DEPLOY_URL + '?v2=1&action=home&zone=' + encodeURIComponent(zoneId) +
              (token ? '&token=' + encodeURIComponent(token) : '');
    window.parent.location.href = url;
  }
}

function getTokenFromUrl() {
  try {
    var m = window.location.search.match(/[?&]token=([^&]+)/);
    return m ? decodeURIComponent(m[1]) : '';
  } catch(e) { return ''; }
}

// ── Edit mode ────────────────────────────────────────────────────────────────
function enterEditMode() {
  _isEditMode = true;
  _origZones = _zones.map(function(z) { return Object.assign({}, z); });
  syncToolbarState();
  drawSVG();
  pmToast('Edit mode active — drag zones, resize corners, double-click to rename.', 'info');
}

function cancelEdit() {
  _isEditMode = false;
  _zones = _origZones.map(function(z) { return Object.assign({}, z); });
  _origZones = [];
  syncToolbarState();
  drawSVG();
}

function saveLayout() {
  var saveBtn = document.getElementById('btnSave');
  saveBtn.disabled = true;
  saveBtn.textContent = 'Saving…';

  var layoutJSON = JSON.stringify(_zones.map(function(z) {
    return {
      id:         z.id,
      x:          z.x,
      y:          z.y,
      width:      z.width,
      height:     z.height,
      label:      z.label,
      floorLevel: z.floorLevel || 'GF'
    };
  }));

  google.script.run
    .withSuccessHandler(function(result) {
      saveBtn.disabled = false;
      saveBtn.textContent = 'Save';
      if (result && result.success) {
        _isEditMode = false;
        _origZones = [];
        syncToolbarState();
        drawSVG();
        pmToast('Layout saved successfully.', 'success');
      } else {
        pmToast((result && result.message) ? result.message : 'Save failed.', 'error');
      }
    })
    .withFailureHandler(function(err) {
      saveBtn.disabled = false;
      saveBtn.textContent = 'Save';
      pmToast((err && err.message) ? err.message : 'Server error saving layout.', 'error');
    })
    .saveFloorMapLayout(layoutJSON);
}

// ── Rename modal ─────────────────────────────────────────────────────────────
function openRenameModal(zoneId) {
  _renameZoneId = zoneId;
  var z = _zones.find(function(z) { return z.id === zoneId; });
  var inp = document.getElementById('fmRenameInput');
  inp.value = z ? (z.label || z.id) : '';
  document.getElementById('fmRenameOverlay').style.display = 'flex';
  inp.focus();
  inp.select();
}

function cancelRename() {
  _renameZoneId = null;
  document.getElementById('fmRenameOverlay').style.display = 'none';
}

function applyRename() {
  var newLabel = document.getElementById('fmRenameInput').value.trim();
  if (!newLabel) { pmToast('Label cannot be empty.', 'warn'); return; }
  var z = _zones.find(function(z) { return z.id === _renameZoneId; });
  if (z) {
    z.label = newLabel;
    document.getElementById('btnSave').disabled = false;
  }
  cancelRename();
  drawSVG();
}

// Enter key in rename input
document.addEventListener('DOMContentLoaded', function() {
  var inp = document.getElementById('fmRenameInput');
  if (inp) {
    inp.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') applyRename();
      if (e.key === 'Escape') cancelRename();
    });
  }
});

// ── Toolbar state sync ────────────────────────────────────────────────────────
function syncToolbarState() {
  var modeChip = document.getElementById('fmModeChip');
  var btnEdit   = document.getElementById('btnEdit');
  var btnSave   = document.getElementById('btnSave');
  var btnCancel = document.getElementById('btnCancel');

  if (_isEditMode) {
    modeChip.textContent = 'Edit';
    modeChip.className = 'fm-mode-chip edit';
    btnEdit.style.display   = 'none';
    btnSave.style.display   = 'inline-flex';
    btnCancel.style.display = 'inline-flex';
  } else {
    modeChip.textContent = 'View';
    modeChip.className = 'fm-mode-chip view';
    btnEdit.style.display   = 'inline-flex';
    btnSave.style.display   = 'none';
    btnCancel.style.display = 'none';
  }
}

// ── Loading / Error helpers ───────────────────────────────────────────────────
function showLoading(show) {
  document.getElementById('fmLoading').style.display = show ? 'flex' : 'none';
  document.getElementById('fmError').style.display   = 'none';
}

function showError(msg) {
  document.getElementById('fmLoading').style.display = 'none';
  document.getElementById('fmErrorMsg').textContent = msg || 'Unknown error.';
  document.getElementById('fmError').style.display  = 'flex';
}

// ── XSS helper ───────────────────────────────────────────────────────────────
function escHtml(s) {
  if (!s) return '';
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

// ── pmToast fallback (in case CommonStyles version not available) ─────────────
if (typeof pmToast === 'undefined') {
  window.pmToast = function(msg, type) { console.log('[Toast][' + (type||'info') + '] ' + msg); };
}
</script>
