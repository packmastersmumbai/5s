<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PackMasters — Raise Red Tag</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Plus Jakarta Sans',sans-serif;background:oklch(96% 0.014 82);min-height:100vh}

  .rt-header{background:oklch(20% 0.02 260);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:12px}
  .rt-back{color:rgba(255,255,255,.7);text-decoration:none;font-size:12px;padding:4px 8px;border:1px solid rgba(255,255,255,.2);border-radius:6px;white-space:nowrap}
  .rt-back:hover{color:#fff}
  .rt-header h1{font-size:15px;font-weight:600}
  .rt-accent{display:inline-block;width:10px;height:10px;background:#e85c2e;border-radius:50%;margin-right:8px}

  .rt-form-wrap{max-width:560px;margin:28px auto;padding:0 16px 40px}

  .rt-card{background:#fff;border-radius:12px;border:1px solid #e0e4ee;padding:24px}
  .rt-card-title{font-size:13px;font-weight:700;color:#e85c2e;letter-spacing:.5px;text-transform:uppercase;margin-bottom:20px;display:flex;align-items:center;gap:8px}
  .rt-card-title::before{content:'';display:inline-block;width:16px;height:3px;background:#e85c2e;border-radius:2px}

  .form-row{margin-bottom:18px}
  .form-row label{display:block;font-size:11px;font-weight:700;color:#5a6070;letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px}
  .form-row input,.form-row select,.form-row textarea{width:100%;padding:10px 14px;border:1.5px solid #d0d4de;border-radius:8px;font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;color:#1a2235;background:#fff;transition:border-color .15s,box-shadow .15s;outline:none}
  .form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:#e85c2e;box-shadow:0 0 0 3px rgba(232,92,46,.10)}
  .form-row textarea{resize:vertical;min-height:80px;line-height:1.5}
  .form-row select{appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0l5 6 5-6z' fill='%236b7280'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 14px center;padding-right:36px}

  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:480px){.form-grid{grid-template-columns:1fr}}

  .rt-submit{width:100%;padding:14px;background:#e85c2e;color:#fff;border:none;border-radius:8px;font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:background .15s,transform .1s;letter-spacing:.3px;margin-top:8px}
  .rt-submit:hover{background:#cc4820}
  .rt-submit:active{transform:scale(.98)}
  .rt-submit:disabled{background:#c0c8d8;cursor:not-allowed;transform:none}

  .rt-success{display:none;text-align:center;padding:48px 24px}
  .rt-success-icon{font-size:56px;margin-bottom:16px}
  .rt-success h2{font-size:18px;font-weight:700;color:#1a2235;margin-bottom:8px}
  .rt-success p{font-size:13px;color:#6b7280;margin-bottom:24px}
  .rt-success-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .btn-outline{padding:10px 20px;border:1.5px solid #d0d4de;border-radius:8px;background:#fff;font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:600;color:#3a4a70;cursor:pointer;transition:border-color .15s}
  .btn-outline:hover{border-color:#e85c2e;color:#e85c2e}
  .btn-primary{padding:10px 20px;border:none;border-radius:8px;background:#e85c2e;font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:700;color:#fff;cursor:pointer;transition:background .15s}
  .btn-primary:hover{background:#cc4820}

  .rt-error{display:none;background:#fef2ee;border:1px solid #f4b8a0;border-radius:8px;padding:12px 16px;margin-top:16px;font-size:13px;color:#b83a14}
</style>
</head>
<body>

<div class="rt-header">
  <a class="rt-back" href="javascript:history.back()">&#8592; Back</a>
  <h1><span class="rt-accent"></span>Raise Red Tag</h1>
</div>

<div class="rt-form-wrap">
  <div class="rt-card" id="form-section">
    <div class="rt-card-title">Item Details</div>

    <form id="rt-form" onsubmit="submitForm(event)">
      <div class="form-row">
        <label>Zone <span style="color:#e85c2e">*</span></label>
        <select id="f-zone" required>
          <option value="">&#8212; Select Zone &#8212;</option>
        </select>
      </div>

      <div class="form-row">
        <label>Item Description <span style="color:#e85c2e">*</span></label>
        <textarea id="f-item" required placeholder="Describe the item clearly (what it is, where found)"></textarea>
      </div>

      <div class="form-grid">
        <div class="form-row">
          <label>Quantity</label>
          <input type="number" id="f-qty" min="1" value="1">
        </div>
        <div class="form-row">
          <label>Category <span style="color:#e85c2e">*</span></label>
          <select id="f-category" required>
            <option value="">&#8212; Select &#8212;</option>
            <option>Raw Material</option>
            <option>WIP</option>
            <option>Finished Goods</option>
            <option>Equipment</option>
            <option>Tools</option>
            <option>Consumables</option>
            <option>Waste</option>
            <option>Other</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <label>Reason for Tagging <span style="color:#e85c2e">*</span></label>
        <select id="f-reason" required>
          <option value="">&#8212; Select Reason &#8212;</option>
          <option>No Longer Needed</option>
          <option>Defective / Damaged</option>
          <option>Unknown Item</option>
          <option>Wrong Location</option>
          <option>Excess Quantity</option>
          <option>Expired / Obsolete</option>
          <option>Safety Hazard</option>
          <option>Other</option>
        </select>
      </div>

      <div class="form-row">
        <label>Suggested Action</label>
        <select id="f-action">
          <option value="">&#8212; Select Action &#8212;</option>
          <option>Return to Supplier</option>
          <option>Move to Correct Location</option>
          <option>Scrap / Dispose</option>
          <option>Repair and Reuse</option>
          <option>Sell / Transfer</option>
          <option>Evaluate Further</option>
        </select>
      </div>

      <div class="form-row">
        <label>Tagged By <span style="color:#e85c2e">*</span></label>
        <input type="text" id="f-taggedby" required placeholder="Your name">
      </div>

      <div class="form-row">
        <label>Remarks</label>
        <textarea id="f-remarks" rows="2" placeholder="Optional notes"></textarea>
      </div>

      <div class="rt-error" id="rt-error"></div>

      <button type="submit" class="rt-submit" id="submit-btn">Raise Red Tag</button>
    </form>
  </div>

  <div class="rt-success" id="success-section">
    <div class="rt-success-icon">&#128308;</div>
    <h2>Red Tag Raised!</h2>
    <p id="success-msg">The item has been logged and is pending action.</p>
    <div class="rt-success-btns">
      <button class="btn-outline" onclick="resetForm()">Raise Another</button>
      <button class="btn-primary" onclick="goToBoard()">View Board</button>
    </div>
  </div>
</div>

<script>
var ZONES_FALLBACK = [
  'Z-01','Z-02','Z-03','Z-04','Z-05','Z-06','Z-07','Z-08','Z-09',
  'Z-10','Z-11','Z-12','Z-13','Z-14','Z-15','Z-16','Z-17','Z-18','Z-19',
  'Z-20','Z-21','Z-22','Z-23','Z-24','Z-25','Z-26','Z-27','Z-28'
];

function populateZones(zones) {
  var sel = document.getElementById('f-zone');
  var sorted = zones.slice().sort();
  sorted.forEach(function(z) {
    var o = document.createElement('option');
    o.value = z; o.textContent = z;
    sel.appendChild(o);
  });
  var m = window.location.search.match(/zone=([^&]+)/);
  if (m) sel.value = decodeURIComponent(m[1]);
}

google.script.run
  .withSuccessHandler(function(ids) {
    if (ids && ids.length) {
      populateZones(ids);
    } else {
      populateZones(ZONES_FALLBACK);
    }
  })
  .withFailureHandler(function() {
    populateZones(ZONES_FALLBACK);
  })
  .getAllZoneIds();

function submitForm(e) {
  e.preventDefault();
  var errEl = document.getElementById('rt-error');
  errEl.style.display = 'none';

  var data = {
    zone:     document.getElementById('f-zone').value,
    item:     document.getElementById('f-item').value.trim(),
    quantity: parseInt(document.getElementById('f-qty').value) || 1,
    category: document.getElementById('f-category').value,
    reason:   document.getElementById('f-reason').value,
    action:   document.getElementById('f-action').value,
    taggedBy: document.getElementById('f-taggedby').value.trim(),
    remarks:  document.getElementById('f-remarks').value.trim()
  };

  var btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = 'Submitting...';

  google.script.run
    .withSuccessHandler(function(result) {
      var r = typeof result === 'string' ? JSON.parse(result) : result;
      if (r && (r.success || r.ok)) {
        document.getElementById('form-section').style.display = 'none';
        document.getElementById('success-section').style.display = 'block';
        document.getElementById('success-msg').textContent =
          'Tag #' + (r.tagNo || '') + ' raised for ' + data.zone + '.';
      } else {
        errEl.textContent = (r && r.error) ? r.error : 'Submission failed. Please try again.';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Raise Red Tag';
      }
    })
    .withFailureHandler(function(err) {
      errEl.textContent = err.message || 'Server error. Please try again.';
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Raise Red Tag';
    })
    .raiseRedTag(data);
}

function resetForm() {
  document.getElementById('rt-form').reset();
  document.getElementById('rt-error').style.display = 'none';
  document.getElementById('submit-btn').disabled = false;
  document.getElementById('submit-btn').textContent = 'Raise Red Tag';
  document.getElementById('form-section').style.display = 'block';
  document.getElementById('success-section').style.display = 'none';
}

function goToBoard() {
  google.script.run.withSuccessHandler(function(url) {
    window.parent.location.href = url + '?v2=1&action=kanban';
  }).getScriptUrl();
}
</script>
<?!= include("CommonStyles") ?>
</body>
</html>
