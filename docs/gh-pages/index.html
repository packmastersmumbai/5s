<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>PackMasters 5S</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23d97706'/><text x='50' y='68' font-size='52' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'>5S</text></svg>">
<style>
  html, body { margin: 0; height: 100%; background: #faf7f2; overflow: hidden; }
  #app { border: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; }
  #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
          font-family: system-ui, sans-serif; color: #9a8f7d; font-size: 13px; letter-spacing: .5px; }
</style>
</head>
<body>
<div id="boot">Loading PackMasters 5S…</div>
<!-- The GAS web app runs inside this iframe so the address bar stays on github.io.
     In-app navigation uses window.parent/_parent (see CommonStyles base target),
     which targets THIS iframe when embedded and the browser tab when opened directly. -->
<iframe id="app" allow="camera; microphone; fullscreen; geolocation" allowfullscreen></iframe>
<script>
  var GAS = 'https://script.google.com/macros/s/AKfycbyYsCQfJvhorJglpwmpfYNt65659sM5HWKztNK1n5tzeB5wyaovrLpMRDYg95d6yKgQHg/exec';
  // Forward any query string (deep links: ?v2=1&action=quickaudit&zone=Z-07) into the app.
  var app = document.getElementById('app');
  app.src = GAS + (window.location.search || '');
  app.addEventListener('load', function () { var b = document.getElementById('boot'); if (b) b.style.display = 'none'; });
</script>
</body>
</html>
