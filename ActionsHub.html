<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Actions Hub — PackMasters 5S</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-main);
  background: var(--bg-page);
  color: var(--text-primary);
  min-height: 100vh;
}

/* ── HEADER ─────────────────────────────── */
.ah-header {
  background: var(--bg-header);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  position: sticky; top: 0; z-index: 100;
}
.ah-header h1 {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 700;
  color: var(--pm-primary);
  display: flex;
  align-items: center;
  gap: 10px;
}
.ah-header h1::before {
  content: '';
  display: block;
  width: 3px;
  height: 18px;
  background: var(--pm-primary);
  border-radius: 2px;
}

/* ── TYPE TABS ──────────────────────────── */
.ah-type-tabs {
  display: flex;
  gap: 0;
  background: var(--bg-card);
  border-bottom: 2px solid var(--border);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.ah-type-tabs::-webkit-scrollbar { display: none; }

.ah-type-tab {
  padding: 10px 16px;
  font-family: var(--font-display);
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  cursor: pointer;
  border-bottom: 3px solid transparent;
  transition: all .15s;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 6px;
  background: none;
  border-top: none;
  border-left: none;
  border-right: none;
}
.ah-type-tab:hover { color: var(--pm-primary); }
.ah-type-tab.active { color: var(--pm-primary); border-bottom-color: var(--pm-primary); }

.tab-badge {
  display: inline-block;
  background: var(--bg-card-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1px 7px;
  font-size: 10px;
  font-family: var(--font-mono);
  color: var(--text-muted);
  transition: background .15s;
}
.ah-type-tab.active .tab-badge {
  background: var(--pm-primary);
  color: #fff;
  border-color: var(--pm-primary);
}

/* ── STATUS TABS ────────────────────────── */
/* Zone strip: 28 zones will not fit as a static row, so it scrolls
   horizontally. Each tab carries its live count, and the whole strip is
   rebuilt from the cached data whenever any other filter changes. */
.ah-zone-tabs {
  display: flex; gap: 6px; align-items: center;
  padding: 8px 16px; max-width: 1440px; margin: 0 auto;
  background: var(--bg-card); border-bottom: 1px solid var(--border-light);
  overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
}
.ah-zone-tabs::-webkit-scrollbar { display: none; }
.ah-zone-tabs:empty { display: none; }
.ah-zone-tab {
  flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px;
  min-height: 36px; padding: 0 12px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--bg-card);
  font-family: var(--font-mono); font-size: 11.5px; font-weight: 700;
  color: var(--text-secondary); cursor: pointer; white-space: nowrap;
}
.ah-zone-tab:hover { border-color: var(--pm-accent); }
.ah-zone-tab.active {
  background: var(--pm-primary); border-color: var(--pm-primary); color: #fff;
}
.ah-zone-tab:focus-visible { outline: 3px solid var(--border-focus); outline-offset: 2px; }
.ah-zt-n {
  font-size: 10px; font-weight: 800; padding: 1px 6px; border-radius: 999px;
  background: var(--bg-card-2); color: var(--text-muted);
}
.ah-zone-tab.active .ah-zt-n { background: rgba(255,255,255,.22); color: #fff; }

/* The status tabs ARE the reason a started record leaves the list. They were
   quiet enough to read as headings rather than an active filter, so a record
   moving Open -> In Progress looked like it had vanished. */
.ah-status-tabs {
  display: flex;
  gap: 0;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.ah-status-tabs::-webkit-scrollbar { display: none; }

.ah-status-tab {
  padding: 10px 18px;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 700;
  color: var(--text-muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 6px;
  background: none;
  border-top: none;
  border-left: none;
  border-right: none;
  letter-spacing: .4px;
  transition: all .15s;
}
.ah-status-tab:hover { color: var(--text-primary); }
.ah-status-tab.active { color: var(--text-primary); border-bottom-color: var(--text-primary); }

/* ── FILTER TOGGLE (header button) ─────── */
.ah-filter-toggle {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 6px 11px;
  border-radius: 7px;
  border: 1.5px solid var(--border);
  background: var(--bg-card);
  color: var(--text-secondary);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  min-height: 30px;
  transition: all .15s;
}
.ah-filter-toggle:hover { border-color: var(--pm-primary); color: var(--pm-primary); }
.ah-filter-toggle.on    { border-color: var(--pm-primary); color: var(--pm-primary); background: var(--pm-primary-soft); }
.ah-filter-count {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 15px; height: 15px; padding: 0 4px;
  border-radius: 8px; background: var(--pm-primary); color: #fff;
  font-size: 9px; font-weight: 700;
}

/* ── FILTER ROW ──
   Open by default on desktop: the priority chips and zone dropdown were a
   click away behind Filters, which hid them from anyone who did not think to
   look. Still collapsed on narrow screens, where the row would push the list
   itself below the fold. Toggled via .open / .hidden either way. */
.ah-filter-row {
  display: flex;
  gap: 8px;
  padding: 10px 16px;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
  align-items: center;
  animation: ahFilterDrop .16s ease;
}
.ah-filter-row.open { display: flex; }
.ah-filter-row.collapsed { display: none; }
.ah-filter-row.hidden { display: none !important; }
@media (max-width: 480px) {
  /* Three labelled controls do not fit one row on a handset; the first was
     wrapping to "Multi-/select". Keep the icons, drop the words. */
  #ahSelectLabel { position: absolute; width: 1px; height: 1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .ah-filter-toggle { padding-left: 10px; padding-right: 10px; white-space: nowrap; }
}
@media (max-width: 760px) {
  .ah-filter-row { display: none; }
  .ah-filter-row.open { display: flex; }
}

/* ── collapsible type sections ── */
.ah-sec { margin-bottom: 10px; }
.ah-sec-hd {
  display: flex; align-items: center; gap: 8px; cursor: pointer;
  padding: 8px 12px; background: var(--bg-card-2); border: 1px solid var(--border);
  border-radius: 8px; user-select: none;
}
.ah-sec-hd:hover { border-color: var(--pm-primary); }
.ah-sec-caret { font-size: 11px; color: var(--text-muted); transition: transform .15s ease; }
.ah-sec.collapsed .ah-sec-caret { transform: rotate(-90deg); }
.ah-sec-em { font-size: 14px; line-height: 1; }
.ah-sec-nm { font-weight: 700; font-size: 13px; color: var(--text-primary); }
.ah-sec-ct {
  margin-left: auto; font-family: var(--font-mono); font-size: 10px; font-weight: 700;
  background: var(--pm-primary-soft); color: var(--pm-primary); padding: 2px 8px; border-radius: 10px;
}
.ah-sec-bd { margin-top: 6px; }
.ah-sec.collapsed .ah-sec-bd { display: none; }

/* ── inline detail expander ── */
.ah-tr.expanded { background: var(--pm-primary-soft); }
.ah-tr.expanded .title { font-weight: 700; }
.ah-detail-row > .ah-detail-cell { padding: 0; background: var(--bg-card-2); border-bottom: 1px solid var(--border); }
.ah-detail-box {
  padding: 14px 18px;
  border-left: 3px solid var(--pm-primary);
  animation: ahDetailIn .16s ease;
}
@keyframes ahDetailIn { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }

/* ── undo toast (fallback when the host toast has no action slot) ── */
.ah-undo {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%); z-index: 3000;
  display: flex; align-items: center; gap: 14px;
  background: var(--text-primary); color: #fff;
  padding: 12px 14px 12px 18px; border-radius: 12px;
  font-size: 14px; box-shadow: 0 8px 28px rgba(15,23,42,.34);
  max-width: calc(100vw - 32px);
  animation: ahDetailIn .18s ease;
}
.ah-undo-btn {
  flex-shrink: 0; min-height: 36px; padding: 0 14px;
  background: none; border: 1.5px solid var(--pm-primary);
  color: #fff; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer;
}
.ah-undo-btn:hover { background: var(--pm-primary); }
@keyframes ahFilterDrop {
  from { opacity: 0; transform: translateY(-4px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Priority chips */
.ah-chip {
  padding: 5px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  border: 1.5px solid var(--border);
  background: var(--bg-card);
  color: var(--text-secondary);
  cursor: pointer;
  white-space: nowrap;
  min-height: 32px;
  transition: all .15s;
  font-family: var(--font-mono);
}
.ah-chip:hover { border-color: var(--pm-primary); color: var(--pm-primary); }
.ah-chip.active { background: var(--pm-primary); border-color: var(--pm-primary); color: #fff; }
.ah-chip.crit.active  { background: var(--score-red);   border-color: var(--score-red); }
.ah-chip.high.active  { background: var(--score-amber); border-color: var(--score-amber); }
.ah-chip.med.active   { background: #B45309; border-color: #B45309; }
.ah-chip.low.active   { background: var(--text-muted); border-color: var(--text-muted); }

/* Zone dropdown */
/* Hidden, not removed: the Create dialog builds its zone list from this
   select's options. The visible zone filter is the tab strip above, which
   shows live counts; offering the same filter twice in two idioms ten pixels
   apart made neither authoritative. */
.ah-zone-select { position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; }
.ah-zone-select-OLD {
  padding: 5px 10px;
  border-radius: 8px;
  border: 1.5px solid var(--border);
  background: var(--bg-card);
  color: var(--text-primary);
  font-family: var(--font-mono);
  font-size: 11px;
  cursor: pointer;
  min-height: 32px;
  outline: none;
  transition: border-color .15s;
}
.ah-zone-select:focus { border-color: var(--pm-primary); }

/* ── CARDS ──────────────────────────────── */
.ah-list {
  max-width: 700px;
  margin: 14px auto;
  padding: 0 14px 100px;
}

.ah-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-left: 4px solid var(--border);
  border-radius: var(--r);
  margin-bottom: 10px;
  box-shadow: var(--shadow);
  overflow: hidden;
  transition: box-shadow .2s;
}
.ah-card:hover { box-shadow: var(--shadow-lg); }
.ah-card.CRITICAL { border-left-color: var(--score-red); }
.ah-card.HIGH     { border-left-color: var(--score-amber); }
.ah-card.MEDIUM   { border-left-color: #F59E0B; }
.ah-card.LOW      { border-left-color: var(--text-muted); }

.ah-card__body {
  padding: 14px 16px 12px;
  cursor: pointer;
}
.ah-card__body:hover .ah-card__title { text-decoration: underline; text-underline-offset: 2px; }

.ah-card__top {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 6px;
}
.ah-card__title {
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 600;
  color: var(--pm-primary);
  flex: 1;
  min-width: 0;
  line-height: 1.3;
}

/* TYPE badge */
.type-badge {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 4px;
  white-space: nowrap;
  letter-spacing: .5px;
  flex-shrink: 0;
}
.type-badge.NC       { background: #EEE8FF; color: #5B21B6; }
.type-badge.TASK     { background: var(--pm-primary-soft); color: var(--pm-primary); }
.type-badge.RED_TAG  { background: var(--score-red-bg); color: var(--score-red); }
.type-badge.KAIZEN   { background: #DBEAFE; color: #1D4ED8; }
.type-badge.GEMBA    { background: #EDE9FE; color: #6D28D9; }
.type-badge.AUDIT    { background: #DCFCE7; color: #15803D; }

/* PRIORITY badge */
/* Priority as an icon. Colour carries the level at a glance, but the glyph
   differs too (up / dot / down), so the column still reads for anyone who
   cannot separate the hues. Critical and High share the triangle and part on
   colour plus weight -- they are the two that must never be missed. */
.pri-ic {
  display: inline-block; width: 100%; text-align: center;
  font-size: 13px; line-height: 1; cursor: default;
}
.pri-ic.CRITICAL { color: var(--score-red);   font-size: 15px; text-shadow: 0 0 0 var(--score-red); }
.pri-ic.HIGH     { color: var(--score-amber); }
.pri-ic.MEDIUM   { color: #B45309; font-size: 10px; }
.pri-ic.LOW      { color: var(--text-muted); }

/* Photo evidence, in its own column so the camera sits in one place down the
   list rather than trailing whatever text came before it. */
.ah-evi { display: inline-flex; align-items: center; gap: 2px; font-size: 12px; cursor: default; }
.ah-evi-n { font-size: 10px; font-weight: 700; color: var(--text-muted); }

/* Visible to screen readers only -- the photo column's header has no visible
   label because the icon speaks for itself on screen. */
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

.pri-badge {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 4px;
  white-space: nowrap;
  letter-spacing: .5px;
  flex-shrink: 0;
}
.pri-badge.CRITICAL { background: var(--score-red-bg);   color: var(--score-red); }
.pri-badge.HIGH     { background: var(--score-amber-bg); color: var(--score-amber); }
.pri-badge.MEDIUM   { background: #FFF8E1;               color: #B45309; }
.pri-badge.LOW      { background: var(--bg-card-2);      color: var(--text-muted); }

/* STATUS label */
.status-lbl {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 4px;
  white-space: nowrap;
  letter-spacing: .4px;
  flex-shrink: 0;
}
.status-lbl.OPEN        { background: var(--score-red-bg);   color: var(--score-red); }
.status-lbl.IN_PROGRESS { background: var(--score-amber-bg); color: var(--score-amber); }
.status-lbl.CLOSED      { background: var(--score-green-bg); color: var(--score-green); }

.ah-card__meta {
  font-size: 11px;
  color: var(--text-muted);
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 4px;
}
.ah-card__meta span { display: flex; align-items: center; gap: 3px; }

.ah-overdue { color: var(--score-red); font-weight: 600; font-size: 11px; margin-top: 3px; }

/* ── ACTION BUTTONS ─────────────────────── */
.ah-card__actions {
  display: flex;
  gap: 6px;
  padding: 10px 16px 12px;
  flex-wrap: wrap;
  border-top: 1px solid var(--border-light);
  background: var(--bg-card-2);
}

.ah-btn {
  padding: 5px 12px;
  border-radius: 6px;
  font-size: 10.5px;
  font-weight: 700;
  cursor: pointer;
  font-family: var(--font-mono);
  letter-spacing: .3px;
  transition: opacity .15s, transform .1s;
  min-height: 28px;
  flex: 1 1 auto;
  min-width: 0;
}
.ah-btn:active:not(:disabled) { transform: scale(.94); }
.ah-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
.ah-btn.start  { background: var(--pm-primary-soft); color: var(--pm-primary);   border: 1px solid var(--pm-primary); }
.ah-btn.close  { background: var(--score-green-bg);  color: var(--score-green);  border: 1px solid var(--score-green); }
.ah-btn.done   { background: var(--score-green-bg);  color: var(--score-green);  border: 1px solid var(--score-green); }
.ah-btn.phase  { background: var(--score-amber-bg);  color: var(--score-amber);  border: 1px solid var(--score-amber); }

/* ── COMPACT TABLE (Actions list) ───────── */
.ah-table-wrap { max-width: 1440px; margin: 12px auto; padding: 0 16px 100px; overflow-x: auto; }
.ah-table { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: 14.5px; background: var(--bg-card);
  border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
/* Headers were 9px uppercase mono -- a label you cannot read is not a label.
   11.5px, and --text-secondary rather than --text-muted, which fails contrast
   at this size on the card background. */
.ah-table thead th { font-family: var(--font-mono); font-size: 11.5px; font-weight: 700; letter-spacing: .4px;
  text-transform: uppercase; color: var(--text-secondary); text-align: left; padding: 11px 12px;
  background: var(--bg-card-2); border-bottom: 1px solid var(--border); white-space: nowrap; }
/* Fixed-width columns so Title can't starve every other column of space —
   percentages sum to 100% across the visible (non hide-sm) set. */
.ah-table col.c-type   { width: 8%; }
.ah-table col.c-title  { width: 30%; }
.ah-table col.c-zone   { width: 15%; }
.ah-table col.c-owner  { width: 12%; }
.ah-table col.c-due    { width: 9%; }
.ah-table col.c-age    { width: 6%; }
.ah-table col.c-pri    { width: 44px; }
.ah-table col.c-evi    { width: 40px; }
.ah-table col.c-status { width: 8%; }
.ah-table col.c-acts   { width: 200px; }
/* Urgency-first rail: priority tints a thin rail; OVERDUE overrides it with a
   loud red rail + a tinted row so "what's on fire" reads across a bay. The rail
   is a signal here (the focal moment the brief names), never decoration — it is
   always paired with the text overdue chip + priority badge, never color-alone. */
.ah-tr { border-bottom: 1px solid var(--border-light); border-left: 3px solid transparent; }
.ah-tr:last-child { border-bottom: none; }
.ah-tr:hover { background: var(--bg-card-2); }
.ah-tr.CRITICAL { border-left-color: var(--score-red); }
.ah-tr.HIGH     { border-left-color: var(--score-amber); }
.ah-tr.MEDIUM   { border-left-color: #F59E0B; }
.ah-tr.LOW      { border-left-color: var(--text-muted); }
/* Overdue was signalled four times on one row: left border, red date, warning
   glyph and a pink row wash. With most rows overdue the wash became the page
   background and stopped meaning anything, while making the black title text
   sit on a tinted ground. The date and its glyph carry it; the border stays at
   the priority width. */
.ah-tr[data-overdue] { border-left-color: var(--score-red); }
.ah-ttl-txt { display: block; }
.ah-ttl-id {
  display: block; font-family: var(--font-mono); font-size: 10.5px;
  color: var(--text-muted); margin-top: 2px; letter-spacing: .3px;
}
.ah-td { padding: 9px 12px; vertical-align: middle; overflow: hidden; text-overflow: ellipsis; }
.ah-td.title {
  cursor: pointer; font-weight: 600; color: var(--pm-primary); line-height: 1.3;
  overflow: hidden; white-space: normal;
}
/* only the title text clamps to 2 lines; the overdue chip sits above it, unclamped */
.ah-td.title .ah-ttl-txt {
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.ah-td.title:hover .ah-ttl-txt { text-decoration: underline; text-underline-offset: 2px; }
.ah-td.title .ovd { color: var(--score-red); font-weight: 800; font-size: 11px; white-space: nowrap;
  display: inline-block; margin-bottom: 3px; }
/* Badge legibility floor: bright arm's-length floor context needs ≥11px, not 9px
   (critique P2). Scoped to the three status/priority/type badges. */
.type-badge, .pri-badge, .status-lbl { font-size: 11px; padding: 3px 8px; }
.ah-td.muted { color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ah-td.acts { white-space: nowrap; text-align: right; }
.ah-acts-primary, .ah-acts-secondary { display: inline-flex; gap: 4px; vertical-align: middle; }
.ah-acts-secondary { margin-left: 8px; padding-left: 8px; border-left: 1px solid var(--border-light); }
/* action buttons: 44px min hit area (critique P2). Icon-only on the dense desktop
   table (label visually hidden); label shows on the mobile card skin. */
/* Desktop (mouse): compact 36px icons fit the dense row. Touch bumps to 44px
   below via @media(pointer:coarse) + the mobile card skin — the 44px floor is a
   finger requirement, not a mouse one. */
.ah-ibtn { display: inline-flex; align-items: center; justify-content: center;
  min-width: 36px; min-height: 36px; padding: 0 6px;
  border-radius: 8px; cursor: pointer; line-height: 1;
  border: 1px solid var(--border); background: var(--bg-card); color: var(--text-secondary);
  transition: border-color .12s, color .12s, background .12s; }
@media (pointer: coarse) { .ah-ibtn { min-width: 44px; min-height: 44px; } }
.ah-ibtn-ic { font-size: 15px; }
.ah-ibtn-lbl { display: none; font-weight: 700; font-size: 13px; margin-left: 6px; }
.ah-ibtn:hover:not(:disabled) { border-color: var(--pm-primary); color: var(--pm-primary); }
.ah-ibtn:focus-visible { outline: 2px solid var(--pm-primary); outline-offset: 2px; }
.ah-ibtn:disabled { opacity: .4; cursor: not-allowed; }
.ah-ibtn.start { color: var(--pm-primary); border-color: var(--pm-primary); }
.ah-ibtn.done, .ah-ibtn.close, .ah-ibtn.phase { color: var(--score-green); border-color: var(--score-green); }
.ah-ibtn.del:hover { color: var(--score-red); border-color: var(--score-red); }

/* keyboard focus on the expander trigger (was invisible — critique / Sam) */
.ah-td.title:focus-visible { outline: 2px solid var(--pm-primary); outline-offset: -2px; border-radius: 4px; }

/* select-mode checkbox column */
.ah-table col.c-sel { width: 44px; }
.ah-sel-td, .ah-sel-th { text-align: center; padding: 0; }
.ah-sel-box { width: 22px; height: 22px; cursor: pointer; accent-color: var(--pm-primary); }

@media (max-width: 900px) {
  .ah-td.hide-sm { display: none; } .ah-table thead th.hide-sm { display: none; }
  .ah-table col.c-title { width: 60%; }
}

/* ── FILTER ROW / STATUS TABS / BULK ─────── */
.ah-filter-row { flex-direction: column; align-items: stretch; gap: 8px; }
.ah-filter-chips { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.ah-filter-toggle.on { border-color: var(--pm-primary); color: var(--pm-primary); background: var(--pm-primary-soft); }
.ah-bulk-bar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 12px;
  max-width: 1440px; margin: 0 auto; padding: 10px 16px;
  background: var(--pm-primary-soft); border-bottom: 1px solid var(--pm-primary);
}
/* `display: flex` above beats the HTML `hidden` attribute (which is only
   `display: none` at UA-stylesheet priority), so the bar — Close selected /
   Delete selected — rendered on every tab whether or not multi-select was on.
   This restores what `hidden` is supposed to mean. */
.ah-bulk-bar[hidden] { display: none; }
.ah-bulk-count { font-weight: 700; font-size: 13px; color: var(--pm-primary); }
.ah-bulk-del { background: #DC2626 !important; }
.ah-cfm { position: fixed; inset: 0; z-index: 120; background: rgba(15,23,42,.55);
  display: flex; align-items: center; justify-content: center; padding: 16px; }
.ah-cfm-card { width: 100%; max-width: 420px; background: var(--bg-card);
  border-radius: 14px; padding: 20px; box-shadow: 0 12px 40px rgba(0,0,0,.3); }
.ah-cfm-t { font-size: 16px; font-weight: 800; margin-bottom: 8px; }
.ah-cfm-b { font-size: 13px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 18px; }
.ah-cfm-acts { display: flex; gap: 10px; justify-content: flex-end; }
.ah-cfm-acts button { min-height: 44px; padding: 0 18px; border-radius: 8px;
  font-size: 14px; font-weight: 700; cursor: pointer; border: 1px solid var(--border);
  background: var(--bg-card); color: var(--text-secondary); }
.ah-cfm-yes { background: var(--pm-primary); color: #fff; border-color: var(--pm-primary); }
.ah-cfm-yes.danger { background: #DC2626; border-color: #DC2626; }
.ah-cfm-acts button:focus-visible { outline: 3px solid var(--border-focus); outline-offset: 2px; }
.ah-age { display: inline-block; min-width: 34px; padding: 3px 7px; border-radius: 999px;
  font-size: 11.5px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }
.ah-age.fresh { background: #E8F5E9; color: #1B5E20; }
.ah-age.ok    { background: #F1F8E9; color: #33691E; }
.ah-age.warn  { background: #FFF8E1; color: #7A5D00; }
.ah-age.hot   { background: #FFF0E6; color: #A33600; }
.ah-age.stale { background: #FDE7E7; color: #A31515; }
.ah-age-na { color: var(--text-muted); }
.ah-due { display: block; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.ah-due.late { color: #A31515; font-weight: 700; white-space: nowrap; }
:root[data-theme="dark"] .ah-due.late { color: #EF9A9A; }
/* Row whose write is still in flight — visibly settled, but marked as not yet
   confirmed so a failure that rolls it back is not a surprise. */
/* Row on its way out of the current tab: dimmed and desaturated so the move
   is legible, not a disappearance. The quiet refresh removes it for real. */
.ah-tr-leaving { opacity: .35; }
@media (prefers-reduced-motion: no-preference) {
  .ah-tr-leaving { transition: opacity .25s ease; }
}
.rc-src { margin: 10px 0 4px; }
.rc-src a { font-size: 12.5px; font-weight: 600; color: var(--pm-primary);
  text-decoration: none; }
.rc-src a:hover { text-decoration: underline; }
.rc-src a:focus-visible { outline: 3px solid var(--border-focus); outline-offset: 2px; }
.ah-evi { margin-top: 10px; }
.ah-evi-hd { font-size: 10.5px; font-weight: 700; letter-spacing: .04em;
  text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }
.ah-evi-row { display: flex; gap: 8px; flex-wrap: wrap; }
.ah-evi-cell { position: relative; display: inline-block; line-height: 0; cursor: zoom-in; }
.ah-evi-cell.vid { cursor: pointer; }
.ah-evi-play { position: absolute; inset: 0; display: flex; align-items: center;
  justify-content: center; font-size: 22px; color: #fff;
  text-shadow: 0 1px 6px rgba(0,0,0,.7); pointer-events: none; }
.ah-evi-thumb { width: 78px; height: 78px; object-fit: cover; border-radius: 8px;
  border: 1px solid var(--border); cursor: inherit; background: var(--bg-card-2); }
.ah-evi-thumb:focus-visible { outline: 3px solid var(--border-focus); outline-offset: 2px; }
.ah-evi-flag { display: block; margin-top: 3px; font-size: 10px; font-weight: 700;
  color: var(--text-muted); }
.ah-phase { display: block; margin-top: 3px; font-size: 10px; font-weight: 700;
  letter-spacing: .03em; text-transform: uppercase; color: var(--text-muted); }
.ah-row-chev { color: var(--text-muted); font-size: 17px; line-height: 1; opacity: .55; }
.ah-tr.expanded .ah-row-chev { transform: rotate(90deg); display: inline-block; opacity: 1; }
@media (prefers-reduced-motion: no-preference) {
  .ah-row-chev { transition: transform .15s ease; }
}
/* Expander actions: same icon buttons as before, but laid out with room for
   their labels since there is no column width to fight for here. */
.ah-detail-box .ah-card__actions { display: flex; flex-wrap: wrap; gap: 8px;
  border-top: 1px solid var(--border-light); margin-top: 10px; padding-top: 10px; }
.ah-detail-box .ah-acts-primary,
.ah-detail-box .ah-acts-secondary { display: flex; gap: 8px; }
.ah-detail-box .ah-acts-secondary { margin-left: auto; }
.ah-detail-box .ah-ibtn { min-height: 44px; padding: 0 14px; display: inline-flex;
  align-items: center; gap: 7px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--bg-card); cursor: pointer; font-size: 13px; font-weight: 600; }
.ah-detail-box .ah-ibtn .ah-ibtn-lbl { display: inline; margin-left: 0; }
.ah-detail-box .ah-ibtn.del { color: #A31515; }
.ah-detail-box .ah-ibtn:focus-visible { outline: 3px solid var(--border-focus); outline-offset: 2px; }
.ah-tr-pending { opacity: .72; }
.ah-tr-pending .status-lbl { outline: 1px dashed currentColor; outline-offset: 2px; }
:root[data-theme="dark"] .ah-due-late { color: #EF9A9A; }
:root[data-theme="dark"] .ah-age.fresh { background: #14311A; color: #A5D6A7; }
:root[data-theme="dark"] .ah-age.ok    { background: #1B3312; color: #C5E1A5; }
:root[data-theme="dark"] .ah-age.warn  { background: #3A2F05; color: #FFE082; }
:root[data-theme="dark"] .ah-age.hot   { background: #3B1F0B; color: #FFCC80; }
:root[data-theme="dark"] .ah-age.stale { background: #3B1113; color: #EF9A9A; }
.ah-bulk-btn { min-height: 44px; padding: 0 16px; border: none; border-radius: 8px;
  background: var(--score-green); color: #fff; font-weight: 700; font-size: 14px; cursor: pointer; }
.ah-bulk-cancel { min-height: 44px; padding: 0 12px; border: none; background: none;
  color: var(--text-secondary); font-weight: 600; cursor: pointer; margin-left: auto; }

/* ── MOBILE CARD SKIN (≤640px) ────────────
   One markup, two skins: the desktop <table> reflows into stacked cards so
   actions are reachable with one thumb and nothing scrolls horizontally.
   Cells become labeled rows via their data-label; the primary action is a big
   button and Edit/Delete recede behind it (never thumb-adjacent). */
@media (max-width: 640px) {
  .ah-table-wrap { overflow-x: visible; padding: 0 12px 100px; }
  .ah-table, .ah-table tbody, .ah-table tr, .ah-table td { display: block; width: auto; }
  .ah-table { border: none; background: none; }
  .ah-table thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); } /* header hidden, data-labels carry it */
  .ah-table col { width: auto !important; }
  .ah-tr {
    position: relative; margin: 0 0 10px; padding: 12px 14px 12px 16px;
    background: var(--bg-card); border: 1px solid var(--border);
    border-left: 5px solid transparent; border-radius: var(--r);
  }
  .ah-tr.CRITICAL { border-left-color: var(--score-red); }
  .ah-tr.HIGH     { border-left-color: var(--score-amber); }
  .ah-tr.MEDIUM   { border-left-color: #F59E0B; }
  .ah-tr.LOW      { border-left-color: var(--text-muted); }
  .ah-tr[data-overdue] { border-left-color: var(--score-red); }
  .ah-td { padding: 2px 0; overflow: visible; white-space: normal; }
  .ah-td.title { font-size: 15px; -webkit-line-clamp: 3; margin-bottom: 6px; }
  /* meta cells: label + value inline, muted */
  .ah-td[data-label] { display: flex; gap: 6px; font-size: 13px; }
  .ah-td[data-label]::before { content: attr(data-label) ":"; color: var(--text-muted); font-weight: 600; min-width: 62px; }
  .ah-td[data-label]:empty, .ah-td.title[data-label] { display: none; } /* title handled above */
  /* priority/status badges keep their pills, drop the redundant label prefix */
  .ah-td[data-label="Priority"]::before, .ah-td[data-label="Status"]::before { content: none; }
  .ah-td[data-label="Priority"], .ah-td[data-label="Status"] { display: inline-flex; margin-right: 8px; margin-top: 4px; }
  /* actions: full-width primary, secondary demoted below */
  .ah-td.acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; text-align: left; }
  .ah-acts-primary { flex: 1 1 auto; }
  .ah-acts-primary .ah-ibtn { flex: 1; }
  .ah-acts-secondary { margin: 0; padding: 0; border: none; }
  .ah-ibtn { min-height: 46px; }
  .ah-ibtn-lbl { display: inline; }               /* labels visible on cards */
  .ah-acts-secondary .ah-ibtn-lbl { display: none; } /* Edit/Delete stay icon-only + small */
  .ah-acts-secondary .ah-ibtn { min-width: 46px; flex: 0 0 auto; }
  .ah-sel-td { position: absolute; top: 12px; right: 12px; padding: 0; }
}

/* ── LOADING / EMPTY ────────────────────── */
/* A badge showing 0 before the fetch returns asserts "no work". Show a dash,
   dimmed, until the count is real. */
.tab-badge.is-pending { opacity: .4; }
.ah-loading {
  text-align: center;
  padding: 60px;
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 1px;
}
.ah-empty {
  text-align: center;
  padding: 60px 24px;
  color: var(--score-green);
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 600;
}

/* ── RECORD DETAIL MODAL (NC) ───────────── */
.rd-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.45);
  z-index: 300;
}
.rd-backdrop.open { display: block; }

.rd-modal {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: calc(var(--r) * 1.5);
  box-shadow: var(--shadow-lg);
  z-index: 301;
  width: min(94vw, 520px);
  max-height: 82vh;
  overflow: hidden;
  display: none;
  flex-direction: column;
}
.rd-modal.open { display: flex; }

.rd-modal__header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px 10px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.rd-modal__title {
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 700;
  color: var(--pm-primary);
}
.rd-modal__close {
  background: none;
  border: none;
  font-size: 18px;
  cursor: pointer;
  color: var(--text-muted);
  line-height: 1;
  padding: 2px 6px;
  border-radius: 4px;
  transition: background .15s;
}
.rd-modal__close:hover { background: var(--bg-card-2); color: var(--text-primary); }

.rd-modal__body {
  overflow-y: auto;
  padding: 12px 16px 14px;
  flex: 1;
}

.rd-dl {
  display: grid;
  grid-template-columns: 108px 1fr;
  gap: 3px 10px;
  font-size: 12px;
}
.rd-dt {
  font-family: var(--font-mono);
  color: var(--text-muted);
  font-size: 9.5px;
  letter-spacing: .4px;
  text-transform: uppercase;
  line-height: 1.5;
}
.rd-dd {
  color: var(--text-primary);
  line-height: 1.4;
  word-break: break-word;
}
.rd-dd.empty { color: var(--text-muted); font-style: italic; }
.rd-divider {
  grid-column: 1 / -1;
  border: none;
  border-top: 1px solid var(--border);
  margin: 2px 0;
}

/* ── COMPACT ICON DETAIL ─────────────────── */
.rc-hero {
  display: flex; align-items: center; gap: 8px;
  padding: 2px 0 8px;
}
.rc-hero .rc-emoji { font-size: 20px; line-height: 1; }
.rc-hero .rc-id {
  font-family: var(--font-mono); font-size: 12px; font-weight: 700;
  color: var(--text-primary); letter-spacing: .3px;
}
.rc-hero .rc-badges { margin-left: auto; display: flex; gap: 5px; }
.rc-title { font-size: 16px; font-weight: 700; color: var(--text-primary); line-height: 1.3; margin: 2px 0 8px; }
/* Was a hard `1fr 1fr`: on a wide row the right column ran out of fields and
   left half the panel empty while the left column ellipsised. auto-fit packs
   as many columns as the width allows and collapses to one on narrow screens. */
.rc-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 7px 22px; margin-bottom: 12px;
}
.rc-cell {
  display: flex; align-items: baseline; gap: 7px;
  font-size: 13.5px; color: var(--text-primary); min-width: 0;
}
.rc-cell .rc-ic { flex-shrink: 0; font-size: 13px; width: 16px; text-align: center; color: var(--text-muted); }
.rc-cell .rc-v { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rc-cell.wide { grid-column: 1 / -1; }
.rc-cell.wide .rc-v { white-space: normal; }
.rc-desc { font-size: 13.5px; color: var(--text-secondary); line-height: 1.4; margin-bottom: 8px; }
.rc-section {
  font-family: var(--font-mono); font-size: 10.5px; font-weight: 700;
  letter-spacing: .6px; text-transform: uppercase; color: var(--text-secondary);
  border-top: 1px solid var(--border-light); padding-top: 10px; margin: 12px 0 7px;
}
/* ── Expanded record: structure ───────────────────────────────────────────
   The detail read as one flat column of emoji + value with no field names, no
   grouping and raw ISO timestamps. It now reads as three answers in order:
   WHAT was found -> WHAT is being done -> WHO signed it off, with every value
   carrying its own label. */
/* ── Audits view ──────────────────────────────────────────────────────────
   Audits are a scannable set, not a reading list: you look for the low scores.
   A responsive grid uses the full width instead of one full-bleed row per
   audit, and the score leads each tile at display size. */
.au-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr));
  gap: 10px; padding: 12px 16px; max-width: 1440px; margin: 0 auto;
}
.au-tile {
  display: flex; align-items: stretch; gap: 12px; width: 100%;
  padding: 12px; text-align: left; cursor: pointer;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 12px; font: inherit; color: inherit;
}
.au-tile:hover { border-color: var(--pm-accent); box-shadow: var(--shadow-sm); }
.au-tile:focus-visible { outline: 3px solid var(--border-focus); outline-offset: 2px; }
.au-score {
  flex: 0 0 72px; display: flex; align-items: center; justify-content: center;
  border-radius: 10px; font-family: var(--font-mono);
  font-size: 26px; font-weight: 800; letter-spacing: -.02em;
}
.au-score i { font-size: 13px; font-style: normal; font-weight: 700; opacity: .75; margin-left: 1px; }
.au-score.g { background: #E8F5E9; color: #1B5E20; }
.au-score.a { background: #FFF8E1; color: #7A5D00; }
.au-score.r { background: #FDE7E7; color: #A31515; }
:root[data-theme="dark"] .au-score.g { background: #14311A; color: #A5D6A7; }
:root[data-theme="dark"] .au-score.a { background: #3A2F05; color: #FFE082; }
:root[data-theme="dark"] .au-score.r { background: #3B1113; color: #EF9A9A; }
.au-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
.au-zone { font-family: var(--font-mono); font-size: 12.5px; font-weight: 700; color: var(--text-secondary); }
.au-name {
  font-size: 15px; font-weight: 700; color: var(--text-primary); line-height: 1.3;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.au-meta { font-size: 12.5px; color: var(--text-secondary); }
/* Was 11px on --text-muted: below the contrast floor and unreadable at
   arm's length. The counts are data, so they get the mono face. */
/* The auditor name shares this line with two counts. At the larger type it
   wrapped and truncated to "packmast...", so the name gets its own line and
   the counts stay on one. */
.au-stats {
  display: flex; gap: 14px; margin-top: 6px; font-size: 12.5px;
  font-family: var(--font-mono); color: var(--text-secondary);
  white-space: nowrap;
}
.au-by {
  display: block; margin-top: 4px; font-size: 12px;
  color: var(--text-secondary); overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap;
}

/* Share row: full-width tap targets, not two thin links. */
.au-share-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.au-share {
  flex: 1 1 160px; min-height: 44px; padding: 0 16px;
  border: none; border-radius: 10px; cursor: pointer;
  font-size: 13.5px; font-weight: 700; font-family: inherit;
}
.au-share.pdf { background: #EEF2FF; color: #3730A3; border: 1px solid #C7D2FE; }
.au-share.wa  { background: #25D366; color: #fff; }
.au-share:focus-visible { outline: 3px solid var(--border-focus); outline-offset: 2px; }
.au-share-msg { font-size: 12px; color: var(--text-muted); }

.rc-sec { margin-top: 14px; }
.rc-sec:first-of-type { margin-top: 10px; }
.rc-sec-t {
  margin: 0 0 8px; padding-bottom: 5px;
  font-size: 10.5px; font-weight: 800; letter-spacing: .07em;
  text-transform: uppercase; color: var(--text-muted);
  border-bottom: 1px solid var(--border-light);
}

/* Label-above-value pairs. Auto-fit keeps them readable from a phone (one
   column) to a desk monitor (four) without a media query per breakpoint. */
.rc-fields {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px 18px; margin: 0;
}
.rc-f { min-width: 0; }
.rc-f.wide { grid-column: 1 / -1; }
.rc-f-k {
  font-size: 10px; font-weight: 700; letter-spacing: .05em;
  text-transform: uppercase; color: var(--text-muted); margin-bottom: 2px;
}
.rc-f-v {
  margin: 0; font-size: 13.5px; font-weight: 600; color: var(--text-primary);
  line-height: 1.35; overflow-wrap: anywhere;
}
.rc-f-v.mono { font-family: var(--font-mono); font-size: 12.5px; }

/* Free-text answers (root cause, corrective action) need room to breathe —
   they are sentences, not values, so the label sits above and the text wraps. */
.rc-para { font-size: 13.5px; color: var(--text-primary); line-height: 1.5; margin-bottom: 10px; }
.rc-para:last-child { margin-bottom: 0; }
.rc-para .rc-k {
  display: block; font-size: 10px; font-weight: 700; letter-spacing: .05em;
  text-transform: uppercase; color: var(--text-muted); margin-bottom: 2px;
}
.rc-para .rc-pv { display: block; overflow-wrap: anywhere; }
.rc-repeat {
  display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-mono);
  font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 4px;
  background: var(--score-red-bg); color: var(--score-red);
}

/* ── RCA START MODAL ────────────────────── */
.rca-modal {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: calc(var(--r) * 1.5);
  box-shadow: var(--shadow-lg);
  z-index: 401;
  width: min(94vw, 480px);
  display: none;
  flex-direction: column;
}
.rca-modal.open { display: flex; }
.rca-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  z-index: 400;
}
.rca-backdrop.open { display: block; }
.rca-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 18px 12px;
  border-bottom: 1px solid var(--border);
}
.rca-title {
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 700;
  color: var(--pm-primary);
}
.rca-close {
  background: none; border: none;
  font-size: 18px; cursor: pointer;
  color: var(--text-muted);
  padding: 2px 6px; border-radius: 4px;
  transition: background .15s;
}
.rca-close:hover { background: var(--bg-card-2); }
.rca-body { padding: 16px 18px 20px; }
.rca-label {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: .5px;
  margin-bottom: 6px;
  display: block;
}
.rca-textarea {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 10px 12px;
  font-family: var(--font-main);
  font-size: 13px;
  color: var(--text-primary);
  background: var(--bg-page);
  resize: vertical;
  min-height: 80px;
  outline: none;
  transition: border-color .15s;
}
.rca-textarea:focus { border-color: var(--pm-primary); }
.rca-counter {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-muted);
  text-align: right;
  margin-top: 3px;
  margin-bottom: 14px;
}
.rca-counter.ok { color: var(--score-green); }
.rca-submit {
  width: 100%;
  background: var(--pm-primary);
  color: #fff;
  border: none;
  border-radius: var(--r);
  padding: 10px 16px;
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: opacity .15s;
}
.rca-submit:hover { opacity: .9; }
.rca-submit:disabled { opacity: .4; cursor: not-allowed; }

/* ── CREATE BUTTON ──────────────────────── */
.ah-create-btn {
  padding: 7px 14px;
  background: var(--pm-primary);
  color: #fff;
  border: none;
  border-radius: var(--r);
  font-family: var(--font-display);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  letter-spacing: .3px;
  transition: opacity .15s;
  flex-shrink: 0;
}
.ah-create-btn:hover { opacity: .85; }

/* ── CREATE MODAL ────────────────────────── */
.ac-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  z-index: 400;
}
.ac-backdrop.open { display: block; }

.ac-modal {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: calc(var(--r) * 1.5);
  box-shadow: var(--shadow-lg);
  z-index: 401;
  width: min(94vw, 480px);
  max-height: 88vh;
  overflow: hidden;
  display: none;
  flex-direction: column;
}
.ac-modal.open { display: flex; }

.ac-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 18px 12px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.ac-title {
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 700;
  color: var(--pm-primary);
}
.ac-close {
  background: none; border: none;
  font-size: 18px; cursor: pointer;
  color: var(--text-muted);
  padding: 2px 6px; border-radius: 4px;
  transition: background .15s;
}
.ac-close:hover { background: var(--bg-card-2); color: var(--text-primary); }

.ac-body {
  overflow-y: auto;
  padding: 16px 18px 20px;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* type selector */
.ac-type-row {
  display: flex;
  gap: 6px;
}
.ac-type-btn {
  flex: 1;
  padding: 7px 6px;
  border: 1.5px solid var(--border);
  border-radius: var(--r);
  background: var(--bg-card);
  color: var(--text-secondary);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  text-align: center;
  transition: all .15s;
  letter-spacing: .3px;
}
.ac-type-btn:hover { border-color: var(--pm-primary); color: var(--pm-primary); }
.ac-type-btn.active { background: var(--pm-primary); border-color: var(--pm-primary); color: #fff; }

/* form fields */
.ac-field { display: flex; flex-direction: column; gap: 4px; }
.ac-label {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: .5px;
}
.ac-label .req { color: var(--score-red); }

.ac-input, .ac-select, .ac-textarea {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 8px 10px;
  font-family: var(--font-main);
  font-size: 13px;
  color: var(--text-primary);
  background: var(--bg-page);
  outline: none;
  transition: border-color .15s;
}
.ac-input:focus, .ac-select:focus, .ac-textarea:focus { border-color: var(--pm-primary); }
.ac-textarea { resize: vertical; min-height: 72px; }

.ac-group { display: flex; flex-direction: column; gap: 12px; }
.ac-hint { font-weight: 400; color: var(--text-muted); font-size: 11px; }
.ac-photos { display: flex; gap: 8px; flex-wrap: wrap; }
.ac-photos:empty { display: none; }
.ac-thumb { position: relative; width: 72px; height: 72px; border-radius: 8px;
  overflow: hidden; border: 1px solid var(--border); background: var(--bg-card-2); }
.ac-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ac-thumb-x { position: absolute; top: 2px; right: 2px; width: 22px; height: 22px;
  border: none; border-radius: 50%; background: rgba(0,0,0,.62); color: #fff;
  font-size: 13px; line-height: 1; cursor: pointer; }
.ac-thumb-edit { position: absolute; bottom: 0; left: 0; right: 0; border: none;
  background: rgba(0,0,0,.62); color: #fff; font-size: 10px; font-weight: 700;
  padding: 3px 0; cursor: pointer; }
.ac-photo-add { min-height: 44px; padding: 0 14px; border: 1px dashed var(--border);
  border-radius: 8px; background: var(--bg-card); color: var(--text-secondary);
  font-size: 13px; font-weight: 600; cursor: pointer; }
.ac-photo-add:focus-visible { outline: 3px solid var(--border-focus); outline-offset: 2px; }
.ac-photo-add[disabled] { opacity: .5; cursor: default; }
.ac-photo-note { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
.ac-vid { width: 100%; height: 100%; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 3px; background: #1F2937; color: #fff; }
.ac-vid-ic { font-size: 20px; line-height: 1; }
.ac-vid-sz { font-size: 9px; font-weight: 700; opacity: .85; }
.ncv-recap { background: var(--bg-card-2); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 12px; margin-bottom: 14px; font-size: 12.5px;
  line-height: 1.55; color: var(--text-secondary); }
.ncv-recap b { color: var(--text-primary); }
.ncv-recap .ncv-missing { color: var(--text-muted); font-style: italic; }
.ncv-hint { font-size: 11.5px; margin: 4px 0 2px; min-height: 14px; }
.ncv-hint.warn { color: #B23C00; font-weight: 600; }

/* footer buttons */
.ac-footer {
  display: flex;
  gap: 8px;
  padding: 12px 18px 14px;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
.ac-submit {
  flex: 1;
  background: var(--pm-primary);
  color: #fff;
  border: none;
  border-radius: var(--r);
  padding: 9px 16px;
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: opacity .15s;
}
.ac-submit:hover { opacity: .9; }
.ac-submit:disabled { opacity: .4; cursor: not-allowed; }
.ac-cancel {
  padding: 9px 16px;
  background: var(--bg-card-2);
  color: var(--text-secondary);
  border: 1px solid var(--border);
  border-radius: var(--r);
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: background .15s;
}
.ac-cancel:hover { background: var(--border); }

/* ── INLINE DETAIL MODAL (TASK / RED TAG) ── */
.id-modal {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: calc(var(--r) * 1.5);
  box-shadow: var(--shadow-lg);
  z-index: 301;
  width: min(94vw, 480px);
  max-height: 82vh;
  overflow: hidden;
  display: none;
  flex-direction: column;
}
.id-modal.open { display: flex; }

/* ── SUMMARY TAB (by user / by zone) ── */
/* ── SUMMARY ──
   Two problems were structural, not cosmetic. Status and record type were both
   rendered as identical pills in the SAME status palette, so a Task was always
   green ("good") and an NC always red ("bad") no matter what state it was in --
   colour asserting a judgement the data never made. And every row carried an
   identical chip pair, so a person with 45 open of 48 looked like a person
   with 1 of 1.
   Now: status keeps the red/amber/green semantics and is the only coloured
   thing. Record type is neutral and typographic. Open count leads at display
   size, because that is the number the row exists to communicate. */
.ah-sum-section { margin-bottom: 26px; }
.ah-sum-section h3 {
  font-family: var(--font-display);
  font-size: 15px; font-weight: 700;
  color: var(--text-primary);
  letter-spacing: 0; text-transform: none;
  margin: 0 0 2px;
}
.ah-sum-section__sub {
  font-size: 13px; color: var(--text-secondary); margin: 0 0 12px;
}
.ah-sum-row {
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px 16px;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--r); padding: 12px 14px; margin-bottom: 6px;
}
.ah-sum-row__name {
  font-weight: 650; font-size: 15px; color: var(--text-primary);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.ah-sum-row__types {
  font-family: var(--font-mono); font-size: 12.5px; color: var(--text-secondary);
  display: flex; gap: 12px; flex-wrap: wrap; margin-top: 3px;
}
.ah-sum-row__types b { font-weight: 700; color: var(--text-primary); }
/* Numbers align in a fixed grid so columns read down the list. */
.ah-sum-nums { display: flex; align-items: baseline; gap: 18px; }
.ah-sum-num { text-align: right; min-width: 44px; }
.ah-sum-num__v {
  display: block; font-family: var(--font-mono); font-size: 20px;
  font-weight: 800; line-height: 1.1; letter-spacing: -.02em;
  /* slashed-zero off: a lone 0 in this mono face reads as the empty-set sign */
  font-variant-numeric: tabular-nums; font-feature-settings: 'zero' 0, 'tnum' 1;
}
.ah-sum-num__l {
  display: block; font-size: 10.5px; font-weight: 600; margin-top: 2px;
  text-transform: uppercase; letter-spacing: .04em; color: var(--text-secondary);
}
.ah-sum-num.open .ah-sum-num__v     { color: var(--score-red); }
.ah-sum-num.prog .ah-sum-num__v     { color: var(--score-amber); }
.ah-sum-num.closed .ah-sum-num__v   { color: var(--score-green); }
.ah-sum-num.total .ah-sum-num__v    { color: var(--text-primary); }
.ah-sum-num.zero .ah-sum-num__v     { color: var(--text-muted); font-weight: 600; }
/* Proportion of the row that is still open -- the one thing a reviewer scans
   a summary for. 2px, so it reads as a measure and not as decoration. */
/* Inset and muted: at full width in saturated red it read as a section rule
   rather than as this row's own measure. */
.ah-sum-bar {
  grid-column: 1 / -1; height: 3px; max-width: 240px; border-radius: 3px;
  background: var(--bg-card-2); overflow: hidden;
}
.ah-sum-bar span { display: block; height: 100%; background: var(--score-red); opacity: .55; }
@media (max-width: 560px) {
  .ah-sum-row { grid-template-columns: 1fr; }
  .ah-sum-nums { gap: 14px; }
  .ah-sum-num { min-width: 38px; text-align: left; }
}

/* ── AUDIT EVIDENCE THUMBNAILS + HOVER PREVIEW ── */
.ah-au-row {
  display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap;
  padding: 12px 0; border-bottom: 1px solid var(--border);
}
.ah-au-txt { flex: 1 1 240px; min-width: 0; }
.ah-au-photos { display: flex; gap: 8px; flex-wrap: wrap; flex-shrink: 0; }
.ah-au-thumb-wrap { position: relative; }
.ah-au-thumb {
  /* Was 56px square: enough to prove a photo existed, not to see the thing it
     was taken to show. 4:3 at 180px reads at a glance and still leaves the
     criterion text the majority of the row. */
  width: 180px; aspect-ratio: 4 / 3; height: auto; object-fit: cover; border-radius: 8px;
  border: 1px solid var(--border); cursor: zoom-in; display: block;
  background: var(--bg-subtle);
  transition: transform .15s ease, box-shadow .15s ease;
}
.ah-au-thumb:hover { transform: scale(1.15); z-index: 60; position: relative; box-shadow: var(--shadow-lg); }
@media (max-width: 700px) {
  /* On a phone the photo takes the full width under the text rather than
     competing with it for a narrow row. */
  .ah-au-photos { width: 100%; }
  .ah-au-thumb { width: 100%; }
}
@media (hover: none) { .ah-au-thumb:hover { transform: none; } } /* no hover-zoom on touch — tap opens lightbox instead */

/* ── PHOTO LIGHTBOX ── */
.ah-lightbox {
  display: none; position: fixed; inset: 0; z-index: 500;
  background: rgba(10,10,16,.94); align-items: center; justify-content: center;
  animation: ahLbFade .12s ease;
}
.ah-lightbox.open { display: flex; }
@keyframes ahLbFade { from { opacity: 0; } to { opacity: 1; } }
.ah-lightbox img { max-width: 92vw; max-height: 86vh; object-fit: contain; border-radius: 4px; }
.ah-lb-close {
  position: absolute; top: 14px; right: 16px; width: 38px; height: 38px;
  border-radius: 50%; border: none; background: rgba(255,255,255,.14); color: #fff;
  font-size: 20px; cursor: pointer; line-height: 1;
}
.ah-lb-nav {
  position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px;
  border-radius: 50%; border: none; background: rgba(255,255,255,.14); color: #fff;
  font-size: 16px; cursor: pointer;
}
.ah-lb-nav.prev { left: 14px; } .ah-lb-nav.next { right: 14px; }
.ah-lb-count {
  position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
  font-family: var(--font-mono); font-size: 12px; color: rgba(255,255,255,.75);
  background: rgba(0,0,0,.35); padding: 3px 10px; border-radius: 12px;
}
</style>
</head>
<body>

<div class="ah-header">
  <h1>Actions</h1>
  <div style="display:flex;align-items:center;gap:8px">
    <div id="ahRefreshBadge" style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted)"></div>
    <button class="ah-filter-toggle" id="ahSelectToggle" onclick="toggleSelectMode()"
            aria-pressed="false" title="Turn multi-select on or off">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      <span id="ahSelectLabel">Multi-select</span>
    </button>
    <button class="ah-filter-toggle" id="ahFilterToggle" onclick="toggleFilterRow()" title="Filters">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
      Filters<span class="ah-filter-count" id="ahFilterCount" style="display:none">0</span>
    </button>
    <button class="ah-create-btn" onclick="openCreateModal()">+ Create</button>
  </div>
</div>

<!-- VIEW TABS (record types are collapsible sections in the list itself) -->
<div class="ah-type-tabs" id="ahTypeTabs">
  <!-- Type tabs removed: each record type has its own bottom-nav page now, and
       Summary folded into Analytics. Four tabs duplicating five nav
       destinations was two navigations for one job. The strip stays in the DOM
       only as the anchor the page-title row renders into. -->
</div>

<!-- FILTERS (status + priority + zone) — folded behind the Filters toggle so the
     default view isn't a stack of 4 competing filter axes (critique P1). -->
<!-- Zone tabs sit ABOVE the status tabs: zone is the coarser cut (which part
     of the plant), status the finer one (what state its records are in). The
     strip is built from the loaded data so every tab carries a live count and
     zones with no records are not offered. -->
<div class="ah-zone-tabs" id="ahZoneTabs" role="tablist" aria-label="Zone"></div>

<!-- Status tabs are ALWAYS visible: they are how you reach In Progress and
     Closed records. They used to sit inside .ah-filter-row (display:none until
     the Filters toggle was pressed), which made those two views unreachable. -->
<div class="ah-status-tabs" id="ahStatusTabs" role="tablist">
  <button class="ah-status-tab active" data-status="OPEN"        onclick="setStatusTab(this)">Open        <span class="tab-badge is-pending" id="cntOPEN">–</span></button>
  <button class="ah-status-tab"        data-status="IN_PROGRESS" onclick="setStatusTab(this)">In Progress <span class="tab-badge is-pending" id="cntIN_PROGRESS">–</span></button>
  <button class="ah-status-tab"        data-status="CLOSED"      onclick="setStatusTab(this)">Closed      <span class="tab-badge is-pending" id="cntCLOSED">–</span></button>
</div>

<div class="ah-filter-row">
  <div class="ah-filter-chips">
    <button class="ah-chip active" data-pri=""         onclick="setPriChip(this)">All</button>
    <button class="ah-chip crit"   data-pri="CRITICAL" onclick="setPriChip(this)">Critical</button>
    <button class="ah-chip high"   data-pri="HIGH"     onclick="setPriChip(this)">High</button>
    <button class="ah-chip med"    data-pri="MEDIUM"   onclick="setPriChip(this)">Medium</button>
    <button class="ah-chip low"    data-pri="LOW"      onclick="setPriChip(this)">Low</button>
    <select class="ah-zone-select" id="ahZoneSelect" onchange="setZone(this.value)">
      <option value="">All Zones</option>
    </select>
  </div>
</div>

<!-- BULK ACTION BAR (shown only in select mode with ≥1 selected) -->
<div class="ah-bulk-bar" id="ahBulkBar" hidden>
  <span class="ah-bulk-count" id="ahBulkCount">0 selected</span>
  <button class="ah-bulk-btn" id="ahBulkClose" onclick="doBulkClose()">✓ Close selected</button>
  <button class="ah-bulk-btn ah-bulk-del" id="ahBulkDelete" onclick="doBulkDelete()">&#128465; Delete selected</button>
  <button class="ah-bulk-cancel" onclick="toggleSelectMode()">Cancel</button>
</div>

<!-- CARD LIST -->
<div id="ahContent">
  <div class="ah-loading">Loading actions…</div>
</div>

<!-- ── NC Record Detail Modal ── -->
<div class="rd-backdrop" id="rdBackdrop" onclick="closeNcDetail()"></div>
<div class="rd-modal" id="recordDetailModal" role="dialog" aria-modal="true" aria-labelledby="rdModalTitle">
  <div class="rd-modal__header">
    <span class="rd-modal__title" id="rdModalTitle">NC / CAPA Detail</span>
    <button class="rd-modal__close" onclick="closeNcDetail()" aria-label="Close">✕</button>
  </div>
  <div class="rd-modal__body" id="recordDetailBody"></div>
</div>

<!-- ── Edit Modal ── -->
<div class="rd-backdrop" id="editBackdrop" onclick="closeEditModal()"></div>
<div class="rd-modal" id="editModal" role="dialog" aria-modal="true" aria-labelledby="edModalTitle">
  <div class="rd-modal__header">
    <span class="rd-modal__title" id="edModalTitle">Edit</span>
    <button class="rd-modal__close" onclick="closeEditModal()" aria-label="Close">✕</button>
  </div>
  <div class="rd-modal__body" id="editBody"></div>
  <div style="padding:12px;display:flex;gap:8px;justify-content:flex-end">
    <button class="ah-btn" onclick="closeEditModal()">Cancel</button>
    <button class="ah-create-btn" onclick="submitEdit()">Save</button>
  </div>
</div>

<!-- ── Inline Detail Modal (TASK / RED_TAG) ── -->
<div class="rd-backdrop" id="idBackdrop" onclick="closeInlineDetail()"></div>
<div class="id-modal" id="inlineDetailModal" role="dialog" aria-modal="true" aria-labelledby="idModalTitle">
  <div class="rd-modal__header">
    <span class="rd-modal__title" id="idModalTitle">Detail</span>
    <button class="rd-modal__close" onclick="closeInlineDetail()" aria-label="Close">✕</button>
  </div>
  <div class="rd-modal__body" id="inlineDetailBody"></div>
</div>

<!-- ── Create Modal (NC / Task / Red Tag) ── -->
<div class="ac-backdrop" id="acBackdrop" onclick="closeCreateModal()"></div>
<div class="ac-modal" id="acCreateModal" role="dialog" aria-modal="true" aria-labelledby="acModalTitle">
  <div class="ac-header">
    <span class="ac-title" id="acModalTitle">Create Action</span>
    <button class="ac-close" onclick="closeCreateModal()" aria-label="Close">✕</button>
  </div>
  <div class="ac-body">

    <!-- Item type selector -->
    <div class="ac-field">
      <span class="ac-label">Item Type <span class="req">*</span></span>
      <div class="ac-type-row">
        <button class="ac-type-btn active" data-actype="NC"      onclick="setCreateType('NC',this)">NC</button>
        <button class="ac-type-btn"        data-actype="TASK"    onclick="setCreateType('TASK',this)">Task</button>
        <button class="ac-type-btn"        data-actype="RED_TAG" onclick="setCreateType('RED_TAG',this)">Red Tag</button>
      </div>
    </div>

    <!-- Zone selector (shared, always shown) -->
    <div class="ac-field">
      <label class="ac-label" for="acZone">Zone <span class="req">*</span></label>
      <select class="ac-select" id="acZone">
        <option value="">— select zone —</option>
      </select>
    </div>

    <!-- Photo evidence (shared by NC / Task / Red Tag) -->
    <div class="ac-field">
      <label class="ac-label">Evidence <span class="ac-hint">photos or short video &middot; up to 8</span></label>
      <div class="ac-photos" id="acPhotoStrip"></div>
      <button type="button" class="ac-photo-add" id="acPhotoAdd" onclick="acPickPhoto()">
        &#128247; Add photo
      </button>
      <input type="file" id="acPhotoInput" accept="image/*,video/*" capture="environment" multiple hidden
             onchange="acOnPhotoPicked(this)">

     and verification_remarks blank on every closed NC. -->
<div class="rca-backdrop" id="ncvBackdrop" onclick="closeNcVerifyModal()"></div>
