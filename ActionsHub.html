<script>
/* ── helpers ── */
function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── state ── */
var CURRENT_USER = '<?= (typeof params !== "undefined" && params && params.currentUser) ? params.currentUser : "" ?>';
var _filters = { type: '', status: 'OPEN', priority: '', zoneId: '' };
var _lastCounts = { byType:{NC:0,TASK:0,RED_TAG:0}, byStatus:{OPEN:0,IN_PROGRESS:0,CLOSED:0}, byPriority:{}, total:0 };
var _rcaPendingId = null;

/* ── tabs / chips ── */
function setTypeTab(btn) {
  document.querySelectorAll('.ah-type-tab').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  var t = btn.getAttribute('data-type');
  var isAudits = (t === 'AUDITS');
  var isSummary = (t === 'SUMMARY');
  var st = document.getElementById('ahStatusTabs');
  var fr = document.querySelector('.ah-filter-row');
  var ft = document.getElementById('ahFilterToggle');
  if (st) st.style.display = (isAudits || isSummary) ? 'none' : '';
  /* NOTE: never set inline display on .ah-filter-row — it would override the
     .open class and permanently break the Filters toggle. Use a class instead. */
  if (fr) fr.classList.toggle('hidden', isAudits || isSummary);
  if (ft) ft.style.display = (isAudits || isSummary) ? 'none' : '';
  if (isAudits) { renderAuditsView(); return; }
  if (isSummary) { renderSummaryView(); return; }
  _filters.type = t === 'ALL' ? '' : t;
  fetchAndRender();
}

/* ── Summary view: open NC/Task/RedTag counts by user and by zone ── */
function renderSummaryView() {
  document.getElementById('ahContent').innerHTML = '<div class="ah-loading">Loading summary…</div>';
  google.script.run
    .withSuccessHandler(function(res) {
      var byUser = (res && res.byUser) || [];
      var byZone = (res && res.byZone) || [];
      function typeChip(n, cls, label) {
        return n > 0 ? '<span class="ah-sum-chip ' + cls + '">' + label + ' ' + n + '</span>' : '';
      }
      function row(b) {
        return '<div class="ah-sum-row">' +
          '<div class="ah-sum-row__head"><span class="ah-sum-row__name">' + escHtml(b.label) + '</span>' +
          '<span class="ah-sum-row__total">' + b.total + ' total</span></div>' +
          '<div class="ah-sum-row__chips">' +
            typeChip(b.open, 'r', 'Open') + typeChip(b.inProgress, 'a', 'In-progress') + typeChip(b.closed, 'g', 'Closed') +
          '</div>' +
          '<div class="ah-sum-row__types">' +
            typeChip(b.byType.NC, 'nc', 'NC') + typeChip(b.byType.TASK, 'task', 'Task') + typeChip(b.byType.RED_TAG, 'rt', 'Red Tag') +
          '</div></div>';
      }
      var html = '<div class="ah-sum-section"><h3>By User</h3>' +
        (byUser.length ? byUser.map(row).join('') : '<div class="ah-empty">No actions yet.</div>') + '</div>' +
        '<div class="ah-sum-section"><h3>By Zone</h3>' +
        (byZone.length ? byZone.map(row).join('') : '<div class="ah-empty">No actions yet.</div>') + '</div>';
      document.getElementById('ahContent').innerHTML = html;
    })
    .withFailureHandler(function(e) {
      document.getElementById('ahContent').innerHTML = '<div class="ah-empty">' + escHtml(friendlyError_(e)) + '</div>';
    })
    .getActionsSummary({});
}

/* ── Audits view (per-criterion filled audits with photos) ── */
function renderAuditsView() {
  document.getElementById('ahContent').innerHTML = '<div class="ah-loading">Loading audits…</div>';
  google.script.run
    .withSuccessHandler(function(res) {
      var audits = (res && res.audits) || [];
      if (!audits.length) {
        document.getElementById('ahContent').innerHTML = '<div class="ah-empty">No submitted audits yet.</div>';
        return;
      }
      var html = audits.map(function(a) {
        var pcls = a.pct >= 80 ? 'g' : a.pct >= 60 ? 'a' : 'r';
        var when = a.timestamp ? new Date(a.timestamp).toLocaleString() : '';
        return '<div class="ah-card" onclick="openAuditDetail(\'' + escHtml(a.submissionId) + '\')" style="cursor:pointer">' +
          '<div class="ah-card__body"><div class="ah-card__top">' +
          '<span class="ah-card__title">' + escHtml(a.zoneId) + ' · ' + escHtml(a.zoneName) + '</span>' +
          '<span class="ah-pct ' + pcls + '" style="font-weight:700">' + a.pct + '%</span></div>' +
          '<div class="ah-card__meta">' + escHtml(when) + ' · ' + a.count + ' criteria · ' +
          a.photos + ' photo(s) · ' + escHtml(a.auditor) + '</div></div></div>';
      }).join('');
      document.getElementById('ahContent').innerHTML = html;
    })
    .withFailureHandler(function(e) {
      document.getElementById('ahContent').innerHTML = '<div class="ah-empty">' + escHtml(friendlyError_(e)) + '</div>';
    })
    .getRecentAudits(50);
}

/* ── Photo lightbox: each criterion's photo array is registered as a
   "gallery" so prev/next navigates within that criterion's own photos. ── */
var _ahGalleries = [];
var _ahLbState = { gallery: -1, idx: 0 };
function _ahRegisterGallery(urls) { return _ahGalleries.push(urls) - 1; }
function openAhLightbox(galleryIdx, photoIdx) {
  _ahLbState = { gallery: galleryIdx, idx: photoIdx };
  _ahRenderLightbox();
  document.getElementById('ahLightbox').classList.add('open');
}
function _ahRenderLightbox() {
  var urls = _ahGalleries[_ahLbState.gallery] || [];
  if (!urls.length) return;
  document.getElementById('ahLbImg').src = urls[_ahLbState.idx];
  document.getElementById('ahLbCount').textContent = (_ahLbState.idx + 1) + ' / ' + urls.length;
  var multi = urls.length > 1;
  document.getElementById('ahLbPrev').style.display = multi ? '' : 'none';
  document.getElementById('ahLbNext').style.display = multi ? '' : 'none';
}
function ahLbStep(ev, dir) {
  if (ev) ev.stopPropagation();
  var urls = _ahGalleries[_ahLbState.gallery] || [];
  if (!urls.length) return;
  _ahLbState.idx = (_ahLbState.idx + dir + urls.length) % urls.length;
  _ahRenderLightbox();
}
function closeAhLightbox(ev) {
  if (ev && ev.target !== ev.currentTarget && !ev.target.classList.contains('ah-lb-close')) return;
  document.getElementById('ahLightbox').classList.remove('open');
}
document.addEventListener('keydown', function(e) {
  var lb = document.getElementById('ahLightbox');
  if (!lb || !lb.classList.contains('open')) return;
  if (e.key === 'Escape') closeAhLightbox();
  else if (e.key === 'ArrowLeft') ahLbStep(null, -1);
  else if (e.key === 'ArrowRight') ahLbStep(null, 1);
});

function openAuditDetail(submissionId) {
  _ahGalleries = []; // reset gallery registry for this audit's photos
  document.getElementById('recordDetailBody').innerHTML = '<div class="ah-loading">Loading…</div>';
  document.getElementById('rdModalTitle').textContent = 'Filled Audit';
  document.getElementById('rdBackdrop').classList.add('open');
  document.getElementById('recordDetailModal').classList.add('open');
  google.script.run
    .withSuccessHandler(function(d) {
      if (!d || !d.found) { document.getElementById('recordDetailBody').innerHTML = '<div class="ah-empty">Not found.</div>'; return; }
      /* Header + per-pillar roll-up. The detail used to render bare criterion
         ids because getAuditDetail returned label:"" for every item (schema
         keys 'S1-C1', line items store the zone's 'S1-1'). With labels flowing
         there is enough to summarise. */
      var _sum = 0, _max = 0, _byP = {};
      d.items.forEach(function(it){
        if (it.score === null || it.score === undefined) return;
        _sum += it.score; _max += 4;
        var p = it.pillar || '?';
        if (!_byP[p]) _byP[p] = { s: 0, n: 0 };
        _byP[p].s += it.score; _byP[p].n++;
      });
      var _pct = _max ? Math.round(100 * _sum / _max) : 0;
      var _fails = d.items.filter(function(it){ return it.score !== null && it.score <= 1; }).length;
      var _pcls = _pct >= 80 ? 'g' : _pct >= 60 ? 'a' : 'r';

      var h = '<div style="margin-bottom:10px;font-size:13px;color:var(--text-muted)">' +
        escHtml(d.header.zoneId) + ' · ' + escHtml(d.header.zoneName) + ' · ' +
        (d.header.timestamp ? new Date(d.header.timestamp).toLocaleString() : '') + ' · ' + escHtml(d.header.auditor) + '</div>';

      h += '<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 12px;margin-bottom:12px;' +
           'background:var(--bg-card-2);border-radius:10px">' +
           '<span class="ah-pct ' + _pcls + '" style="font-size:22px;font-weight:800">' + _pct + '%</span>' +
           '<span style="font-size:13px;color:var(--text-secondary)">' + _sum + ' / ' + _max + ' pts</span>' +
           '<span style="font-size:13px;color:var(--text-secondary)">' + d.items.length + ' criteria</span>' +
           (_fails ? '<span style="font-size:13px;font-weight:700;color:var(--score-red)">' + _fails + ' failing</span>' : '') +
           '<span style="margin-left:auto;display:flex;gap:6px">' +
           Object.keys(_byP).sort().map(function(p){
             var pc = Math.round(100 * _byP[p].s / (_byP[p].n * 4));
             var col = pc >= 80 ? 'var(--score-green)' : pc >= 60 ? 'var(--score-amber)' : 'var(--score-red)';
             return '<span title="' + escHtml(p) + ' — ' + pc + '%" style="font-family:var(--font-mono);font-size:11px;' +
                    'font-weight:700;padding:3px 8px;border-radius:6px;color:#fff;background:' + col + '">' +
                    escHtml(p) + ' ' + pc + '</span>';
           }).join('') + '</span></div>';
      h += d.items.map(function(it) {
        var sc = (it.score === null || it.score === undefined) ? '—' : it.score;
        var scls = it.score <= 1 ? 'r' : it.score <= 2 ? 'a' : 'g';
        var urls = (it.photoUrls && it.photoUrls.length) ? it.photoUrls : (it.photoUrl ? [it.photoUrl] : []);
        var galleryIdx = urls.length ? _ahRegisterGallery(urls) : -1;
        var photo = urls.length
          ? '<div class="ah-au-photos">' + urls.map(function(u, pi) {
              return '<img class="ah-au-thumb" src="' + escHtml(u) + '" title="Click to enlarge"' +
                ' onclick="openAhLightbox(' + galleryIdx + ',' + pi + ')">';
            }).join('') + '</div>'
          : '';
        var titleLine = escHtml(it.criterionId) +
          (it.label ? ' · ' + escHtml(it.label) : '') +
          ' <span style="color:var(--text-muted);font-weight:400">(' + escHtml(it.pillar) + ')</span>';
        return '<div style="display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--border)">' +
          '<span class="ah-pct ' + scls + '" style="min-width:34px;font-weight:700">' + sc + '</span>' +
          '<div style="flex:1"><div style="font-weight:600;font-size:13.5px">' + titleLine + '</div>' +
          (it.labelHi ? '<div style="font-size:12.5px;color:var(--text-secondary);margin-top:2px">' + escHtml(it.labelHi) + '</div>' : '') +
          (it.remark ? '<div style="font-size:12.5px;color:var(--text-muted);margin-top:3px;font-style:italic">' + escHtml(it.remark) + '</div>' : '') +
          '</div>' + photo + '</div>';
      }).join('');
      h = '<div id="auShare" style="display:flex;gap:8px;margin-bottom:12px"><span style="font-size:12px;color:var(--text-muted)">Preparing report…</span></div>' + h;
      document.getElementById('recordDetailBody').innerHTML = h;
      auditShareLinks_(submissionId);
    })
    .withFailureHandler(function(e) { document.getElementById('recordDetailBody').innerHTML = '<div class="ah-empty">' + escHtml(friendlyError_(e)) + '</div>'; })
    .getAuditDetail(submissionId);
}

function auditShareLinks_(submissionId) {
  google.script.run
    .withSuccessHandler(function(r) {
      var el = document.getElementById('auShare');
      if (!el) return;
      if (r && r.success) {
        var h = '';
        if (r.pdfUrl) h += '<a href="' + r.pdfUrl + '" target="_blank" rel="noopener" style="flex:1;text-align:center;padding:9px;border-radius:8px;background:#eef2ff;color:#3730a3;font-weight:600;text-decoration:none;font-size:13px">&#128196; View PDF</a>';
        if (r.waUrl)  h += '<a href="' + r.waUrl + '" target="_blank" rel="noopener" style="flex:1;text-align:center;padding:9px;border-radius:8px;background:#25D366;color:#fff;font-weight:600;text-decoration:none;font-size:13px">&#128241; WhatsApp</a>';
        el.innerHTML = h;
      } else { el.innerHTML = '<span style="font-size:12px;color:var(--text-muted)">Report unavailable</span>'; }
    })
    .withFailureHandler(function() {
      var el = document.getElementById('auShare');
      if (el) el.innerHTML = '<span style="font-size:12px;color:var(--text-muted)">Report unavailable</span>';
    })
    .generateAuditPdf(submissionId);
}

function setStatusTab(btn) {
  document.querySelectorAll('.ah-status-tab').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  _filters.status = btn.getAttribute('data-status');
  fetchAndRender();
}

function setPriChip(btn) {
  document.querySelectorAll('.ah-chip').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  _filters.priority = btn.getAttribute('data-pri');
  updateFilterCount_();
  fetchAndRender();
}

function setZone(val) {
  _filters.zoneId = val;
  updateFilterCount_();
  fetchAndRender();
}

/* ── collapsible priority/zone filter row ── */
function toggleFilterRow() {
  var row = document.querySelector('.ah-filter-row');
  var btn = document.getElementById('ahFilterToggle');
  if (!row || !btn) return;
  var open = row.classList.toggle('open');
  btn.classList.toggle('on', open);
}
function updateFilterCount_() {
  var n = (_filters.priority ? 1 : 0) + (_filters.zoneId ? 1 : 0);
  var badge = document.getElementById('ahFilterCount');
  var btn = document.getElementById('ahFilterToggle');
  var row = document.querySelector('.ah-filter-row');
  if (!badge || !btn) return;
  badge.textContent = n;
  badge.style.display = n > 0 ? '' : 'none';
  btn.classList.toggle('on', n > 0 || (row && row.classList.contains('open')));
}

/* ── zone dropdown population ── */
function loadZones() {
  google.script.run
    .withSuccessHandler(function(zones) {
      var sel = document.getElementById('ahZoneSelect');
      if (!zones) return;
      zones.forEach(function(z) {
        var opt = document.createElement('option');
        opt.value = z;
        opt.textContent = z;
        sel.appendChild(opt);
      });
    })
    .withFailureHandler(function() {})
    .getAllZoneIds();
}

/* ── fetch ── */
function fetchAndRender() {
  document.getElementById('ahContent').innerHTML = '<div class="ah-loading">Loading…</div>';

  var f = {
    zoneId:   _filters.zoneId   || '',
    type:     _filters.type     || '',
    status:   _filters.status   || '',
    priority: _filters.priority || ''
  };

  google.script.run
    .withSuccessHandler(function(data) {
      if (!data) {
        document.getElementById('ahContent').innerHTML = '<div class="ah-empty">No data returned.</div>';
        return;
      }
      updateBadges(data.counts || {});
      renderCards(data.items || []);
    })
    .withFailureHandler(function(e) {
      document.getElementById('ahContent').innerHTML =
        '<div class="ah-loading" style="color:var(--score-red)">' + escHtml(friendlyError_(e)) + '</div>';
    })
    .getUnifiedActionList(f);
}

/* ── badge updates ── */
function updateBadges(counts) {
  _lastCounts = counts;
  var bs = counts.byStatus || {};
  var total = counts.total || 0;

  /* per-type counts now live on the collapsible section headers, not tabs */
  var setTxt = function(id, v) { var el = document.getElementById(id); if (el) el.textContent = v; };
  setTxt('cntAll', total);

  // Status badges reflect the selected type tab (fall back to all-types totals)
  var ss = bs;
  if (_filters.type && counts.byTypeStatus && counts.byTypeStatus[_filters.type]) {
    ss = counts.byTypeStatus[_filters.type];
  }
  setTxt('cntOPEN',        ss.OPEN        || 0);
  setTxt('cntIN_PROGRESS', ss.IN_PROGRESS || 0);
  setTxt('cntCLOSED',      ss.CLOSED      || 0);
}

/* ── render cards ── */
function renderCards(items) {
  if (!items || items.length === 0) {
    document.getElementById('ahContent').innerHTML =
      '<div class="ah-empty">✓ No actions match these filters.</div>';
    return;
  }

  /* Any open inline expander is discarded by this re-render */
  _openRow = null;

  /* Group into collapsible sections by record type */
  var groups = { NC: [], TASK: [], RED_TAG: [] };
  items.forEach(function(a) { (groups[a.type] = groups[a.type] || []).push(a); });

  var order = ['NC', 'TASK', 'RED_TAG'];
  var emoji = { NC: '&#128995;', TASK: '&#128203;', RED_TAG: '&#128308;' };
  var html = '';
  order.forEach(function(t) {
    var rows = groups[t] || [];
    if (!rows.length) return;
    var collapsed = _collapsed[t] ? ' collapsed' : '';
    html += '<div class="ah-sec' + collapsed + '" data-sec="' + t + '">' +
      '<div class="ah-sec-hd" onclick="toggleSection(\'' + t + '\')">' +
        '<span class="ah-sec-caret">&#9662;</span>' +
        '<span class="ah-sec-em">' + emoji[t] + '</span>' +
        '<span class="ah-sec-nm">' + escHtml(typeName(t)) + '</span>' +
        '<span class="ah-sec-ct">' + rows.length + '</span>' +
      '</div><div class="ah-sec-bd">' + buildTable_(rows) + '</div></div>';
  });
  document.getElementById('ahContent').innerHTML = html;
}

/* one table for a set of rows (no Type column — the section header carries it) */
function buildTable_(rows) {
  var sel = _selectMode;
  var selCol = sel ? '<col class="c-sel">' : '';
  var selHead = sel ? '<th class="ah-sel-th"></th>' : '';
  var html = '<div class="ah-table-wrap"><table class="ah-table' + (sel ? ' selecting' : '') + '">' +
    '<colgroup>' + selCol + '<col class="c-title"><col class="c-zone"><col class="c-owner">' +
    '<col class="c-due"><col class="c-age"><col class="c-pri"><col class="c-status"><col class="c-acts"></colgroup>' +
    '<thead><tr>' + selHead +
    '<th>Title</th><th class="hide-sm">Zone</th><th class="hide-sm">Owner</th>' +
    '<th class="hide-sm">Due</th><th class="hide-sm">Age</th><th>Pri</th><th>Status</th><th></th>' +
    '</tr></thead><tbody>';

  rows.forEach(function(a) {
    var priClass = escHtml(a.priority || '');
    var overdue = a.isOverdue && a.status !== 'CLOSED';
    var openArgs = escHtml(JSON.stringify(a.type)) + ',' + escHtml(JSON.stringify(a.id));
    /* urgency-first: overdue rows carry a loud left rail (data-overdue) that reads
       across a bay; priority tints it when not overdue. */
    html += '<tr class="ah-tr ' + priClass + '"' + (overdue ? ' data-overdue="1"' : '') +
      ' data-id="' + escHtml(a.id) + '" data-type="' + escHtml(a.type) + '">';
    if (sel) {
      /* only records that CAN be closed are selectable (already-closed excluded) */
      var closable = a.status !== 'CLOSED';
      html += '<td class="ah-sel-td">' + (closable
        ? '<input type="checkbox" class="ah-sel-box" aria-label="Select ' + escHtml(a.title) + '" onchange="onSelToggle_()">'
        : '') + '</td>';
    }
    /* title cell = the real expander trigger: keyboard + screen-reader reachable */
    html += '<td class="ah-td title" role="button" tabindex="0" aria-expanded="false"' +
      ' onclick="toggleRowDetail(' + openArgs + ',this)"' +
      ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();toggleRowDetail(' + openArgs + ',this);}"' +
      ' title="' + escHtml(a.title) + '">' +
      (overdue ? '<span class="ovd">&#9888; ' + (a.daysPastDue > 0 ? escHtml(String(a.daysPastDue)) + 'd overdue' : 'overdue') + '</span>' : '') +
      '<span class="ah-ttl-txt">' + escHtml(a.title) + '</span></td>';
    html += '<td class="ah-td muted hide-sm" data-label="Zone">' + escHtml(a.zone || '') + '</td>';
    html += '<td class="ah-td muted hide-sm" data-label="Owner">' + escHtml(a.owner || '—') + '</td>';
    html += '<td class="ah-td muted hide-sm" data-label="Due">' + escHtml(a.dueDate || '—') + '</td>';
    html += '<td class="ah-td muted hide-sm" data-label="Age">' + (a.ageDays != null ? escHtml(String(a.ageDays)) + 'd' : '—') + '</td>';
    html += '<td class="ah-td" data-label="Priority">' + (a.priority ? '<span class="pri-badge ' + escHtml(a.priority) + '">' + escHtml(a.priority) + '</span>' : '') + '</td>';
    html += '<td class="ah-td" data-label="Status"><span class="status-lbl ' + escHtml(a.status) + '">' + escHtml(statusLabel(a.status)) + '</span></td>';
    html += '<td class="ah-td acts">' + buildActionIcons(a) + '</td>';
    html += '</tr>';
  });
  return html + '</tbody></table></div>';
}

/* collapse state persists across re-renders */
var _collapsed = {};
function toggleSection(t) {
  _collapsed[t] = !_collapsed[t];
  var el = document.querySelector('.ah-sec[data-sec="' + t + '"]');
  if (el) el.classList.toggle('collapsed', !!_collapsed[t]);
}

/* Action buttons per type/status. The PRIMARY transition (Start/Done/Close/
   Advance) is wrapped separately from the secondary Edit/Delete pair so CSS can
   keep the primary big and thumb-safe while Edit/Delete recede — Delete is never
   thumb-adjacent to the primary action (critique P2). Each button carries a text
   label span (visually hidden on the dense desktop icon skin, shown on cards). */
function buildActionIcons(a) {
  var si = escHtml(JSON.stringify(a.id));
  var aj = escHtml(JSON.stringify(a));
  var ib = function(cls, icon, label, onclick) {
    return '<button class="ah-ibtn ' + cls + '" title="' + label + '" aria-label="' + label +
      '" onclick="event.stopPropagation();' + onclick + '">' +
      '<span class="ah-ibtn-ic" aria-hidden="true">' + icon + '</span>' +
      '<span class="ah-ibtn-lbl">' + label + '</span></button>';
  };
  var primary = '';
  if (a.status !== 'CLOSED') {
    if (a.type === 'NC') {
      if (a.status === 'OPEN') primary += ib('start', '&#9654;', 'Start', 'openRcaModal(' + si + ')');
      primary += ib('close', '&#10003;', 'Close', 'doNcClose(' + si + ',this)');
    } else if (a.type === 'TASK') {
      var raw = (a.rawStatus || '').toUpperCase();
      if (raw === 'BACKLOG' || raw === 'THIS_WEEK' || raw === 'OPEN' || a.status === 'OPEN')
        primary += ib('start', '&#9654;', 'Start', 'doTaskStatus(' + si + ',\'IN_PROGRESS\',this)');
      primary += ib('done', '&#10003;', 'Done', 'doTaskStatus(' + si + ',\'DONE\',this)');
    } else if (a.type === 'RED_TAG') {
      var np = nextRedTagPhase((a.rawStatus || a.status || '').toUpperCase());
      if (np) primary += ib('phase', '&#10003;', (np.label.replace(/<[^>]+>|&#\d+;/g, '').trim() || 'Advance'), 'doRedTagPhase(' + si + ',\'' + np.phase + '\',this)');
    }
  }
  var secondary = ib('edit', '&#9998;', 'Edit', 'openEditModal(' + aj + ')') +
                  ib('del', '&#128465;', 'Delete', 'doDelete(' + escHtml(JSON.stringify(a.type)) + ',' + si + ',this)');
  return '<span class="ah-acts-primary">' + primary + '</span>' +
         '<span class="ah-acts-secondary">' + secondary + '</span>';
}

function typeName(t) {
  if (t === 'NC') return 'NC';
  if (t === 'TASK') return 'Task';
  if (t === 'RED_TAG') return 'Red Tag';
  return t;
}

function statusLabel(s) {
  if (s === 'IN_PROGRESS') return 'In Progress';
  if (s === 'OPEN') return 'Open';
  if (s === 'CLOSED') return 'Closed';
  return s;
}

/* ── action buttons per type + status ── */
function buildActionBtns(a) {
  var id = a.id;
  var si = escHtml(JSON.stringify(id));
  var html = '';

  if (a.type === 'NC') {
    if (a.status === 'OPEN') {
      html += '<button class="ah-btn start" onclick="event.stopPropagation();openRcaModal(' + si + ')">&#8594; Start</button>';
      html += '<button class="ah-btn close" onclick="event.stopPropagation();doNcClose(' + si + ',this)">&#10003; Close</button>';
    } else if (a.status === 'IN_PROGRESS') {
      html += '<button class="ah-btn close" onclick="event.stopPropagation();doNcClose(' + si + ',this)">&#10003; Close</button>';
    }
  } else if (a.type === 'TASK') {
    var raw = (a.rawStatus || '').toUpperCase();
    if (raw === 'BACKLOG' || raw === 'THIS_WEEK' || raw === 'OPEN' || a.status === 'OPEN') {
      html += '<button class="ah-btn start" onclick="event.stopPropagation();doTaskStatus(' + si + ',\'IN_PROGRESS\',this)">&#8594; Start</button>';
      html += '<button class="ah-btn done"  onclick="event.stopPropagation();doTaskStatus(' + si + ',\'DONE\',this)">&#10003; Done</button>';
    } else if (a.status === 'IN_PROGRESS') {
      html += '<button class="ah-btn done" onclick="event.stopPropagation();doTaskStatus(' + si + ',\'DONE\',this)">&#10003; Done</button>';
    }
  } else if (a.type === 'RED_TAG') {
    var raw2 = (a.rawStatus || a.status || '').toUpperCase();
    var nextPhase = nextRedTagPhase(raw2);
    if (nextPhase) {
      html += '<button class="ah-btn phase" onclick="event.stopPropagation();doRedTagPhase(' + si + ',\'' + nextPhase.phase + '\',this)">' + nextPhase.label + '</button>';
    }
  }
  /* Edit + Delete available for all types/states */
  var aj = escHtml(JSON.stringify(a));
  html += '<button class="ah-btn edit" onclick="event.stopPropagation();openEditModal(' + aj + ')">&#9998; Edit</button>';
  html += '<button class="ah-btn del" onclick="event.stopPropagation();doDelete(' + escHtml(JSON.stringify(a.type)) + ',' + escHtml(JSON.stringify(a.id)) + ',this)">&#128465; Delete</button>';
  return html;
}

/* ── Edit modal ── */
function openEditModal(a) {
  var b = document.getElementById('editBody');
  var rows = '';
  function field(label, id, val, type) {
    return '<label style="display:block;font-size:12px;color:var(--text-muted);margin:8px 0 2px">' + label + '</label>' +
      (type === 'textarea'
        ? '<textarea id="' + id + '" rows="2" style="width:100%;padding:6px;border:1px solid var(--border);border-radius:6px">' + escHtml(val || '') + '</textarea>'
        : '<input id="' + id + '" type="' + (type || 'text') + '" value="' + escHtml(val || '') + '" style="width:100%;padding:6px;border:1px solid var(--border);border-radius:6px">');
  }
  if (a.type === 'NC') {
    rows += field('Description', 'edDesc', a.title, 'textarea');
    rows += field('Responsible', 'edOwner', a.owner);
    rows += field('Target date (YYYY-MM-DD)', 'edDue', a.dueDate);
  } else if (a.type === 'TASK') {
    rows += field('Title', 'edTitle', a.title);
    rows += field('Description', 'edDesc', a.description, 'textarea');
    rows += field('Assigned to', 'edOwner', a.owner);
    rows += field('Due date (YYYY-MM-DD)', 'edDue', a.dueDate);
    rows += field('Priority (urgent/high/medium/low)', 'edPri', a.priority);
  } else {
    rows += field('Item description', 'edDesc', a.title, 'textarea');
    rows += field('Owner', 'edOwner', a.owner);
    rows += field('Deadline (YYYY-MM-DD)', 'edDue', a.dueDate);
  }
  b.innerHTML = rows;
  b.setAttribute('data-type', a.type);
  b.setAttribute('data-id', a.id);
  document.getElementById('edModalTitle').textContent = 'Edit ' + typeName(a.type);
  document.getElementById('editBackdrop').classList.add('open');
  document.getElementById('editModal').classList.add('open');
}
function closeEditModal() {
  document.getElementById('editModal').classList.remove('open');
  document.getElementById('editBackdrop').classList.remove('open');
}
function submitEdit() {
  var b = document.getElementById('editBody');
  var type = b.getAttribute('data-type'), id = b.getAttribute('data-id');
  function v(x) { var el = document.getElementById(x); return el ? el.value : undefined; }
  var fn, updates;
  if (type === 'NC') {
    fn = 'editCAPA'; updates = { description: v('edDesc'), responsible: v('edOwner'), targetDate: v('edDue') };
  } else if (type === 'TASK') {
    fn = 'editTask'; updates = { title: v('edTitle'), description: v('edDesc'), assignedTo: v('edOwner'), dueDate: v('edDue'), priority: v('edPri') };
  } else {
    fn = 'editRedTag'; updates = { itemDescription: v('edDesc'), owner: v('edOwner'), deadline: v('edDue') };
  }
  google.script.run
    .withSuccessHandler(function(r) { closeEditModal(); fetchAndRender(); })
    .withFailureHandler(function(e) { showToast(friendlyError_(e), 'error'); })
    [fn](id, updates);
}
/* Any status-changing action (Start/Done/Advance/Close/Delete) can be
   triggered either from a table row or from inside a now-stale open detail
   modal — close whichever is open so the refreshed table is what's visible.
   No-op (safe) when called from a table row with nothing open. */
function closeAllDetailModals_() {
  closeInlineDetail();
  closeNcDetail();
}

function doDelete(type, id, btn) {
  if (!confirm('Delete this ' + typeName(type) + '?')) return;
  if (btn) { btn.disabled = true; btn.textContent = '…'; }
  var fn = type === 'NC' ? 'deleteCAPA' : type === 'TASK' ? 'deleteTask' : 'deleteRedTag';
  google.script.run
    .withSuccessHandler(function(r) {
      closeAllDetailModals_(); fetchAndRender();
      /* Real Undo: delete is a soft status flip, restore reverses it. */
      var prev = r && r.prevStatus;
      showUndoToast_(typeName(type) + ' deleted.', function(){
        google.script.run
          .withSuccessHandler(function(){ showToast(typeName(type) + ' restored.', 'success'); fetchAndRender(); })
          .withFailureHandler(function(e){ showToast(friendlyError_(e), 'error'); })
          .restoreRecord_(type, id, prev);
      });
    })
    .withFailureHandler(function(e) { showToast(friendlyError_(e), 'error'); if (btn) { btn.disabled = false; btn.textContent = '🗑 Delete'; } })
    [fn](id);
}

function nextRedTagPhase(raw) {
  if (raw === 'IDENTIFIED') return { phase: 'EVALUATED', label: '&#10003; Evaluate' };
  if (raw === 'EVALUATED')  return { phase: 'DISPOSED',  label: '&#10003; Dispose'  };
  if (raw === 'DISPOSED')   return { phase: 'CLOSED',    label: '&#10003; Close'    };
  return null;
}

/* ── inline row expander ──────────────────────────────────────────────────
   Clicking a row title expands its detail directly beneath the row instead of
   opening a modal, so the record stays in the context of its section. One row
   open at a time; clicking the same row again collapses it. */
var _openRow = null;

/* ── bulk select mode ─────────────────────────────────────────────────────
   A "Select" toggle turns on a checkbox column; picking rows and hitting
   "Close selected" runs the existing single-record close call per row. Only
   same-transition (close) and only not-already-closed rows — no combinatorial
   action matrix. Reuses doNcClose/doTaskStatus/doRedTagPhase, no bulk endpoint. */
var _selectMode = false;

function toggleSelectMode() {
  _selectMode = !_selectMode;
  var btn = document.getElementById('ahSelectToggle');
  if (btn) btn.classList.toggle('on', _selectMode);
  if (!_selectMode) { var bar = document.getElementById('ahBulkBar'); if (bar) bar.hidden = true; }
  fetchAndRender();   // re-render to add/remove the checkbox column
}

function selectedRows_() {
  return Array.prototype.slice.call(document.querySelectorAll('.ah-sel-box:checked'))
    .map(function(box){ var tr = box.closest('tr'); return tr && { id: tr.getAttribute('data-id'), type: tr.getAttribute('data-type') }; })
    .filter(Boolean);
}

function onSelToggle_() {
  var n = selectedRows_().length;
  var bar = document.getElementById('ahBulkBar');
  var cnt = document.getElementById('ahBulkCount');
  if (cnt) cnt.textContent = n + ' selected';
  if (bar) bar.hidden = (n === 0);
}

function doBulkClose() {
  var sel = selectedRows_();
  if (!sel.length) return;
  if (!confirm('Close ' + sel.length + ' selected record' + (sel.length > 1 ? 's' : '') + '?')) return;
  var btn = document.getElementById('ahBulkClose');
  if (btn) { btn.disabled = true; btn.textContent = 'Closing…'; }
  var done = 0, failed = 0;
  function finish() {
    if (done + failed < sel.length) return;
    showToast(done + ' closed' + (failed ? ', ' + failed + ' failed' : ''), failed ? 'error' : 'success');
    _selectMode = false;
    var b = document.getElementById('ahSelectToggle'); if (b) b.classList.remove('on');
    var bar = document.getElementById('ahBulkBar'); if (bar) bar.hidden = true;
    fetchAndRender();
  }
  sel.forEach(function(r) {
    var fn, args;
    if (r.type === 'NC')       { fn = 'updateCAPAStatus';  args = [r.id, 'CLOSED', '', '']; }
    else if (r.type === 'TASK'){ fn = 'updateTaskStatus';  args = [r.id, 'DONE', '']; }
    else                       { fn = 'advanceRedTagPhase'; args = [r.id, 'CLOSED', '']; }
    google.script.run
      .withSuccessHandler(function(res){ (res && (res.success || res.ok)) ? done++ : failed++; finish(); })
      .withFailureHandler(function(){ failed++; finish(); })
      [fn].apply(null, args);
  });
}

function toggleRowDetail(type, id, el) {
  var tr = el && el.closest ? el.closest('tr') : null;
  if (!tr) { openDetail(type, id); return; }   // fall back to the modal

  /* collapse any currently-open expander (including this one → toggle off).
     Search globally: each type section is its own <table>, so tr.parentNode
     would miss an expander open in a different section. */
  var existing = document.querySelector('tr.ah-detail-row');
  var wasThis = existing && existing.previousElementSibling === tr;
  if (existing) existing.parentNode.removeChild(existing);
  /* reset every open trigger's state, then re-set only if we're opening */
  document.querySelectorAll('.ah-tr.expanded').forEach(function(r) {
    r.classList.remove('expanded');
    var trig = r.querySelector('.ah-td.title'); if (trig) trig.setAttribute('aria-expanded', 'false');
  });
  if (wasThis) { _openRow = null; return; }

  var cols = tr.children.length;
  var det = document.createElement('tr');
  det.className = 'ah-detail-row';
  det.innerHTML = '<td class="ah-detail-cell" colspan="' + cols + '">' +
    '<div class="ah-detail-box" id="ahDetailBox">' +
    '<div class="ah-loading" style="padding:14px 0">Loading…</div></div></td>';
  tr.parentNode.insertBefore(det, tr.nextSibling);
  tr.classList.add('expanded');
  el.setAttribute('aria-expanded', 'true');
  _openRow = id;

  if (type === 'NC') {
    google.script.run
      .withSuccessHandler(function(d) { renderNcDetail(d, 'ahDetailBox'); })
      .withFailureHandler(function(e) {
        var b = document.getElementById('ahDetailBox');
        if (b) b.innerHTML = '<div class="ah-loading" style="color:var(--score-red)">' + escHtml(friendlyError_(e)) + '</div>';
      })
      .getNcDetail(id);
  } else {
    var box = document.getElementById('ahDetailBox');
    if (box) box.innerHTML = buildTaskDetailBody_(findItem_(id));
  }
}

/* ── open detail (modal — kept for non-table callers) ── */
function openDetail(type, id) {
  if (type === 'NC') {
    openNcDetail(id);
  } else {
    openInlineDetail(type, id);
  }
}

/* ── NC detail modal ── */
function openNcDetail(id) {
  var modal    = document.getElementById('recordDetailModal');
  var backdrop = document.getElementById('rdBackdrop');
  var body     = document.getElementById('recordDetailBody');
  body.innerHTML = '<div class="ah-loading" style="padding:30px 0">Loading…</div>';
  modal.classList.add('open');
  backdrop.classList.add('open');
  google.script.run
    .withSuccessHandler(renderNcDetail)
    .withFailureHandler(function(e) {
      document.getElementById('recordDetailBody').innerHTML =
        '<div class="ah-loading" style="color:var(--score-red)">' + escHtml(friendlyError_(e)) + '</div>';
    })
    .getNcDetail(id);
}

function closeNcDetail() {
  document.getElementById('recordDetailModal').classList.remove('open');
  document.getElementById('rdBackdrop').classList.remove('open');
}

/* Renders into the modal body (default) or any element id passed as targetId,
   so the inline expander and the modal share one renderer. */
function renderNcDetail(d, targetId) {
  var body = document.getElementById(targetId || 'recordDetailBody');
  if (!body) return;
  if (!d) { body.innerHTML = '<div class="ah-loading">Record not found.</div>'; return; }
  function cell(icon, val, wide) {
    if (val === null || val === undefined || val === '') return '';
    return '<div class="rc-cell' + (wide ? ' wide' : '') + '"><span class="rc-ic">' + icon +
      '</span><span class="rc-v">' + escHtml(String(val)) + '</span></div>';
  }
  function para(key, val) {
    if (val === null || val === undefined || val === '') return '';
    return '<div class="rc-para"><span class="rc-k">' + key + '</span>' + escHtml(String(val)) + '</div>';
  }
  var zone = d.zoneName || d.zoneId;
  var badges = d.status ? '<span class="status-lbl ' + escHtml(d.status) + '">' + escHtml(statusLabel(d.status)) + '</span>' : '';
  if (d.isRepeat) badges += '<span class="rc-repeat">&#128257; Repeat' + (d.recurrenceCount ? ' ×' + escHtml(String(d.recurrenceCount)) : '') + '</span>';
  var html = '<div class="rc-hero"><span class="rc-emoji">&#128995;</span>' +
    '<span class="rc-id">' + escHtml(d.id) + '</span>' +
    '<span class="rc-badges">' + badges + '</span></div>';
  if (d.description) html += '<div class="rc-title">' + escHtml(d.description) + '</div>';
  html += '<div class="rc-grid">';
  html += cell('&#128205;', zone);                       /* 📍 */
  html += cell('&#128100;', d.responsible);              /* 👤 */
  html += cell('&#127919;', d.pillar);                   /* 🎯 */
  html += cell('&#128197;', d.targetDate && ('Target ' + d.targetDate)); /* 📅 */
  html += cell('&#128202;', d.scoreGiven != null && d.scoreGiven !== '' && ('Score ' + d.scoreGiven)); /* 📊 */
  html += '</div>';

  var rca = para('Root Cause:', d.rootCause) + para('Corrective:', d.correctiveAction) + para('Preventive:', d.preventiveAction);
  if (rca) html += '<div class="rc-section">Root Cause Analysis</div>' + rca;

  var auditCells =
    cell('&#128373;', d.auditor && ('By ' + d.auditor)) +      /* 🕵 */
    cell('&#128197;', d.auditDate && ('Audit ' + d.auditDate)) +
    cell('&#10133;',  d.createdDate && ('Created ' + d.createdDate)) +  /* ➕ */
    cell('&#9989;',   d.closureDate && ('Closed ' + d.closureDate)) +   /* ✅ */
    cell('&#128100;', d.verifiedBy && ('Verified by ' + d.verifiedBy));
  var remarks = para('Remarks:', d.verificationRemarks);
  if (auditCells || remarks) {
    html += '<div class="rc-section">Audit &amp; Verification</div>';
    if (auditCells) html += '<div class="rc-grid">' + auditCells + '</div>';
    html += remarks;
  }

  var ncAction = { type: 'NC', id: d.id, title: d.description, status: d.status, zone: zone };
  html += '<div class="ah-card__actions" style="border-top:1px solid var(--border-light);margin-top:2px;padding:10px 0 0">' + buildActionBtns(ncAction) + '</div>';
  body.innerHTML = html;
}

/* ── Inline detail (TASK / RED_TAG) ── */
/* Detail body for a TASK / RED_TAG row. Shared by the inline expander and the
   modal so both render identically. */
function buildTaskDetailBody_(item) {
  if (!item) return '<div class="ah-loading">Detail not available.</div>';
  function cell(icon, val, wide) {
    if (val === null || val === undefined || val === '') return '';
    return '<div class="rc-cell' + (wide ? ' wide' : '') + '"><span class="rc-ic">' + icon +
      '</span><span class="rc-v">' + escHtml(String(val)) + '</span></div>';
  }
  var emoji = item.type === 'RED_TAG' ? '&#128308;' : '&#128203;'; /* 🔴 / 📋 */
  var badges = '';
  if (item.status) badges += '<span class="status-lbl ' + escHtml(item.status) + '">' + escHtml(statusLabel(item.status)) + '</span>';
  if (item.priority) badges += '<span class="pri-badge ' + escHtml(item.priority) + '">' + escHtml(item.priority) + '</span>';
  var h = '<div class="rc-hero"><span class="rc-emoji">' + emoji + '</span>' +
    '<span class="rc-id">' + escHtml(item.id) + '</span>' +
    '<span class="rc-badges">' + badges + '</span></div>';
  if (item.title) h += '<div class="rc-title">' + escHtml(item.title) + '</div>';
  h += '<div class="rc-grid">';
  h += cell('&#128205;', item.zone);        /* 📍 */
  h += cell('&#128100;', item.owner);       /* 👤 */
  h += cell('&#128197;', item.dueDate && ('Due ' + item.dueDate)); /* 📅 */
  h += cell('&#128336;', item.ageDays != null && (item.ageDays + 'd old')); /* 🕐 */
  h += '</div>';
  if (item.description) h += '<div class="rc-desc">' + escHtml(item.description) + '</div>';
  h += '<div class="ah-card__actions" style="border-top:1px solid var(--border-light);margin-top:2px;padding:10px 0 0">' + buildActionBtns(item) + '</div>';
  return h;
}

function findItem_(id) {
  if (!window._lastItems) return null;
  for (var i = 0; i < _lastItems.length; i++) if (_lastItems[i].id === id) return _lastItems[i];
  return null;
}

function openInlineDetail(type, id) {
  var item = findItem_(id);
  var title = type === 'TASK' ? 'Task Detail' : 'Red Tag Detail';
  document.getElementById('idModalTitle').textContent = title;
  document.getElementById('inlineDetailBody').innerHTML = buildTaskDetailBody_(item);
  document.getElementById('inlineDetailModal').classList.add('open');
  document.getElementById('idBackdrop').classList.add('open');
}

function closeInlineDetail() {
  document.getElementById('inlineDetailModal').classList.remove('open');
  document.getElementById('idBackdrop').classList.remove('open');
}

/* ── RCA modal for NC start ── */
function openRcaModal(ncId) {
  _rcaPendingId = ncId;
  document.getElementById('rcaRootCause').value = '';
  document.getElementById('rcaCorrectiveAction').value = '';
  document.getElementById('rcaCounter').textContent = '0 / 50 chars';
  document.getElementById('rcaCounter').className = 'rca-counter';
  document.getElementById('rcaSubmitBtn').disabled = true;
  document.getElementById('rcaModal').classList.add('open');
  document.getElementById('rcaBackdrop').classList.add('open');
  document.getElementById('rcaRootCause').focus();
}

function closeRcaModal() {
  document.getElementById('rcaModal').classList.remove('open');
  document.getElementById('rcaBackdrop').classList.remove('open');
  _rcaPendingId = null;
}

function onRcaInput() {
  var len = document.getElementById('rcaRootCause').value.length;
  var counter = document.getElementById('rcaCounter');
  counter.textContent = len + ' / 50 chars';
  counter.className = 'rca-counter' + (len >= 50 ? ' ok' : '');
  document.getElementById('rcaSubmitBtn').disabled = (len < 50);
}

function submitRca() {
  if (!_rcaPendingId) return;
  var rootCause        = document.getElementById('rcaRootCause').value.trim();
  var correctiveAction = document.getElementById('rcaCorrectiveAction').value.trim();
  if (rootCause.length < 50) {
    showToast('Root cause must be at least 50 characters.', 'error'); return;
  }
  if (!correctiveAction) {
    showToast('Corrective action is required.', 'error'); return;
  }
  var btn = document.getElementById('rcaSubmitBtn');
  btn.disabled = true;
  btn.textContent = '…';

  var id = _rcaPendingId;
  google.script.run
    .withSuccessHandler(function(result) {
      btn.disabled = false;
      btn.textContent = 'Submit & Start';
      if (result && result.success) {
        showToast('NC started.', 'success');
        closeRcaModal();
        fetchAndRender();
      } else {
        showToast((result && result.message) || 'Failed to start NC.', 'error');
      }
    })
    .withFailureHandler(function(e) {
      btn.disabled = false;
      btn.textContent = 'Submit & Start';
      showToast(friendlyError_(e), 'error');
    })
    .updateCAPAStatus(id, 'IN_PROGRESS', '', '', { root_cause: rootCause, corrective_action: correctiveAction });
}

/* ── NC close ── */
function doNcClose(id, btn) {
  var remarks = '';
  disableBtn(btn, '…');
  google.script.run
    .withSuccessHandler(function(result) {
      enableBtn(btn, '✓ Close');
      if (result && result.success) {
        showToast('NC closed.', 'success');
        closeAllDetailModals_(); fetchAndRender();
      } else {
        showToast((result && result.message) || 'Failed to close NC.', 'error');
      }
    })
    .withFailureHandler(function(e) {
      enableBtn(btn, '✓ Close');
      showToast(friendlyError_(e), 'error');
    })
    .updateCAPAStatus(id, 'CLOSED', '', remarks);
}

/* ── TASK status ── */
function doTaskStatus(id, newStatus, btn) {
  var origText = btn.textContent;
  disableBtn(btn, '…');
  google.script.run
    .withSuccessHandler(function(result) {
      enableBtn(btn, origText);
      if (result && result.success) {
        showToast('Task updated.', 'success');
        closeAllDetailModals_(); fetchAndRender();
      } else {
        showToast((result && result.message) || 'Failed to update task.', 'error');
      }
    })
    .withFailureHandler(function(e) {
      enableBtn(btn, origText);
      showToast(friendlyError_(e), 'error');
    })
    .updateTaskStatus(id, newStatus, '');
}

/* ── RED TAG phase ── */
function doRedTagPhase(id, toPhase, btn) {
  var origText = btn.innerHTML;
  disableBtn(btn, '…');
  google.script.run
    .withSuccessHandler(function(result) {
      btn.innerHTML = origText;
      enableBtn(btn, origText);
      if (result && result.success) {
        showToast('Red Tag advanced.', 'success');
        closeAllDetailModals_(); fetchAndRender();
      } else {
        showToast((result && result.message) || 'Failed to advance Red Tag.', 'error');
      }
    })
    .withFailureHandler(function(e) {
      btn.innerHTML = origText;
      enableBtn(btn, origText);
      showToast(friendlyError_(e), 'error');
    })
    .advanceRedTagPhase(id, toPhase, '');
}

/* ── btn helpers ── */
function disableBtn(btn, text) {
  btn.disabled = true;
  btn.textContent = text;
}
function enableBtn(btn, text) {
  btn.disabled = false;
  btn.innerHTML = text;
}

/* ── toast ── */
function showToast(msg, type) {
  if (typeof pmToast === 'function') {
    pmToast(msg, type || 'info');
  } else {
    alert(msg);
  }
}

/* Translate a raw server error into short, actionable floor copy. GAS pushes
   exception strings like "Exception: Service invoked too many times" that mean
   nothing to a gloved worker — map the common ones, generic-fallback the rest,
   never surface a stack. */
function friendlyError_(e) {
  var raw = (e && e.message ? String(e.message) : String(e || '')).toLowerCase();
  if (!raw) return 'Something went wrong. Please try again.';
  if (/network|fetch|timeout|timed out|unavailable|too many times|rate/.test(raw))
    return 'Connection problem. Check your network and try again.';
  if (/permission|not allowed|denied|auth/.test(raw))
    return "You don't have permission for that action.";
  if (/not found|no such|missing/.test(raw))
    return 'That record could no longer be found — it may have changed. Refreshing…';
  if (/lock|busy|concurrent/.test(raw))
    return 'Someone else is editing this. Wait a moment and try again.';
  return 'Could not complete that action. Please try again.';
}

/* Toast with an inline Undo action. Falls back to a plain toast if the toast
   host has no action support (pmToast is fire-and-forget). */
function showUndoToast_(msg, onUndo) {
  if (typeof pmToast === 'function' && pmToast.length >= 3) {
    pmToast(msg, 'success', { actionLabel: 'Undo', onAction: onUndo, duration: 6000 });
    return;
  }
  /* Minimal self-contained undo bar — no dependency on the host toast. */
  var bar = document.createElement('div');
  bar.className = 'ah-undo';
  bar.innerHTML = '<span>' + escHtml(msg) + '</span><button type="button" class="ah-undo-btn">Undo</button>';
  document.body.appendChild(bar);
  var t = setTimeout(function(){ bar.remove(); }, 6000);
  bar.querySelector('.ah-undo-btn').addEventListener('click', function(){
    clearTimeout(t); bar.remove(); onUndo();
  });
}

/* ── CREATE MODAL ── */
var _acType = 'NC';
var _acZonesLoaded = false;

function openCreateModal() {
  _acType = 'NC';
  // reset type buttons
  document.querySelectorAll('.ac-type-btn').forEach(function(b) {
    b.classList.toggle('active', b.getAttribute('data-actype') === 'NC');
  });
  _showCreateGroup('NC');
  // reset fields
  document.getElementById('acZone').value = '';
  document.getElementById('acNcPillar').value = 'S1';
  document.getElementById('acNcDesc').value = '';
  document.getElementById('acNcPerson').value = '';
  document.getElementById('acTaskTitle').value = '';
  document.getElementById('acTaskDesc').value = '';
  document.getElementById('acTaskPriority').value = 'MEDIUM';
  document.getElementById('acTaskAssigned').value = '';
  document.getElementById('acTaskDue').value = '';
  document.getElementById('acRtItem').value = '';
  document.getElementById('acRtQty').value = '1';
  document.getElementById('acRtCat').value = 'Equipment';
  document.getElementById('acRtReason').value = '';
  document.getElementById('acRtAction').value = '';
  // populate zone select from existing filter dropdown (reuse loadZones data)
  if (!_acZonesLoaded) {
    var src = document.getElementById('ahZoneSelect');
    var dst = document.getElementById('acZone');
    // clear all but first placeholder
    while (dst.options.length > 1) { dst.remove(1); }
    for (var i = 1; i < src.options.length; i++) {
      var o = document.createElement('option');
      o.value = src.options[i].value;
      o.textContent = src.options[i].textContent;
      dst.appendChild(o);
    }
    if (src.options.length > 1) { _acZonesLoaded = true; }
  }
  var btn = document.getElementById('acSubmitBtn');
  btn.disabled = false;
  btn.textContent = 'Create';
  document.getElementById('acCreateModal').classList.add('open');
  document.getElementById('acBackdrop').classList.add('open');
}

function closeCreateModal() {
  document.getElementById('acCreateModal').classList.remove('open');
  document.getElementById('acBackdrop').classList.remove('open');
}

function setCreateType(type, btn) {
  _acType = type;
  document.querySelectorAll('.ac-type-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  _showCreateGroup(type);
}

function _showCreateGroup(type) {
  ['NC','TASK','RED_TAG'].forEach(function(t) {
    var el = document.getElementById('acGrp' + t);
    if (el) { el.style.display = (t === type) ? '' : 'none'; }
  });
}

var _pillarSqcdp = { S1:'S', S2:'Q', S3:'C', S4:'D', S5:'P' };

function submitCreate() {
  var zone = document.getElementById('acZone').value.trim();
  if (!zone) { showToast('Please select a zone.', 'error'); return; }

  var btn = document.getElementById('acSubmitBtn');

  if (_acType === 'NC') {
    var desc = document.getElementById('acNcDesc').value.trim();
    if (!desc) { showToast('Description is required for NC.', 'error'); return; }
    var pillar = document.getElementById('acNcPillar').value;
    var sqcdp  = _pillarSqcdp[pillar] || 'S';
    var person = document.getElementById('acNcPerson').value.trim();
    btn.disabled = true; btn.textContent = 'Creating…';
    google.script.run
      .withSuccessHandler(function(ncId) {
        btn.disabled = false; btn.textContent = 'Create';
        if (ncId) {
          showToast('NC created: ' + escHtml(String(ncId)), 'success');
          closeCreateModal();
          fetchAndRender();
        } else {
          showToast('Server returned no NC ID. Please retry.', 'error');
        }
      })
      .withFailureHandler(function(e) {
        btn.disabled = false; btn.textContent = 'Create';
        showToast(friendlyError_(e), 'error');
      })
      .createCAPA(zone, desc, 'NC', pillar, sqcdp, person, CURRENT_USER);

  } else if (_acType === 'TASK') {
    var title = document.getElementById('acTaskTitle').value.trim();
    if (!title) { showToast('Title is required for Task.', 'error'); return; }
    btn.disabled = true; btn.textContent = 'Creating…';
    google.script.run
      .withSuccessHandler(function(result) {
        btn.disabled = false; btn.textContent = 'Create';
        if (result && result.success) {
          showToast('Task created: ' + escHtml(String(result.taskId || '')), 'success');
          closeCreateModal();
          fetchAndRender();
        } else {
          showToast((result && result.message) || 'Failed to create task.', 'error');
        }
      })
      .withFailureHandler(function(e) {
        btn.disabled = false; btn.textContent = 'Create';
        showToast(friendlyError_(e), 'error');
      })
      .createTask({
        title:       title,
        zoneId:      zone,
        description: document.getElementById('acTaskDesc').value.trim(),
        priority:    document.getElementById('acTaskPriority').value,
        assignedTo:  document.getElementById('acTaskAssigned').value.trim(),
        dueDate:     document.getElementById('acTaskDue').value,
        source:      'MANUAL',
        createdBy:   CURRENT_USER
      });

  } else if (_acType === 'RED_TAG') {
    var item = document.getElementById('acRtItem').value.trim();
    if (!item) { showToast('Item is required for Red Tag.', 'error'); return; }
    btn.disabled = true; btn.textContent = 'Creating…';
    google.script.run
      .withSuccessHandler(function(result) {
        btn.disabled = false; btn.textContent = 'Create';
        if (result && (result.ok || result.success)) {
          showToast('Red Tag raised: ' + escHtml(String(result.tagNo || '')), 'success');
          closeCreateModal();
          fetchAndRender();
        } else {
          showToast((result && result.message) || 'Failed to raise Red Tag.', 'error');
        }
      })
      .withFailureHandler(function(e) {
        btn.disabled = false; btn.textContent = 'Create';
        showToast(friendlyError_(e), 'error');
      })
      .raiseRedTag({
        zone:     zone,
        item:     item,
        quantity: parseInt(document.getElementById('acRtQty').value, 10) || 1,
        category: document.getElementById('acRtCat').value,
        reason:   document.getElementById('acRtReason').value.trim(),
        action:   document.getElementById('acRtAction').value.trim(),
        taggedBy: CURRENT_USER,
        createdBy: CURRENT_USER
      });
  }
}

/* also invalidate zone cache when loadZones refreshes */
var _origLoadZones = loadZones;
loadZones = function() {
  _acZonesLoaded = false;
  _origLoadZones();
};

/* ── patch renderCards to store items for inline detail ── */
var _origRenderCards = renderCards;
renderCards = function(items) {
  window._lastItems = items;
  _origRenderCards(items);
};

/* ── init ── */
loadZones();
fetchAndRender();
</script>
