<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>PackMasters 5S — Select Zone</title>
<?!= include('CommonStyles') ?>
<style>
  body { min-height: 100vh; display: flex; flex-direction: column; }

  .zs-header {
    background: var(--bg-header);
    border-bottom: 2px solid var(--pm-accent);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .zs-logo {
    width: 36px; height: 36px;
    background: var(--pm-accent);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 14px; color: #fff; letter-spacing: -0.5px;
    flex-shrink: 0;
  }
  .zs-header-title {
    font-size: var(--size-md);
    font-weight: 700;
    color: var(--text-primary);
  }
  .zs-header-sub {
    font-size: var(--size-xs);
    color: var(--text-muted);
  }

  .zs-body {
    flex: 1;
    padding: 20px 16px;
    max-width: 600px;
    margin: 0 auto;
    width: 100%;
  }

  .zs-prompt {
    font-size: var(--size-sm);
    color: var(--text-secondary);
    margin-bottom: 16px;
    font-weight: 500;
  }

  .zone-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  @media (max-width: 360px) {
    .zone-grid { grid-template-columns: 1fr; }
  }

  .zone-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 12px;
    background: var(--bg-card);
    border: 2px solid var(--bg-card-2);
    border-radius: 12px;
    cursor: pointer;
    text-decoration: none;
    transition: border-color .15s, background .15s;
    min-height: 90px;
    text-align: center;
    -webkit-tap-highlight-color: transparent;
  }
  .zone-card:active,
  .zone-card:hover {
    border-color: var(--pm-accent);
    background: var(--bg-card-2);
  }
  .zone-id {
    font-size: var(--size-xs);
    font-weight: 700;
    color: var(--pm-accent);
    letter-spacing: 0.06em;
    margin-bottom: 4px;
  }
  .zone-name {
    font-size: var(--size-sm);
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1.3;
  }

  .zs-footer {
    padding: 16px;
    text-align: center;
    border-top: 1px solid var(--bg-card-2);
  }
  .zs-login-link {
    font-size: var(--size-xs);
    color: var(--text-muted);
    text-decoration: none;
  }
  .zs-login-link:hover { color: var(--text-secondary); }
  .zs-login-link span { text-decoration: underline; }
</style>
</head>
<body>

<div class="zs-header">
  <div class="zs-logo">PM</div>
  <div>
    <div class="zs-header-title">PackMasters 5S</div>
    <div class="zs-header-sub">Select your zone to begin</div>
  </div>
</div>

<div class="zs-body">
  <div class="zs-prompt">Tap your zone</div>
  <div class="zone-grid" id="zoneGrid">
    <!-- Skeleton -->
    <div class="zone-card" style="pointer-events:none">
      <div class="pm-skeleton" style="height:12px;width:40px;margin-bottom:6px"></div>
      <div class="pm-skeleton" style="height:14px;width:80px"></div>
    </div>
    <div class="zone-card" style="pointer-events:none">
      <div class="pm-skeleton" style="height:12px;width:40px;margin-bottom:6px"></div>
      <div class="pm-skeleton" style="height:14px;width:80px"></div>
    </div>
  </div>
</div>

<div class="zs-footer">
  <a class="zs-login-link" href="<?= deployUrl ?>?action=login" target="_top">
    Manager / Admin <span>sign in</span>
  </a>
</div>

<script>
(function() {
  var zones = <?!= zonesJson ?>;
  var deployUrl = '<?!= deployUrl ?>';
  var grid = document.getElementById('zoneGrid');
  grid.innerHTML = '';
  zones.forEach(function(z) {
    var a = document.createElement('a');
    a.className = 'zone-card';
    a.href = deployUrl + '?v2=1&action=quickaudit&zone=' + encodeURIComponent(z.id);
    a.target = '_top';
    a.innerHTML =
      '<div class="zone-id">' + escHtml(z.id) + '</div>' +
      '<div class="zone-name">' + escHtml(z.name) + '</div>';
    grid.appendChild(a);
  });
  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
})();
</script>
</body>
</html>
