<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Quick Audit — PackMasters 5S</title>
<?!= include("CommonStyles") ?>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      oklch(96.5% 0.015 78);
  --card:    oklch(100% 0 0);
  --line:    oklch(91% 0.010 76);
  --line2:   oklch(85% 0.012 74);
  --ink:     oklch(15% 0.018 56);
  --ink-2:   oklch(34% 0.016 58);
  --ink-3:   oklch(52% 0.012 60);
  --ink-4:   oklch(68% 0.009 64);

  /* Pillar ramp - now aliases onto the canonical --pillar-*-vivid set in
     CommonStyles.html (promoted from this file 2026-08-20). The 64 var(--pN)
     usages below are unchanged; only the definitions moved, so this page no
     longer forks the palette while keeping the vivid values it needs to read
     at arm's length on the floor. */
  --p1:      var(--pillar-sort-vivid);     --p1-bg: var(--pillar-sort-bg);     --p1-lgt: var(--pillar-sort-lgt);
  --p2:      var(--pillar-standard-vivid); --p2-bg: var(--pillar-standard-bg); --p2-lgt: var(--pillar-standard-lgt);
  --p3:      var(--pillar-shine-vivid);    --p3-bg: var(--pillar-shine-bg);    --p3-lgt: var(--pillar-shine-lgt);
  --p4:      var(--pillar-set-vivid);      --p4-bg: var(--pillar-set-bg);      --p4-lgt: var(--pillar-set-lgt);
  --p5:      var(--pillar-sustain-vivid);  --p5-bg: var(--pillar-sustain-bg);  --p5-lgt: var(--pillar-sustain-lgt);

  /* Score ramp */
  /* Foreground lightness solved for >=4.5:1 against each tinted background
     (WCAG AA, 15px text). Measured in-browser 2026-08-20: the ramp was
     3.57-4.04:1 and every score button failed. Do not raise these L values
     without re-measuring against --sc*-bg, not against white. */
  --sc0-fg: oklch(46% 0.27 22);   --sc0-bg: oklch(95% 0.07 22);
  --sc1-fg: oklch(48% 0.24 44);   --sc1-bg: oklch(96% 0.07 44);
  --sc2-fg: oklch(48% 0.20 82);   --sc2-bg: oklch(96% 0.06 82);
  --sc3-fg: oklch(46% 0.20 140);  --sc3-bg: oklch(95% 0.06 140);
  --sc4-fg: oklch(42% 0.20 156);  --sc4-bg: oklch(94% 0.06 156);

  /* SQCDP */
  --sq-s: oklch(53% 0.28 22);    --sq-s-bg: oklch(94% 0.07 22);
  --sq-q: oklch(49% 0.27 252);   --sq-q-bg: oklch(93% 0.07 252);
  --sq-c: oklch(57% 0.25 54);    --sq-c-bg: oklch(95% 0.08 54);
  --sq-d: oklch(44% 0.22 192);   --sq-d-bg: oklch(93% 0.06 192);
  --sq-p: oklch(49% 0.28 302);   --sq-p-bg: oklch(93% 0.07 302);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  padding-bottom: 84px;
}

/* ── Progress bar ── */
.qa-prog {
  position: fixed; top: 0; left: 0; right: 0;
  height: 4px; background: var(--line); z-index: 200;
}
.qa-prog-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--p4), oklch(62% 0.22 80));
  transition: width 0.4s cubic-bezier(.22,.68,0,1.2);
  border-radius: 0 2px 2px 0;
}

/* ── Header ── */
.qa-hdr {
  position: sticky; top: 4px; z-index: 100;
  background: var(--card);
  border-bottom: 1px solid var(--line);
  padding: 10px 14px 9px;
  display: flex; justify-content: space-between; align-items: center;
  box-shadow: 0 1px 8px oklch(16% 0.016 58 / .06);
}
.qa-hdr-left { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.qa-hdr h1 {
  font-size: 15px; font-weight: 700; color: var(--ink);
  letter-spacing: -0.2px; line-height: 1;
}
.qa-hdr-info {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; color: var(--ink-3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.qa-timer {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px; font-weight: 500; color: var(--ink-2);
  background: var(--bg); padding: 4px 10px;
  border-radius: 20px; border: 1px solid var(--line);
  flex-shrink: 0; letter-spacing: .5px;
}

/* ── Content wrap ── */
.qa-wrap {
  max-width: 560px; margin: 0 auto;
  /* bottom pad clears the fixed .qa-foot — without it the last criterion card
     sits under the footer and can never be scored, so Submit never unlocks */
  padding: 10px 10px calc(96px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 7px;
}

/* ── Already audited banner ── */
.qa-banner {
  background: var(--p4-bg); border: 1.5px solid var(--p4-lgt);
  border-radius: 10px; padding: 10px 14px;
  font-size: 12px; font-weight: 500; color: var(--p4);
}

/* ── Card ── */
@keyframes cardIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
.qa-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
  position: relative;
  display: flex; align-items: stretch;
  animation: cardIn 0.35s ease-out both;
  transition: box-shadow 0.2s, border-color 0.2s, opacity 0.3s;
}
.qa-card.active {
  border-color: var(--line2);
  box-shadow: 0 2px 16px oklch(16% 0.016 58 / .10);
}
/* A scored card is de-emphasised, not disabled. Only the score buttons are
   locked (re-score goes through the picked chip); every other control —
   remark, create, WDGLL, thumbnails — must stay clickable, otherwise a user
   can never raise an NC/Task/Red Tag, which requires scoring first. */
.qa-card.scored {
  opacity: 0.55;
}
.qa-card.scored:hover, .qa-card.scored:focus-within { opacity: 1; }
.qa-card.scored .qa-scores { pointer-events: none; }

/* Pillar left border */
.qa-card::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0;
  width: 4px; border-radius: 12px 0 0 12px;
}
.qa-card.S1::before { background: var(--p1); }
.qa-card.S2::before { background: var(--p2); }
.qa-card.S3::before { background: var(--p3); }
.qa-card.S4::before { background: var(--p4); }
.qa-card.S5::before { background: var(--p5); }

/* ── Pillar tag in card ── */
.qa-pillar-tag {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px 2px 5px; border-radius: 20px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; font-weight: 600; letter-spacing: .8px;
  flex-shrink: 0; margin-bottom: 4px;
}
.qa-pillar-tag .pt-dot {
  width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
}
.qa-card.S1 .qa-pillar-tag { background: var(--p1-bg); color: var(--p1); }
.qa-card.S1 .pt-dot         { background: var(--p1); }
.qa-card.S2 .qa-pillar-tag { background: var(--p2-bg); color: var(--p2); }
.qa-card.S2 .pt-dot         { background: var(--p2); }
.qa-card.S3 .qa-pillar-tag { background: var(--p3-bg); color: var(--p3); }
.qa-card.S3 .pt-dot         { background: var(--p3); }
.qa-card.S4 .qa-pillar-tag { background: var(--p4-bg); color: var(--p4); }
.qa-card.S4 .pt-dot         { background: var(--p4); }
.qa-card.S5 .qa-pillar-tag { background: var(--p5-bg); color: var(--p5); }
.qa-card.S5 .pt-dot         { background: var(--p5); }

/* ── Scored (collapsed) row ── */
@keyframes scoreRowIn {
  from { opacity: 0; transform: translateX(-6px); }
  to   { opacity: 1; transform: translateX(0); }
}
.qa-scored-row {
  display: none; align-items: center; gap: 8px;
  padding: 9px 12px 9px 16px;
  animation: scoreRowIn 0.22s ease-out both;
}
.qa-scored-row.show { display: flex; flex: 1 1 auto; min-width: 0; }
.qa-s-pill {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; font-weight: 600; letter-spacing: .7px;
  padding: 2px 8px; border-radius: 20px; flex-shrink: 0;
}
.qa-card.S1 .qa-s-pill { background: var(--p1-bg); color: var(--p1); }
.qa-card.S2 .qa-s-pill { background: var(--p2-bg); color: var(--p2); }
.qa-card.S3 .qa-s-pill { background: var(--p3-bg); color: var(--p3); }
.qa-card.S4 .qa-s-pill { background: var(--p4-bg); color: var(--p4); }
.qa-card.S5 .qa-s-pill { background: var(--p5-bg); color: var(--p5); }
.qa-s-label {
  font-size: 12px; color: var(--ink-3); flex: 1;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.qa-s-dot {
  width: 26px; height: 26px; border-radius: 50%;
  font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.qa-s-dot.sc0 { background: var(--sc0-bg); color: var(--sc0-fg); }
.qa-s-dot.sc1 { background: var(--sc1-bg); color: var(--sc1-fg); }
.qa-s-dot.sc2 { background: var(--sc2-bg); color: var(--sc2-fg); }
.qa-s-dot.sc3 { background: var(--sc3-bg); color: var(--sc3-fg); }
.qa-s-dot.sc4 { background: var(--sc4-bg); color: var(--sc4-fg); }
.qa-s-reset { margin-left: 8px; background: transparent; border: 1px solid var(--ink-6, #ccc); color: var(--ink-4, #888); border-radius: 6px; padding: 4px 6px; cursor: pointer; display: inline-flex; align-items: center; }
.qa-s-reset:hover { color: var(--p1, #c00); border-color: currentColor; }

/* ── Card body ── */
.qa-body { flex: 1 1 auto; min-width: 0; padding: 8px 12px 0 12px; transition: opacity 0.18s ease; }
.qa-body.fading { opacity: 0; }

/* Name row */
.qa-name-row {
  display: flex; align-items: flex-start; gap: 6px;
  margin-bottom: 5px; position: relative;
}
.qa-name {
  font-size: 13px; font-weight: 600; color: var(--ink);
  line-height: 1.45; flex: 1;
}
.qa-info-btn {
  width: 20px; height: 20px; border-radius: 50%;
  border: 1.5px solid var(--line2); background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--ink-4);
  font-style: italic; font-family: Georgia, serif; font-size: 11px; font-weight: 700;
  flex-shrink: 0; margin-top: 1px;
  transition: all .15s; position: relative; z-index: 20;
  line-height: 1; -webkit-tap-highlight-color: transparent;
}
.qa-info-btn.open, .qa-info-btn:active {
  background: oklch(92% 0.06 230);
  border-color: oklch(70% 0.14 230);
  color: oklch(38% 0.20 230);
}

/* ── Tooltip ── */
.qa-tooltip {
  display: none; position: absolute;
  top: calc(100% + 7px); right: 0;
  width: 230px;
  background: oklch(14% 0.012 52);
  border-radius: 10px; padding: 11px 12px;
  z-index: 500;
  box-shadow: 0 8px 28px oklch(14% 0.012 52 / .30);
}
.qa-tooltip::before {
  content: ''; position: absolute; top: -5px; right: 9px;
  width: 9px; height: 9px;
  background: oklch(14% 0.012 52);
  transform: rotate(45deg); border-radius: 2px;
}
.qa-tooltip.show { display: block; }
.qa-tt-row { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 7px; }
.qa-tt-row:last-child { margin-bottom: 0; }
.qa-tt-ic {
  width: 20px; height: 20px; border-radius: 5px;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; flex-shrink: 0; margin-top: 1px;
}
.qa-tt-ic.ta { background: oklch(32% 0.16 22);  color: oklch(80% 0.12 22); }
.qa-tt-ic.go { background: oklch(30% 0.14 145); color: oklch(78% 0.10 145); }
.qa-tt-ic.ou { background: oklch(30% 0.14 278); color: oklch(78% 0.10 278); }
.qa-tt-lbl {
  font-size: 8px; font-weight: 700; letter-spacing: 1px;
  text-transform: uppercase; color: oklch(46% 0.008 60); margin-bottom: 2px;
}
.qa-tt-txt { font-size: 11.5px; color: oklch(87% 0.006 74); line-height: 1.45; }

/* Bilingual row */
.qa-bi { margin-bottom: 8px; }
.qa-hi {
  font-size: 11px; color: var(--ink-4);
  font-style: italic; line-height: 1.5;
}

/* ── Score controls ── */
.qa-controls {
  display: flex; align-items: center; gap: 0;
  padding-bottom: 10px;
}
.qa-scores { display: flex; gap: 4px; flex: 1; }
.qa-sbtn {
  flex: 1; height: 40px;
  border: 1.5px solid var(--line);
  border-radius: 8px;
  background: var(--bg);
  font-family: 'JetBrains Mono', monospace;
  font-size: 15px; font-weight: 600;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--ink-4);
  transition: background 0.12s, border-color 0.12s, color 0.12s, transform 0.08s;
  -webkit-tap-highlight-color: transparent;
}
/* Tinted unselected hints */
/* Unselected score buttons. Foreground lightness solved for >=4.5:1 against
   each tinted background (WCAG AA, 15px). Measured 2026-08-20: was 3.57-4.04:1
   and all five failed. NOTE these are hardcoded, not --sc*-fg — that token set
   styles only the .selected state. Re-measure against the background beside it,
   never against white. */
.qa-sbtn.s0 { background: oklch(97.5% 0.025 22);  color: oklch(49% 0.18 22); }
.qa-sbtn.s1 { background: oklch(97.5% 0.022 44);  color: oklch(48% 0.16 44); }
.qa-sbtn.s2 { background: oklch(97.5% 0.018 82);  color: oklch(47% 0.14 82); }
.qa-sbtn.s3 { background: oklch(97.5% 0.020 140); color: oklch(46% 0.14 140); }
.qa-sbtn.s4 { background: oklch(97.5% 0.020 156); color: oklch(45% 0.14 156); }
/* Selected — vivid fill */
.qa-sbtn.selected.s0 { background: var(--sc0-fg); border-color: var(--sc0-fg); color: oklch(98% 0 0); }
.qa-sbtn.selected.s1 { background: var(--sc1-fg); border-color: var(--sc1-fg); color: oklch(98% 0 0); }
.qa-sbtn.selected.s2 { background: var(--sc2-fg); border-color: var(--sc2-fg); color: oklch(98% 0 0); }
.qa-sbtn.selected.s3 { background: var(--sc3-fg); border-color: var(--sc3-fg); color: oklch(98% 0 0); }
.qa-sbtn.selected.s4 { background: var(--sc4-fg); border-color: var(--sc4-fg); color: oklch(98% 0 0); }
.qa-sbtn:active { transform: scale(0.84); }

.qa-vsep { width: 1px; background: var(--line); margin: 0 6px; flex-shrink: 0; align-self: stretch; }
.qa-acts { display: flex; gap: 4px; }
.qa-ac {
  width: 32px; height: 40px;
  border: 1.5px solid var(--line); border-radius: 8px;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--ink-3);
  transition: all 0.12s; -webkit-tap-highlight-color: transparent;
}
.qa-ac:active { transform: scale(0.88); }
.qa-ac.on-cam { background: oklch(93% 0.05 228); border-color: oklch(74% 0.12 228); color: oklch(40% 0.20 228); }
.qa-ac.on-rem { background: var(--p4-bg); border-color: var(--p4-lgt); color: var(--p4); }
.qa-ac.on-ncr { background: var(--p1-bg); border-color: var(--p1-lgt); color: var(--p1); }

/* Remark */
.qa-remark-row { display: none; margin-bottom: 8px; }
.qa-remark-toggle {
  font-size: 11px; font-weight: 600; color: var(--p4);
  background: none; border: none; cursor: pointer; padding: 0;
}
.qa-remark-input {
  display: none; width: 100%; margin-top: 5px;
  padding: 8px 10px;
  border: 1.5px solid var(--line); border-radius: 8px;
  background: var(--bg); color: var(--ink);
  font-family: inherit; font-size: 12px;
  resize: vertical; min-height: 52px;
}
.qa-remark-input:focus { outline: none; border-color: var(--p4); background: var(--card); }

/* WDGLL */
.qa-wdgll-toggle {
  font-size: 11px; font-weight: 600; color: var(--p2);
  background: none; border: none; cursor: pointer; padding: 0;
  display: block; margin-bottom: 6px;
}
.qa-wdgll-box { display: none; border-radius: 8px; overflow: hidden; margin-bottom: 8px; }
.qa-wdgll-box.show { display: block; }
.qa-wdgll-box img { width: 100%; max-height: 160px; object-fit: cover; display: block; }
.qa-wdgll-label { font-size: 10px; color: var(--ink-3); padding: 4px 8px; background: var(--bg); }

/* ── SQCDP rail (compact vertical strip on the left) ── */
.qa-sqcdp {
  order: -1; flex-shrink: 0;
  display: flex; flex-direction: column; justify-content: center; gap: 2px;
  padding: 6px 6px 6px 8px;
  border-right: 1px solid var(--line);
  background: oklch(98.5% 0.006 78);
}
/* collapsed (scored) cards: rail hidden — pillar pill already shown, keeps row thin */
.qa-card.scored .qa-sqcdp { display: none; }
/* letter first, then logo — compact inline row per dimension */
.qa-sq {
  display: flex; flex-direction: row; align-items: center; gap: 3px;
  flex: none; border-radius: 6px; padding: 1px 3px;
  transition: background 0.15s;
}
.qa-sq-l {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; font-weight: 700; letter-spacing: .3px;
  width: 7px; text-align: center;
}
.qa-sq-ic {
  width: 17px; height: 17px; border-radius: 5px;
  display: flex; align-items: center; justify-content: center;
}
.qa-sq-ic svg { width: 12px; height: 12px; }
/* Off state — nearly invisible */
.qa-sq.off .qa-sq-ic { background: oklch(92% 0.006 78); color: oklch(78% 0.008 70); }
.qa-sq.off .qa-sq-l  { color: oklch(74% 0.008 72); }
/* Active states — vivid */
.qa-sq.sq-s .qa-sq-ic { background: var(--sq-s-bg); color: var(--sq-s); }
.qa-sq.sq-s .qa-sq-l  { color: var(--sq-s); }
.qa-sq.sq-q .qa-sq-ic { background: var(--sq-q-bg); color: var(--sq-q); }
.qa-sq.sq-q .qa-sq-l  { color: var(--sq-q); }
.qa-sq.sq-c .qa-sq-ic { background: var(--sq-c-bg); color: var(--sq-c); }
.qa-sq.sq-c .qa-sq-l  { color: var(--sq-c); }
.qa-sq.sq-d .qa-sq-ic { background: var(--sq-d-bg); color: var(--sq-d); }
.qa-sq.sq-d .qa-sq-l  { color: var(--sq-d); }
.qa-sq.sq-p .qa-sq-ic { background: var(--sq-p-bg); color: var(--sq-p); }
.qa-sq.sq-p .qa-sq-l  { color: var(--sq-p); }

/* ── Photo card ── */
.qa-photo-card {
  background: var(--card); border: 1px solid var(--line);
  border-radius: 12px; padding: 12px;
}
.qa-photo-lbl {
  font-size: 10px; font-weight: 700; letter-spacing: .9px;
  text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px;
}
.qa-photo-btn {
  width: 100%; min-height: 56px;
  border: 1.5px dashed var(--line2); border-radius: 9px;
  background: var(--bg); color: var(--ink-3);
  font-size: 13px; font-weight: 500; font-family: inherit;
  display: flex; align-items: center; justify-content: center;
  gap: 7px; cursor: pointer;
  transition: border-color .15s, background .15s;
  -webkit-tap-highlight-color: transparent;
}
.qa-photo-btn:active { background: var(--line); border-color: var(--p4); }
.qa-photo-preview { display: none; margin-top: 8px; }
.qa-photo-preview img { width: 100%; border-radius: 8px; border: 1px solid var(--line); display: block; }
.qa-photo-ok { font-size: 11px; color: var(--p3); font-weight: 600; margin-top: 4px; }
.qa-photo-hint { font-size: 10px; color: var(--ink-4); margin-top: 5px; }
.mobile-only { display: none; }
@media (max-width: 768px) { .mobile-only { display: inline; color: var(--p1); } }

/* ── Footer ── */
.qa-foot {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  background: var(--card); border-top: 1px solid var(--line);
  /* safe-area pad keeps the bar clear of the iOS home indicator / Safari toolbar,
     which otherwise covers it and makes Submit look missing */
  padding: 10px 14px calc(16px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -3px 16px oklch(16% 0.016 58 / .07);
}
.qa-foot-inner {
  max-width: 560px; margin: 0 auto;
  display: flex; align-items: center; gap: 12px;
}
.qa-score-ct {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px; font-weight: 600; color: var(--ink-3); flex-shrink: 0;
}
.qa-submit {
  flex: 1; height: 46px;
  background: var(--ink); color: oklch(98% 0.008 78);
  border: none; border-radius: 10px;
  font-family: 'Plus Jakarta Sans', inherit; font-size: 14px; font-weight: 700;
  cursor: pointer; letter-spacing: .2px;
  transition: opacity .15s, transform .12s, background .2s;
  -webkit-tap-highlight-color: transparent;
}
.qa-submit:not(:disabled):active { transform: scale(0.97); }
.qa-submit:not(:disabled) { background: oklch(24% 0.018 56); }
.qa-submit:disabled {
  background: var(--line); color: var(--ink-4); cursor: not-allowed;
}
/* the locked bar is still tappable (scrolls to the first unscored card) */
.qa-foot-inner:has(.qa-submit:disabled) { cursor: pointer; }
/* optional per-record evidence attach */
.qa-rp { margin-top: 6px; }
.qa-rp-add {
  display: inline-flex; align-items: center; gap: 5px;
  background: none; border: 1px dashed var(--line2); color: var(--ink-3);
  border-radius: 7px; padding: 5px 9px; font-size: 11px; font-weight: 600;
  cursor: pointer; font-family: inherit;
}
.qa-rp-add:hover { border-color: var(--p1); color: var(--p1); }
.qa-rp-opt { font-weight: 400; opacity: .65; }
.qa-rp-strip { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
.qa-rp-item { position: relative; width: 52px; height: 52px; }
.qa-rp-item img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); }
.qa-rp-x {
  position: absolute; top: -5px; right: -5px; width: 17px; height: 17px; padding: 0;
  border-radius: 50%; border: none; background: #dc2626; color: #fff;
  font-size: 12px; line-height: 17px; cursor: pointer;
}
.qa-flash { animation: qaFlash 1.2s ease; }
@keyframes qaFlash {
  0%, 100% { box-shadow: 0 0 0 0 transparent; }
  30%      { box-shadow: 0 0 0 3px var(--p1); }
}

/* ── Zone picker ── */
.qa-pick-title {
  font-size: 16px; font-weight: 700; color: var(--ink);
  text-align: center; margin: 20px 0 12px;
}
.qa-pick-btn {
  display: flex; align-items: center; gap: 12px;
  width: 100%; background: var(--card);
  border: 1px solid var(--line); border-radius: 11px;
  padding: 13px 14px; margin-bottom: 7px; cursor: pointer;
  text-align: left; font-family: inherit;
  transition: border-color .15s, box-shadow .15s, transform .1s;
  -webkit-tap-highlight-color: transparent;
}
.qa-pick-btn:active { transform: scale(0.98); }
.qa-pick-btn:hover { border-color: var(--p4); box-shadow: 0 2px 12px oklch(16% 0.016 58 / .07); }
.qa-zpb-id { font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 600; letter-spacing: 1.5px; color: var(--p4); }
.qa-zpb-name { font-size: 14px; font-weight: 600; color: var(--ink); margin-top: 1px; }
.qa-zpb-leader { font-size: 11px; color: var(--ink-3); margin-top: 1px; }

/* ── Success ── */
@keyframes successPop {
  0%  { transform: scale(.7); opacity: 0; }
  70% { transform: scale(1.08); }
  100%{ transform: scale(1); opacity: 1; }
}
.qa-success { text-align: center; padding: 60px 20px; }
.qa-success-ring {
  width: 72px; height: 72px; border-radius: 50%;
  background: var(--p3-bg); margin: 0 auto 20px;
  display: flex; align-items: center; justify-content: center;
  animation: successPop .5s cubic-bezier(.34,1.56,.64,1) both;
}
.qa-success-ring svg { width: 34px; height: 34px; color: var(--p3); }
.qa-success h2 { font-size: 22px; font-weight: 700; color: var(--ink); margin-bottom: 4px; }
.qa-success-pct {
  font-size: 64px; font-weight: 700; line-height: 1.1;
  margin: 16px 0 4px;
  font-family: 'JetBrains Mono', monospace; letter-spacing: -2px;
}
.qa-success-pct.g { color: var(--p3); }
.qa-success-pct.a { color: var(--p4); }
.qa-success-pct.r { color: var(--p1); }
.qa-success-sub { font-size: 13px; color: var(--ink-3); margin-bottom: 20px; }
.qa-success-note {
  display: inline-block; background: var(--p4-bg);
  border: 1.5px solid var(--p4-lgt); color: var(--p4);
  border-radius: 9px; padding: 8px 16px;
  font-size: 12px; font-weight: 600; margin-bottom: 20px;
}
.qa-success-back { color: var(--p4); font-weight: 600; font-size: 13px; text-decoration: none; }
@keyframes zmspin { to { transform: rotate(360deg); } }
.qa-share { display:flex; flex-direction:column; gap:10px; align-items:center; margin-bottom:18px; font-size:12px; color:#667; }
.qa-share-btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; width:min(86vw,300px);
  padding:12px 16px; border-radius:11px; font-size:14px; font-weight:600; text-decoration:none; }
.qa-share-btn.pdf { background:#eef2ff; color:#3730a3; border:1px solid #c7d2fe; }
.qa-share-btn.wa  { background:#25D366; color:#fff; }
.qa-cam-thumb { width:30px; height:30px; object-fit:cover; border-radius:6px; border:1.5px solid #25D366; vertical-align:middle; cursor:pointer; margin-left:2px; }
</style>
</head>
<body>

<div class="qa-prog"><div class="qa-prog-fill" id="progressBar"></div></div>

<div class="qa-hdr">
  <div class="qa-hdr-left">
    <h1>Quick Audit</h1>
    <div class="qa-hdr-info" id="auditInfo">Loading…</div>
  </div>
  <div class="qa-timer" id="timer">0:00</div>
</div>

<div id="content">
  <div style="text-align:center;padding:60px;color:oklch(68% 0.009 64);font-family:'JetBrains Mono',monospace;font-size:12px">
    Loading audit form…
  </div>
</div>

<div class="qa-foot">
  <!-- click lands on the wrapper because a disabled button fires no events -->
  <div class="qa-foot-inner" onclick="if(document.getElementById('submitBtn').disabled) jumpToUnscored_();">
    <span class="qa-score-ct" id="scoreSummary">0 / —</span>
    <button class="qa-submit" id="submitBtn" disabled onclick="submitAudit()">Complete Audit</button>
  </div>
</div>

<script>
function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

var scores = {}, totalCriteria = 0, timerStart = null, timerInterval = null;
var QA_DEPLOY_URL = '<?= (typeof deployUrl !== "undefined" && deployUrl) ? deployUrl : "" ?>';
var criterionPhotos = {};       /* criterionId -> array of watermarked dataURLs (up to QA_MAX_PHOTOS) */
var criterionPhotosRaw = {};    /* criterionId -> array of raw pre-watermark dataURLs (for annotation) */
var criterionPhotoTokens = {};  /* criterionId -> array of stable per-photo tokens, parallel to criterionPhotos */
var _qaPhotoTokenSeq = 0;
/* Image compression budget. Mirrors pmCompressImage in CommonStyles.html, which
   this page does not include. Every photo is displayed via Drive's w400
   thumbnail, so 1024px long edge is ~2.5x more than any view renders while
   keeping files in the 5-50 KB band. Keep the two in sync. */
var PM_IMG_MAX_EDGE = 1024;
var PM_IMG_QUALITY  = 0.7;
var _activeCrit = null;     /* {idx, cid} while a per-criterion camera capture is in flight */
var _recPending = null;     /* {idx, type} while a per-record (NC/Task/RedTag) capture is in flight */
var QA_MAX_PHOTOS = 3;

var _ZONE_ID = '<?= (typeof params !== "undefined" && params && params.zone) ? String(params.zone).replace(/['"<>&]/g,"") : "" ?>';
var _SELECTED_ZONE = '';

function getZoneId() {
  if (_SELECTED_ZONE) return _SELECTED_ZONE;
  if (_ZONE_ID)       return _ZONE_ID;
  try { return new URLSearchParams(window.location.search).get('zone') || ''; } catch(e) { return ''; }
}

function loadAudit() {
  var zid = getZoneId();
  if (!zid) {
    document.getElementById('auditInfo').textContent = 'Select a zone to audit';
    document.getElementById('content').innerHTML =
      '<div style="text-align:center;padding:40px;color:oklch(68% 0.009 64);font-size:11px">Loading zones…</div>';
    google.script.run
      .withSuccessHandler(renderZonePicker)
      .withFailureHandler(function(e) {
        document.getElementById('content').innerHTML =
          '<div style="text-align:center;padding:40px;color:var(--p1);font-size:12px">Could not load zones: ' + escHtml(e.message) + '</div>';
      })
      .getMapEditorData();
    return;
  }
  google.script.run
    .withSuccessHandler(renderAudit)
    .withFailureHandler(function(e) {
      document.getElementById('content').innerHTML =
        '<div style="text-align:center;padding:40px;color:var(--p1)">' + escHtml(e.message) + '</div>';
    })
    .getQuickAuditConfig(zid);
}

/* Pillar display names */
var PILLAR_NAMES = {S1:'SORT', S2:'SET IN ORDER', S3:'SHINE', S4:'STANDARDIZE', S5:'SUSTAIN'};
/* Pillar prefix → SQCDP dimension letter */
var SQCDP_MAP = {S1:'S', S2:'Q', S3:'C', S4:'D', S5:'P'};
/* Current audit config — set in renderAudit so create modals can read criteria by index */
var _CFG = null;

function renderAudit(cfg) {
  if (!cfg || !cfg.criteria) {
    document.getElementById('content').innerHTML =
      '<div style="text-align:center;padding:40px">No criteria found</div>';
    return;
  }
  _CFG = cfg;

  /* The success screen hides the footer/progress bar with an inline style. That
     style survives an in-app return to QuickAudit (no page reload), so a second
     audit would render with no visible Submit button — restore them here. */
  var foot = document.querySelector('.qa-foot'); if (foot) foot.style.display = '';
  var prog = document.querySelector('.qa-prog'); if (prog) prog.style.display = '';

  document.getElementById('auditInfo').textContent =
    cfg.zoneName + ' · ' + cfg.dateDisplay + ' · ' + cfg.auditor;
  totalCriteria = cfg.criteria.length;
  document.getElementById('scoreSummary').textContent = '0 / ' + totalCriteria;

  var html = '<div class="qa-wrap">';

  if (cfg.alreadyAudited) {
    html += '<div class="qa-banner">This zone was already audited today. Submitting will add another record.</div>';
  }

  cfg.criteria.forEach(function(c, idx) {
    var pCls = escHtml(c.pillar);
    var sqcdp = c.sqcdp || {};
    var delay = (idx * 45) + 'ms';
    var pillarName = PILLAR_NAMES[c.pillar] || c.pillar || '';

    var cid = escHtml(c.criterionId);
    html += '<div class="qa-card ' + pCls + '" id="card-' + idx + '" style="animation-delay:' + delay + '">';
    html += '<div class="qa-main">';

    /* Header: label (EN · HI · pillar) | action icons | SQCDP */
    html += '<div class="qa-head">';
    html += '<div class="qa-hlabel">';
    html += '<span class="qa-name">' + escHtml(c.label) + '</span>';
    if (c.labelHi) html += ' <span class="qa-hi">· ' + escHtml(c.labelHi) + '</span>';
    html += ' <span class="qa-ptag">' + escHtml(c.pillar) + '</span>';
    html += '<button class="qa-info-btn" id="info-btn-' + idx + '" onclick="toggleTooltip(' + idx + ')" title="Guidance">i</button>';
    html += '</div>';

    html += '<div class="qa-hicons">';
    html += '<button class="qa-ic" id="ac-cam-' + idx + '" onclick="captureFor_(' + idx + ',\'' + cid + '\')" title="Photo + annotate"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></button>';
    html += '<button class="qa-ic" id="ac-ncr-' + idx + '" onclick="toggleType_(' + idx + ',\'NC\')" title="Raise NCR"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></button>';
    html += '<button class="qa-ic" id="ac-rt-' + idx + '" onclick="toggleType_(' + idx + ',\'REDTAG\')" title="Raise Red Tag"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg></button>';
    html += '<button class="qa-ic" id="ac-task-' + idx + '" onclick="toggleType_(' + idx + ',\'TASK\')" title="Create Task"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></button>';
    html += '</div>';

    html += '<div class="qa-sqcdp">';
    html += sqIcon('S', 'sq-s', sqcdp.S) + sqIcon('Q', 'sq-q', sqcdp.Q) + sqIcon('C', 'sq-c', sqcdp.C) + sqIcon('D', 'sq-d', sqcdp.D) + sqIcon('P', 'sq-p', sqcdp.P);
    html += '</div>';
    html += '</div>'; /* end qa-head */

    /* Guidance tooltip */
    html += '<div class="qa-tooltip" id="tooltip-' + idx + '">';
    html += '<div class="qa-tt-row"><div class="qa-tt-ic ta">&#10003;</div><div><div class="qa-tt-lbl">Guidance</div><div class="qa-tt-txt">' + escHtml(c.task || 'Check this criterion against the zone standard.') + '</div></div></div>';
    if (c.goal) html += '<div class="qa-tt-row"><div class="qa-tt-ic go">&#9673;</div><div><div class="qa-tt-lbl">Goal</div><div class="qa-tt-txt">' + escHtml(c.goal) + '</div></div></div>';
    if (c.outcome) html += '<div class="qa-tt-row"><div class="qa-tt-ic ou">&#8679;</div><div><div class="qa-tt-lbl">Outcome</div><div class="qa-tt-txt">' + escHtml(c.outcome) + '</div></div></div>';
    html += '</div>';

    /* Score row (collapses to a chip once picked) + inline remark */
    html += '<div class="qa-row">';
    html += '<div class="qa-scores" id="scores-' + idx + '">';
    for (var s = 0; s <= (c.maxScore || 4); s++) {
      html += '<button class="qa-sbtn s' + s + '" id="btn-' + idx + '-' + s + '" onclick="setScore(\'' + cid + '\',' + s + ',' + idx + ')">' + s + '</button>';
    }
    html += '</div>';
    html += '<button class="qa-picked" id="picked-' + idx + '" style="display:none" onclick="resetCriterion_(' + idx + ',\'' + cid + '\')" title="Re-score"></button>';
    html += '<span style="flex:1"></span>';
    html += '<button class="qa-ic" id="ac-rem-' + idx + '" onclick="toggleRemark(' + idx + ')" title="Remark"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>';
    html += '</div>';

    /* Remark field (opens directly) */
    html += '<div class="qa-remark-row" id="remark-row-' + idx + '" style="display:none">';
    html += '<textarea class="qa-remark-input" id="remark-' + idx + '" data-cid="' + cid + '" rows="2" placeholder="Optional remark…" style="display:block"></textarea>';
    html += '</div>';

    /* Inline create — one field group per selected action (populated by updateCreateArea_) */
    html += '<div class="qa-create" id="create-' + idx + '" style="display:none">';
    html += '<div class="qa-create-fields" id="createfields-' + idx + '"></div>';
    html += '<button class="qa-create-btn" id="cbtn-' + idx + '" onclick="submitCardCreate(' + idx + ')">Create</button>';
    html += '</div>';

    /* WDGLL */
    if (c.wdgllPhotos && c.wdgllPhotos.length > 0) {
      html += '<button class="qa-ic qa-wdgll-btn" onclick="toggleWDGLL(' + idx + ')" title="Standard"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></button>';
      html += '<div class="qa-wdgll-box" id="wdgll-' + idx + '">';
      html += '<img src="' + escHtml(c.wdgllPhotos[0].photoUrl) + '" alt="Standard" onerror="this.style.display=\'none\'">';
      html += '<div class="qa-wdgll-label">' + escHtml(c.wdgllPhotos[0].description) + '</div>';
      html += '</div>';
    }

    html += '</div>'; /* end qa-main */

    /* Photo thumbnail strip (appears after capture; up to QA_MAX_PHOTOS, tap to enlarge) */
    html += '<div class="qa-thumb" id="thumb-' + idx + '" style="display:none"></div>';

    html += '</div>'; /* end qa-card */
  });

  /* Hidden inputs used by per-criterion photo capture (no global photo card —
     evidence is attached per parameter, with an inline thumbnail confirmation) */
  html += '<input type="file" id="photoInputRaw" accept="image/*" capture="environment" style="display:none">';
  html += '<input type="hidden" id="photoDataUrl">';

  html += '</div>'; /* end qa-wrap */

  /* Annotator overlay (same-document canvas — no iframe).
     Rebuilt with the cards, so it always starts hidden; PMAnnot re-resolves it
     by id rather than caching the node. */
  html += '<div id="annotatorOverlay" style="display:none;position:fixed;inset:0;z-index:9999;background:#000;flex-direction:column">';
  html += '  <div class="pma-bar">';
  html += '    <button type="button" id="pma-draw" class="on" onclick="PMAnnot.tool(\'draw\')">✎ Pen</button>';
  html += '    <button type="button" id="pma-arrow" onclick="PMAnnot.tool(\'arrow\')">➜ Arrow</button>';
  html += '    <button type="button" id="pma-circle" onclick="PMAnnot.tool(\'circle\')">◯ Circle</button>';
  html += '    <button type="button" id="pma-text" onclick="PMAnnot.tool(\'text\')">T Text</button>';
  html += '    <button type="button" id="pma-undo" onclick="PMAnnot.undo()" title="Undo last">↶ Undo</button>';
  html += '    <select id="pmaColor" onchange="PMAnnot.color(this.value)">';
  html += '      <option value="#e74c3c">Red</option><option value="#f39c12">Yellow</option><option value="#27ae60">Green</option><option value="#2980b9">Blue</option><option value="#ffffff">White</option>';
  html += '    </select>';
  html += '    <button type="button" onclick="PMAnnot.undo()">↶ Undo</button>';
  html += '  </div>';
  html += '  <div class="pma-stage"><canvas id="pmaCanvas"></canvas></div>';
  html += '  <div class="pma-foot"><button type="button" class="pma-cancel" onclick="PMAnnot.cancel()">Cancel</button><button type="button" class="pma-save" onclick="PMAnnot.save()">Save</button></div>';
  html += '</div>';

  document.getElementById('content').innerHTML = html;

  timerStart = Date.now();
  timerInterval = setInterval(function() {
    var e = Math.floor((Date.now() - timerStart) / 1000);
    document.getElementById('timer').textContent = Math.floor(e/60) + ':' + (e%60 < 10 ? '0' : '') + e%60;
  }, 1000);

  var first = document.getElementById('card-0');
  if (first) first.classList.add('active');

  document.addEventListener('click', function(e) {
    if (!e.target.classList.contains('qa-info-btn')) {
      document.querySelectorAll('.qa-tooltip.show').forEach(function(t) { t.classList.remove('show'); });
      document.querySelectorAll('.qa-info-btn.open').forEach(function(b) { b.classList.remove('open'); });
    }
  });
}

/* SQCDP icons with proper SVGs per dimension */
var SQCDP_SVG = {
  S: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>',
  Q: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>',
  C: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>',
  D: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13" rx="1"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>',
  P: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>'
};
var SQCDP_LABELS = { S:'Safety', Q:'Quality', C:'Cost', D:'Delivery', P:'People' };
var SQCDP_CLS    = { S:'sq-s', Q:'sq-q', C:'sq-c', D:'sq-d', P:'sq-p' };

function sqIcon(letter, cls, active) {
  var activeCls = active ? SQCDP_CLS[letter] : 'off';
  return '<div class="qa-sq ' + activeCls + '">' +
         '<div class="qa-sq-l">' + letter + '</div>' +
         '<div class="qa-sq-ic">' + (SQCDP_SVG[letter] || '') + '</div>' +
         '</div>';
}

function setScore(criterionId, score, idx) {
  scores[criterionId] = score;

  for (var s = 0; s <= 4; s++) {
    var b = document.getElementById('btn-' + idx + '-' + s);
    if (b) b.classList.toggle('selected', s === score);
  }

  /* Collapse the 0–4 buttons to a single picked chip, keep the card usable */
  var scoresEl = document.getElementById('scores-' + idx);
  var picked = document.getElementById('picked-' + idx);
  if (scoresEl) scoresEl.style.display = 'none';
  if (picked) { picked.style.display = 'flex'; picked.textContent = score; picked.className = 'qa-picked sc' + score; }
  var card = document.getElementById('card-' + idx);
  if (card) card.classList.add('scored');

  /* Activate next unscored */
  var next = document.getElementById('card-' + (idx + 1));
  if (next && !next.classList.contains('scored')) {
    setTimeout(function() {
      next.classList.add('active');
      next.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 200);
  }

  /* Progress */
  var scored = Object.keys(scores).length;
  document.getElementById('progressBar').style.width =
    (totalCriteria > 0 ? (scored / totalCriteria * 100).toFixed(1) : 0) + '%';
  var ss = document.getElementById('scoreSummary');
  if (ss) ss.textContent = scored + ' / ' + totalCriteria;
  updateSubmitBtn_(scored);
}

/* Keep the submit button honest: when it is locked, say how many criteria are
   still unscored rather than showing a dead "Complete Audit". */
function updateSubmitBtn_(scored) {
  var btn = document.getElementById('submitBtn');
  if (!btn) return;
  if (scored == null) scored = Object.keys(scores).length;
  var left = totalCriteria - scored;
  btn.disabled = (left > 0);
  btn.textContent = (left > 0)
    ? left + ' criteri' + (left === 1 ? 'on' : 'a') + ' left'
    : 'Complete Audit';
}

/* Tapping the locked button scrolls to the first unscored card (the footer is
   fixed, so a card below the fold is otherwise easy to miss entirely). */
function jumpToUnscored_() {
  var cards = document.querySelectorAll('.qa-card');
  for (var i = 0; i < cards.length; i++) {
    if (!cards[i].classList.contains('scored')) {
      cards[i].scrollIntoView({ behavior: 'smooth', block: 'center' });
      cards[i].classList.add('qa-flash');
      (function(c) { setTimeout(function() { c.classList.remove('qa-flash'); }, 1200); })(cards[i]);
      return;
    }
  }
}

function toggleTooltip(idx) {
  var btn = document.getElementById('info-btn-' + idx);
  var tip = document.getElementById('tooltip-' + idx);
  if (!btn || !tip) return;
  var isOpen = tip.classList.contains('show');
  document.querySelectorAll('.qa-tooltip.show').forEach(function(t) { t.classList.remove('show'); });
  document.querySelectorAll('.qa-info-btn.open').forEach(function(b) { b.classList.remove('open'); });
  if (!isOpen) { tip.classList.add('show'); btn.classList.add('open'); }
}

function toggleRemark(idx) {
  var rr = document.getElementById('remark-row-' + idx);
  if (!rr) return;
  var showing = rr.style.display !== 'none';
  rr.style.display = showing ? 'none' : 'block';
  var ac = document.getElementById('ac-rem-' + idx);
  if (ac) ac.classList.toggle('on-rem', !showing);
  if (!showing) { var ta = document.getElementById('remark-' + idx); if (ta) setTimeout(function() { ta.focus(); }, 50); }
}

/* ── Per-card capture / create (NCR / Task / Red Tag), inline — no modal ────── */

function captureFor_(idx, cid) {
  if (!getZoneId()) { alert('No zone selected'); return; }
  var have = (criterionPhotos[cid] || []).length;
  if (have >= QA_MAX_PHOTOS) { if (typeof pmToast === 'function') pmToast('Max ' + QA_MAX_PHOTOS + ' photos per item', 'info'); return; }
  openCriterionCamera_(idx, cid);   // → file input → applyWatermark_ stores + auto-annotates
}

function removePhoto_(idx, cid, photoIdx) {
  if (criterionPhotos[cid]) criterionPhotos[cid].splice(photoIdx, 1);
  if (criterionPhotosRaw[cid]) criterionPhotosRaw[cid].splice(photoIdx, 1);
  if (criterionPhotoTokens[cid]) criterionPhotoTokens[cid].splice(photoIdx, 1);
  showThumb_(idx, cid);
}

var TYPE_META = { NC: { btn: 'ac-ncr-', label: 'NCR' }, REDTAG: { btn: 'ac-rt-', label: 'Red Tag' }, TASK: { btn: 'ac-task-', label: 'Task' } };

function toggleType_(idx, type) {
  if (!_CFG || !_CFG.criteria || !_CFG.criteria[idx]) return;
  var btn = document.getElementById(TYPE_META[type].btn + idx);
  if (btn) btn.classList.toggle('sel');
  updateCreateArea_(idx);
}

function selectedTypes_(idx) {
  var out = [];
  ['NC', 'TASK', 'REDTAG'].forEach(function(t) {
    var b = document.getElementById(TYPE_META[t].btn + idx);
    if (b && b.classList.contains('sel')) out.push(t);
  });
  return out;
}

function cfEsc_(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* Build one labelled field group per selected action, preserving typed values */
function updateCreateArea_(idx) {
  var types = selectedTypes_(idx);
  var area = document.getElementById('create-' + idx);
  var fields = document.getElementById('createfields-' + idx);
  if (!area || !fields) return;
  if (!types.length) { area.style.display = 'none'; return; }
  area.style.display = 'block';

  var prev = {};
  fields.querySelectorAll('[data-f]').forEach(function(el){ prev[el.getAttribute('data-f')] = el.value; });
  var label = (_CFG.criteria[idx].label || '');
  /* Owner fields were free text, which produced 42 distinct strings for 6 real
     people. A select over the canonical roster keeps names consistent; "Other"
     still allows a name that is not on it, rather than blocking the audit. */
  function personSelect_(field, label) {
    var people = (window.QA_PEOPLE || []);
    if (!people.length) {
      return '<input class="qa-cf" data-f="' + field + '" type="text" placeholder="' + label + '">';
    }
    var zone = getZoneId();
    var opts = '<option value="">' + label + '</option>';
    people.forEach(function (p) {
      var isLead = (p.zones || []).indexOf(zone) > -1;
      opts += '<option value="' + escHtml(p.name) + '"' + (isLead ? ' selected' : '') + '>' +
              escHtml(p.name) + (isLead ? ' (zone lead)' : '') + '</option>';
    });
    opts += '<option value="__other">Other…</option>';
    return '<select class="qa-cf" data-f="' + field + '" onchange="personOther_(this)">' + opts + '</select>';
  }

  var h = '';
  if (types.indexOf('NC') >= 0) {
    h += '<div class="qa-cf-grp"><span class="qa-cf-lbl nc">NCR</span>';
    h += '<input class="qa-cf" data-f="nc_desc" type="text" placeholder="Non-conformance description">';
    h += '<div class="qa-cf-row">' + personSelect_('nc_resp', 'Responsible person');
    h += '<input class="qa-cf qa-cf-date" data-f="nc_target" type="date" title="Target date"></div>';
    h += recPhotoCtrl_(idx, 'NC') + '</div>';
  }
  if (types.indexOf('TASK') >= 0) {
    h += '<div class="qa-cf-grp"><span class="qa-cf-lbl task">Task</span>';
    h += '<input class="qa-cf" data-f="task_title" type="text" placeholder="Task title">';
    h += '<div class="qa-cf-row">' + personSelect_('task_resp', 'Assign to');
    h += '<input class="qa-cf qa-cf-date" data-f="task_due" type="date" title="Due date"></div>';
    h += recPhotoCtrl_(idx, 'TASK') + '</div>';
  }
  if (types.indexOf('REDTAG') >= 0) {
    h += '<div class="qa-cf-grp"><span class="qa-cf-lbl rt">Red Tag</span>';
    h += '<input class="qa-cf" data-f="rt_item" type="text" placeholder="Item to tag">';
    h += '<div class="qa-cf-row">' + personSelect_('rt_owner', 'Owner');
    h += '<input class="qa-cf qa-cf-date" data-f="rt_due" type="date" title="Deadline"></div>';
    h += recPhotoCtrl_(idx, 'REDTAG') + '</div>';
  }
  fields.innerHTML = h;
  ['NC','TASK','REDTAG'].forEach(function(t){ if (types.indexOf(t) >= 0) renderRecPhotos_(idx, t); });

  fields.querySelectorAll('[data-f]').forEach(function(el){ var k = el.getAttribute('data-f'); if (prev[k] !== undefined) el.value = prev[k]; });
  var d = fields.querySelector('[data-f="nc_desc"]');   if (d && !d.value)  d.value = 'Non-conformance: ' + label;
  var tt = fields.querySelector('[data-f="task_title"]'); if (tt && !tt.value) tt.value = 'Action: ' + label;
  var ri = fields.querySelector('[data-f="rt_item"]');   if (ri && !ri.value) ri.value = label;
}

function cfVal_(idx, f) {
  var e = document.querySelector('#createfields-' + idx + ' [data-f="' + f + '"]');
  return e ? (e.value || '').trim() : '';
}

/* "Other..." swaps the select for a text input, so an unlisted name is still
   possible without making free text the default path. */
function personOther_(sel) {
  if (sel.value !== '__other') return;
  var inp = document.createElement('input');
  inp.className = 'qa-cf';
  inp.type = 'text';
  inp.placeholder = 'Name';
  inp.setAttribute('data-f', sel.getAttribute('data-f'));
  sel.parentNode.replaceChild(inp, sel);
  inp.focus();
}

/* Canonical people, loaded once. The audit stays usable if this fails: the
   select builder falls back to a text input when the roster is empty. */
window.QA_PEOPLE = [];
google.script.run
  .withSuccessHandler(function (list) { window.QA_PEOPLE = list || []; })
  .withFailureHandler(function () { window.QA_PEOPLE = []; })
  .getAssignablePeople();

/* ── Optional per-record evidence photos (NC / Task / Red Tag) ──────────────
   Separate from the criterion photo pool: a record can carry its own evidence,
   and attaching is always optional — nothing here gates Create. */
var recPhotos = {};                       /* "idx:TYPE" -> [dataURL, …] */
var recPhotoTokens = {};                  /* "idx:TYPE" -> [token, …], parallel to recPhotos */
var REC_MAX_PHOTOS = 3;
function recKey_(idx, t) { return idx + ':' + t; }

function recPhotoCtrl_(idx, t) {
  var k = recKey_(idx, t);
  return '<div class="qa-rp" id="rp-' + k.replace(':','-') + '">' +
    '<button type="button" class="qa-rp-add" onclick="addRecPhoto_(' + idx + ',\'' + t + '\')">' +
    '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>' +
    ' Add photo <span class="qa-rp-opt">(optional)</span></button>' +
    '<div class="qa-rp-strip"></div></div>';
}

function addRecPhoto_(idx, t) {
  var k = recKey_(idx, t);
  if ((recPhotos[k] || []).length >= REC_MAX_PHOTOS) { toast_('Up to ' + REC_MAX_PHOTOS + ' photos', 'info'); return; }
  var inp = document.getElementById('photoInputRaw');
  if (!inp) return;
  _recPending = { idx: idx, type: t };
  inp.value = '';
  inp.click();
}

function renderRecPhotos_(idx, t) {
  var k = recKey_(idx, t);
  var box = document.getElementById('rp-' + k.replace(':','-'));
  if (!box) return;
  var strip = box.querySelector('.qa-rp-strip');
  var arr = recPhotos[k] || [];
  strip.innerHTML = arr.map(function(url, i) {
    return '<div class="qa-rp-item"><img src="' + url + '" alt="Evidence ' + (i+1) + '">' +
      '<button type="button" class="qa-rp-x" onclick="removeRecPhoto_(' + idx + ',\'' + t + '\',' + i + ')" title="Remove">&times;</button></div>';
  }).join('');
}

function removeRecPhoto_(idx, t, i) {
  var k = recKey_(idx, t);
  if (recPhotos[k]) recPhotos[k].splice(i, 1);
  if (recPhotoTokens[k]) recPhotoTokens[k].splice(i, 1);   // keep tokens aligned
  renderRecPhotos_(idx, t);
}

/* base64 payloads for the server (strip the data: prefix, same as NC photos) */
function recPhotosB64_(idx, t) {
  return (recPhotos[recKey_(idx, t)] || []).map(function(p) { return p.split(',')[1]; });
}

function toast_(msg, kind) {
  if (typeof pmToast === 'function') { pmToast(msg, kind || 'info'); return; }
  if (kind === 'error') alert(msg);
}

function submitCardCreate(idx) {
  var c = _CFG.criteria[idx], zone = getZoneId();
  var types = selectedTypes_(idx);
  if (!types.length) return;

  // Per-action fields
  var ncDesc = cfVal_(idx, 'nc_desc'), ncResp = cfVal_(idx, 'nc_resp'), ncTarget = cfVal_(idx, 'nc_target');
  var taskTitle = cfVal_(idx, 'task_title');
  var rtItem = cfVal_(idx, 'rt_item');
  if (types.indexOf('NC') >= 0 && !ncDesc)      { alert('NCR: enter a description'); return; }
  if (types.indexOf('TASK') >= 0 && !taskTitle) { alert('Task: enter a title'); return; }
  if (types.indexOf('REDTAG') >= 0 && !rtItem)  { alert('Red Tag: enter an item'); return; }

  // Optimistic UI: createCAPA/createTask/raiseRedTag each do a synchronous
  // Telegram broadcast + DWM sync (10–20s each), so DON'T block the button —
  // give instant feedback and let the server work finish in the background.
  types.sort(function(a, b){ return a === 'NC' ? -1 : b === 'NC' ? 1 : 0; });   // NCR first → shared ref
  types.forEach(function(t){ var b = document.getElementById(TYPE_META[t].btn + idx); if (b) { b.classList.remove('sel'); b.classList.add('pending'); } });
  document.getElementById('create-' + idx).style.display = 'none';
  toast_('Creating ' + types.map(function(t){ return TYPE_META[t].label; }).join(' + ') + '…', 'info');

  /* Resolve the auditor once per Create so the name prompt appears at most once. */
  var who = qaWho_();
  var linkRef = '', errors = [], okIds = [];
  function link_(t){ return linkRef ? (t + ' [Linked NC ' + linkRef + ']') : t; }
  function mark(t, ok){ var b = document.getElementById(TYPE_META[t].btn + idx); if (b) { b.classList.remove('pending'); b.classList.toggle('done', ok); } }
  function run(i){ if (i >= types.length) { done_(); return; } one(types[i], function(){ run(i + 1); }); }
  function one(type, next) {
    if (type === 'NC') {
      /* criterion evidence + any photos attached to the NC form itself */
      var ncPhotos = (criterionPhotos[c.criterionId] || []).map(function(p) { return p.split(',')[1]; })
        .concat(recPhotosB64_(idx, 'NC'));
      google.script.run
        .withSuccessHandler(function(r){ if (r) { linkRef = String(r); okIds.push('NCR ' + r); mark('NC', true); } else { errors.push('NCR failed'); mark('NC', false); } next(); })
        .withFailureHandler(function(e){ errors.push('NCR: ' + e.message); mark('NC', false); next(); })
        .createCAPA(zone, ncDesc, 'NC', c.pillar, SQCDP_MAP[c.pillar] || '', ncResp, who, ncTarget, ncPhotos);
    } else if (type === 'TASK') {
      google.script.run
        .withSuccessHandler(function(r){ if (r && r.success) { okIds.push('Task ' + r.taskId); mark('TASK', true); } else { errors.push('Task failed'); mark('TASK', false); } next(); })
        .withFailureHandler(function(e){ errors.push('Task: ' + e.message); mark('TASK', false); next(); })
        .createTask({ title: taskTitle, zoneId: zone, description: link_('Raised from QuickAudit — ' + (c.label || c.labelEn || '')), priority: 'MEDIUM',
                      assignedTo: cfVal_(idx, 'task_resp') || who, dueDate: cfVal_(idx, 'task_due'),
                      source: 'AUDIT', sourceRefId: linkRef || c.criterionId || '', createdBy: who,
                      photosB64: recPhotosB64_(idx, 'TASK') });
    } else {
      google.script.run
        .withSuccessHandler(function(r){ var ok = r && (r.ok || r.success); if (ok) { okIds.push('Red Tag ' + r.tagNo); mark('REDTAG', true); } else { errors.push('Red Tag failed'); mark('REDTAG', false); } next(); })
        .withFailureHandler(function(e){ errors.push('Red Tag: ' + e.message); mark('REDTAG', false); next(); })
        .raiseRedTag({ zone: zone, item: rtItem, quantity: 1, category: 'Other', reason: link_('Flagged during audit'), action: '',
                       owner: cfVal_(idx, 'rt_owner') || who, taggedBy: who, createdBy: who,
                       deadline: cfVal_(idx, 'rt_due'),
                       photosB64: recPhotosB64_(idx, 'REDTAG') });
    }
  }
  function done_() {
    if (okIds.length) toast_('Created: ' + okIds.join(', '), 'success');
    if (errors.length) toast_('Failed: ' + errors.join('; '), 'error');
  }
  run(0);
}

/* Photo thumbnail strip (up to QA_MAX_PHOTOS) + full-screen viewer */
function showThumb_(idx, cid) {
  var t = document.getElementById('thumb-' + idx);
  if (!t) return;
  var photos = criterionPhotos[cid] || [];
  var camBtn = document.getElementById('ac-cam-' + idx);
  if (!photos.length) {
    t.style.display = 'none'; t.innerHTML = '';
    if (camBtn) { camBtn.classList.remove('done'); var badge = camBtn.querySelector('.qa-cam-count'); if (badge) badge.remove(); }
    return;
  }
  t.style.display = 'flex';
  t.innerHTML = photos.map(function(url, i) {
    return '<div class="qa-thumb-item" onclick="event.stopPropagation();openViewer_(\'' + cid + '\',' + i + ')">' +
      '<img src="' + url + '" alt="Evidence ' + (i+1) + '">' +
      '<button class="qa-thumb-x" onclick="event.stopPropagation();removePhoto_(' + idx + ',\'' + cid + '\',' + i + ')" title="Remove"><span class="qa-thumb-x-dot">&times;</span></button>' +
      '</div>';
  }).join('');
  if (camBtn) {
    camBtn.classList.add('done');
    var badge = camBtn.querySelector('.qa-cam-count');
    if (!badge) { badge = document.createElement('span'); badge.className = 'qa-cam-count'; camBtn.appendChild(badge); }
    badge.textContent = photos.length;
  }
}
function openViewer_(cid, photoIdx) {
  var photos = criterionPhotos[cid];
  if (!photos || !photos.length) return;
  document.getElementById('viewerImg').src = photos[photoIdx || 0];
  document.getElementById('photoViewer').style.display = 'flex';
}
function closeViewer_() { document.getElementById('photoViewer').style.display = 'none'; }

function toggleWDGLL(idx) {
  var el = document.getElementById('wdgll-' + idx);
  if (el) el.classList.toggle('show');
}

function submitAudit() {
  if (!validatePhotoOnMobile_()) return;
  var btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Submitting…';
  clearInterval(timerInterval);

  var photoHidden = document.getElementById('photoDataUrl');
  var photoB64 = photoHidden && photoHidden.value ? photoHidden.value.split(',')[1] : '';
  var criteriaRemarks = {};
  document.querySelectorAll('.qa-remark-input').forEach(function(ta) {
    var v = ta.value.trim();
    if (v) criteriaRemarks[ta.getAttribute('data-cid')] = v;
  });
  /* Per-criterion line items: score + optional remark + up to QA_MAX_PHOTOS photos */
  var lineItems = Object.keys(scores).map(function(cid) {
    var li = { criterionId: cid, score: scores[cid], remark: criteriaRemarks[cid] || '' };
    var photos = criterionPhotos[cid];
    if (photos && photos.length) li.photos_b64 = photos.map(function(p) { return p.split(',')[1]; });
    return li;
  });
  var payload = { zoneId: getZoneId(), zone: getZoneId(), scores: scores, remarks: criteriaRemarks, photo_b64: photoB64, lineItems: lineItems,
    fillSeconds: Math.floor((Date.now() - timerStart) / 1000), clientSubmittedAt: new Date().toISOString() };

  function queueOffline_(reason) {
    if (typeof offlineQueue !== 'undefined') {
      offlineQueue.queueSubmission('audit', payload).then(function() {
        btn.disabled = false; btn.textContent = 'Complete Audit';
        if (typeof pmToast === 'function') pmToast('Saved offline — will sync when online', 'info');
        if (typeof updateQueueStatus_ === 'function') updateQueueStatus_();
      }).catch(function(e2) {
        btn.disabled = false; btn.textContent = 'Complete Audit';
        if (typeof pmToast === 'function') pmToast('Error: ' + e2.message, 'error');
      });
    } else {
      btn.disabled = false; btn.textContent = 'Complete Audit';
      if (typeof pmToast === 'function') pmToast(reason || 'Submission failed', 'error');
    }
  }

  if (!navigator.onLine) { queueOffline_('offline'); return; }

  google.script.run
    .withSuccessHandler(function(result) {
      if (result && result.success) {
        if (typeof pmToast === 'function') pmToast('Submitted', 'success');
        var elapsed = Math.floor((Date.now() - timerStart) / 1000);
        var pct = result.percentage;
        var pcls = pct >= 80 ? 'g' : pct >= 60 ? 'a' : 'r';
        var html = '<div class="qa-wrap"><div class="qa-success">';
        html += '<div class="qa-success-ring"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>';
        html += '<h2>Audit Complete</h2>';
        html += '<div class="qa-success-pct ' + pcls + '">' + pct + '%</div>';
        html += '<div class="qa-success-sub">Score: ' + result.totalScore + ' / ' + result.maxScore + ' &nbsp;·&nbsp; ' + Math.floor(elapsed/60) + 'm ' + elapsed%60 + 's</div>';
        if (result.actionsGenerated > 0) {
          html += '<div class="qa-success-note">' + result.actionsGenerated + ' action(s) auto-generated for low scores</div><br>';
        }
        html += '<div id="qaShare" class="qa-share"><span class="zm-spin" style="display:inline-block;width:13px;height:13px;border:2px solid #e5e7eb;border-top-color:#6b21a8;border-radius:50%;animation:zmspin .7s linear infinite;vertical-align:middle;margin-right:6px"></span>Preparing report…</div>';
        html += '<a class="qa-success-back" href="#" onclick="goBackToDashboard_();return false;">Back to Dashboard</a>';
        html += '</div></div>';
        document.getElementById('content').innerHTML = html;
        document.querySelector('.qa-foot').style.display = 'none';
        document.querySelector('.qa-prog').style.display = 'none';
        if (result.submissionId) prepareAuditShare_(result.submissionId);
      } else {
        /* Server accepted the request but rejected the payload. Was a raw
           alert() — a blocking native dialog, unstyled, and the only path here
           not using pmToast. Reported inline at the submit bar so the auditor
           can see the reason and their scores at the same time. */
        btn.disabled = false; btn.textContent = 'Complete Audit';
        var msg = (result && result.message) ? result.message : 'Submission failed — please try again';
        var errEl = document.getElementById('qaSubmitErr');
        if (!errEl) {
          errEl = document.createElement('div');
          errEl.id = 'qaSubmitErr';
          errEl.className = 'qa-submit-err';
          errEl.setAttribute('role', 'alert');
          var foot = document.querySelector('.qa-foot-inner');
          if (foot) foot.insertBefore(errEl, foot.firstChild);
        }
        errEl.textContent = msg;
        errEl.style.display = 'block';
        if (typeof pmToast === 'function') pmToast(msg, 'error');
      }
    })
    .withFailureHandler(function(e) { queueOffline_(e.message); })
    .submitQuickAudit(payload);
}

function prepareAuditShare_(submissionId) {
  google.script.run
    .withSuccessHandler(function(r) {
      var el = document.getElementById('qaShare');
      if (!el) return;
      if (r && r.success) {

function applyWatermark_(dataUrl) {
  var img = new Image();
  img.onload = function() {
    /* Downscale to PM_IMG_MAX_EDGE first: camera originals are ~4000px / 2-5 MB,
       far beyond the w400 thumbnail every view actually renders, and large enough
       to hit the GAS payload limit and fail the upload silently. */
    var scale = Math.min(1, PM_IMG_MAX_EDGE / Math.max(img.width, img.height));
    var iw = Math.max(1, Math.round(img.width * scale));
    var ih = Math.max(1, Math.round(img.height * scale));
    var stripH = Math.max(28, Math.round(ih * 0.045));
    var c = document.createElement('canvas');
    c.width = iw; c.height = ih + stripH;
    var ctx = c.getContext('2d');
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, 0, 0, iw, ih);
    var zone    = getZoneId() || 'Unknown Zone';
    var auditor = (typeof currentUser_ !== 'undefined' && currentUser_) ? currentUser_ : 'Auditor';
    var now     = new Date();
    var dateStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' +
                  String(now.getDate()).padStart(2,'0') + ' ' +
                  String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    var zoom    = (window.devicePixelRatio || 1).toFixed(1);
    var fontSize = Math.max(12, Math.round(stripH * 0.52));
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, ih, c.width, stripH);
    ctx.font = 'bold ' + fontSize + 'px Arial';
    ctx.textBaseline = 'middle';
    var midY = ih + stripH / 2;
    ctx.fillStyle = '#ffffff';
    ctx.fillText(zone + '  |  ' + auditor, 10, midY);
    var right = dateStr + '  |  zoom ' + zoom + 'x';
    ctx.fillStyle = '#a0aec0';
    ctx.fillText(right, c.width - ctx.measureText(right).width - 10, midY);
    var watermarked = c.toDataURL('image/jpeg', PM_IMG_QUALITY);
    /* Record-level evidence (NC / Task / Red Tag) — checked before the criterion
       pool so an "Add photo" on a create form doesn't land on the criterion. */
    if (_recPending) {
      var rp = _recPending; _recPending = null;
      var rk = recKey_(rp.idx, rp.type);
      if (!recPhotos[rk]) recPhotos[rk] = [];
      recPhotos[rk].push(watermarked);
      /* Match by stable token, not index: removeRecPhoto_ can splice the array
         while an annotate callback is still pending. */
      var rtok = 'r' + (_qaPhotoTokenSeq++);
      if (!recPhotoTokens[rk]) recPhotoTokens[rk] = [];
      recPhotoTokens[rk].push(rtok);
      renderRecPhotos_(rp.idx, rp.type);
      /* Same flow as criterion photos: capture drops straight into the annotator
         so the evidence can be marked up (arrows/circles/text) to explain itself. */
      openAnnotatorFor_(dataUrl, qaStamp_(), function(annotated) {
        var pos2 = (recPhotoTokens[rk] || []).indexOf(rtok);
        if (pos2 === -1) return; // photo removed before annotation finished
        recPhotos[rk][pos2] = annotated;
        renderRecPhotos_(rp.idx, rp.type);
      });
      return;
    }
    if (_activeCrit) {
      var ac = _activeCrit; _activeCrit = null;
      if (!criterionPhotos[ac.cid]) criterionPhotos[ac.cid] = [];
      if (!criterionPhotosRaw[ac.cid]) criterionPhotosRaw[ac.cid] = [];
      if (!criterionPhotoTokens[ac.cid]) criterionPhotoTokens[ac.cid] = [];
      // Stable per-photo token (not a raw array index) — removePhoto_ can
      // splice the array out from under a still-pending annotate callback;
      // matching by token instead of index keeps the write on the right photo.
      var token = 'p' + (_qaPhotoTokenSeq++);
      criterionPhotos[ac.cid].push(watermarked);
      criterionPhotosRaw[ac.cid].push(dataUrl);
      criterionPhotoTokens[ac.cid].push(token);
      showThumb_(ac.idx, ac.cid);
      /* Capture flows straight into annotate (same-document canvas) */
      openAnnotatorFor_(dataUrl, qaStamp_(), function(annotated) {
        var pos = (criterionPhotoTokens[ac.cid] || []).indexOf(token);
        if (pos === -1) return; // photo was removed before annotation finished
        criterionPhotos[ac.cid][pos] = annotated;
        showThumb_(ac.idx, ac.cid);
      });
      return;
    }
    var hidden = document.getElementById('photoDataUrl');
    var thumb  = document.getElementById('photoThumb');
    var prev   = document.getElementById('photoPreviewImg');
    var photoBtn = document.getElementById('photoBtn');
    if (hidden)   hidden.value = watermarked;
    if (prev)     prev.src = watermarked;
    if (thumb)    thumb.style.display = 'block';
    if (photoBtn) photoBtn.textContent = 'Retake photo';
    document.querySelectorAll('[id^="ac-cam-"]').forEach(function(b) { b.classList.add('on-cam'); });
  };
  img.src = dataUrl;
}

// ── Same-document annotator (no iframe — GAS nesting breaks postMessage) ──────
// PMAnnot draws the photo + watermark strip on a canvas and lets the auditor
// mark it up (pen / arrow / circle, colour, undo) before saving back.
var PMAnnot = (function() {
  var overlay, canvas, ctx, baseImg = null, strokes = [], cur = null;
  var tool = 'draw', color = '#e74c3c', lineW = 5, stamp = {}, onSave = null;

  function el(id) { return document.getElementById(id); }

  function drawStrip() {
    if (!baseImg) return;
    var stripH = canvas.height - baseImg.height;
    if (stripH <= 0 || (!stamp.zone && !stamp.auditor)) return;
    var fs = Math.max(12, Math.round(stripH * 0.52));
    ctx.fillStyle = '#1a1a2e'; ctx.fillRect(0, baseImg.height, canvas.width, stripH);
    ctx.font = 'bold ' + fs + 'px Arial'; ctx.textBaseline = 'middle';
    var midY = baseImg.height + stripH / 2;
    ctx.fillStyle = '#fff'; ctx.fillText((stamp.zone || '') + '  |  ' + (stamp.auditor || ''), 10, midY);
    var right = (stamp.date || '') + (stamp.zoom ? '  |  zoom ' + stamp.zoom + 'x' : '');
    ctx.fillStyle = '#a0aec0'; ctx.fillText(right, canvas.width - ctx.measureText(right).width - 10, midY);
  }

  function drawOne(s) {
    ctx.strokeStyle = s.color; ctx.fillStyle = s.color; ctx.lineWidth = s.lineW;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (s.type === 'draw') {
      ctx.beginPath();
      s.pts.forEach(function(p, i) { i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); });
      ctx.stroke();
    } else if (s.type === 'circle') {
      ctx.beginPath();
      ctx.ellipse((s.sx + s.ex) / 2, (s.sy + s.ey) / 2, Math.abs(s.ex - s.sx) / 2, Math.abs(s.ey - s.sy) / 2, 0, 0, 2 * Math.PI);
      ctx.stroke();
    } else if (s.type === 'arrow') {
      ctx.beginPath(); ctx.moveTo(s.sx, s.sy); ctx.lineTo(s.ex, s.ey); ctx.stroke();
      var a = Math.atan2(s.ey - s.sy, s.ex - s.sx), h = 8 + s.lineW * 2;
      ctx.beginPath(); ctx.moveTo(s.ex, s.ey);
      ctx.lineTo(s.ex - h * Math.cos(a - 0.4), s.ey - h * Math.sin(a - 0.4));
      ctx.lineTo(s.ex - h * Math.cos(a + 0.4), s.ey - h * Math.sin(a + 0.4));
      ctx.closePath(); ctx.fill();
    } else if (s.type === 'text') {
      /* Scale with the image so text stays legible on large photos, and back it
         with a dark plate so light-coloured labels remain readable on any photo. */
      var tf = s.fontPx || 24;
      ctx.font = 'bold ' + tf + 'px Arial';
      ctx.textBaseline = 'top';
      var tw = ctx.measureText(s.text).width, pad = Math.round(tf * 0.28);
      ctx.fillStyle = 'rgba(0,0,0,.55)';
      ctx.fillRect(s.sx - pad, s.sy - pad, tw + pad * 2, tf + pad * 2);
      ctx.fillStyle = s.color;
      ctx.fillText(s.text, s.sx, s.sy);
    }
  }

  function redraw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (baseImg) ctx.drawImage(baseImg, 0, 0);
    drawStrip();
    strokes.forEach(drawOne);
    if (cur) drawOne(cur);
  }

  function pos(ev) {
    var r = canvas.getBoundingClientRect();
    var t = ev.touches && ev.touches[0] ? ev.touches[0] : ev;
    return { x: (t.clientX - r.left) * (canvas.width / r.width), y: (t.clientY - r.top) * (canvas.height / r.height) };
  }
  function down(ev) {
    ev.preventDefault(); var p = pos(ev);
    /* Text is placed by a single tap, not a drag — prompt, then commit at that point. */
    if (tool === 'text') {
      var t = window.prompt('Label text:');
      if (t && t.trim()) {
        strokes.push({ type: 'text', color: color, text: t.trim(), sx: p.x, sy: p.y,
                       fontPx: Math.max(18, Math.round((baseImg ? baseImg.width : 800) * 0.035)) });
        redraw();
      }
      return;
    }
    cur = (tool === 'draw') ? { type: 'draw', color: color, lineW: lineW, pts: [p] }
                            : { type: tool, color: color, lineW: lineW, sx: p.x, sy: p.y, ex: p.x, ey: p.y }; }
  function move(ev) { if (!cur) return; ev.preventDefault(); var p = pos(ev);
    if (cur.type === 'draw') cur.pts.push(p); else { cur.ex = p.x; cur.ey = p.y; } redraw(); }
  function up() { if (cur) { strokes.push(cur); cur = null; redraw(); } }

  function open(dataUrl, stmp, cb) {
    stamp = stmp || {}; onSave = cb || null; strokes = []; cur = null; tool = 'draw';
    overlay = el('annotatorOverlay'); canvas = el('pmaCanvas'); ctx = canvas.getContext('2d');
    var img = new Image();
    img.onload = function() {
      baseImg = img;
      var stripH = Math.max(28, Math.round(img.height * 0.045));
      canvas.width = img.width; canvas.height = img.height + stripH;
      redraw();
      overlay.style.display = 'flex';
    };
    img.src = dataUrl;
    if (!canvas._wired) {
      canvas._wired = true;
      canvas.addEventListener('mousedown', down); canvas.addEventListener('mousemove', move);
      window.addEventListener('mouseup', up);
      canvas.addEventListener('touchstart', down, { passive: false });
      canvas.addEventListener('touchmove', move, { passive: false });
      canvas.addEventListener('touchend', up);
    }
  }

  return {
    open: open,
    tool: function(t) { tool = t; ['draw', 'arrow', 'circle', 'text'].forEach(function(x) { var b = el('pma-' + x); if (b) b.classList.toggle('on', x === t); }); },
    undo: function() { strokes.pop(); redraw(); },
    color: function(c) { color = c; },
    undo: function() { strokes.pop(); redraw(); },
    /* Resolve the overlay from the DOM every time: #annotatorOverlay lives inside
       the card markup, which render() rebuilds, so a cached reference can point at
       a detached node — hiding that leaves the live overlay covering the page at
       z-index 9999 and swallowing every click. */
    cancel: function() { var o = el('annotatorOverlay'); if (o) o.style.display = 'none'; },
    save: function() {
      var o = el('annotatorOverlay'); if (o) o.style.display = 'none';
      /* Canvas is already downscaled (source is the watermarked image). Encode at
         a slightly higher quality than the first pass so the unavoidable second
         encode does not compound artefacts — size is already bounded by the
         1024px cap applied upstream. */
      var d = canvas.toDataURL('image/jpeg', 0.78); if (onSave) onSave(d);
    }
  };
})();

function openAnnotatorFor_(dataUrl, stamp, cb) { PMAnnot.open(dataUrl, stamp, cb); }

/* ── Auditor identity ───────────────────────────────────────────────────────
   Floor workers reach QuickAudit by QR with no login, so the server has no
   Session identity and v2GetCurrentUser_() returns "system" — which is what
   every record and Telegram card was showing. Resolve the real name here:
     1. a logged-in session name injected by the server (manager/auditor), else
     2. a name remembered on this device, else
     3. ask once and remember it.
   ------------------------------------------------------------------------- */
var QA_NAME_KEY = 'pm5s_auditor_name';

function qaAuditorName_(promptIfMissing) {
  /* server-injected session name wins (real login) */
  var s = (typeof currentUser_ !== 'undefined' && currentUser_) ? String(currentUser_).trim() : '';
  if (!s && _CFG && _CFG.auditor) {
    var c = String(_CFG.auditor).trim();
    if (c && c.toLowerCase() !== 'system' && c.toLowerCase() !== 'worker') s = c;
  }
  if (s) return s;

  var saved = '';
  try { saved = (localStorage.getItem(QA_NAME_KEY) || '').trim(); } catch (e) {}
  if (saved) return saved;

  if (!promptIfMissing) return '';
  var entered = '';
  try { entered = (window.prompt('Your name (recorded on this audit):') || '').trim(); } catch (e) {}
  if (entered) { try { localStorage.setItem(QA_NAME_KEY, entered); } catch (e) {} return entered; }
  return '';
}

/* Name used on every record this session; asked for once, then remembered. */
function qaWho_() { return qaAuditorName_(true) || 'Auditor'; }

function qaStamp_() {
  var now = new Date();
  return {
    zone: getZoneId() || 'Unknown Zone',
    auditor: qaAuditorName_(false) || 'Auditor',
    date: now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' +
          String(now.getDate()).padStart(2,'0') + ' ' +
          String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0'),
    zoom: (window.devicePixelRatio || 1).toFixed(1)
  };
}

function isMobileDevice_() {
  return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
}

function validatePhotoOnMobile_() {
  // Photos are now optional and attached per parameter — no global photo requirement.
  return true;
}
