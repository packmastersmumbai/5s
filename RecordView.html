<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PackMasters 5S — Record</title>
<style>
  :root{--ink:#1a1f2e;--ink2:#5a6472;--ink3:#9aa1ad;--line:#e3e6ee;--bg:#f6f8fc;--accent:#2563eb;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);padding:16px;}
  .wrap{max-width:560px;margin:0 auto;}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 18px 20px;box-shadow:0 2px 14px rgba(16,24,40,.05);}
  .loading,.err{color:var(--ink2);font-size:14px;padding:20px 0;text-align:center;}
  .err{color:#c0392b;}
  .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px;}
  .badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;}
  .badge.NCR{background:#fdecec;color:#c0392b;} .badge.Task{background:#eafaf1;color:#1e8e50;} .badge.RedTag{background:#fef5e7;color:#b9770a;}
  .st{font-size:12px;font-weight:600;color:var(--ink2);padding:3px 10px;border:1px solid var(--line);border-radius:20px;text-transform:uppercase;letter-spacing:.03em;}
  .id{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink3);margin-bottom:10px;}
  .ti{font-size:18px;font-weight:600;line-height:1.35;margin-bottom:14px;}
  .tbl{width:100%;border-collapse:collapse;}
  .tbl td{padding:9px 0;border-top:1px solid var(--line);vertical-align:top;font-size:14px;}
  .tbl td.l{color:var(--ink2);width:38%;font-size:13px;}
  .tbl td.v{color:var(--ink);}
  .signin{display:block;margin-top:18px;text-align:center;background:var(--accent);color:#fff;text-decoration:none;padding:12px;border-radius:10px;font-size:14px;font-weight:600;}
  .foot{margin-top:12px;text-align:center;font-size:11px;color:var(--ink3);}
</style>
</head>
<body>
<div class="wrap">
  <div id="rec" class="card"><div class="loading">Loading record…</div></div>
  <div class="foot">PackMasters 5S · read-only</div>
</div>
<script>
var TYPE = '<?= (params && params.type) ? String(params.type).replace(/[^a-zA-Z]/g,"") : "" ?>';
var ID   = '<?= (params && params.id) ? String(params.id).replace(/[^a-zA-Z0-9\-_]/g,"") : "" ?>';
var DU   = '<?= deployUrl ?>';
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function render(rec){
  var el = document.getElementById('rec');
  if(!rec){ el.innerHTML = '<div class="err">Record not found (' + esc(TYPE) + ' ' + esc(ID) + ').</div>'; return; }
  var rows = (rec.fields||[]).filter(function(f){ return f.v!=='' && f.v!=null; })
    .map(function(f){ return '<tr><td class="l">' + esc(f.l) + '</td><td class="v">' + esc(f.v) + '</td></tr>'; }).join('');
  var zoneId = (String(rec.zone||'').match(/Z-\d+/)||[''])[0];
  var editAction = rec.type === 'NCR' ? 'capa' : 'actionlist';
  var next = 'v2=1&action=' + editAction + (zoneId ? '&zone=' + zoneId : '');
  el.innerHTML =
    '<div class="hd"><span class="badge ' + esc(rec.type).replace(/\s/g,'') + '">' + esc(rec.type) + '</span><span class="st">' + esc(rec.status) + '</span></div>' +
    '<div class="id">' + esc(rec.id) + ' · ' + esc(rec.zone) + '</div>' +
    '<div class="ti">' + esc(rec.title) + '</div>' +
    '<table class="tbl">' + rows + '</table>' +
    '<a class="signin" href="' + DU + '?v2=1&action=login&next=' + encodeURIComponent(next) + '" target="_top">Sign in to update</a>';
}
function load(){
  if(!TYPE || !ID){ document.getElementById('rec').innerHTML = '<div class="err">Missing record type or id.</div>'; return; }
  google.script.run
    .withSuccessHandler(render)
    .withFailureHandler(function(e){ document.getElementById('rec').innerHTML = '<div class="err">Could not load record: ' + esc(e && e.message || '') + '</div>'; })
    .getPublicRecord(TYPE, ID);
}
load();
</script>
</body>
</html>
