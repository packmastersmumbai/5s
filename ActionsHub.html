<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Actions Hub — PackMasters 5S</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-main);
  background: var(--bg-page);
  color: var(--text-primary);
  min-height: 100vh;
}

/* ── HEADER ─────────────────────────────── */
.ah-header {
  background: var(--bg-header);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  position: sticky; top: 0; z-index: 100;
}
.ah-header h1 {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 700;
  color: var(--pm-primary);
  display: flex;
  align-items: center;
  gap: 10px;
}
.ah-header h1::before {
  content: '';
  display: block;
  width: 3px;
  height: 18px;
  background: var(--pm-primary);
  border-radius: 2px;
}

/* ── TYPE TABS ──────────────────────────── */
.ah-type-tabs {
  display: flex;
  gap: 0;
  background: var(--bg-card);
  border-bottom: 2px solid var(--border);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.ah-type-tabs::-webkit-scrollbar { display: none; }

.ah-type-tab {
  padding: 10px 16px;
  font-family: var(--font-display);
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  cursor: pointer;
  border-bottom: 3px solid transparent;
  transition: all .15s;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 6px;
  background: none;
  border-top: none;
  border-left: none;
  border-right: none;
}
.ah-type-tab:hover { color: var(--pm-primary); }
.ah-type-tab.active { color: var(--pm-primary); border-bottom-color: var(--pm-primary); }

.tab-badge {
  display: inline-block;
  background: var(--bg-card-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1px 7px;
  font-size: 10px;
  font-family: var(--font-mono);
  color: var(--text-muted);
  transition: background .15s;
}
.ah-type-tab.active .tab-badge {
  background: var(--pm-primary);
  color: #fff;
  border-color: var(--pm-primary);
}

/* ── STATUS TABS ────────────────────────── */
.ah-status-tabs {
  display: flex;
  gap: 0;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.ah-status-tabs::-webkit-scrollbar { display: none; }

.ah-status-tab {
  padding: 8px 16px;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 6px;
  background: none;
  border-top: none;
  border-left: none;
  border-right: none;
  letter-spacing: .4px;
  transition: all .15s;
}
.ah-status-tab:hover { color: var(--text-primary); }
.ah-status-tab.active { color: var(--text-primary); border-bottom-color: var(--text-primary); }

/* ── FILTER ROW ─────────────────────────── */
.ah-filter-row {
  display: flex;
  gap: 8px;
  padding: 10px 16px;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
  align-items: center;
}

/* Priority chips */
.ah-chip {
  padding: 5px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  border: 1.5px solid var(--border);
  background: var(--bg-card);
  color: var(--text-secondary);
  cursor: pointer;
  white-space: nowrap;
  min-height: 32px;
  transition: all .15s;
  font-family: var(--font-mono);
}
.ah-chip:hover { border-color: var(--pm-primary); color: var(--pm-primary); }
.ah-chip.active { background: var(--pm-primary); border-color: var(--pm-primary); color: #fff; }
.ah-chip.crit.active  { background: var(--score-red);   border-color: var(--score-red); }
.ah-chip.high.active  { background: var(--score-amber); border-color: var(--score-amber); }
.ah-chip.med.active   { background: #B45309; border-color: #B45309; }
.ah-chip.low.active   { background: var(--text-muted); border-color: var(--text-muted); }

/* Zone dropdown */
.ah-zone-select {
  padding: 5px 10px;
  border-radius: 8px;
  border: 1.5px solid var(--border);
  background: var(--bg-card);
  color: var(--text-primary);
  font-family: var(--font-mono);
  font-size: 11px;
  cursor: pointer;
  min-height: 32px;
  outline: none;
  transition: border-color .15s;
}
.ah-zone-select:focus { border-color: var(--pm-primary); }

/* ── CARDS ──────────────────────────────── */
.ah-list {
  max-width: 700px;
  margin: 14px auto;
  padding: 0 14px 100px;
}

.ah-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-left: 4px solid var(--border);
  border-radius: var(--r);
  margin-bottom: 10px;
  box-shadow: var(--shadow);
  overflow: hidden;
  transition: box-shadow .2s;
}
.ah-card:hover { box-shadow: var(--shadow-lg); }
.ah-card.CRITICAL { border-left-color: var(--score-red); }
.ah-card.HIGH     { border-left-color: var(--score-amber); }
.ah-card.MEDIUM   { border-left-color: #F59E0B; }
.ah-card.LOW      { border-left-color: var(--text-muted); }

.ah-card__body {
  padding: 14px 16px 12px;
  cursor: pointer;
}
.ah-card__body:hover .ah-card__title { text-decoration: underline; text-underline-offset: 2px; }

.ah-card__top {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 6px;
}
.ah-card__title {
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 600;
  color: var(--pm-primary);
  flex: 1;
  min-width: 0;
  line-height: 1.3;
}

/* TYPE badge */
.type-badge {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 4px;
  white-space: nowrap;
  letter-spacing: .5px;
  flex-shrink: 0;
}
.type-badge.NC       { background: #EEE8FF; color: #5B21B6; }
.type-badge.TASK     { background: var(--pm-primary-soft); color: var(--pm-primary); }
.type-badge.RED_TAG  { background: var(--score-red-bg); color: var(--score-red); }

/* PRIORITY badge */
.pri-badge {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 4px;
  white-space: nowrap;
  letter-spacing: .5px;
  flex-shrink: 0;
}
.pri-badge.CRITICAL { background: var(--score-red-bg);   color: var(--score-red); }
.pri-badge.HIGH     { background: var(--score-amber-bg); color: var(--score-amber); }
.pri-badge.MEDIUM   { background: #FFF8E1;               color: #B45309; }
.pri-badge.LOW      { background: var(--bg-card-2);      color: var(--text-muted); }

/* STATUS label */
.status-lbl {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 4px;
  white-space: nowrap;
  letter-spacing: .4px;
  flex-shrink: 0;
}
.status-lbl.OPEN        { background: var(--score-red-bg);   color: var(--score-red); }
.status-lbl.IN_PROGRESS { background: var(--score-amber-bg); color: var(--score-amber); }
.status-lbl.CLOSED      { background: var(--score-green-bg); color: var(--score-green); }

.ah-card__meta {
  font-size: 11px;
  color: var(--text-muted);
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 4px;
}
.ah-card__meta span { display: flex; align-items: center; gap: 3px; }

.ah-overdue { color: var(--score-red); font-weight: 600; font-size: 11px; margin-top: 3px; }

/* ── ACTION BUTTONS ─────────────────────── */
.ah-card__actions {
  display: flex;
  gap: 6px;
  padding: 10px 16px 12px;
  flex-wrap: wrap;
  border-top: 1px solid var(--border-light);
  background: var(--bg-card-2);
}

.ah-btn {
  padding: 5px 14px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  font-family: var(--font-mono);
  letter-spacing: .3px;
  transition: opacity .15s, transform .1s;
  min-height: 30px;
}
.ah-btn:active:not(:disabled) { transform: scale(.94); }
.ah-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
.ah-btn.start  { background: var(--pm-primary-soft); color: var(--pm-primary);   border: 1px solid var(--pm-primary); }
.ah-btn.close  { background: var(--score-green-bg);  color: var(--score-green);  border: 1px solid var(--score-green); }
.ah-btn.done   { background: var(--score-green-bg);  color: var(--score-green);  border: 1px solid var(--score-green); }
.ah-btn.phase  { background: var(--score-amber-bg);  color: var(--score-amber);  border: 1px solid var(--score-amber); }

/* ── COMPACT TABLE (Actions list) ───────── */
.ah-table-wrap { max-width: 1100px; margin: 12px auto; padding: 0 12px 100px; overflow-x: auto; }
.ah-table { width: 100%; border-collapse: collapse; font-size: 12px; background: var(--bg-card);
  border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
.ah-table thead th { font-family: var(--font-mono); font-size: 9px; font-weight: 700; letter-spacing: .5px;
  text-transform: uppercase; color: var(--text-muted); text-align: left; padding: 8px 10px;
  background: var(--bg-card-2); border-bottom: 1px solid var(--border); white-space: nowrap; }
.ah-tr { border-bottom: 1px solid var(--border-light); border-left: 3px solid transparent; }
.ah-tr:last-child { border-bottom: none; }
.ah-tr:hover { background: var(--bg-card-2); }
.ah-tr.CRITICAL { border-left-color: var(--score-red); }
.ah-tr.HIGH     { border-left-color: var(--score-amber); }
.ah-tr.MEDIUM   { border-left-color: #F59E0B; }
.ah-tr.LOW      { border-left-color: var(--text-muted); }
.ah-td { padding: 7px 10px; vertical-align: middle; }
.ah-td.title { cursor: pointer; font-weight: 600; color: var(--pm-primary); max-width: 320px;
  min-width: 160px; line-height: 1.25; }
.ah-td.title:hover { text-decoration: underline; text-underline-offset: 2px; }
.ah-td.title .ovd { color: var(--score-red); font-weight: 700; margin-left: 5px; font-size: 10px; }
.ah-td.muted { color: var(--text-muted); white-space: nowrap; }
.ah-td.acts { white-space: nowrap; text-align: right; }
/* compact icon buttons */
.ah-ibtn { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px;
  margin-left: 4px; border-radius: 6px; cursor: pointer; font-size: 13px; line-height: 1;
  border: 1px solid var(--border); background: var(--bg-card); color: var(--text-secondary);
  transition: all .12s; vertical-align: middle; }
.ah-ibtn:hover:not(:disabled) { border-color: var(--pm-primary); color: var(--pm-primary); }
.ah-ibtn:disabled { opacity: .4; cursor: not-allowed; }
.ah-ibtn.start { color: var(--pm-primary); border-color: var(--pm-primary); }
.ah-ibtn.done, .ah-ibtn.close, .ah-ibtn.phase { color: var(--score-green); border-color: var(--score-green); }
.ah-ibtn.del:hover { color: var(--score-red); border-color: var(--score-red); }
@media (max-width: 640px) { .ah-td.hide-sm { display: none; } .ah-table thead th.hide-sm { display: none; } }

/* ── LOADING / EMPTY ────────────────────── */
.ah-loading {
  text-align: center;
  padding: 60px;
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 1px;
}
.ah-empty {
  text-align: center;
  padding: 60px 24px;
  color: var(--score-green);
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 600;
}

/* ── RECORD DETAIL MODAL (NC) ───────────── */
.rd-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.45);
  z-index: 300;
}
.rd-backdrop.open { display: block; }

.rd-modal {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: calc(var(--r) * 1.5);
  box-shadow: var(--shadow-lg);
  z-index: 301;
  width: min(94vw, 520px);
  max-height: 82vh;
  overflow: hidden;
  display: none;
  flex-direction: column;
}
.rd-modal.open { display: flex; }

.rd-modal__header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 18px 12px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.rd-modal__title {
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 700;
  color: var(--pm-primary);
}
.rd-modal__close {
  background: none;
  border: none;
  font-size: 18px;
  cursor: pointer;
  color: var(--text-muted);
  line-height: 1;
  padding: 2px 6px;
  border-radius: 4px;
  transition: background .15s;
}
.rd-modal__close:hover { background: var(--bg-card-2); color: var(--text-primary); }

.rd-modal__body {
  overflow-y: auto;
  padding: 16px 18px 20px;
  flex: 1;
}

.rd-dl {
  display: grid;
  grid-template-columns: 130px 1fr;
  gap: 6px 10px;
  font-size: 12px;
}
.rd-dt {
  font-family: var(--font-mono);
  color: var(--text-muted);
  font-size: 10px;
  letter-spacing: .5px;
  text-transform: uppercase;
  padding-top: 2px;
  line-height: 1.4;
}
.rd-dd {
  color: var(--text-primary);
  line-height: 1.5;
  word-break: break-word;
}
.rd-dd.empty { color: var(--text-muted); font-style: italic; }
.rd-divider {
  grid-column: 1 / -1;
  border: none;
  border-top: 1px solid var(--border);
  margin: 4px 0;
}

/* ── RCA START MODAL ────────────────────── */
.rca-modal {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: calc(var(--r) * 1.5);
  box-shadow: var(--shadow-lg);
  z-index: 401;
  width: min(94vw, 480px);
  display: none;
  flex-direction: column;
}
.rca-modal.open { display: flex; }
.rca-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  z-index: 400;
}
.rca-backdrop.open { display: block; }
.rca-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 18px 12px;
  border-bottom: 1px solid var(--border);
}
.rca-title {
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 700;
  color: var(--pm-primary);
}
.rca-close {
  background: none; border: none;
  font-size: 18px; cursor: pointer;
  color: var(--text-muted);
  padding: 2px 6px; border-radius: 4px;
  transition: background .15s;
}
.rca-close:hover { background: var(--bg-card-2); }
.rca-body { padding: 16px 18px 20px; }
.rca-label {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: .5px;
  margin-bottom: 6px;
  display: block;
}
.rca-textarea {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 10px 12px;
  font-family: var(--font-main);
  font-size: 13px;
  color: var(--text-primary);
  background: var(--bg-page);
  resize: vertical;
  min-height: 80px;
  outline: none;
  transition: border-color .15s;
}
.rca-textarea:focus { border-color: var(--pm-primary); }
.rca-counter {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-muted);
  text-align: right;
  margin-top: 3px;
  margin-bottom: 14px;
}
.rca-counter.ok { color: var(--score-green); }
.rca-submit {
  width: 100%;
  background: var(--pm-primary);
  color: #fff;
  border: none;
  border-radius: var(--r);
  padding: 10px 16px;
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: opacity .15s;
}
.rca-submit:hover { opacity: .9; }
.rca-submit:disabled { opacity: .4; cursor: not-allowed; }

/* ── CREATE BUTTON ──────────────────────── */
.ah-create-btn {
  padding: 7px 14px;
  background: var(--pm-primary);
  color: #fff;
  border: none;
  border-radius: var(--r);
  font-family: var(--font-display);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  letter-spacing: .3px;
  transition: opacity .15s;
  flex-shrink: 0;
}
.ah-create-btn:hover { opacity: .85; }

/* ── CREATE MODAL ────────────────────────── */
.ac-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  z-index: 400;
}
.ac-backdrop.open { display: block; }

.ac-modal {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: calc(var(--r) * 1.5);
  box-shadow: var(--shadow-lg);
  z-index: 401;
  width: min(94vw, 480px);
  max-height: 88vh;
  overflow: hidden;
  display: none;
  flex-direction: column;
}
.ac-modal.open { display: flex; }

.ac-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 18px 12px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.ac-title {
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 700;
  color: var(--pm-primary);
}
.ac-close {
  background: none; border: none;
  font-size: 18px; cursor: pointer;
  color: var(--text-muted);
  padding: 2px 6px; border-radius: 4px;
  transition: background .15s;
}
.ac-close:hover { background: var(--bg-card-2); color: var(--text-primary); }

.ac-body {
  overflow-y: auto;
  padding: 16px 18px 20px;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* type selector */
.ac-type-row {
  display: flex;
  gap: 6px;
}
.ac-type-btn {
  flex: 1;
  padding: 7px 6px;
  border: 1.5px solid var(--border);
  border-radius: var(--r);
  background: var(--bg-card);
  color: var(--text-secondary);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  text-align: center;
  transition: all .15s;
  letter-spacing: .3px;
}
.ac-type-btn:hover { border-color: var(--pm-primary); color: var(--pm-primary); }
.ac-type-btn.active { background: var(--pm-primary); border-color: var(--pm-primary); color: #fff; }

/* form fields */
.ac-field { display: flex; flex-direction: column; gap: 4px; }
.ac-label {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: .5px;
}
.ac-label .req { color: var(--score-red); }

.ac-input, .ac-select, .ac-textarea {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 8px 10px;
  font-family: var(--font-main);
  font-size: 13px;
  color: var(--text-primary);
  background: var(--bg-page);
  outline: none;
  transition: border-color .15s;
}
.ac-input:focus, .ac-select:focus, .ac-textarea:focus { border-color: var(--pm-primary); }
.ac-textarea { resize: vertical; min-height: 72px; }

.ac-group { display: flex; flex-direction: column; gap: 12px; }

/* footer buttons */
.ac-footer {
  display: flex;
  gap: 8px;
  padding: 12px 18px 14px;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
.ac-submit {
  flex: 1;
  background: var(--pm-primary);
  color: #fff;
  border: none;
  border-radius: var(--r);
  padding: 9px 16px;
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: opacity .15s;
}
.ac-submit:hover { opacity: .9; }
.ac-submit:disabled { opacity: .4; cursor: not-allowed; }
.ac-cancel {
  padding: 9px 16px;
  background: var(--bg-card-2);
  color: var(--text-secondary);
  border: 1px solid var(--border);
  border-radius: var(--r);
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: background .15s;
}
.ac-cancel:hover { background: var(--border); }

/* ── INLINE DETAIL MODAL (TASK / RED TAG) ── */
.id-modal {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: calc(var(--r) * 1.5);
  box-shadow: var(--shadow-lg);
  z-index: 301;
  width: min(94vw, 480px);
  max-height: 82vh;
  overflow: hidden;
  display: none;
  flex-direction: column;
}
.id-modal.open { display: flex; }
</style>
</head>
<body>

<div class="ah-header">
  <h1>Actions</h1>
  <div style="display:flex;align-items:center;gap:10px">
    <div id="ahRefreshBadge" style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted)"></div>
    <button class="ah-create-btn" onclick="openCreateModal()">+ Create</button>
  </div>
</div>

<!-- TYPE TABS -->
<div class="ah-type-tabs" id="ahTypeTabs">
  <button class="ah-type-tab active" data-type="ALL"     onclick="setTypeTab(this)">All     <span class="tab-badge" id="cntAll">0</span></button>
  <button class="ah-type-tab"        data-type="NC"      onclick="setTypeTab(this)">NCs     <span class="tab-badge" id="cntNC">0</span></button>
  <button class="ah-type-tab"        data-type="TASK"    onclick="setTypeTab(this)">Tasks   <span class="tab-badge" id="cntTASK">0</span></button>
  <button class="ah-type-tab"        data-type="RED_TAG" onclick="setTypeTab(this)">Red Tags<span class="tab-badge" id="cntRED_TAG">0</span></button>
  <button class="ah-type-tab"        data-type="AUDITS"  onclick="setTypeTab(this)">Audits</button>
</div>

<!-- STATUS TABS -->
<div class="ah-status-tabs" id="ahStatusTabs">
  <button class="ah-status-tab active" data-status="OPEN"        onclick="setStatusTab(this)">Open        <span class="tab-badge" id="cntOPEN">0</span></button>
  <button class="ah-status-tab"        data-status="IN_PROGRESS" onclick="setStatusTab(this)">In Progress <span class="tab-badge" id="cntIN_PROGRESS">0</span></button>
  <button class="ah-status-tab"        data-status="CLOSED"      onclick="setStatusTab(this)">Closed      <span class="tab-badge" id="cntCLOSED">0</span></button>
</div>

<!-- PRIORITY CHIPS + ZONE SELECT -->
<div class="ah-filter-row">
  <button class="ah-chip active" data-pri=""         onclick="setPriChip(this)">All</button>
  <button class="ah-chip crit"   data-pri="CRITICAL" onclick="setPriChip(this)">Critical</button>
  <button class="ah-chip high"   data-pri="HIGH"     onclick="setPriChip(this)">High</button>
  <button class="ah-chip med"    data-pri="MEDIUM"   onclick="setPriChip(this)">Medium</button>
  <button class="ah-chip low"    data-pri="LOW"      onclick="setPriChip(this)">Low</button>
  <select class="ah-zone-select" id="ahZoneSelect" onchange="setZone(this.value)">
    <option value="">All Zones</option>
  </select>
</div>

<!-- CARD LIST -->
<div id="ahContent">
  <div class="ah-loading">Loading actions…</div>
</div>

<!-- ── NC Record Detail Modal ── -->
<div class="rd-backdrop" id="rdBackdrop" onclick="closeNcDetail()"></div>
<div class="rd-modal" id="recordDetailModal" role="dialog" aria-modal="true" aria-labelledby="rdModalTitle">
  <div class="rd-modal__header">
    <span class="rd-modal__title" id="rdModalTitle">NC / CAPA Detail</span>
    <button class="rd-modal__close" onclick="closeNcDetail()" aria-label="Close">✕</button>
  </div>
  <div class="rd-modal__body" id="recordDetailBody"></div>
</div>

<!-- ── Edit Modal ── -->
<div class="rd-backdrop" id="editBackdrop" onclick="closeEditModal()"></div>
<div class="rd-modal" id="editModal" role="dialog" aria-modal="true" aria-labelledby="edModalTitle">
  <div class="rd-modal__header">
    <span class="rd-modal__title" id="edModalTitle">Edit</span>
    <button class="rd-modal__close" onclick="closeEditModal()" aria-label="Close">✕</button>
  </div>
  <div class="rd-modal__body" id="editBody"></div>
  <div style="padding:12px;display:flex;gap:8px;justify-content:flex-end">
    <button class="ah-btn" onclick="closeEditModal()">Cancel</button>
    <button class="ah-create-btn" onclick="submitEdit()">Save</button>
  </div>
</div>

<!-- ── Inline Detail Modal (TASK / RED_TAG) ── -->
<div class="rd-backdrop" id="idBackdrop" onclick="closeInlineDetail()"></div>
<div class="id-modal" id="inlineDetailModal" role="dialog" aria-modal="true" aria-labelledby="idModalTitle">
  <div class="rd-modal__header">
    <span class="rd-modal__title" id="idModalTitle">Detail</span>
    <button class="rd-modal__close" onclick="closeInlineDetail()" aria-label="Close">✕</button>
  </div>
  <div class="rd-modal__body" id="inlineDetailBody"></div>
</div>

<!-- ── Create Modal (NC / Task / Red Tag) ── -->
<div class="ac-backdrop" id="acBackdrop" onclick="closeCreateModal()"></div>
<div class="ac-modal" id="acCreateModal" role="dialog" aria-modal="true" aria-labelledby="acModalTitle">
  <div class="ac-header">
    <span class="ac-title" id="acModalTitle">Create Action</span>
    <button class="ac-close" onclick="closeCreateModal()" aria-label="Close">✕</button>
  </div>
  <div class="ac-body">

    <!-- Item type selector -->
    <div class="ac-field">
      <span class="ac-label">Item Type <span class="req">*</span></span>
      <div class="ac-type-row">
        <button class="ac-type-btn active" data-actype="NC"      onclick="setCreateType('NC',this)">NC</button>
        <button class="ac-type-btn"        data-actype="TASK"    onclick="setCreateType('TASK',this)">Task</button>
        <button class="ac-type-btn"        data-actype="RED_TAG" onclick="setCreateType('RED_TAG',this)">Red Tag</button>
      </div>
    </div>

    <!-- Zone selector (shared, always shown) -->
    <div class="ac-field">
      <label class="ac-label" for="acZone">Zone <span class="req">*</span></label>
      <select class="ac-select" id="acZone">
        <option value="">— select zone —</option>
      </select>
    </div>

    <!-- NC fields -->
    <div class="ac-group" id="acGrpNC">
      <div class="ac-field">
        <label class="ac-label" for="acNcPillar">Pillar <span class="req">*</span></label>
        <select class="ac-select" id="acNcPillar">
          <option value="S1">S1 Sort</option>
          <option value="S2">S2 Set in Order</option>
          <option value="S3">S3 Shine</option>
          <option value="S4">S4 Standardize</option>
          <option value="S5">S5 Sustain</option>
        </select>
      </div>
      <div class="ac-field">
        <label class="ac-label" for="acNcDesc">Description <span class="req">*</span></label>
        <textarea class="ac-textarea" id="acNcDesc" rows="3" placeholder="Describe the non-conformance…"></textarea>
      </div>
      <div class="ac-field">
        <label class="ac-label" for="acNcPerson">Responsible Person</label>
        <input class="ac-input" id="acNcPerson" type="text" placeholder="Optional">
      </div>
    </div>

    <!-- Task fields -->
    <div class="ac-group" id="acGrpTASK" style="display:none">
      <div class="ac-field">
        <label class="ac-label" for="acTaskTitle">Title <span class="req">*</span></label>
        <input class="ac-input" id="acTaskTitle" type="text" placeholder="Task title">
      </div>
      <div class="ac-field">
        <label class="ac-label" for="acTaskDesc">Description</label>
        <textarea class="ac-textarea" id="acTaskDesc" rows="2" placeholder="Optional description…"></textarea>
      </div>
      <div class="ac-field">
        <label class="ac-label" for="acTaskPriority">Priority</label>
        <select class="ac-select" id="acTaskPriority">
          <option value="LOW">LOW</option>
          <option value="MEDIUM" selected>MEDIUM</option>
          <option value="HIGH">HIGH</option>
        </select>
      </div>
      <div class="ac-field">
        <label class="ac-label" for="acTaskAssigned">Assigned To</label>
        <input class="ac-input" id="acTaskAssigned" type="text" placeholder="Optional">
      </div>
      <div class="ac-field">
        <label class="ac-label" for="acTaskDue">Due Date</label>
        <input class="ac-input" id="acTaskDue" type="date">
      </div>
    </div>

    <!-- Red Tag fields -->
    <div class="ac-group" id="acGrpRED_TAG" style="display:none">
      <div class="ac-field">
        <label class="ac-label" for="acRtItem">Item <span class="req">*</span></label>
        <input class="ac-input" id="acRtItem" type="text" placeholder="Item name">
      </div>
      <div class="ac-field">
        <label class="ac-label" for="acRtQty">Quantity</label>
        <input class="ac-input" id="acRtQty" type="number" min="1" value="1">
      </div>
      <div class="ac-field">
        <label class="ac-label" for="acRtCat">Category</label>
        <select class="ac-select" id="acRtCat">
          <option value="Equipment">Equipment</option>
          <option value="Material">Material</option>
          <option value="Tool">Tool</option>
          <option value="Document">Document</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="ac-field">
        <label class="ac-label" for="acRtReason">Reason</label>
        <textarea class="ac-textarea" id="acRtReason" rows="2" placeholder="Why is this tagged?"></textarea>
      </div>
      <div class="ac-field">
        <label class="ac-label" for="acRtAction">Proposed Action</label>
        <input class="ac-input" id="acRtAction" type="text" placeholder="e.g. Dispose / Return / Repair">
      </div>
    </div>

  </div><!-- /.ac-body -->
  <div class="ac-footer">
    <button class="ac-cancel" onclick="closeCreateModal()">Cancel</button>
    <button class="ac-submit" id="acSubmitBtn" onclick="submitCreate()">Create</button>
  </div>
</div>

<!-- ── RCA Start Modal (NC → IN_PROGRESS gate) ── -->
<div class="rca-backdrop" id="rcaBackdrop" onclick="closeRcaModal()"></div>
<div class="rca-modal" id="rcaModal" role="dialog" aria-modal="true">
  <div class="rca-header">
    <span class="rca-title">Start NC — Root Cause Analysis</span>
    <button class="rca-close" onclick="closeRcaModal()">✕</button>
  </div>
  <div class="rca-body">
    <label class="rca-label">Root Cause <em>(min 50 characters)</em></label>
    <textarea class="rca-textarea" id="rcaRootCause" rows="3" placeholder="Describe the root cause in detail…" oninput="onRcaInput()"></textarea>
    <div class="rca-counter" id="rcaCounter">0 / 50 chars</div>

    <label class="rca-label">Corrective Action <em>(required)</em></label>
    <textarea class="rca-textarea" id="rcaCorrectiveAction" rows="2" placeholder="What corrective action will be taken?"></textarea>

    <button class="rca-submit" id="rcaSubmitBtn" onclick="submitRca()" disabled>Submit &amp; Start</button>
  </div>
</div>

<script>
/* ── helpers ── */
function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── state ── */
var CURRENT_USER = '<?= (typeof params !== "undefined" && params && params.currentUser) ? params.currentUser : "" ?>';
var _filters = { type: '', status: 'OPEN', priority: '', zoneId: '' };
var _lastCounts = { byType:{NC:0,TASK:0,RED_TAG:0}, byStatus:{OPEN:0,IN_PROGRESS:0,CLOSED:0}, byPriority:{}, total:0 };
var _rcaPendingId = null;

/* ── tabs / chips ── */
function setTypeTab(btn) {
  document.querySelectorAll('.ah-type-tab').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  var t = btn.getAttribute('data-type');
  var isAudits = (t === 'AUDITS');
  var st = document.getElementById('ahStatusTabs');
  var fr = document.querySelector('.ah-filter-row');
  if (st) st.style.display = isAudits ? 'none' : '';
  if (fr) fr.style.display = isAudits ? 'none' : '';
  if (isAudits) { renderAuditsView(); return; }
  _filters.type = t === 'ALL' ? '' : t;
  fetchAndRender();
}

/* ── Audits view (per-criterion filled audits with photos) ── */
function renderAuditsView() {
  document.getElementById('ahContent').innerHTML = '<div class="ah-loading">Loading audits…</div>';
  google.script.run
    .withSuccessHandler(function(res) {
      var audits = (res && res.audits) || [];
      if (!audits.length) {
        document.getElementById('ahContent').innerHTML = '<div class="ah-empty">No submitted audits yet.</div>';
        return;
      }
      var html = audits.map(function(a) {
        var pcls = a.pct >= 80 ? 'g' : a.pct >= 60 ? 'a' : 'r';
        var when = a.timestamp ? new Date(a.timestamp).toLocaleString() : '';
        return '<div class="ah-card" onclick="openAuditDetail(\'' + escHtml(a.submissionId) + '\')" style="cursor:pointer">' +
          '<div class="ah-card__body"><div class="ah-card__top">' +
          '<span class="ah-card__title">' + escHtml(a.zoneId) + ' · ' + escHtml(a.zoneName) + '</span>' +
          '<span class="ah-pct ' + pcls + '" style="font-weight:700">' + a.pct + '%</span></div>' +
          '<div class="ah-card__meta">' + escHtml(when) + ' · ' + a.count + ' criteria · ' +
          a.photos + ' photo(s) · ' + escHtml(a.auditor) + '</div></div></div>';
      }).join('');
      document.getElementById('ahContent').innerHTML = html;
    })
    .withFailureHandler(function(e) {
      document.getElementById('ahContent').innerHTML = '<div class="ah-empty">Error: ' + escHtml(e.message) + '</div>';
    })
    .getRecentAudits(50);
}

function openAuditDetail(submissionId) {
  document.getElementById('recordDetailBody').innerHTML = '<div class="ah-loading">Loading…</div>';
  document.getElementById('rdModalTitle').textContent = 'Filled Audit';
  document.getElementById('rdBackdrop').classList.add('open');
  document.getElementById('recordDetailModal').classList.add('open');
  google.script.run
    .withSuccessHandler(function(d) {
      if (!d || !d.found) { document.getElementById('recordDetailBody').innerHTML = '<div class="ah-empty">Not found.</div>'; return; }
      var h = '<div style="margin-bottom:10px;font-size:13px;color:var(--text-muted)">' +
        escHtml(d.header.zoneId) + ' · ' + escHtml(d.header.zoneName) + ' · ' +
        (d.header.timestamp ? new Date(d.header.timestamp).toLocaleString() : '') + ' · ' + escHtml(d.header.auditor) + '</div>';
      h += d.items.map(function(it) {
        var sc = (it.score === null || it.score === undefined) ? '—' : it.score;
        var scls = it.score <= 1 ? 'r' : it.score <= 2 ? 'a' : 'g';
        var photo = it.photoUrl
          ? '<img src="' + escHtml(it.photoUrl) + '" title="Hover to enlarge · click to open"' +
            ' onclick="window.open(\'https://drive.google.com/file/d/' + escHtml(it.photoFileId) + '/view\',\'_blank\')"' +
            ' onmouseover="this.style.transform=\'scale(4)\';this.style.zIndex=\'50\';this.style.position=\'relative\'"' +
            ' onmouseout="this.style.transform=\'\';this.style.zIndex=\'\';this.style.position=\'\'"' +
            ' style="width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--border);cursor:zoom-in;transition:transform .15s ease;transform-origin:right center">'
          : '';
        var titleLine = escHtml(it.criterionId) +
          (it.label ? ' · ' + escHtml(it.label) : '') +
          ' <span style="color:var(--text-muted);font-weight:400">(' + escHtml(it.pillar) + ')</span>';
        return '<div style="display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--border)">' +
          '<span class="ah-pct ' + scls + '" style="min-width:34px;font-weight:700">' + sc + '</span>' +
          '<div style="flex:1"><div style="font-weight:600;font-size:13px">' + titleLine + '</div>' +
          (it.remark ? '<div style="font-size:12px;color:var(--text-muted);margin-top:2px">' + escHtml(it.remark) + '</div>' : '') +
          '</div>' + photo + '</div>';
      }).join('');
      h = '<div id="auShare" style="display:flex;gap:8px;margin-bottom:12px"><span style="font-size:12px;color:var(--text-muted)">Preparing report…</span></div>' + h;
      document.getElementById('recordDetailBody').innerHTML = h;
      auditShareLinks_(submissionId);
    })
    .withFailureHandler(function(e) { document.getElementById('recordDetailBody').innerHTML = '<div class="ah-empty">Error: ' + escHtml(e.message) + '</div>'; })
    .getAuditDetail(submissionId);
}

function auditShareLinks_(submissionId) {
  google.script.run
    .withSuccessHandler(function(r) {
      var el = document.getElementById('auShare');
      if (!el) return;
      if (r && r.success) {
        var h = '';
        if (r.pdfUrl) h += '<a href="' + r.pdfUrl + '" target="_blank" rel="noopener" style="flex:1;text-align:center;padding:9px;border-radius:8px;background:#eef2ff;color:#3730a3;font-weight:600;text-decoration:none;font-size:13px">&#128196; View PDF</a>';
        if (r.waUrl)  h += '<a href="' + r.waUrl + '" target="_blank" rel="noopener" style="flex:1;text-align:center;padding:9px;border-radius:8px;background:#25D366;color:#fff;font-weight:600;text-decoration:none;font-size:13px">&#128241; WhatsApp</a>';
        el.innerHTML = h;
      } else { el.innerHTML = '<span style="font-size:12px;color:var(--text-muted)">Report unavailable</span>'; }
    })
    .withFailureHandler(function() {
      var el = document.getElementById('auShare');
      if (el) el.innerHTML = '<span style="font-size:12px;color:var(--text-muted)">Report unavailable</span>';
    })
    .generateAuditPdf(submissionId);
}

function setStatusTab(btn) {
  document.querySelectorAll('.ah-status-tab').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  _filters.status = btn.getAttribute('data-status');
  fetchAndRender();
}

function setPriChip(btn) {
  document.querySelectorAll('.ah-chip').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  _filters.priority = btn.getAttribute('data-pri');
  fetchAndRender();
}

function setZone(val) {
  _filters.zoneId = val;
  fetchAndRender();
}

/* ── zone dropdown population ── */
function loadZones() {
  google.script.run
    .withSuccessHandler(function(zones) {
      var sel = document.getElementById('ahZoneSelect');
      if (!zones) return;
      zones.forEach(function(z) {
        var opt = document.createElement('option');
        opt.value = z;
        opt.textContent = z;
        sel.appendChild(opt);
      });
    })
    .withFailureHandler(function() {})
    .getAllZoneIds();
}

/* ── fetch ── */
function fetchAndRender() {
  document.getElementById('ahContent').innerHTML = '<div class="ah-loading">Loading…</div>';

  var f = {
    zoneId:   _filters.zoneId   || '',
    type:     _filters.type     || '',
    status:   _filters.status   || '',
    priority: _filters.priority || ''
  };

  google.script.run
    .withSuccessHandler(function(data) {
      if (!data) {
        document.getElementById('ahContent').innerHTML = '<div class="ah-empty">No data returned.</div>';
        return;
      }
      updateBadges(data.counts || {});
      renderCards(data.items || []);
    })
    .withFailureHandler(function(e) {
      document.getElementById('ahContent').innerHTML =
        '<div class="ah-loading" style="color:var(--score-red)">' + escHtml(e.message) + '</div>';
    })
    .getUnifiedActionList(f);
}

/* ── badge updates ── */
function updateBadges(counts) {
  _lastCounts = counts;
  var bt = counts.byType || {};
  var bs = counts.byStatus || {};
  var total = counts.total || 0;

  document.getElementById('cntAll').textContent     = total;
  document.getElementById('cntNC').textContent      = bt.NC      || 0;
  document.getElementById('cntTASK').textContent    = bt.TASK    || 0;
  document.getElementById('cntRED_TAG').textContent = bt.RED_TAG || 0;

  // Status badges reflect the selected type tab (fall back to all-types totals)
  var ss = bs;
  if (_filters.type && counts.byTypeStatus && counts.byTypeStatus[_filters.type]) {
    ss = counts.byTypeStatus[_filters.type];
  }
  document.getElementById('cntOPEN').textContent        = ss.OPEN        || 0;
  document.getElementById('cntIN_PROGRESS').textContent = ss.IN_PROGRESS || 0;
  document.getElementById('cntCLOSED').textContent      = ss.CLOSED      || 0;
}

/* ── render cards ── */
function renderCards(items) {
  if (!items || items.length === 0) {
    document.getElementById('ahContent').innerHTML =
      '<div class="ah-empty">✓ No actions match these filters.</div>';
    return;
  }

  var html = '<div class="ah-table-wrap"><table class="ah-table"><thead><tr>' +
    '<th>Type</th><th>Title</th><th class="hide-sm">Zone</th><th class="hide-sm">Owner</th>' +
    '<th class="hide-sm">Due</th><th class="hide-sm">Age</th><th>Pri</th><th>Status</th><th></th>' +
    '</tr></thead><tbody>';

  items.forEach(function(a) {
    var priClass = escHtml(a.priority || '');
    var openArgs = escHtml(JSON.stringify(a.type)) + ',' + escHtml(JSON.stringify(a.id));
    html += '<tr class="ah-tr ' + priClass + '">';
    html += '<td class="ah-td"><span class="type-badge ' + escHtml(a.type) + '">' + escHtml(typeName(a.type)) + '</span></td>';
    html += '<td class="ah-td title" onclick="openDetail(' + openArgs + ')" title="' + escHtml(a.title) + '">' +
      escHtml(a.title) + (a.isOverdue && a.status !== 'CLOSED' ? '<span class="ovd">&#9888; overdue</span>' : '') + '</td>';
    html += '<td class="ah-td muted hide-sm">' + escHtml(a.zone || '') + '</td>';
    html += '<td class="ah-td muted hide-sm">' + escHtml(a.owner || '—') + '</td>';
    html += '<td class="ah-td muted hide-sm">' + escHtml(a.dueDate || '—') + '</td>';
    html += '<td class="ah-td muted hide-sm">' + (a.ageDays != null ? escHtml(String(a.ageDays)) + 'd' : '—') + '</td>';
    html += '<td class="ah-td">' + (a.priority ? '<span class="pri-badge ' + escHtml(a.priority) + '">' + escHtml(a.priority) + '</span>' : '') + '</td>';
    html += '<td class="ah-td"><span class="status-lbl ' + escHtml(a.status) + '">' + escHtml(statusLabel(a.status)) + '</span></td>';
    html += '<td class="ah-td acts">' + buildActionIcons(a) + '</td>';
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  document.getElementById('ahContent').innerHTML = html;
}

/* compact icon action buttons per type/status (+ edit/delete) */
function buildActionIcons(a) {
  var si = escHtml(JSON.stringify(a.id));
  var aj = escHtml(JSON.stringify(a));
  var h = '';
  var ib = function(cls, icon, title, onclick) {
    return '<button class="ah-ibtn ' + cls + '" title="' + title + '" onclick="event.stopPropagation();' + onclick + '">' + icon + '</button>';
  };
  if (a.status !== 'CLOSED') {
    if (a.type === 'NC') {
      if (a.status === 'OPEN') h += ib('start', '&#9654;', 'Start (RCA)', 'openRcaModal(' + si + ')');
      h += ib('close', '&#10003;', 'Close', 'doNcClose(' + si + ',this)');
    } else if (a.type === 'TASK') {
      var raw = (a.rawStatus || '').toUpperCase();
      if (raw === 'BACKLOG' || raw === 'THIS_WEEK' || raw === 'OPEN' || a.status === 'OPEN')
        h += ib('start', '&#9654;', 'Start', 'doTaskStatus(' + si + ',\'IN_PROGRESS\',this)');
      h += ib('done', '&#10003;', 'Done', 'doTaskStatus(' + si + ',\'DONE\',this)');
    } else if (a.type === 'RED_TAG') {
      var np = nextRedTagPhase((a.rawStatus || a.status || '').toUpperCase());
      if (np) h += ib('phase', '&#10003;', np.label.replace(/<[^>]+>|&#\d+;/g, '').trim() || 'Advance', 'doRedTagPhase(' + si + ',\'' + np.phase + '\',this)');
    }
  }
  h += ib('edit', '&#9998;', 'Edit', 'openEditModal(' + aj + ')');
  h += ib('del', '&#128465;', 'Delete', 'doDelete(' + escHtml(JSON.stringify(a.type)) + ',' + si + ',this)');
  return h;
}

function typeName(t) {
  if (t === 'NC') return 'NC';
  if (t === 'TASK') return 'Task';
  if (t === 'RED_TAG') return 'Red Tag';
  return t;
}

function statusLabel(s) {
  if (s === 'IN_PROGRESS') return 'In Progress';
  if (s === 'OPEN') return 'Open';
  if (s === 'CLOSED') return 'Closed';
  return s;
}

/* ── action buttons per type + status ── */
function buildActionBtns(a) {
  var id = a.id;
  var si = escHtml(JSON.stringify(id));
  var html = '';

  if (a.type === 'NC') {
    if (a.status === 'OPEN') {
      html += '<button class="ah-btn start" onclick="event.stopPropagation();openRcaModal(' + si + ')">&#8594; Start</button>';
      html += '<button class="ah-btn close" onclick="event.stopPropagation();doNcClose(' + si + ',this)">&#10003; Close</button>';
    } else if (a.status === 'IN_PROGRESS') {
      html += '<button class="ah-btn close" onclick="event.stopPropagation();doNcClose(' + si + ',this)">&#10003; Close</button>';
    }
  } else if (a.type === 'TASK') {
    var raw = (a.rawStatus || '').toUpperCase();
    if (raw === 'BACKLOG' || raw === 'THIS_WEEK' || raw === 'OPEN' || a.status === 'OPEN') {
      html += '<button class="ah-btn start" onclick="event.stopPropagation();doTaskStatus(' + si + ',\'IN_PROGRESS\',this)">&#8594; Start</button>';
      html += '<button class="ah-btn done"  onclick="event.stopPropagation();doTaskStatus(' + si + ',\'DONE\',this)">&#10003; Done</button>';
    } else if (a.status === 'IN_PROGRESS') {
      html += '<button class="ah-btn done" onclick="event.stopPropagation();doTaskStatus(' + si + ',\'DONE\',this)">&#10003; Done</button>';
    }
  } else if (a.type === 'RED_TAG') {
    var raw2 = (a.rawStatus || a.status || '').toUpperCase();
    var nextPhase = nextRedTagPhase(raw2);
    if (nextPhase) {
      html += '<button class="ah-btn phase" onclick="event.stopPropagation();doRedTagPhase(' + si + ',\'' + nextPhase.phase + '\',this)">' + nextPhase.label + '</button>';
    }
  }
  /* Edit + Delete available for all types/states */
  var aj = escHtml(JSON.stringify(a));
  html += '<button class="ah-btn edit" onclick="event.stopPropagation();openEditModal(' + aj + ')">&#9998; Edit</button>';
  html += '<button class="ah-btn del" onclick="event.stopPropagation();doDelete(' + escHtml(JSON.stringify(a.type)) + ',' + escHtml(JSON.stringify(a.id)) + ',this)">&#128465; Delete</button>';
  return html;
}

/* ── Edit modal ── */
function openEditModal(a) {
  var b = document.getElementById('editBody');
  var rows = '';
  function field(label, id, val, type) {
    return '<label style="display:block;font-size:12px;color:var(--text-muted);margin:8px 0 2px">' + label + '</label>' +
      (type === 'textarea'
        ? '<textarea id="' + id + '" rows="2" style="width:100%;padding:6px;border:1px solid var(--border);border-radius:6px">' + escHtml(val || '') + '</textarea>'
        : '<input id="' + id + '" type="' + (type || 'text') + '" value="' + escHtml(val || '') + '" style="width:100%;padding:6px;border:1px solid var(--border);border-radius:6px">');
  }
  if (a.type === 'NC') {
    rows += field('Description', 'edDesc', a.title, 'textarea');
    rows += field('Responsible', 'edOwner', a.owner);
    rows += field('Target date (YYYY-MM-DD)', 'edDue', a.dueDate);
  } else if (a.type === 'TASK') {
    rows += field('Title', 'edTitle', a.title);
    rows += field('Description', 'edDesc', a.description, 'textarea');
    rows += field('Assigned to', 'edOwner', a.owner);
    rows += field('Due date (YYYY-MM-DD)', 'edDue', a.dueDate);
    rows += field('Priority (urgent/high/medium/low)', 'edPri', a.priority);
  } else {
    rows += field('Item description', 'edDesc', a.title, 'textarea');
    rows += field('Owner', 'edOwner', a.owner);
    rows += field('Deadline (YYYY-MM-DD)', 'edDue', a.dueDate);
  }
  b.innerHTML = rows;
  b.setAttribute('data-type', a.type);
  b.setAttribute('data-id', a.id);
  document.getElementById('edModalTitle').textContent = 'Edit ' + typeName(a.type);
  document.getElementById('editBackdrop').classList.add('open');
  document.getElementById('editModal').classList.add('open');
}
function closeEditModal() {
  document.getElementById('editModal').classList.remove('open');
  document.getElementById('editBackdrop').classList.remove('open');
}
function submitEdit() {
  var b = document.getElementById('editBody');
  var type = b.getAttribute('data-type'), id = b.getAttribute('data-id');
  function v(x) { var el = document.getElementById(x); return el ? el.value : undefined; }
  var fn, updates;
  if (type === 'NC') {
    fn = 'editCAPA'; updates = { description: v('edDesc'), responsible: v('edOwner'), targetDate: v('edDue') };
  } else if (type === 'TASK') {
    fn = 'editTask'; updates = { title: v('edTitle'), description: v('edDesc'), assignedTo: v('edOwner'), dueDate: v('edDue'), priority: v('edPri') };
  } else {
    fn = 'editRedTag'; updates = { itemDescription: v('edDesc'), owner: v('edOwner'), deadline: v('edDue') };
  }
  google.script.run
    .withSuccessHandler(function(r) { closeEditModal(); fetchAndRender(); })
    .withFailureHandler(function(e) { alert('Edit failed: ' + e.message); })
    [fn](id, updates);
}
function doDelete(type, id, btn) {
  if (!confirm('Delete this ' + typeName(type) + '? (soft-delete — recoverable)')) return;
  if (btn) { btn.disabled = true; btn.textContent = '…'; }
  var fn = type === 'NC' ? 'deleteCAPA' : type === 'TASK' ? 'deleteTask' : 'deleteRedTag';
  google.script.run
    .withSuccessHandler(function(r) { fetchAndRender(); })
    .withFailureHandler(function(e) { alert('Delete failed: ' + e.message); if (btn) { btn.disabled = false; btn.textContent = '🗑 Delete'; } })
    [fn](id);
}

function nextRedTagPhase(raw) {
  if (raw === 'IDENTIFIED') return { phase: 'EVALUATED', label: '&#10003; Evaluate' };
  if (raw === 'EVALUATED')  return { phase: 'DISPOSED',  label: '&#10003; Dispose'  };
  if (raw === 'DISPOSED')   return { phase: 'CLOSED',    label: '&#10003; Close'    };
  return null;
}

/* ── open detail ── */
function openDetail(type, id) {
  if (type === 'NC') {
    openNcDetail(id);
  } else {
    openInlineDetail(type, id);
  }
}

/* ── NC detail modal ── */
function openNcDetail(id) {
  var modal    = document.getElementById('recordDetailModal');
  var backdrop = document.getElementById('rdBackdrop');
  var body     = document.getElementById('recordDetailBody');
  body.innerHTML = '<div class="ah-loading" style="padding:30px 0">Loading…</div>';
  modal.classList.add('open');
  backdrop.classList.add('open');
  google.script.run
    .withSuccessHandler(renderNcDetail)
    .withFailureHandler(function(e) {
      document.getElementById('recordDetailBody').innerHTML =
        '<div class="ah-loading" style="color:var(--score-red)">' + escHtml(e.message) + '</div>';
    })
    .getNcDetail(id);
}

function closeNcDetail() {
  document.getElementById('recordDetailModal').classList.remove('open');
  document.getElementById('rdBackdrop').classList.remove('open');
}

function renderNcDetail(d) {
  var body = document.getElementById('recordDetailBody');
  if (!d) { body.innerHTML = '<div class="ah-loading">Record not found.</div>'; return; }
  function row(label, val) {
    var display = (val !== null && val !== undefined && val !== '')
      ? escHtml(String(val))
      : '<span class="rd-dd empty">—</span>';
    return '<dt class="rd-dt">' + label + '</dt><dd class="rd-dd">' + display + '</dd>';
  }
  var html = '<dl class="rd-dl">';
  html += row('ID',                d.id);
  html += row('Zone',              d.zoneName || d.zoneId);
  html += row('Pillar',            d.pillar);
  html += row('Status',            d.status);
  html += row('Responsible',       d.responsible);
  html += row('Target Date',       d.targetDate);
  html += '<hr class="rd-divider">';
  html += row('Description',       d.description);
  html += row('Score Given',       d.scoreGiven);
  html += '<hr class="rd-divider">';
  html += row('Root Cause',        d.rootCause);
  html += row('Corrective Action', d.correctiveAction);
  html += row('Preventive Action', d.preventiveAction);
  html += '<hr class="rd-divider">';
  html += row('Auditor',           d.auditor);
  html += row('Audit Date',        d.auditDate);
  html += row('Created Date',      d.createdDate);
  html += row('Closure Date',      d.closureDate);
  html += row('Verified By',       d.verifiedBy);
  html += row('Verification',      d.verificationRemarks);
  html += '<hr class="rd-divider">';
  html += row('Repeat?',           d.isRepeat ? 'Yes' : 'No');
  html += row('Recurrence Count',  d.recurrenceCount);
  html += '</dl>';
  body.innerHTML = html;
}

/* ── Inline detail (TASK / RED_TAG) ── */
function openInlineDetail(type, id) {
  /* find item from current DOM data via re-fetch is too heavy;
     instead we stored items in _lastItems */
  var item = null;
  if (window._lastItems) {
    for (var i = 0; i < window._lastItems.length; i++) {
      if (_lastItems[i].id === id) { item = _lastItems[i]; break; }
    }
  }
  var title = type === 'TASK' ? 'Task Detail' : 'Red Tag Detail';
  document.getElementById('idModalTitle').textContent = title;
  var body = document.getElementById('inlineDetailBody');
  if (!item) { body.innerHTML = '<div class="ah-loading">Detail not available.</div>'; }
  else {
    function row2(label, val) {
      var display = (val !== null && val !== undefined && val !== '')
        ? escHtml(String(val))
        : '<span class="rd-dd empty">—</span>';
      return '<dt class="rd-dt">' + label + '</dt><dd class="rd-dd">' + display + '</dd>';
    }
    var h = '<dl class="rd-dl">';
    h += row2('ID',          item.id);
    h += row2('Type',        typeName(item.type));
    h += row2('Status',      statusLabel(item.status));
    h += row2('Raw Status',  item.rawStatus);
    h += row2('Priority',    item.priority);
    h += row2('Zone',        item.zone);
    h += row2('Owner',       item.owner);
    h += row2('Due Date',    item.dueDate);
    h += row2('Created',     item.createdDate);
    h += row2('Age (days)',  item.ageDays);
    h += '<hr class="rd-divider">';
    h += row2('Title',       item.title);
    h += row2('Description', item.description);
    h += '</dl>';
    body.innerHTML = h;
  }
  document.getElementById('inlineDetailModal').classList.add('open');
  document.getElementById('idBackdrop').classList.add('open');
}

function closeInlineDetail() {
  document.getElementById('inlineDetailModal').classList.remove('open');
  document.getElementById('idBackdrop').classList.remove('open');
}

/* ── RCA modal for NC start ── */
function openRcaModal(ncId) {
  _rcaPendingId = ncId;
  document.getElementById('rcaRootCause').value = '';
  document.getElementById('rcaCorrectiveAction').value = '';
  document.getElementById('rcaCounter').textContent = '0 / 50 chars';
  document.getElementById('rcaCounter').className = 'rca-counter';
  document.getElementById('rcaSubmitBtn').disabled = true;
  document.getElementById('rcaModal').classList.add('open');
  document.getElementById('rcaBackdrop').classList.add('open');
  document.getElementById('rcaRootCause').focus();
}

function closeRcaModal() {
  document.getElementById('rcaModal').classList.remove('open');
  document.getElementById('rcaBackdrop').classList.remove('open');
  _rcaPendingId = null;
}

function onRcaInput() {
  var len = document.getElementById('rcaRootCause').value.length;
  var counter = document.getElementById('rcaCounter');
  counter.textContent = len + ' / 50 chars';
  counter.className = 'rca-counter' + (len >= 50 ? ' ok' : '');
  document.getElementById('rcaSubmitBtn').disabled = (len < 50);
}

function submitRca() {
  if (!_rcaPendingId) return;
  var rootCause        = document.getElementById('rcaRootCause').value.trim();
  var correctiveAction = document.getElementById('rcaCorrectiveAction').value.trim();
  if (rootCause.length < 50) {
    showToast('Root cause must be at least 50 characters.', 'error'); return;
  }
  if (!correctiveAction) {
    showToast('Corrective action is required.', 'error'); return;
  }
  var btn = document.getElementById('rcaSubmitBtn');
  btn.disabled = true;
  btn.textContent = '…';

  var id = _rcaPendingId;
  google.script.run
    .withSuccessHandler(function(result) {
      btn.disabled = false;
      btn.textContent = 'Submit & Start';
      if (result && result.success) {
        showToast('NC started.', 'success');
        closeRcaModal();
        fetchAndRender();
      } else {
        showToast((result && result.message) || 'Failed to start NC.', 'error');
      }
    })
    .withFailureHandler(function(e) {
      btn.disabled = false;
      btn.textContent = 'Submit & Start';
      showToast('Error: ' + e.message, 'error');
    })
    .updateCAPAStatus(id, 'IN_PROGRESS', '', '', { root_cause: rootCause, corrective_action: correctiveAction });
}

/* ── NC close ── */
function doNcClose(id, btn) {
  var remarks = '';
  disableBtn(btn, '…');
  google.script.run
    .withSuccessHandler(function(result) {
      enableBtn(btn, '✓ Close');
      if (result && result.success) {
        showToast('NC closed.', 'success');
        fetchAndRender();
      } else {
        showToast((result && result.message) || 'Failed to close NC.', 'error');
      }
    })
    .withFailureHandler(function(e) {
      enableBtn(btn, '✓ Close');
      showToast('Error: ' + e.message, 'error');
    })
    .updateCAPAStatus(id, 'CLOSED', '', remarks);
}

/* ── TASK status ── */
function doTaskStatus(id, newStatus, btn) {
  var origText = btn.textContent;
  disableBtn(btn, '…');
  google.script.run
    .withSuccessHandler(function(result) {
      enableBtn(btn, origText);
      if (result && result.success) {
        showToast('Task updated.', 'success');
        fetchAndRender();
      } else {
        showToast((result && result.message) || 'Failed to update task.', 'error');
      }
    })
    .withFailureHandler(function(e) {
      enableBtn(btn, origText);
      showToast('Error: ' + e.message, 'error');
    })
    .updateTaskStatus(id, newStatus, '');
}

/* ── RED TAG phase ── */
function doRedTagPhase(id, toPhase, btn) {
  var origText = btn.innerHTML;
  disableBtn(btn, '…');
  google.script.run
    .withSuccessHandler(function(result) {
      btn.innerHTML = origText;
      enableBtn(btn, origText);
      if (result && result.success) {
        showToast('Red Tag advanced.', 'success');
        fetchAndRender();
      } else {
        showToast((result && result.message) || 'Failed to advance Red Tag.', 'error');
      }
    })
    .withFailureHandler(function(e) {
      btn.innerHTML = origText;
      enableBtn(btn, origText);
      showToast('Error: ' + e.message, 'error');
    })
    .advanceRedTagPhase(id, toPhase, '');
}

/* ── btn helpers ── */
function disableBtn(btn, text) {
  btn.disabled = true;
  btn.textContent = text;
}
function enableBtn(btn, text) {
  btn.disabled = false;
  btn.innerHTML = text;
}

/* ── toast ── */
function showToast(msg, type) {
  if (typeof pmToast === 'function') {
    pmToast(msg, type || 'info');
  } else {
    alert(msg);
  }
}

/* ── CREATE MODAL ── */
var _acType = 'NC';
var _acZonesLoaded = false;

function openCreateModal() {
  _acType = 'NC';
  // reset type buttons
  document.querySelectorAll('.ac-type-btn').forEach(function(b) {
    b.classList.toggle('active', b.getAttribute('data-actype') === 'NC');
  });
  _showCreateGroup('NC');
  // reset fields
  document.getElementById('acZone').value = '';
  document.getElementById('acNcPillar').value = 'S1';
  document.getElementById('acNcDesc').value = '';
  document.getElementById('acNcPerson').value = '';
  document.getElementById('acTaskTitle').value = '';
  document.getElementById('acTaskDesc').value = '';
  document.getElementById('acTaskPriority').value = 'MEDIUM';
  document.getElementById('acTaskAssigned').value = '';
  document.getElementById('acTaskDue').value = '';
  document.getElementById('acRtItem').value = '';
  document.getElementById('acRtQty').value = '1';
  document.getElementById('acRtCat').value = 'Equipment';
  document.getElementById('acRtReason').value = '';
  document.getElementById('acRtAction').value = '';
  // populate zone select from existing filter dropdown (reuse loadZones data)
  if (!_acZonesLoaded) {
    var src = document.getElementById('ahZoneSelect');
    var dst = document.getElementById('acZone');
    // clear all but first placeholder
    while (dst.options.length > 1) { dst.remove(1); }
    for (var i = 1; i < src.options.length; i++) {
      var o = document.createElement('option');
      o.value = src.options[i].value;
      o.textContent = src.options[i].textContent;
      dst.appendChild(o);
    }
    if (src.options.length > 1) { _acZonesLoaded = true; }
  }
  var btn = document.getElementById('acSubmitBtn');
  btn.disabled = false;
  btn.textContent = 'Create';
  document.getElementById('acCreateModal').classList.add('open');
  document.getElementById('acBackdrop').classList.add('open');
}

function closeCreateModal() {
  document.getElementById('acCreateModal').classList.remove('open');
  document.getElementById('acBackdrop').classList.remove('open');
}

function setCreateType(type, btn) {
  _acType = type;
  document.querySelectorAll('.ac-type-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  _showCreateGroup(type);
}

function _showCreateGroup(type) {
  ['NC','TASK','RED_TAG'].forEach(function(t) {
    var el = document.getElementById('acGrp' + t);
    if (el) { el.style.display = (t === type) ? '' : 'none'; }
  });
}

var _pillarSqcdp = { S1:'S', S2:'Q', S3:'C', S4:'D', S5:'P' };

function submitCreate() {
  var zone = document.getElementById('acZone').value.trim();
  if (!zone) { showToast('Please select a zone.', 'error'); return; }

  var btn = document.getElementById('acSubmitBtn');

  if (_acType === 'NC') {
    var desc = document.getElementById('acNcDesc').value.trim();
    if (!desc) { showToast('Description is required for NC.', 'error'); return; }
    var pillar = document.getElementById('acNcPillar').value;
    var sqcdp  = _pillarSqcdp[pillar] || 'S';
    var person = document.getElementById('acNcPerson').value.trim();
    btn.disabled = true; btn.textContent = 'Creating…';
    google.script.run
      .withSuccessHandler(function(ncId) {
        btn.disabled = false; btn.textContent = 'Create';
        if (ncId) {
          showToast('NC created: ' + escHtml(String(ncId)), 'success');
          closeCreateModal();
          fetchAndRender();
        } else {
          showToast('Server returned no NC ID. Please retry.', 'error');
        }
      })
      .withFailureHandler(function(e) {
        btn.disabled = false; btn.textContent = 'Create';
        showToast('Error: ' + escHtml(e.message), 'error');
      })
      .createCAPA(zone, desc, 'NC', pillar, sqcdp, person, CURRENT_USER);

  } else if (_acType === 'TASK') {
    var title = document.getElementById('acTaskTitle').value.trim();
    if (!title) { showToast('Title is required for Task.', 'error'); return; }
    btn.disabled = true; btn.textContent = 'Creating…';
    google.script.run
      .withSuccessHandler(function(result) {
        btn.disabled = false; btn.textContent = 'Create';
        if (result && result.success) {
          showToast('Task created: ' + escHtml(String(result.taskId || '')), 'success');
          closeCreateModal();
          fetchAndRender();
        } else {
          showToast((result && result.message) || 'Failed to create task.', 'error');
        }
      })
      .withFailureHandler(function(e) {
        btn.disabled = false; btn.textContent = 'Create';
        showToast('Error: ' + escHtml(e.message), 'error');
      })
      .createTask({
        title:       title,
        zoneId:      zone,
        description: document.getElementById('acTaskDesc').value.trim(),
        priority:    document.getElementById('acTaskPriority').value,
        assignedTo:  document.getElementById('acTaskAssigned').value.trim(),
        dueDate:     document.getElementById('acTaskDue').value,
        source:      'MANUAL',
        createdBy:   CURRENT_USER
      });

  } else if (_acType === 'RED_TAG') {
    var item = document.getElementById('acRtItem').value.trim();
    if (!item) { showToast('Item is required for Red Tag.', 'error'); return; }
    btn.disabled = true; btn.textContent = 'Creating…';
    google.script.run
      .withSuccessHandler(function(result) {
        btn.disabled = false; btn.textContent = 'Create';
        if (result && (result.ok || result.success)) {
          showToast('Red Tag raised: ' + escHtml(String(result.tagNo || '')), 'success');
          closeCreateModal();
          fetchAndRender();
        } else {
          showToast((result && result.message) || 'Failed to raise Red Tag.', 'error');
        }
      })
      .withFailureHandler(function(e) {
        btn.disabled = false; btn.textContent = 'Create';
        showToast('Error: ' + escHtml(e.message), 'error');
      })
      .raiseRedTag({
        zone:     zone,
        item:     item,
        quantity: parseInt(document.getElementById('acRtQty').value, 10) || 1,
        category: document.getElementById('acRtCat').value,
        reason:   document.getElementById('acRtReason').value.trim(),
        action:   document.getElementById('acRtAction').value.trim(),
        taggedBy: CURRENT_USER,
        createdBy: CURRENT_USER
      });
  }
}

/* also invalidate zone cache when loadZones refreshes */
var _origLoadZones = loadZones;
loadZones = function() {
  _acZonesLoaded = false;
  _origLoadZones();
};

/* ── patch renderCards to store items for inline detail ── */
var _origRenderCards = renderCards;
renderCards = function(items) {
  window._lastItems = items;
  _origRenderCards(items);
};

/* ── init ── */
loadZones();
fetchAndRender();
</script>
