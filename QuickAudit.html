<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Quick Audit — PackMasters 5S</title>
<?!= include("CommonStyles") ?>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:     oklch(96% 0.014 82);
  --card:   oklch(99% 0.005 78);
  --line:   oklch(90% 0.010 75);
  --line2:  oklch(84% 0.012 72);
  --ink:    oklch(18% 0.016 58);
  --ink-2:  oklch(38% 0.014 58);
  --ink-3:  oklch(56% 0.010 58);
  --ink-4:  oklch(72% 0.008 62);
  --p1:     oklch(46% 0.20 25);   --p1-bg: oklch(95% 0.040 25);
  --p2:     oklch(44% 0.20 250);  --p2-bg: oklch(94% 0.035 250);
  --p3:     oklch(40% 0.20 162);  --p3-bg: oklch(94% 0.040 162);
  --p4:     oklch(50% 0.22 58);   --p4-bg: oklch(96% 0.040 58);
  --p5:     oklch(44% 0.22 300);  --p5-bg: oklch(94% 0.036 300);
  --cam-bg: oklch(94% 0.030 230); --cam:   oklch(42% 0.18 230);
  --rem-bg: oklch(96% 0.040 58);  --rem:   oklch(50% 0.22 58);
  --ncr-bg: oklch(95% 0.040 25);  --ncr:   oklch(46% 0.20 25);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', var(--font-main, system-ui), sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  padding-bottom: 80px;
}

/* ── Progress ── */
.qa-prog {
  position: fixed; top: 0; left: 0; right: 0;
  height: 3px; background: var(--line); z-index: 200;
}
.qa-prog-fill {
  height: 100%; width: 0%;
  background: var(--p4);
  transition: width .35s ease-out;
}

/* ── Header ── */
.qa-hdr {
  position: sticky; top: 3px; z-index: 100;
  background: var(--card);
  border-bottom: 1px solid var(--line);
  padding: 11px 16px 10px;
  display: flex; justify-content: space-between; align-items: center;
}
.qa-hdr h1 {
  font-size: 14px; font-weight: 600; color: var(--ink); letter-spacing: .1px;
}
.qa-hdr-info {
  font-family: 'DM Mono', monospace;
  font-size: 10px; color: var(--ink-3); margin-top: 2px;
}
.qa-timer {
  font-family: 'DM Mono', monospace;
  font-size: 12px; font-weight: 500; color: var(--ink-2);
  background: var(--bg); padding: 3px 10px; border-radius: 20px;
}

/* ── Content ── */
.qa-wrap {
  max-width: 560px; margin: 0 auto;
  padding: 10px 10px 0;
  display: flex; flex-direction: column; gap: 6px;
}

/* ── Already done banner ── */
.qa-banner {
  background: var(--p4-bg); border: 1px solid var(--p4);
  border-radius: 9px; padding: 9px 13px;
  font-size: 12px; color: var(--p4);
}

/* ── Card ── */
.qa-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: visible;
  position: relative;
  transition: border-color .2s, opacity .25s;
}
.qa-card.scored { opacity: .55; pointer-events: none; }
.qa-card.active { border-color: var(--p4); }

/* Pillar accent strip */
.qa-accent { height: 3px; border-radius: 10px 10px 0 0; }
.qa-accent.S1,.qa-accent.E1 { background: var(--p1); }
.qa-accent.S2,.qa-accent.E2 { background: var(--p2); }
.qa-accent.S3,.qa-accent.E3 { background: var(--p3); }
.qa-accent.S4,.qa-accent.E4 { background: var(--p4); }
.qa-accent.S5,.qa-accent.S6 { background: var(--p5); }

/* ── Scored (collapsed) row ── */
.qa-scored-row {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 12px;
}
.qa-s-pill {
  font-family: 'DM Mono', monospace;
  font-size: 9px; font-weight: 500; letter-spacing: .6px;
  padding: 2px 7px; border-radius: 20px; flex-shrink: 0;
}
.qa-s-pill.S1,.qa-s-pill.E1 { background: var(--p1-bg); color: var(--p1); }
.qa-s-pill.S2,.qa-s-pill.E2 { background: var(--p2-bg); color: var(--p2); }
.qa-s-pill.S3,.qa-s-pill.E3 { background: var(--p3-bg); color: var(--p3); }
.qa-s-pill.S4,.qa-s-pill.E4 { background: var(--p4-bg); color: var(--p4); }
.qa-s-pill.S5,.qa-s-pill.S6 { background: var(--p5-bg); color: var(--p5); }
.qa-s-label {
  font-size: 12px; color: var(--ink-3);
  flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.qa-s-dot {
  width: 22px; height: 22px; border-radius: 50%;
  font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 500;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.qa-s-dot.sc0 { background: oklch(91% 0.08 25);  color: oklch(32% 0.16 25); }
.qa-s-dot.sc1 { background: oklch(92% 0.07 45);  color: oklch(36% 0.14 45); }
.qa-s-dot.sc2 { background: oklch(94% 0.06 75);  color: oklch(40% 0.14 75); }
.qa-s-dot.sc3 { background: oklch(92% 0.08 130); color: oklch(34% 0.14 130); }
.qa-s-dot.sc4 { background: oklch(91% 0.08 145); color: oklch(28% 0.14 145); }

/* ── Card body ── */
.qa-body { padding: 10px 12px 0; }

/* Row 1: name + info btn */
.qa-name-row {
  display: flex; align-items: flex-start; gap: 5px;
  margin-bottom: 4px; position: relative;
}
.qa-name {
  font-size: 13px; font-weight: 600; color: var(--ink);
  line-height: 1.4; flex: 1;
}
.qa-info-btn {
  width: 18px; height: 18px; border-radius: 50%;
  border: 1px solid var(--line2); background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--ink-4); font-size: 11px;
  flex-shrink: 0; margin-top: 2px;
  transition: all .15s; position: relative; z-index: 20;
  font-style: italic; font-family: Georgia, serif; font-weight: 700;
  line-height: 1; -webkit-tap-highlight-color: transparent;
}
.qa-info-btn:active, .qa-info-btn.open {
  background: oklch(91% 0.06 230);
  border-color: oklch(72% 0.12 230);
  color: oklch(38% 0.18 230);
}

/* ── Tooltip ── */
.qa-tooltip {
  display: none; position: absolute;
  top: calc(100% + 6px); right: 0;
  width: 224px;
  background: oklch(16% 0.014 55);
  border-radius: 9px; padding: 10px 11px;
  z-index: 500;
  box-shadow: 0 6px 24px oklch(18% 0.016 58 / .26);
}
.qa-tooltip::before {
  content: ''; position: absolute; top: -4px; right: 8px;
  width: 8px; height: 8px;
  background: oklch(16% 0.014 55);
  transform: rotate(45deg); border-radius: 1px;
}
.qa-tooltip.show { display: block; }
.qa-tt-row { display: flex; gap: 7px; align-items: flex-start; margin-bottom: 6px; }
.qa-tt-row:last-child { margin-bottom: 0; }
.qa-tt-ic {
  width: 20px; height: 20px; border-radius: 5px;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; flex-shrink: 0; margin-top: 1px;
}
.qa-tt-ic.ta { background: oklch(30% 0.14 25);  color: oklch(78% 0.10 25); }
.qa-tt-ic.go { background: oklch(28% 0.12 145); color: oklch(76% 0.10 145); }
.qa-tt-ic.ou { background: oklch(28% 0.12 280); color: oklch(76% 0.10 280); }
.qa-tt-lbl {
  font-size: 8px; font-weight: 600; letter-spacing: .8px;
  text-transform: uppercase; color: oklch(50% 0.006 60); margin-bottom: 1px;
}
.qa-tt-txt { font-size: 11px; color: oklch(86% 0.006 75); line-height: 1.4; }

/* Row 2: bilingual */
.qa-bi {
  margin-bottom: 8px;
}
.qa-en { font-size: 11px; color: var(--ink-2); line-height: 1.5; }
.qa-hi { font-size: 10px; color: var(--ink-4); margin-top: 2px; font-style: italic; line-height: 1.5; }

/* Row 3: controls */
.qa-controls {
  display: flex; align-items: stretch; gap: 0;
  padding-bottom: 9px;
}
.qa-scores { display: flex; gap: 3px; flex: 1; }
.qa-sbtn {
  flex: 1; height: 36px;
  border: 1px solid var(--line); border-radius: 7px;
  background: var(--bg);
  font-family: 'DM Mono', monospace; font-size: 14px; font-weight: 500;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--ink-4);
  transition: all .1s; -webkit-tap-highlight-color: transparent;
}
.qa-sbtn:active { transform: scale(.88); }
.qa-sbtn.selected.s0 { background: oklch(91% 0.08 25);  border-color: oklch(76% 0.14 25);  color: oklch(32% 0.16 25); }
.qa-sbtn.selected.s1 { background: oklch(92% 0.07 45);  border-color: oklch(76% 0.12 45);  color: oklch(36% 0.14 45); }
.qa-sbtn.selected.s2 { background: oklch(94% 0.06 75);  border-color: oklch(78% 0.12 75);  color: oklch(40% 0.14 75); }
.qa-sbtn.selected.s3 { background: oklch(92% 0.08 130); border-color: oklch(76% 0.14 130); color: oklch(34% 0.14 130); }
.qa-sbtn.selected.s4 { background: oklch(91% 0.08 145); border-color: oklch(74% 0.14 145); color: oklch(28% 0.14 145); }
.qa-vsep { width: 1px; background: var(--line); margin: 0 5px; flex-shrink: 0; }
.qa-acts { display: flex; gap: 3px; }
.qa-ac {
  width: 30px; height: 36px;
  border: 1px solid var(--line); border-radius: 7px;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--ink-4); font-size: 14px;
  transition: all .15s; -webkit-tap-highlight-color: transparent;
}
.qa-ac:active { transform: scale(.9); }
.qa-ac.on-cam { background: var(--cam-bg); border-color: oklch(78% 0.10 230); color: var(--cam); }
.qa-ac.on-rem { background: var(--rem-bg); border-color: oklch(82% 0.12 58);  color: var(--rem); }
.qa-ac.on-ncr { background: var(--ncr-bg); border-color: oklch(80% 0.12 25);  color: var(--ncr); }

/* ── Remark ── */
.qa-remark-row { display: none; margin-bottom: 8px; }
.qa-remark-toggle {
  font-size: 11px; font-weight: 600; color: var(--p4);
  background: none; border: none; cursor: pointer; padding: 0;
}
.qa-remark-input {
  display: none; width: 100%; margin-top: 5px;
  padding: 8px 10px;
  border: 1px solid var(--line); border-radius: 7px;
  background: var(--bg); color: var(--ink);
  font-family: inherit; font-size: 12px;
  resize: vertical; min-height: 52px;
}
.qa-remark-input:focus { outline: none; border-color: var(--p4); background: var(--card); }

/* ── WDGLL ── */
.qa-wdgll-toggle {
  font-size: 11px; font-weight: 600; color: var(--p2);
  background: none; border: none; cursor: pointer; padding: 0;
  display: block; margin-bottom: 6px;
}
.qa-wdgll-box { display: none; border-radius: 8px; overflow: hidden; margin-bottom: 8px; }
.qa-wdgll-box.show { display: block; }
.qa-wdgll-box img { width: 100%; max-height: 160px; object-fit: cover; display: block; }
.qa-wdgll-label { font-size: 10px; color: var(--ink-3); padding: 4px 8px; background: var(--bg); }

/* ── SQCDP ── */
.qa-sqcdp {
  display: flex; gap: 4px;
  padding: 6px 12px 9px;
  border-top: 1px solid var(--line);
}
.qa-sq { display: flex; flex-direction: column; align-items: center; gap: 1px; flex: 1; }
.qa-sq-ic {
  width: 22px; height: 22px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px;
}
.qa-sq-l { font-size: 8px; font-weight: 600; letter-spacing: .3px; }
.qa-sq.off .qa-sq-ic { background: oklch(93% 0.006 70); color: var(--line2); }
.qa-sq.off .qa-sq-l  { color: oklch(80% 0.008 68); }
.qa-sq.sq-s .qa-sq-ic { background: oklch(93% 0.04 25);  color: oklch(44% 0.18 25); }
.qa-sq.sq-s .qa-sq-l  { color: oklch(44% 0.18 25); }
.qa-sq.sq-q .qa-sq-ic { background: oklch(93% 0.04 290); color: oklch(40% 0.18 290); }
.qa-sq.sq-q .qa-sq-l  { color: oklch(40% 0.18 290); }
.qa-sq.sq-c .qa-sq-ic { background: oklch(95% 0.05 72);  color: oklch(46% 0.18 72); }
.qa-sq.sq-c .qa-sq-l  { color: oklch(46% 0.18 72); }
.qa-sq.sq-d .qa-sq-ic { background: oklch(92% 0.05 158); color: oklch(36% 0.18 158); }
.qa-sq.sq-d .qa-sq-l  { color: oklch(36% 0.18 158); }
.qa-sq.sq-p .qa-sq-ic { background: oklch(93% 0.04 310); color: oklch(40% 0.18 310); }
.qa-sq.sq-p .qa-sq-l  { color: oklch(40% 0.18 310); }

/* ── Photo section ── */
.qa-photo-card {
  background: var(--card); border: 1px solid var(--line);
  border-radius: 10px; padding: 12px;
}
.qa-photo-lbl {
  font-size: 10px; font-weight: 600; letter-spacing: .8px;
  text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px;
}
.qa-photo-btn {
  width: 100%; min-height: 56px;
  border: 1.5px dashed var(--line2); border-radius: 8px;
  background: var(--bg); color: var(--ink-3);
  font-size: 13px; font-weight: 500; font-family: inherit;
  display: flex; align-items: center; justify-content: center;
  gap: 7px; cursor: pointer;
  transition: border-color .15s, background .15s;
  -webkit-tap-highlight-color: transparent;
}
.qa-photo-btn:active { background: var(--line); border-color: var(--p4); }
.qa-photo-preview { display: none; margin-top: 8px; }
.qa-photo-preview img { width: 100%; border-radius: 7px; border: 1px solid var(--line); display: block; }
.qa-photo-ok { font-size: 11px; color: var(--p3); font-weight: 600; margin-top: 4px; }
.qa-photo-hint { font-size: 10px; color: var(--ink-4); margin-top: 5px; }
.mobile-only { display: none; }
@media (max-width: 768px) { .mobile-only { display: inline; color: var(--ncr); } }

/* ── Footer ── */
.qa-foot {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  background: var(--card); border-top: 1px solid var(--line);
  padding: 10px 16px 14px;
  box-shadow: 0 -2px 12px oklch(18% 0.016 58 / .05);
}
.qa-foot-inner {
  max-width: 560px; margin: 0 auto;
  display: flex; align-items: center; gap: 12px;
}
.qa-score-ct {
  font-family: 'DM Mono', monospace;
  font-size: 11px; color: var(--ink-3); flex-shrink: 0;
}
.qa-submit {
  flex: 1; height: 44px;
  background: var(--ink); color: oklch(97% 0.010 78);
  border: none; border-radius: 9px;
  font-family: 'DM Sans', inherit; font-size: 14px; font-weight: 600;
  cursor: pointer; letter-spacing: .2px;
  transition: opacity .15s, transform .12s;
  -webkit-tap-highlight-color: transparent;
}
.qa-submit:active:not(:disabled) { transform: scale(.97); }
.qa-submit:disabled {
  background: var(--line); color: var(--ink-4); cursor: not-allowed;
}

/* ── Zone picker ── */
.qa-pick-title {
  font-size: 16px; font-weight: 600; color: var(--ink);
  text-align: center; margin: 20px 0 12px;
}
.qa-pick-btn {
  display: flex; align-items: center; gap: 12px;
  width: 100%; background: var(--card);
  border: 1px solid var(--line); border-radius: 10px;
  padding: 13px 14px; margin-bottom: 7px; cursor: pointer;
  text-align: left; font-family: inherit;
  transition: border-color .15s, box-shadow .15s;
  -webkit-tap-highlight-color: transparent;
}
.qa-pick-btn:active { transform: scale(.98); }
.qa-pick-btn:hover { border-color: var(--p4); box-shadow: 0 2px 10px oklch(18% 0.016 58 / .06); }
.qa-zpb-id { font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500; letter-spacing: 1.5px; color: var(--p4); }
.qa-zpb-name { font-size: 14px; font-weight: 600; color: var(--ink); margin-top: 1px; }
.qa-zpb-leader { font-size: 11px; color: var(--ink-3); margin-top: 1px; }

/* ── Success ── */
.qa-success { text-align: center; padding: 64px 20px; }
.qa-success-ring {
  width: 68px; height: 68px; border-radius: 50%;
  background: oklch(92% 0.08 145); margin: 0 auto 18px;
  display: flex; align-items: center; justify-content: center;
}
.qa-success-ring svg { width: 32px; height: 32px; color: oklch(30% 0.14 145); }
.qa-success h2 { font-size: 20px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
.qa-success-pct { font-size: 60px; font-weight: 600; line-height: 1; margin: 14px 0 4px; font-family: 'DM Mono', monospace; }
.qa-success-pct.g { color: oklch(36% 0.16 145); }
.qa-success-pct.a { color: var(--p4); }
.qa-success-pct.r { color: var(--p1); }
.qa-success-sub { font-size: 13px; color: var(--ink-3); margin-bottom: 20px; }
.qa-success-note {
  display: inline-block; background: var(--p4-bg);
  border: 1px solid var(--p4); color: var(--p4);
  border-radius: 8px; padding: 8px 14px;
  font-size: 12px; font-weight: 600; margin-bottom: 20px;
}
.qa-success-back { color: var(--p4); font-weight: 600; font-size: 13px; text-decoration: none; }
</style>

<body>

<div class="qa-prog"><div class="qa-prog-fill" id="progressBar"></div></div>

<div class="qa-hdr">
  <div>
    <h1>Quick Audit</h1>
    <div class="qa-hdr-info" id="auditInfo">Loading…</div>
  </div>
  <div class="qa-timer" id="timer">0:00</div>
</div>

<div id="content">
  <div style="text-align:center;padding:60px;color:oklch(72% 0.008 62);font-family:'DM Mono',monospace;font-size:12px">
    Loading audit form…
  </div>
</div>

<div class="qa-foot">
  <div class="qa-foot-inner">
    <span class="qa-score-ct" id="scoreSummary">0 / —</span>
    <button class="qa-submit" id="submitBtn" disabled onclick="submitAudit()">Complete Audit</button>
  </div>
</div>

<script>
function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

var scores = {}, totalCriteria = 0, timerStart = null, timerInterval = null;

var _ZONE_ID = '<?= (typeof params !== "undefined" && params && params.zone) ? String(params.zone).replace(/['"<>&]/g,"") : "" ?>';
var _SELECTED_ZONE = '';

function getZoneId() {
  if (_SELECTED_ZONE) return _SELECTED_ZONE;
  if (_ZONE_ID)       return _ZONE_ID;
  try { return new URLSearchParams(window.location.search).get('zone') || ''; } catch(e) { return ''; }
}

function loadAudit() {
  var zid = getZoneId();
  if (!zid) {
    document.getElementById('auditInfo').textContent = 'Select a zone to audit';
    document.getElementById('content').innerHTML =
      '<div style="text-align:center;padding:40px;color:oklch(72% 0.008 62);font-size:11px">Loading zones…</div>';
    google.script.run
      .withSuccessHandler(renderZonePicker)
      .withFailureHandler(function(e) {
        document.getElementById('content').innerHTML =
          '<div style="text-align:center;padding:40px;color:oklch(46% 0.20 25);font-size:12px">Could not load zones: ' + escHtml(e.message) + '</div>';
      })
      .getMapEditorData();
    return;
  }
  google.script.run
    .withSuccessHandler(renderAudit)
    .withFailureHandler(function(e) {
      document.getElementById('content').innerHTML =
        '<div style="text-align:center;padding:40px;color:oklch(46% 0.20 25)">' + escHtml(e.message) + '</div>';
    })
    .getQuickAuditConfig(zid);
}

function renderAudit(cfg) {
  if (!cfg || !cfg.criteria) {
    document.getElementById('content').innerHTML =
      '<div style="text-align:center;padding:40px">No criteria found</div>';
    return;
  }

  document.getElementById('auditInfo').textContent =
    cfg.zoneName + ' · ' + cfg.dateDisplay + ' · ' + cfg.auditor;
  totalCriteria = cfg.criteria.length;
  document.getElementById('scoreSummary').textContent = '0 / ' + totalCriteria;

  var html = '<div class="qa-wrap">';

  if (cfg.alreadyAudited) {
    html += '<div class="qa-banner">This zone was already audited today. Submitting will add another record.</div>';
  }

  cfg.criteria.forEach(function(c, idx) {
    var pCls = escHtml(c.pillar);
    var sqcdp = c.sqcdp || {};

    html += '<div class="qa-card" id="card-' + idx + '">';
    html += '<div class="qa-accent ' + pCls + '"></div>';

    /* Collapsed scored view */
    html += '<div class="qa-scored-row" id="scored-row-' + idx + '" style="display:none">';
    html += '<span class="qa-s-pill ' + pCls + '">' + escHtml(c.pillar) + '</span>';
    html += '<span class="qa-s-label">' + escHtml(c.label) + '</span>';

    check:  '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
    coin:   '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M9 10h4.5a1.5 1.5 0 0 1 0 3H9"/></svg>',
    truck:  '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>',
    people: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>'

function setScore(criterionId, score, idx) {
  scores[criterionId] = score;

  for (var s = 0; s <= 4; s++) {
    var b = document.getElementById('btn-' + idx + '-' + s);
    if (b) { b.classList.toggle('selected', s === score); }
  }

  /* Show remark row */
  var rr = document.getElementById('remark-row-' + idx);
  if (rr) rr.style.display = 'block';

  /* Collapse card */
  var card = document.getElementById('card-' + idx);
  var body = document.getElementById('body-' + idx);
  var scoredRow = document.getElementById('scored-row-' + idx);
  var dot = document.getElementById('score-dot-' + idx);
  if (dot) { dot.textContent = score; dot.className = 'qa-s-dot sc' + score; }
  if (body) body.style.display = 'none';
  if (scoredRow) scoredRow.style.display = 'flex';
  if (card) { card.classList.add('scored'); card.classList.remove('active'); }

  /* Activate next */
  var next = document.getElementById('card-' + (idx + 1));
  if (next && next.classList.contains('scored') === false) {
    next.classList.add('active');
    setTimeout(function() { next.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 50);
  }

  /* Progress */
  var scored = Object.keys(scores).length;
  document.getElementById('progressBar').style.width = (totalCriteria > 0 ? (scored / totalCriteria * 100).toFixed(1) : 0) + '%';
  document.getElementById('scoreSummary').textContent = scored + ' / ' + totalCriteria;
  document.getElementById('submitBtn').disabled = (scored < totalCriteria);
}

function toggleTooltip(idx) {
  var btn = document.getElementById('info-btn-' + idx);
  var tip = document.getElementById('tooltip-' + idx);
  if (!btn || !tip) return;
  var isOpen = tip.classList.contains('show');
  document.querySelectorAll('.qa-tooltip.show').forEach(function(t) { t.classList.remove('show'); });
  document.querySelectorAll('.qa-info-btn.open').forEach(function(b) { b.classList.remove('open'); });
  if (!isOpen) { tip.classList.add('show'); btn.classList.add('open'); }
}

function toggleRemark(idx) {
  var rr = document.getElementById('remark-row-' + idx);
  if (rr) rr.style.display = rr.style.display === 'block' ? 'none' : 'block';
}

function toggleRemarkField(idx) {
  var ta = document.getElementById('remark-' + idx);
  var btn = document.querySelector('#remark-row-' + idx + ' .qa-remark-toggle');
  if (!ta) return;
  var showing = ta.style.display === 'block';
  ta.style.display = showing ? 'none' : 'block';
  if (btn) btn.textContent = showing ? '+ Add remark' : '− Remark';
  var ac = document.getElementById('ac-rem-' + idx);
  if (ac) ac.classList.toggle('on-rem', !showing);
  if (!showing) setTimeout(function() { ta.focus(); }, 50);
}

function raiseNCR(idx) {
  var ac = document.getElementById('ac-ncr-' + idx);
  if (ac) ac.classList.toggle('on-ncr');
}

function toggleWDGLL(idx) {
  var el = document.getElementById('wdgll-' + idx);
  if (el) el.classList.toggle('show');
}

function submitAudit() {
  if (!validatePhotoOnMobile_()) return;
  var btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Submitting…';
  clearInterval(timerInterval);

  var photoHidden = document.getElementById('photoDataUrl');
  var photoB64 = photoHidden && photoHidden.value ? photoHidden.value.split(',')[1] : '';
  var criteriaRemarks = {};
  document.querySelectorAll('.qa-remark-input').forEach(function(ta) {
    var v = ta.value.trim();
    if (v) criteriaRemarks[ta.getAttribute('data-cid')] = v;
  });
  var payload = { zoneId: getZoneId(), zone: getZoneId(), scores: scores, remarks: criteriaRemarks, photo_b64: photoB64 };

  function queueOffline_(reason) {
    if (typeof offlineQueue !== 'undefined') {
      offlineQueue.queueSubmission('audit', payload).then(function() {
        btn.disabled = false; btn.textContent = 'Complete Audit';
        if (typeof pmToast === 'function') pmToast('Saved offline — will sync when online', 'info');
        if (typeof updateQueueStatus_ === 'function') updateQueueStatus_();
      }).catch(function(e2) {
        btn.disabled = false; btn.textContent = 'Complete Audit';
        if (typeof pmToast === 'function') pmToast('Error: ' + e2.message, 'error');
      });
    } else {
      btn.disabled = false; btn.textContent = 'Complete Audit';
      if (typeof pmToast === 'function') pmToast(reason || 'Submission failed', 'error');
    }
  }

  if (!navigator.onLine) { queueOffline_('offline'); return; }

  google.script.run
    .withSuccessHandler(function(result) {
      if (result && result.success) {
        if (typeof pmToast === 'function') pmToast('Submitted', 'success');
        var elapsed = Math.floor((Date.now() - timerStart) / 1000);
        var pct = result.percentage;
        var pcls = pct >= 80 ? 'g' : pct >= 60 ? 'a' : 'r';
        var html = '<div class="qa-wrap"><div class="qa-success">';
        html += '<div class="qa-success-ring"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>';
        html += '<h2>Audit Complete</h2>';
        html += '<div class="qa-success-pct ' + pcls + '">' + pct + '%</div>';
        html += '<div class="qa-success-sub">Score: ' + result.totalScore + ' / ' + result.maxScore + ' &nbsp;·&nbsp; ' + Math.floor(elapsed/60) + 'm ' + elapsed%60 + 's</div>';
        if (result.actionsGenerated > 0) {
          html += '<div class="qa-success-note">' + result.actionsGenerated + ' action(s) auto-generated for low scores</div><br>';
        }
        html += '<a class="qa-success-back" href="javascript:history.back()">Back to Dashboard</a>';
        html += '</div></div>';
        document.getElementById('content').innerHTML = html;
        document.querySelector('.qa-foot').style.display = 'none';
        document.querySelector('.qa-prog').style.display = 'none';
      } else {
        btn.disabled = false; btn.textContent = 'Complete Audit';
        alert(result ? result.message : 'Submission failed');
      }
    })
    .withFailureHandler(function(e) { queueOffline_(e.message); })
    .submitQuickAudit(payload);
}

  }
  var html = '<div class="qa-wrap">';
  html += '<div class="qa-pick-title">Select Zone to Audit</div>';

function openCamera_() {
  var raw = document.getElementById('photoInputRaw');

(function wirePhotoInput_() {
  document.addEventListener('click', function() {
    var raw = document.getElementById('photoInputRaw');
    if (raw && !raw._wired) {
      raw._wired = true;
      raw.addEventListener('change', function() {
        if (!raw.files || !raw.files[0]) return;
        var reader = new FileReader();
        reader.onload = function(ev) { applyWatermark_(ev.target.result); };
        reader.readAsDataURL(raw.files[0]);
      });
    }
  });
})();

function applyWatermark_(dataUrl) {
  var img = new Image();
  img.onload = function() {
    var stripH = Math.max(28, Math.round(img.height * 0.045));
    var c = document.createElement('canvas');
    c.width = img.width; c.height = img.height + stripH;
    var ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0);
    var zone    = getZoneId() || 'Unknown Zone';
    var auditor = (typeof currentUser_ !== 'undefined' && currentUser_) ? currentUser_ : 'Auditor';
    var now     = new Date();
    var dateStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' +
                  String(now.getDate()).padStart(2,'0') + ' ' +
                  String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    var zoom    = (window.devicePixelRatio || 1).toFixed(1);
    var fontSize = Math.max(12, Math.round(stripH * 0.52));
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, img.height, c.width, stripH);
    ctx.font = 'bold ' + fontSize + 'px Arial';
    ctx.textBaseline = 'middle';
    var midY = img.height + stripH / 2;
    ctx.fillStyle = '#ffffff';
    ctx.fillText(zone + '  |  ' + auditor, 10, midY);
    var right = dateStr + '  |  zoom ' + zoom + 'x';
    ctx.fillStyle = '#a0aec0';
    ctx.fillText(right, c.width - ctx.measureText(right).width - 10, midY);
    var watermarked = c.toDataURL('image/jpeg', 0.88);
    var hidden = document.getElementById('photoDataUrl');
    var thumb  = document.getElementById('photoThumb');
    var prev   = document.getElementById('photoPreviewImg');
    var photoBtn = document.getElementById('photoBtn');
    if (hidden)   hidden.value = watermarked;
    if (prev)     prev.src = watermarked;
    if (thumb)    thumb.style.display = 'block';
    if (photoBtn) photoBtn.textContent = 'Retake photo';
    var camBtns = document.querySelectorAll('#ac-cam-' + '_active');
    document.querySelectorAll('[id^="ac-cam-"]').forEach(function(b) { b.classList.add('on-cam'); });
  };
  img.src = dataUrl;
}

window.closeAnnotator = function(dataUrl) {
  document.getElementById('annotatorOverlay').style.display = 'none';
  if (!dataUrl) return;
  var hidden = document.getElementById('photoDataUrl');
  var prev   = document.getElementById('photoPreviewImg');
  var thumb  = document.getElementById('photoThumb');
  if (hidden) hidden.value = dataUrl;
  if (prev)   prev.src = dataUrl;
  if (thumb)  thumb.style.display = 'block';
};

function isMobileDevice_() {
  return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
}

function validatePhotoOnMobile_() {
  if (!isMobileDevice_()) return true;
  var hidden = document.getElementById('photoDataUrl');
  if (!hidden || !hidden.value) {
    if (typeof pmToast === 'function') pmToast('Photo required on mobile', 'warning');
    return false;
  }
  return true;
}
