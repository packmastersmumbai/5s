<html lang="en">

<script src="https://cdn.jsdelivr.net/npm/countup.js@2.8.0/dist/countUp.umd.js" defer></script>

<style>
/* ═══════════════════════════════════════════════
   HOME PAGE — HOME DASHBOARD
   ═══════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-main);
  background: var(--bg-page);
  color: var(--text-primary);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

.wrap {
  min-height: 100vh;
  padding-bottom: 72px;
}

/* ── HEADER ────────────────────────────────── */
.hdr {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 13px 18px;
  background: var(--bg-header);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 200;
}

.hdr-brand { display: flex; align-items: center; gap: 10px; }

.brand-mark {
  width: 34px;
  height: 34px;
  border-radius: 8px;
  background: var(--pm-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 15px;
  color: #fff;
  letter-spacing: -0.5px;
  flex-shrink: 0;
}

.brand-name {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 17px;
  letter-spacing: 0.3px;
  line-height: 1;
  color: var(--pm-primary);
}
.brand-ver {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 1.5px;
  color: var(--text-muted);
  margin-top: 3px;
  text-transform: uppercase;
}

/* Health pill */
.health-pill {
  display: flex;
  align-items: center;
  gap: 7px;
  background: var(--bg-card-2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 5px 12px 5px 8px;
}
.health-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--border);
  transition: background 0.6s;
  flex-shrink: 0;
}
.health-dot.g { background: var(--score-green); }
.health-dot.a { background: var(--score-amber); }
.health-dot.r { background: var(--score-red); animation: blink-r 1.6s ease-in-out infinite; }
@keyframes blink-r { 0%,100%{opacity:1} 50%{opacity:.4} }

.health-num {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 700;
  color: var(--text-primary);
}

/* Gear icon button in header */
.hdr-right {
  display: flex;
  align-items: center;
  gap: 8px;
}
.hdr-gear {
  width: 34px;
  height: 34px;
  border-radius: 8px;
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  text-decoration: none;
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.15s, color 0.15s;
}
.hdr-gear svg { width: 18px; height: 18px; display: block; }
.hdr-gear:active { background: var(--bg-card-2); color: var(--pm-primary); }

/* ── USER INFO CARD ────────────────────────── */
.user-info-card {
  margin: 18px 18px 0;
  padding: 12px 14px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r);
  display: flex;
  gap: 12px;
  align-items: center;
  box-shadow: var(--shadow);
}
.user-avatar {
  font-size: 28px;
  flex-shrink: 0;
}
.user-details {
  flex: 1;
}
.user-email {
  font-weight: 600;
  color: var(--pm-primary);
  font-size: 13px;
  margin-bottom: 3px;
}
.user-role {
  font-size: 11px;
  color: var(--text-muted);
  font-family: var(--font-mono);
}

/* ── SECTION HEADER ───────────────────────── */
.sec-hdr {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.sec-label {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  gap: 8px;
}
.sec-label::before {
  content: '';
  display: inline-block;
  width: 3px;
  height: 12px;
  background: var(--pm-primary);
  border-radius: 2px;
}

/* ── OFFLINE BANNER ────────────────────────── */
.offline-bar {
  display: none;
  background: var(--score-amber);
  color: #fff;
  text-align: center;
  padding: 8px 16px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  font-weight: 700;
}
.offline-bar.on { display: block; }

/* ── SCORE BANNER ──────────────────────────── */
.score-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  gap: 12px;
}
.score-banner-left { flex: 1; min-width: 0; }
.score-zone-id {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 4px;
}
.score-zone-name {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 20px;
  color: var(--pm-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 4px;
}
.score-date {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-muted);
  margin-bottom: 12px;
}
.score-progress-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
}
.score-progress-rail {
  flex: 1;
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
}
.score-progress-fill {
  height: 100%;
  width: 100%;
  border-radius: 3px;
  background: var(--text-muted);
  transform-origin: left;
  transform: scaleX(0);
  transition: transform 1.4s cubic-bezier(.2,1,.3,1), background .6s;
}
.score-progress-fill.g { background: var(--score-green); }
.score-progress-fill.a { background: var(--score-amber); }
.score-progress-fill.r { background: var(--score-red); }
.score-progress-label {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  color: var(--text-primary);
  flex-shrink: 0;
}
.score-banner-right { flex-shrink: 0; }
.gauge-chart { width: 150px; height: 150px; }
.gauge-fallback {
  width: 150px;
  height: 150px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: var(--bg-card);
  border: 2px solid var(--border);
  border-radius: 50%;
}
.gauge-fallback-num {
  font-family: var(--font-display);
  font-size: 36px;
  font-weight: 800;
  color: var(--pm-primary);
  line-height: 1;
}
.gauge-fallback-lbl {
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-top: 4px;
}
@media (max-width: 480px) {
  .score-banner { flex-direction: column; align-items: flex-start; }
  .score-banner-right { align-self: center; }
}

/* ── STAT CHIPS ────────────────────────────── */
.stat-chips-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 18px 18px 0;
}
@media (min-width: 600px) {
  .stat-chips-row { grid-template-columns: repeat(4, 1fr); }
}
.stat-chip {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 14px 12px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  min-height: 80px;
  box-shadow: var(--shadow);
  opacity: 0;
}
.stat-chip.animate__animated { opacity: 1; }
.stat-number {
  font-family: var(--font-display);
  font-size: 32px;
  font-weight: 800;
  color: var(--pm-primary);
  line-height: 1;
  margin-bottom: 4px;
}
.stat-label {
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  font-family: var(--font-mono);
}

/* ── TASK QUEUE ────────────────────────────── */
.task-queue-section { padding: 26px 18px 0; }
.task-queue { display: flex; flex-direction: column; gap: 10px; }
.task-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-left: 3px solid var(--border);
  border-radius: var(--r);
  padding: 12px 14px;
  box-shadow: var(--shadow);
  display: flex;
  align-items: flex-start;
  gap: 10px;
  text-decoration: none;
  color: inherit;
  cursor: pointer;
  opacity: 0;
  transform: translateY(8px);
}
.task-card.--overdue { border-left-color: var(--score-red); }
.task-card.--today   { border-left-color: var(--score-amber); }
.task-card.--upcoming { border-left-color: var(--text-muted); }
.task-card-body { flex: 1; min-width: 0; }
.task-card-title {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 14px;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 3px;
}
.task-card-meta {
  font-size: 11px;
  color: var(--text-muted);
  font-family: var(--font-mono);
}
.task-card-status {
  flex-shrink: 0;
  font-size: 10px;
  font-family: var(--font-mono);
  letter-spacing: 0.5px;
  padding: 2px 8px;
  border-radius: 10px;
  border: 1px solid var(--border);
  color: var(--text-muted);
  text-transform: uppercase;
}
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100px;
  color: var(--score-green);
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 13px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r);
}
.empty-check { font-size: 32px; }

/* ── ZONE MAP ──────────────────────────────── */
/* Home = zone-grouped Quick Audit launcher. Hide the redundant single-zone
   score banner, plant stat chips and task queue so the floor-grouped zone
   launcher (each card opens QuickAudit) is the primary post-login view. */
#scoreBanner, #statChips, .task-queue-section { display: none; }
.zm-section { padding: 10px 18px 0; }
.zm-sec-hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }

/* Tabs — pill segmented control */
.zm-tabs { display: flex; gap: 0; margin-bottom: 14px; background: #f0ece4; border: 1.5px solid #ddd8cf; border-radius: 11px; padding: 3px; }
.zm-tab { flex: 1; padding: 7px 6px; border: none; border-radius: 8px; background: transparent; font-family: var(--font-main); font-size: 10px; color: #9ca3af; cursor: pointer; text-align: center; line-height: 1.35; -webkit-tap-highlight-color: transparent; transition: background 200ms cubic-bezier(0.16,1,0.3,1), box-shadow 200ms; }
.zm-tab-id { display: block; font-family: var(--font-mono); font-size: 14px; font-weight: 700; color: #9ca3af; margin-bottom: 1px; transition: color 200ms; }
.zm-tab-sub { display: block; font-size: 9px; color: #9ca3af; transition: color 200ms; }
.zm-tab.on { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.1), 0 0 0 1.5px #fcd34d; }
.zm-tab.on .zm-tab-id { color: #b45309; }
.zm-tab.on .zm-tab-sub { color: #525668; }

/* Grid */
.zm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; transition: opacity 130ms ease-in; }
.zm-grid.zm-fading { opacity: 0; pointer-events: none; }
@media (min-width: 700px) { .zm-grid { grid-template-columns: 1fr 1fr 1fr; } }

/* Card entrance + shimmer */
@keyframes zmIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes zmShimmer { from { background-position: -200% 0; } to { background-position: 200% 0; } }

.zm-card { background: #fefcf8; border: 1.5px solid #ddd8cf; border-radius: 11px; overflow: hidden; cursor: pointer; transition: border-color 150ms, box-shadow 150ms; -webkit-tap-highlight-color: transparent; animation: zmIn 320ms cubic-bezier(0.16,1,0.3,1) both; }
.zm-card:active { border-color: #d97706; box-shadow: 0 0 0 3px rgba(217,119,6,.12); }
.zm-ch { display: flex; align-items: center; gap: 6px; padding: 7px 10px; background: #f7f5f0; border-bottom: 1.5px solid #e8e4dc; }
.zm-id { font-family: var(--font-mono); font-size: 10px; font-weight: 700; color: #374151; letter-spacing: .8px; }
.zm-type { font-size: 8px; font-weight: 700; color: #525668; text-transform: uppercase; padding: 1px 5px; border: 1px solid #d1cdc4; border-radius: 3px; background: #fff; white-space: nowrap; }
.zm-flags { margin-left: auto; display: flex; gap: 3px; }
.zm-fl { font-family: var(--font-mono); font-size: 8px; font-weight: 700; padding: 1px 4px; border-radius: 3px; border: 1px solid; }
.zm-fl-H { background: #fee2e2; color: #991b1b; border-color: #fca5a5; }
.zm-fl-B { background: #dcfce7; color: #166534; border-color: #86efac; }
.zm-fl-D { background: #fef3c7; color: #92400e; border-color: #fcd34d; }
.zm-body { display: flex; gap: 9px; padding: 10px; align-items: flex-start; }
.zm-tile { flex-shrink: 0; width: 56px; height: 56px; border-radius: 9px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; border: 2px solid; }
.zm-tile-skel { background: linear-gradient(90deg,#ede9e1 25%,#e0dbd2 50%,#ede9e1 75%); background-size: 200% 100%; animation: zmShimmer 1.6s infinite linear; border-color: #e0dbd2 !important; }
.zm-tile-n { font-family: var(--font-mono); font-size: 20px; font-weight: 800; line-height: 1; }
.zm-tile-u { font-family: var(--font-mono); font-size: 8px; font-weight: 700; }
.zm-info { flex: 1; min-width: 0; }
.zm-name { font-size: 12px; font-weight: 800; color: #1a1e2e; line-height: 1.3; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.zm-staff { display: flex; gap: 6px; }
.zm-person { display: flex; align-items: center; gap: 5px; flex: 1; min-width: 0; }
.zm-av { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 9px; font-weight: 700; flex-shrink: 0; }
.zm-av-role { font-size: 8px; font-weight: 700; color: #6b7280; text-transform: uppercase; letter-spacing: .3px; }
.zm-av-name { font-size: 9px; font-weight: 600; color: #374151; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.zm-bars { display: flex; gap: 3px; padding: 3px 10px 9px; }
.zm-bar { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.zm-bar-bg { width: 100%; height: 5px; background: #e9e5de; border-radius: 3px; overflow: hidden; }
.zm-bar-fill { height: 100%; border-radius: 3px; transform-origin: left; transform: scaleX(0); transition: transform 600ms cubic-bezier(0.16,1,0.3,1); }
.zm-bar-lbl { font-family: var(--font-mono); font-size: 7px; font-weight: 700; color: #374151; }
.zm-foot { display: flex; align-items: center; gap: 7px; padding: 7px 10px; border-top: 1.5px solid #e8e4dc; background: #f7f5f0; }
.zm-nc { font-family: var(--font-mono); font-size: 9px; font-weight: 700; padding: 2px 7px; border-radius: 4px; flex-shrink: 0; border: 1.5px solid; }
.zm-nc-ok  { background: #dcfce7; color: #166534; border-color: #86efac; }
.zm-nc-bad { background: #fee2e2; color: #991b1b; border-color: #fca5a5; }
.zm-ago { font-size: 9px; font-weight: 500; color: #6b7280; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.zm-loading { text-align: center; padding: 32px 0; font-size: 12px; color: #9ca3af; font-family: var(--font-mono); }
.zm-spin { display:inline-block; width:14px; height:14px; border:2px solid #e5e7eb; border-top-color:#6b21a8; border-radius:50%; animation:zmspin .7s linear infinite; vertical-align:middle; margin-right:7px; }
@keyframes zmspin { to { transform: rotate(360deg); } }
#zmSync { position:fixed; top:10px; left:50%; transform:translateX(-50%); z-index:60; background:#1f2937; color:#fff; font-size:11px; font-family:var(--font-mono); padding:5px 12px; border-radius:20px; box-shadow:0 2px 10px rgba(0,0,0,.25); display:none; align-items:center; }
#zmSync.on { display:inline-flex; }
#zmSync .zm-spin { border-color:#4b5563; border-top-color:#fff; }
</style>
</head>
<body>

<div id="offlineBar" class="offline-bar">● OFFLINE — SUBMISSIONS QUEUED</div>

<div class="wrap">

  <!-- ══════════════ HEADER ══════════════ -->
  <header class="hdr">
    <div class="hdr-brand">
      <div class="brand-mark">PM</div>
      <div>
        <div class="brand-name">PackMasters</div>
        <div class="brand-ver">5S · IMS · v5.0</div>
      </div>
    </div>
    <div class="hdr-right">
      <div class="health-pill">
        <div class="health-dot" id="hdrDot"></div>
        <span class="health-num" id="hdrPct">—%</span>
      </div>
      <a class="hdr-gear" id="settingsBtn" href="#" title="Settings"></a>
    </div>
  </header>

  <!-- ══════════════ USER INFO CARD ══════════════ -->
  <div class="user-info-card" style="display: flex; justify-content: space-between; align-items: center;">
    <div style="display: flex; align-items: center; gap: 10px; flex: 1;">
      <div class="user-avatar">👤</div>
      <div class="user-details">
        <div class="user-email" id="userEmail">User</div>
        <div class="user-role" id="userRole">PackMasters 5S</div>
      </div>
    </div>
    <button id="logoutBtn" style="margin-left: auto; padding: 8px 14px; background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600; white-space: nowrap;">
      🚪 Logout
    </button>
  </div>

  <!-- ══════════════ SCORE BANNER ══════════════ -->
  <section class="score-banner" id="scoreBanner">
    <div class="score-banner-left">
      <div class="score-zone-id" id="scoreZoneId">Z-01</div>
      <div class="score-zone-name" id="scoreZoneName">Loading...</div>
      <div class="score-date" id="scoreDate"></div>
      <div class="score-progress-wrap">
        <div class="score-progress-rail">
          <div class="score-progress-fill" id="scoreProgressFill"></div>
        </div>
        <span class="score-progress-label" id="scoreProgressLabel">—%</span>
      </div>
    </div>
    <div class="score-banner-right">
      <div id="gaugeContainer" class="gauge-chart">
        <!-- ApexCharts gauge renders here; fallback shown below -->
        <div id="gaugeFallback" class="gauge-fallback" style="display:none">
          <span class="gauge-fallback-num" id="gaugeFallbackNum">—</span>
          <span class="gauge-fallback-lbl">5S SCORE</span>
        </div>
      </div>
    </div>
  </section>

  <!-- ══════════════ STAT CHIPS ══════════════ -->
  <section class="stat-chips-row" id="statChips">
    <div class="stat-chip animate__animated animate__fadeInUp" id="chipCAPAs" style="animation-delay:0.1s">
      <span class="stat-number" id="statOpenCAPAs">0</span>
      <span class="stat-label">Open CAPAs</span>
    </div>
    <div class="stat-chip animate__animated animate__fadeInUp" id="chipRedTags" style="animation-delay:0.18s">
      <span class="stat-number" id="statRedTags">0</span>
      <span class="stat-label">Red Tags</span>
    </div>
    <div class="stat-chip animate__animated animate__fadeInUp" id="chipKaizens" style="animation-delay:0.26s">
      <span class="stat-number" id="statKaizens">0</span>
      <span class="stat-label">Kaizens</span>
    </div>
    <div class="stat-chip animate__animated animate__fadeInUp" id="chipStreak" style="animation-delay:0.34s">
      <span class="stat-number" id="statAuditStreak">0</span>
      <span class="stat-label">Audit Streak</span>
    </div>
  </section>

  <!-- ══════════════ ZONE MAP ══════════════ -->
  <section class="zm-section">
    <div class="zm-sec-hdr">
      <span class="sec-label">QUICK AUDIT — TAP A ZONE TO START</span>
    </div>
    <div class="zm-tabs">
      <button class="zm-tab on" onclick="zmSw('GF',this)"><span class="zm-tab-id">GF</span><span class="zm-tab-sub">Ground Floor</span></button>
      <button class="zm-tab"    onclick="zmSw('1F',this)"><span class="zm-tab-id">1F</span><span class="zm-tab-sub">First Floor</span></button>
      <button class="zm-tab"    onclick="zmSw('2F',this)"><span class="zm-tab-id">2F</span><span class="zm-tab-sub">Second Floor</span></button>

<script>
(function() {
  'use strict';

  var HD = window.PM5S_HD;
  var DU = window.PM5S_DU || '';
  var token = window.PM5S_TOKEN || '';

  /* ── Library fallback helper ── */
  function noLib(name) { console.warn('Library not loaded: ' + name); }

  /* ── Stat chip population ── */
  function populateStats(stats) {
    if (!stats) return;
    var chips = [
      { id: 'statOpenCAPAs', val: stats.openCAPAs || 0 },
      { id: 'statRedTags',   val: stats.redTags   || 0 },
      { id: 'statKaizens',   val: stats.kaizens   || 0 },
      { id: 'statAuditStreak', val: stats.auditStreak || 0 }
    ];
    chips.forEach(function(chip, i) {
      var el = document.getElementById(chip.id);
      if (!el) return;
      if (typeof CountUp !== 'undefined') {
        try {
          var cu = new CountUp(el, chip.val, { duration: 1.5, useEasing: true });
          setTimeout(function() { cu.start(); }, i * 120);
        } catch(e) { el.textContent = chip.val; }
      } else {
        el.textContent = chip.val;
      }
    });
  }

  /* ── Score banner ── */
  function populateScore(score, scoreColor) {
    var fill = document.getElementById('scoreProgressFill');
    var label = document.getElementById('scoreProgressLabel');
    if (score !== null && score !== undefined) {
      if (fill) {
        fill.className = 'score-progress-fill ' + (scoreColor || 'a');
        setTimeout(function() { fill.style.transform = 'scaleX(' + Math.min(score, 100) / 100 + ')'; }, 50);
      }
      if (label) label.textContent = score + '%';
    }
  }

  /* ── ApexCharts gauge ── */
  function renderGauge(score, scoreColor) {
    var container = document.getElementById('gaugeContainer');
    var fallback  = document.getElementById('gaugeFallback');
    var fallbackNum = document.getElementById('gaugeFallbackNum');

    var scoreVal = (score !== null && score !== undefined) ? score : 0;
    var colorMap = { g: '#22c55e', a: '#f59e0b', r: '#ef4444' };
    var gaugeColor = colorMap[scoreColor] || '#94a3b8';

    if (!container) {
      if (fallback) fallback.style.display = 'flex';
      if (fallbackNum) fallbackNum.textContent = score !== null ? score + '%' : '—';
      return;
    }
    if (typeof ApexCharts !== 'undefined') {
      try {
        var opts = {
          chart: { type: 'radialBar', height: 150, sparkline: { enabled: true } },
          plotOptions: {
            radialBar: {
              startAngle: -90, endAngle: 90,
              track: { background: 'var(--border, #E2E8F0)', strokeWidth: '100%' },
              dataLabels: {
                name: { show: false },
                value: {
                  offsetY: -8,
                  fontSize: '22px',
                  fontWeight: '800',
                  color: gaugeColor,
                  formatter: function(val) { return val + '%'; }
                }
              }
            }
          },
          series: [scoreVal],
          colors: [gaugeColor]
        };
        var chart = new ApexCharts(container, opts);
        chart.render();
      } catch(e) {
        noLib('ApexCharts render error: ' + e.message);
        if (fallback) fallback.style.display = 'flex';
        if (fallbackNum) fallbackNum.textContent = score !== null ? score + '%' : '—';
      }
    } else {
      noLib('ApexCharts');
      if (fallback) fallback.style.display = 'flex';
      if (fallbackNum) fallbackNum.textContent = score !== null ? score + '%' : '—';
    }
  }

  /* ── Task queue ── */
  function esc(s) {
    return s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : '';
  }

  function formatDue(dueDate, urgency) {
    if (!dueDate) return '';
    if (urgency === 'overdue') return '⚠ ' + dueDate;
    if (urgency === 'today')   return '📅 Today';
    return dueDate;
  }

  function populateTasks(tasks) {
    var queue = document.getElementById('taskQueue');
    var empty = document.getElementById('emptyState');
    if (!queue || !empty) return;

    if (!tasks || tasks.length === 0) {
      queue.style.display = 'none';
      empty.style.display = 'flex';
      return;
    }

    queue.style.display = 'flex';
    empty.style.display = 'none';

    tasks.forEach(function(task) {
      var card = document.createElement('div');
      card.className = 'task-card --' + (task.urgency || 'upcoming');
      card.innerHTML =
        '<div class="task-card-body">' +
          '<div class="task-card-title">' + esc(task.title) + '</div>' +
          '<div class="task-card-meta">' + esc(task.zone) + ' · ' + esc(formatDue(task.dueDate, task.urgency)) + '</div>' +
        '</div>' +
        '<span class="task-card-status">' + esc(task.status || 'OPEN') + '</span>';
      card.addEventListener('click', function() {
        var params = new URLSearchParams(window.location.search);
        var zone = params.get('zone') || task.zone || '';
        window.pm5sNav(DU + '?v2=1&action=taskboard&zone=' + encodeURIComponent(zone) + '&token=' + encodeURIComponent(token));
      });
      queue.appendChild(card);
    });
  }

  /* ── GSAP entrance animation ── */
  function runEntranceAnimation(tasks) {
    if (typeof gsap === 'undefined') {
      noLib('gsap');
      /* Fallback: make everything visible immediately */
      var chips = document.querySelectorAll('.stat-chip');
      for (var i = 0; i < chips.length; i++) {
        chips[i].style.opacity = '1';
        chips[i].style.transform = 'none';
      }
      var cards = document.querySelectorAll('.task-card');
      for (var j = 0; j < cards.length; j++) {
        cards[j].style.opacity = '1';
        cards[j].style.transform = 'none';
      }
      return;
    }
    try {
      var tl = gsap.timeline();
      tl.to('#scoreBanner',  { opacity: 1, duration: 0.4 }, 0)
        .to('.stat-chip',    { opacity: 1, y: 0, duration: 0.3, stagger: 0.08 }, 0.4)
        .to('.task-card',    { opacity: 1, y: 0, duration: 0.35, stagger: 0.07 }, 0.7);
    } catch(e) {
      noLib('gsap timeline error: ' + e.message);
    }
  }

  /* ── Plan G: score cache helpers ── */
  function saveFreshScore_(zone, score) {
    try {
      localStorage.setItem('pm5s_score_cache_' + zone, JSON.stringify({
        score: score, timestamp: Date.now()
      }));
    } catch(e) {}
  }

  function showCachedScoreBadge_(zone) {
    try {
      var raw = localStorage.getItem('pm5s_score_cache_' + zone);
      if (!raw) return;
      var c = JSON.parse(raw);
      var hoursAgo = Math.floor((Date.now() - c.timestamp) / 3600000);
      if (hoursAgo < 1) return;
      var existing = document.getElementById('scoreCacheBadge');
      if (existing) return;
      var badge = document.createElement('div');
      badge.id = 'scoreCacheBadge';
      badge.style.cssText = 'font-size:11px;color:var(--score-amber);font-family:var(--font-mono);margin-top:4px;';
      badge.textContent = '(Cached ' + hoursAgo + 'h ago)';
      var progressWrap = document.querySelector('.score-progress-wrap');
      if (progressWrap && progressWrap.parentNode) {
        progressWrap.parentNode.insertBefore(badge, progressWrap.nextSibling);
      }
    } catch(e) {}
  }

  /* ── Main init (wait up to 2s for deferred scripts) ── */
  function initDashboard() {
    var score = null, scoreColor = 'a', stats = null, tasks = [];
    if (HD) {
      score      = HD.score !== undefined ? HD.score : null;
      scoreColor = HD.scoreColor || 'a';
      stats      = HD.stats || null;
      tasks      = HD.tasks || [];
    }

    populateScore(score, scoreColor);
    renderGauge(score, scoreColor);
    populateStats(stats);
    populateTasks(tasks);
    runEntranceAnimation(tasks);

    /* Plan G: save fresh score to localStorage; show badge if offline/stale */
    var zone = (new URLSearchParams(window.location.search)).get('zone') || 'Z-01';
    if (score !== null && score !== undefined) {
      saveFreshScore_(zone, score);
    }
    showCachedScoreBadge_(zone);
  }

  /* Deferred scripts load after window.onload; wait for them */
  if (document.readyState === 'complete') {
    setTimeout(initDashboard, 300);
  } else {
    window.addEventListener('load', function() {
      setTimeout(initDashboard, 300);
    });
  }

})();
</script>

/* Score count-up: ease-out-cubic, 550ms */
function countUp(el,target,delay){
  var dur=550;
  setTimeout(function(){
    var start=null;
    function step(ts){
      if(!start)start=ts;
      var p=Math.min((ts-start)/dur,1);
      var e=1-Math.pow(1-p,3);
      el.textContent=Math.round(e*target);
      if(p<1)requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  },delay||0);
}

      +'<div class="zm-tile-u" style="color:'+stFg(score)+'">% 5S</div></div>')

  var bars=[s1,s2,s3,s4,s5].map(function(v,i){
    var bColor=v>0?plFg(v):'#c4bfb5';
    var bDelay=cardDelay+220+(i*55);
    return '<div class="zm-bar"><div class="zm-bar-bg">'
      +'<div class="zm-bar-fill" data-w="'+(v/100)+'" style="background:'+bColor+';transition-delay:'+bDelay+'ms"></div>'
      +'</div><div class="zm-bar-lbl">S'+(i+1)+'</div></div>';
  }).join('');

  var lp=avP(z.l),sp=avP(z.s);
  var auditUrl=DU+'?v2=1&action=quickaudit&zone='+z.id+'&token='+encodeURIComponent(TOKEN);
  var ncUrl=DU+'?v2=1&action=actionlist&zone='+z.id+'&token='+encodeURIComponent(TOKEN);
  var matrixUrl=DU+'?v2=1&action=zonematrix&zone='+z.id+'&token='+encodeURIComponent(TOKEN);

  return '<div class="zm-card" style="animation-delay:'+cardDelay+'ms" onclick="pm5sNav(\''+matrixUrl+'\')">'
    +'<div class="zm-ch"><span class="zm-id">'+z.id+'</span><span class="zm-type">'+z.t+'</span><div class="zm-flags">'+fh+'</div></div>'
    +'<div class="zm-body">'+tileHtml
    +'<div class="zm-info">'
    +'<div class="zm-name">'+z.n+'</div>'
    +'<div class="zm-staff">'
    +'<div class="zm-person"><div class="zm-av" style="background:'+lp.bg+';color:'+lp.fg+'">'+ini(z.l)+'</div><div><div class="zm-av-role">Leader</div><div class="zm-av-name">'+z.l.replace(/^(Mr|Mrs|Ms|Dr)\.?\s*/i,'')+'</div></div></div>'
    +'<div class="zm-person"><div class="zm-av" style="background:'+sp.bg+';color:'+sp.fg+'">'+ini(z.s)+'</div><div><div class="zm-av-role">Supvr</div><div class="zm-av-name">'+z.s.replace(/^(Mr|Mrs|Ms|Dr)\.?\s*/i,'')+'</div></div></div>'
    +'</div></div></div>'
    +'<div class="zm-bars">'+bars+'</div>'
    +'<div class="zm-foot">'
    +(nc>0?'<span class="zm-nc zm-nc-bad">'+nc+' NC</span>':'<span class="zm-nc zm-nc-ok">&#10003; 0 NC</span>')
    +'<span class="zm-ago">'+ago+'</span>'
    +(nc>0?'<button style="'+BTN_NC+'" onclick="event.stopPropagation();pm5sNav(\''+ncUrl+'\')">View NCs</button>':'')
    +'</div></div>';
}

function zmActivate(grid){
  requestAnimationFrame(function(){
    /* Trigger bar fill animations */
    grid.querySelectorAll('.zm-bar-fill').forEach(function(el){
      var w=parseFloat(el.getAttribute('data-w'))||0;
      el.style.transform='scaleX('+w+')';
    });
    /* Count up score tiles */
    grid.querySelectorAll('.zm-tile-n[data-score]').forEach(function(el,i){
      var target=parseInt(el.getAttribute('data-score'),10)||0;
      var card=el.closest('.zm-card');
      var cardDelay=card?parseInt(card.style.animationDelay)||0:0;
      countUp(el,target,cardDelay+80);
    });
  });
}

var _zmFloor='GF';

function zmRender(){
  var grid=document.getElementById('zmGrid');
  if(!grid)return;
  var zones=ZR.filter(function(z){return z.f===_zmFloor;});
  grid.innerHTML=zones.map(function(z,i){return zmCard(z,ZM_SCORES[z.id]||null,i);}).join('');
  zmActivate(grid);
}

window.zmSw=function(floor,btn){
  var grid=document.getElementById('zmGrid');
  if(grid)grid.classList.add('zm-fading');
  setTimeout(function(){
    _zmFloor=floor;
    document.querySelectorAll('.zm-tab').forEach(function(t){t.classList.remove('on');});
    btn.classList.add('on');
    zmRender();
    if(grid)grid.classList.remove('zm-fading');
  },130);
};

zmRender();

if(typeof google!=='undefined'&&google.script&&google.script.run){
  var _sync=document.getElementById('zmSync');
  if(_sync)_sync.classList.add('on');
  google.script.run
    .withSuccessHandler(function(data){
      if(data&&typeof data==='object'){ZM_SCORES=data;zmRender();}
      if(_sync)_sync.classList.remove('on');
    })
    .withFailureHandler(function(){ if(_sync)_sync.classList.remove('on'); })
    .getZoneMapData();
}

})();
</script>
