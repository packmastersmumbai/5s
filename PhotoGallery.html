<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Photo Gallery — PackMasters 5S</title>
  <?!= include('CommonStyles') ?>
  <style>
    .photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:var(--sp-3);}
    .photo-item{background:var(--bg-card);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);}
    .photo-item img{width:100%;height:140px;object-fit:cover;display:block;}
    .photo-item__info{padding:var(--sp-2) var(--sp-3);font-size:var(--size-xs);}
    .photo-item__date{color:var(--text-secondary);}
    .photo-item__type{font-weight:700;color:var(--pm-primary);}
    .filter-row{display:flex;gap:var(--sp-2);margin-bottom:var(--sp-4);flex-wrap:wrap;align-items:center;}
    .filter-row select{padding:8px;border-radius:6px;border:1px solid var(--border);font-size:var(--size-sm);min-height:var(--tap-min);}
    .lightbox{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);display:none;align-items:center;justify-content:center;z-index:300;padding:20px;cursor:pointer;}
    .lightbox.visible{display:flex;}
    .lightbox img{max-width:100%;max-height:90vh;border-radius:8px;}
    @media print{.photo-grid{grid-template-columns:repeat(3,1fr);}.no-print{display:none!important;}}
  </style>
</head>
<body>
  <div class="pm-header">
    <div class="pm-header__row">
      <div>
        <a href="<?= JSON.parse(data).deployUrl ?>" style="color:white;text-decoration:none;font-size:13px;opacity:0.8">← Home</a>
        <div class="pm-header__brand" style="margin-top:2px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;flex-shrink:0"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg> Photo Gallery</div>
        <div class="pm-header__zone">F/QA/5S/05</div>
      </div>
    </div>
  </div>
  <div class="pm-content">
    <div class="filter-row no-print">
      <select id="zoneFilter" onchange="applyFilters()"><option value="">All Zones</option></select>
      <select id="monthFilter" onchange="applyFilters()"><option value="all">All Months</option></select>
      <button onclick="window.print()" class="pm-btn pm-btn--outline" style="width:auto;padding:8px 16px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;flex-shrink:0"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg> Print</button>
    </div>
    <div class="photo-grid" id="photoGrid">
      <div class="skeleton" style="height:200px;"></div>
      <div class="skeleton" style="height:200px;"></div>
      <div class="skeleton" style="height:200px;"></div>
    </div>
    <div id="emptyState" class="hidden" style="text-align:center;padding:40px;color:var(--text-secondary);">No photos found for the selected filters.</div>
  </div>
  <div class="lightbox" id="lightbox" onclick="this.classList.remove('visible')"><img id="lightboxImg" src=""></div>

  <script>
    (function(){
      var SERVER_DATA=<?!= data ?>;
      var deployUrl=SERVER_DATA.deployUrl;
      var initialZone=SERVER_DATA.zoneId||'';
      var initialMonth=SERVER_DATA.month||'all';
      var allPhotos=[];

      // Populate zone filter
      var zf=document.getElementById('zoneFilter');
      google.script.run.withSuccessHandler(function(zones){
        var ids=Object.keys(zones).sort();
        ids.forEach(function(id){
          var opt=document.createElement('option');
          opt.value=id;opt.textContent=id+' — '+zones[id].name;
          if(id===initialZone)opt.selected=true;
          zf.appendChild(opt);
        });
      }).getZoneConfig();

      // Populate month filter
      var mf=document.getElementById('monthFilter');
      var now=new Date();
      for(var i=0;i<12;i++){
        var d=new Date(now.getFullYear(),now.getMonth()-i,1);
        var m=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
        var opt=document.createElement('option');
        opt.value=m;opt.textContent=d.toLocaleDateString('en-IN',{month:'short',year:'numeric'});
        if(m===initialMonth)opt.selected=true;
        mf.appendChild(opt);
      }

      loadPhotos();

      function loadPhotos(){
        var zone=document.getElementById('zoneFilter').value||'';
        var month=document.getElementById('monthFilter').value||'all';
        if(!zone){
          // Load all zones
          google.script.run.withSuccessHandler(function(zones){
            var ids=Object.keys(zones).sort();
            allPhotos=[];
            var loaded=0;
            if(ids.length===0){renderPhotos();return;}
            ids.forEach(function(id){
              google.script.run.withSuccessHandler(function(photos){
                allPhotos=allPhotos.concat(photos||[]);
                loaded++;
                if(loaded===ids.length)renderPhotos();
              }).getPhotoData(id,month);
            });
          }).getZoneConfig();
        }else{
          google.script.run.withSuccessHandler(function(photos){
            allPhotos=photos||[];
            renderPhotos();
          }).getPhotoData(zone,month);
        }
      }

      function renderPhotos(){
        var grid=document.getElementById('photoGrid');
        var empty=document.getElementById('emptyState');
        if(allPhotos.length===0){
          grid.innerHTML='';empty.classList.remove('hidden');return;
        }
        empty.classList.add('hidden');
        var html='';
        allPhotos.forEach(function(p){
          var thumb=p.thumbnailUrl||p.drive_url||'';
          var fullUrl=p.drive_url||thumb;
          var dateStr='';
          if(p.photo_date){
            try{dateStr=new Date(p.photo_date).toLocaleDateString('en-IN',{day:'numeric',month:'short'});}catch(e){}
          }
          html+='<div class="photo-item" onclick="openLightbox(\''+fullUrl+'\')">'+
            '<img src="'+thumb+'" alt="5S Photo" loading="lazy" onerror="this.src=\'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect fill=%22%23f0f0f0%22 width=%22100%22 height=%22100%22/><text x=%2250%22 y=%2255%22 text-anchor=%22middle%22 fill=%22%23999%22 font-size=%2212%22>No Image</text></svg>\'">'+
            '<div class="photo-item__info">'+
            '<div class="photo-item__type">'+(p.zone_id||'')+'</div>'+
            '<div class="photo-item__date">'+dateStr+'</div>'+
            '<div class="photo-item__date">'+(p.description||'').substring(0,30)+'</div>'+
            '</div></div>';
        });
        grid.innerHTML=html;
      }

      window.applyFilters=loadPhotos;
      window.openLightbox=function(url){
        document.getElementById('lightboxImg').src=url;
        document.getElementById('lightbox').classList.add('visible');
      };
    })();
  </script>
</body>
</html>
