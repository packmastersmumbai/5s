<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Gemba Walk — PackMasters 5S</title>
<?!= include("CommonStyles") ?>
<style>
.gw-header {
  background: linear-gradient(135deg, var(--pm-primary) 0%, var(--pm-primary-light) 100%);
  color: #fff;
  padding: 14px 16px 12px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.gw-header__top { display: flex; align-items: center; gap: 10px; }
.gw-header__back {
  width: 36px; height: 36px; border-radius: 50%;
  background: rgba(255,255,255,.15);
  border: none; color: #fff; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; flex-shrink: 0;
}
.gw-header__title { font-family: var(--font-display); font-size: 18px; font-weight: 700; flex: 1; }

.gw-progress-bar { background: var(--border); height: 3px; }
.gw-progress-fill { height: 100%; width: 100%; background: var(--score-green); transform-origin: left; transform: scaleX(0); transition: transform .3s ease-out; }

.gw-content { max-width: 600px; margin: 0 auto; padding: 16px 12px 120px; }

.form-section {
  background: var(--bg-card);
  border: 1px solid var(--border-light);
  border-radius: var(--r-lg);
  padding: 14px 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
}
.form-section h3 {
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 700;
  color: var(--pm-primary);
  margin-bottom: 12px;
}

.gw-field { margin-bottom: 12px; }
.gw-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); display: block; margin-bottom: 5px; }

.gw-question { margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--border-light); }
.gw-question:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
.gw-question__text { font-size: 13px; color: var(--text-primary); margin-bottom: 8px; line-height: 1.4; }
.gw-yn-btns { display: flex; gap: 8px; }
.gw-yn-btn {
  flex: 1; padding: 8px; border-radius: var(--r); font-size: 13px; font-weight: 600;
  border: 1.5px solid var(--border); background: var(--bg-card-2);
  cursor: pointer; min-height: 36px; transition: var(--trans);
}
.gw-yn-btn.yes.selected { background: var(--score-green-bg); border-color: var(--score-green); color: var(--score-green); }
.gw-yn-btn.no.selected  { background: var(--score-red-bg);   border-color: var(--score-red);   color: var(--score-red); }
.gw-yn-btn.na.selected  { background: var(--score-amber-bg); border-color: var(--score-amber); color: var(--score-amber); }

.action-item {
  background: var(--bg-card-2);
  border-radius: var(--r);
  padding: 12px;
  margin-bottom: 8px;
  border: 1px solid var(--border-light);
}
.ai-field {
  width: 100%;
  padding: 8px;
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  font-size: 13px;
  font-family: inherit;
  background: var(--bg-card);
  color: var(--text-primary);
  margin-top: 6px;
  box-sizing: border-box;
}

.gw-add-btn {
  padding: 8px 16px;
  border-radius: var(--r);
  border: 1.5px dashed var(--border);
  background: var(--bg-card-2);
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  width: 100%;
  min-height: 36px;
  transition: var(--trans);
}
.gw-add-btn:hover { border-color: var(--pm-primary); color: var(--pm-primary); }

.gw-progress-row {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-muted);
  text-align: right;
  margin-bottom: 4px;
}

/* Compact chip pickers */
.gw-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.gw-chip {
  padding: 7px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
  border: 1.5px solid var(--border); background: var(--bg-card-2); color: var(--text-secondary);
  cursor: pointer; min-height: 34px; transition: var(--trans);
}
.gw-chip.selected { background: var(--pm-primary); border-color: var(--pm-primary); color: #fff; }
.gw-zone-group { margin-bottom: 10px; }
.gw-zone-group:last-child { margin-bottom: 0; }
.gw-zone-floor {
  font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  color: var(--text-muted); margin-bottom: 6px;
}
.gw-zone-locked {
  display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: var(--r);
  background: var(--score-green-bg); border: 1.5px solid var(--score-green); color: var(--score-green);
  font-size: 13px; font-weight: 700;
}
.gw-zone-locked span { font-size: 15px; }

/* Plan F: mobile-only */
.mobile-only { display: none; }
@media (max-width: 768px) {
  .mobile-only { display: inline; color: var(--score-red, #EF4444); }
}
</style>
</head>
<body>

<div class="gw-header">
  <div class="gw-header__top">
    <button class="gw-header__back" onclick="history.back()">&#8592;</button>
    <span class="gw-header__title">Gemba Walk</span>
  </div>
</div>
<div class="gw-progress-bar">
  <div class="gw-progress-fill" id="progressBar"></div>
</div>

<div class="gw-content" id="gwContent">
  <div style="text-align:center;padding:60px;color:var(--text-muted);font-family:var(--font-mono);font-size:12px">
    Loading form…
  </div>
</div>

<script>
// Auth guard
(function() {
  var params = new URLSearchParams(window.location.search);
  var urlToken = params.get('token');
  if (urlToken) localStorage.setItem('pm5s_token', urlToken);
  var token = localStorage.getItem('pm5s_token');
  if (!token) {
    window.pm5sNav('<?= deployUrl ?>?v2=1&action=login');
    return;
  }
  window.PM5S_TOKEN = token;
})();

var DU = '<?= deployUrl ?>';
var ZONE_ID = '<?= params && params.zone ? String(params.zone).replace(/[^a-zA-Z0-9\-_]/g,"") : "" ?>';
var responses = {};
var questions = [];
var actionItemCount = 0;
var selectedWalkType = '';
var selectedZone = '';

function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── Load walk types then render form ── */
function loadWalkForm() {
  google.script.run
    .withSuccessHandler(function(types) {
      renderForm(types || []);
    })
    .withFailureHandler(function(e) {
      document.getElementById('gwContent').innerHTML =
        '<div style="text-align:center;padding:40px;color:var(--score-red);">' + escHtml(e.message) + '</div>';
    })
    .getGembaWalkTypes();
}

/* ── Render the main form shell ── */
function renderForm(walkTypes) {
  var html = '';

  // Walk Info section — Zone first, one-tap chips
  html += '<div class="form-section">';
  html += '<h3>Walk Setup</h3>';

  html += '<div class="gw-field"><label class="gw-label">Zone *</label>';
  html += '<div id="walkZoneChips"><div style="color:var(--text-muted);font-size:12px">Loading zones…</div></div></div>';

  html += '<div class="gw-field"><label class="gw-label">Walk Type *</label>';
  html += '<div id="walkTypeChips" class="gw-chips"></div></div>';

  html += '<div class="gw-field"><label class="gw-label" for="walkerName">Walker Name</label>';
  html += '<input class="pm-input" type="text" id="walkerName" placeholder="Your name"></div>';
  html += '</div>';

  // Questions section (populated by loadQuestions)
  html += '<div class="form-section" id="questionsSection">';
  html += '<h3>Observations</h3>';
  html += '<div id="questionsList"><div style="color:var(--text-muted);font-size:13px;">Select walk type to load questions…</div></div>';
  html += '<div class="gw-progress-row"><span id="progressText">0/0</span></div>';
  html += '</div>';

  // General observations
  html += '<div class="form-section">';
  html += '<h3>General Observations</h3>';
  html += '<div class="gw-field"><label class="gw-label" for="observations">Notes / Comments</label>';
  html += '<textarea class="pm-textarea" id="observations" rows="3" placeholder="Any additional observations…"></textarea></div>';
  html += '</div>';

  // Action items
  html += '<div class="form-section">';
  html += '<h3>Action Items</h3>';
  html += '<div id="actionItemsList"></div>';
  html += '<button class="gw-add-btn" onclick="addActionItem()">+ Add Action Item</button>';
  html += '</div>';

  // Photo evidence
  html += '<div class="form-section">';
  html += '<label class="gw-label">Photo Evidence <span class="mobile-only">(required)</span></label>';
  html += '<input type="file" id="photoInput" name="photoInput" accept="image/*" capture="environment" class="pm-input" style="padding:6px;">';
  html += '<small style="color:var(--text-muted,#94A3B8);">Capture on-site evidence</small>';
  html += '</div>';

  // Submit
  html += '<button class="pm-btn pm-btn--primary form-sticky-submit" id="submitBtn" onclick="submitWalk()" disabled>Submit Walk</button>';
  html += '<div id="submitStatus" style="text-align:center;margin-top:8px;color:var(--text-muted);font-size:13px;"></div>';

  document.getElementById('gwContent').innerHTML = html;
  initFormDefaults_();
  renderWalkTypeChips(walkTypes);
  loadZonesForForm();
}

/* ── Walk-type chips (default first, auto-loads questions) ── */
function labelType_(t) {
  return String(t).replace(/_/g, ' ').replace(/\b\w/g, function(m) { return m.toUpperCase(); });
}
function renderWalkTypeChips(types) {
  if (!types || !types.length) types = ['5S_AUDIT', 'SAFETY', 'QUALITY'];
  var c = document.getElementById('walkTypeChips');
  if (!c) return;
  c.innerHTML = types.map(function(t) {
    return '<button type="button" class="gw-chip" data-type="' + escHtml(t) + '" onclick="selectWalkType(\'' + escHtml(t) + '\')">' + escHtml(labelType_(t)) + '</button>';
  }).join('');
  selectWalkType(types[0]);
}
function selectWalkType(t) {
  selectedWalkType = t;
  document.querySelectorAll('#walkTypeChips .gw-chip').forEach(function(b) {
    b.classList.toggle('selected', b.dataset.type === t);
  });
  loadQuestions();
}

/* ── Zone chips (floor-grouped) or locked pill when prefilled ── */
function floorOf_(id) {
  var n = parseInt(String(id).replace(/[^0-9]/g, ''), 10) || 0;
  if (n <= 9) return 'Ground Floor';
  if (n <= 19) return '1st Floor';
  return '2nd Floor';
}
// Zone config injected server-side (same reliable path as KaizenForm) — the old
// google.script.run.getZoneConfig() had no failure handler and left "Loading zones…" stuck.
var GW_ZC = {};
try { GW_ZC = <?!= config.zoneConfig ?> || {}; } catch (e) { GW_ZC = {}; }
function loadZonesForForm() {
  if (GW_ZC && Object.keys(GW_ZC).length) { renderZoneChips(GW_ZC); return; }
  google.script.run
    .withSuccessHandler(function(cfg) { renderZoneChips(cfg || {}); })
    .withFailureHandler(function(e) {
      var w = document.getElementById('walkZoneChips');
      if (w) w.innerHTML = '<div style="color:var(--score-red);font-size:12px">Could not load zones: ' + escHtml(e && e.message || '') + '</div>';
    })
    .getZoneConfig();
}
function renderZoneChips(cfg) {
  var wrap = document.getElementById('walkZoneChips');
  if (!wrap) return;
  var ids = Object.keys(cfg).sort();

  if (ZONE_ID && cfg[ZONE_ID]) {
    selectedZone = ZONE_ID;
    wrap.innerHTML = '<div class="gw-zone-locked">' + escHtml(ZONE_ID + ' — ' + (cfg[ZONE_ID].name || ZONE_ID)) + ' <span>&#10003;</span></div>';
    updateProgress();
    return;
  }

  var groups = {};
  ids.forEach(function(id) { (groups[floorOf_(id)] = groups[floorOf_(id)] || []).push(id); });
  var html = '';
  ['Ground Floor', '1st Floor', '2nd Floor'].forEach(function(fl) {
    if (!groups[fl]) return;
    html += '<div class="gw-zone-group"><div class="gw-zone-floor">' + fl + '</div><div class="gw-chips">';
    groups[fl].forEach(function(id) {
      html += '<button type="button" class="gw-chip gw-chip--zone" data-zone="' + escHtml(id) + '" onclick="selectZone(\'' + escHtml(id) + '\')" title="' + escHtml(id) + '">' + escHtml(cfg[id].name || id) + '</button>';
    });
    html += '</div></div>';
  });
  wrap.innerHTML = html;
  updateProgress();
}
function selectZone(id) {
  selectedZone = id;
  document.querySelectorAll('#walkZoneChips .gw-chip--zone').forEach(function(b) {
    b.classList.toggle('selected', b.dataset.zone === id);
  });
  updateProgress();
}

/* ── Load questions for selected walk type ── */
function loadQuestions() {
  if (!selectedWalkType) return;
  var qList = document.getElementById('questionsList');
  if (qList) qList.innerHTML = '<div style="color:var(--text-muted);font-size:13px;">Loading questions…</div>';
  responses = {};
  google.script.run
    .withSuccessHandler(function(qs) {
      questions = qs || [];
      renderQuestions(questions);
    })
    .withFailureHandler(function() {
      questions = [];
      renderQuestions([]);
    })
    .getGembaWalkQuestions(selectedWalkType);
}

/* ── Render question cards ── */
function renderQuestions(qs) {
  var qList = document.getElementById('questionsList');
  if (!qList) return;
  if (qs.length === 0) {
    qList.innerHTML = '<div style="color:var(--text-muted);font-size:13px;">No questions configured for this walk type.</div>';
    updateProgress();
    return;
  }
  var html = '';
  qs.forEach(function(q, idx) {
    html += '<div class="gw-question">';
    html += '<div class="gw-question__text">' + escHtml(q.text || q.question || ('Question ' + (idx + 1))) + (q.required ? ' <span style="color:var(--score-red)">*</span>' : '') + '</div>';
    html += '<div class="gw-yn-btns">';
    html += '<button class="gw-yn-btn yes" id="q' + idx + '_yes" onclick="setResponse(\'' + escHtml(q.questionId || ('q' + idx)) + '\',' + idx + ',\'YES\')">Yes</button>';
    html += '<button class="gw-yn-btn no"  id="q' + idx + '_no"  onclick="setResponse(\'' + escHtml(q.questionId || ('q' + idx)) + '\',' + idx + ',\'NO\')">No</button>';
    html += '<button class="gw-yn-btn na"  id="q' + idx + '_na"  onclick="setResponse(\'' + escHtml(q.questionId || ('q' + idx)) + '\',' + idx + ',\'NA\')">N/A</button>';
    html += '</div>';
    html += '<div id="q' + idx + '_flag" style="display:none;font-size:11px;color:#b71c1c;font-weight:600;margin-top:6px">&#9888; A follow-up task will be auto-created for this finding.</div>';
    html += '</div>';
  });
  qList.innerHTML = html;
  updateProgress();
}

/* ── Record a response ── */
function setResponse(questionId, idx, val) {
  responses[questionId] = val;
  ['yes','no','na'].forEach(function(v) {
    var btn = document.getElementById('q' + idx + '_' + v);
    if (btn) btn.classList.toggle('selected', v.toUpperCase() === val);
  });
  var flag = document.getElementById('q' + idx + '_flag');
  if (flag) flag.style.display = (val === 'NO') ? 'block' : 'none';
  updateProgress();
}

/* ── Update progress bar and submit state ── */
function updateProgress() {
  var answered = Object.keys(responses).length;
  var total = questions.length;
  var pct = total > 0 ? Math.round(answered / total * 100) : 0;
  var bar = document.getElementById('progressBar');
  if (bar) bar.style.transform = 'scaleX(' + pct / 100 + ')';
  var txt = document.getElementById('progressText');
  if (txt) txt.textContent = answered + '/' + total;

  var allRequired = true;
  questions.forEach(function(q) {
    if (q.required && !responses[q.questionId || ('q' + questions.indexOf(q))]) allRequired = false;
  });
  var btn = document.getElementById('submitBtn');
  if (btn) btn.disabled = !allRequired || !selectedWalkType || !selectedZone;
}

/* ── Add action item row ── */
function addActionItem() {
  actionItemCount++;
  var div = document.createElement('div');
  div.className = 'action-item';
  div.innerHTML =
    '<b style="font-size:13px;">Action Item #' + actionItemCount + '</b>' +
    '<input type="text" placeholder="Title / What needs to be done?" data-field="title" class="ai-field">' +
    '<textarea rows="2" placeholder="Description (optional)" data-field="description" class="ai-field" style="margin-top:4px;"></textarea>' +
    '<input type="text" placeholder="Assign to (name)" data-field="assignedTo" class="ai-field">' +
    '<input type="date" data-field="dueDate" class="ai-field">';
  document.getElementById('actionItemsList').appendChild(div);
}

/* ── Submit the walk ── */
function submitWalk() {
  if (!validatePhotoOnMobile_()) return;
  var btn = document.getElementById('submitBtn');
  btn.disabled = true;
  document.getElementById('submitStatus').textContent = 'Submitting…';

  var actionItems = [];
  document.querySelectorAll('.action-item').forEach(function(item) {
    var ai = {};
    item.querySelectorAll('.ai-field').forEach(function(field) {
      ai[field.dataset.field] = field.value;
    });
    if (ai.title) actionItems.push(ai);
  });

  var walkData = {
    walkType: selectedWalkType,
    zoneId: selectedZone,
    walkerName: document.getElementById('walkerName').value,
    walkerEmail: '',
    responses: responses,
    observations: document.getElementById('observations').value,
    actionItems: actionItems,
    photoUrls: ''
  };

  function queueGembaOffline_(reason) {
    if (typeof offlineQueue !== 'undefined') {
      var gembaForQueue = Object.assign({}, walkData, { zone: walkData.zoneId });
      offlineQueue.queueSubmission('gemba', gembaForQueue).then(function() {
        btn.disabled = false;
        document.getElementById('submitStatus').innerHTML = '<span style="color:var(--score-amber);">Saved offline — will sync when online</span>';
        if (typeof pmToast === 'function') pmToast('Saved offline — will sync when online', 'info');
        if (typeof updateQueueStatus_ === 'function') updateQueueStatus_();
      }).catch(function(e2) {
        btn.disabled = false;
        document.getElementById('submitStatus').innerHTML = '<span style="color:var(--score-red);">Error: ' + escHtml(e2.message) + '</span>';
      });
    } else {
      btn.disabled = false;
      document.getElementById('submitStatus').innerHTML = '<span style="color:var(--score-red);">Error: ' + escHtml(reason) + '</span>';
    }
  }

  if (!navigator.onLine) { queueGembaOffline_('offline'); return; }

  google.script.run
    .withFailureHandler(function(e) {
      queueGembaOffline_(e.message);
    })
    .withSuccessHandler(function(result) {
      if (result.success) {
        if (typeof pmToast === 'function') pmToast('✓ Submitted', 'success');
        document.getElementById('submitStatus').innerHTML = '<span style="color:var(--score-green);">Walk submitted! ID: ' +
          escHtml(String(result.walkId)) +
          (result.taskIds && result.taskIds.length > 0 ? ' | ' + result.taskIds.length + ' tasks created' : '') +
          '</span>';
      } else {
        document.getElementById('submitStatus').innerHTML = '<span style="color:var(--score-red);">' + escHtml(result.message) + '</span>';
        btn.disabled = false;
      }
    })
    .submitGembaWalk(walkData);
}

/* ── Plan F: Form defaults, mobile detection, photo validation ── */
function initFormDefaults_() {
  var params = new URLSearchParams(window.location.search);
  var today = new Date().toISOString().split('T')[0];
  document.querySelectorAll('input[type="date"]').forEach(function(f) { if (!f.value) f.value = today; });
  var ownerField = document.getElementById('walkerName');
  if (ownerField && params.get('currentUser') && !ownerField.value) {
    ownerField.value = params.get('currentUser');
  }
  document.querySelectorAll('.form-section').forEach(function(el, idx) {
    el.classList.add('animate__animated', 'animate__fadeInUp');
    el.style.animationDelay = (idx * 0.08) + 's';
  });
  document.body.classList.add('has-sticky-submit');
}

function isMobileDevice_() {
  return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
}

function validatePhotoOnMobile_() {
  if (!isMobileDevice_()) return true;
  var photoInput = document.getElementById('photoInput') || document.querySelector('input[type="file"][accept*="image"]');
  if (!photoInput || !photoInput.files || photoInput.files.length === 0) {
    if (typeof pmToast === 'function') pmToast('Photo required on mobile', 'warning');
    return false;
  }
  return true;
}

loadWalkForm();
</script>
</body>
</html>
