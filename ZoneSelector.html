<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>PackMasters 5S — Select Zone</title>
<?!= include('CommonStyles') ?>
<style>
  body { min-height: 100vh; display: flex; flex-direction: column; }

  .zs-header {
    background: var(--bg-header);
    border-bottom: 2px solid var(--pm-accent);
    padding: 12px 18px;
    display: flex; align-items: center; gap: 12px;
  }
  .zs-logo {
    width: 34px; height: 34px; background: var(--pm-accent); border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 13px; color: #fff; letter-spacing: -0.5px; flex-shrink: 0;
  }
  .zs-header-title { font-size: var(--size-md); font-weight: 700; color: var(--text-primary); }
  .zs-header-sub { font-size: var(--size-xs); color: var(--text-muted); }

  .zs-body { flex: 1; padding: 14px 16px; max-width: 1180px; margin: 0 auto; width: 100%; }
  .zs-prompt { font-size: var(--size-sm); color: var(--text-secondary); margin-bottom: 10px; font-weight: 500; }

  /* Floor group header */
  .zs-floor-hdr {
    font-size: var(--size-xs); font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--pm-accent); margin: 14px 2px 6px;
  }
  .zs-floor-hdr:first-child { margin-top: 0; }

  /* Rows were 220px wide and 46px tall to carry a code and a truncated name —
     dead space to the right of every one, and the zone's actual state (score,
     open NCs, red tags) nowhere on the screen a worker starts from. 260px lets
     the longest zone name sit on one line WITH its numbers. */
  .zone-grid {
    display: grid;
    /* 320px, not 260. At 260 the numbers pushed the name into an ellipsis on
       almost every row ("Security ...", "Conferen..."), which is backwards: this
       is the screen where a worker finds their zone BY NAME. Fewer columns and
       a readable name beats one more column of truncated ones. */
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 5px;
  }
  .zone-row {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 10px; min-height: 44px;   /* 44px: the touch-target floor */
    background: var(--bg-card); border: 1px solid var(--bg-card-2);
    border-radius: 8px; text-decoration: none; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: border-color .12s, background .12s;
  }
  .zone-row:active, .zone-row:hover { border-color: var(--pm-accent); background: var(--bg-card-2); }
  .zone-row:focus-visible { outline: 3px solid var(--border-focus); outline-offset: 2px; }
  .zone-row .zid {
    font-family: var(--font-mono); font-size: 11px; font-weight: 800;
    color: var(--pm-accent); flex-shrink: 0; min-width: 34px;
  }
  .zone-row .znm {
    font-size: 12.5px; font-weight: 600; color: var(--text-primary);
    /* flex-shrink:0 up to its content: the stats yield first, so a long zone
       name stays whole and the pills drop off the end instead. */
    flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .zone-row .chev { color: var(--text-muted); flex-shrink: 0; opacity: .6; }

  /* ── Live state, loaded after the list paints ─────────────────────────────
     The score is the number a zone is judged on, so it is the only thing given
     colour. Counts stay neutral and only appear when non-zero: a row of "0 0 0"
     is noise that trains people to stop reading the row. */
  .zs-stats {
    display: flex; align-items: center; gap: 5px;
    flex: 0 1 auto; min-width: 0; overflow: hidden;
    margin-left: auto;   /* sits hard against the chevron, never mid-row */
  }
  .zs-score {
    font-family: var(--font-mono); font-size: 11.5px; font-weight: 800;
    min-width: 34px; text-align: right; letter-spacing: -.02em;
  }
  .zs-score.g { color: #15803d; }
  .zs-score.a { color: #b45309; }
  .zs-score.r { color: #b91c1c; }
  .zs-score.n { color: var(--text-muted); font-weight: 600; }
  .zs-pill {
    display: inline-flex; align-items: center; gap: 2px;
    font-family: var(--font-mono); font-size: 10px; font-weight: 700;
    padding: 1px 5px; border-radius: 5px; line-height: 1.5;
    background: var(--bg-card-2); color: var(--text-secondary);
  }
  .zs-pill.warn { background: #fef2f2; color: #b91c1c; }
  /* A zone with no audit today is the one thing a supervisor scans for, so it
     gets a mark rather than being silently identical to a zone at 100%. */
  .zs-pending { width: 6px; height: 6px; border-radius: 50%; background: var(--pm-accent); flex-shrink: 0; }
  .zs-legend { font-size: 10.5px; color: var(--text-muted); margin: 2px 2px 10px; }
  .zs-sheet { position: fixed; inset: 0; z-index: 90; background: rgba(15,23,42,.55);
    display: flex; align-items: flex-end; justify-content: center; padding: 12px; }
  .zs-sheet[hidden] { display: none; }
  .zs-sheet-card { width: 100%; max-width: 460px; background: var(--bg-card);
    border-radius: 18px 18px 12px 12px; padding: 16px; box-shadow: 0 -8px 32px rgba(0,0,0,.28); }
  .zs-sheet-hd { font-size: 13px; font-weight: 800; color: var(--text-secondary);
    letter-spacing: .02em; margin-bottom: 12px; }
  .zs-act { display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 12px 14px;
    margin-bottom: 10px; border: 1.5px solid var(--border); border-radius: 12px;
    background: var(--bg-card); text-decoration: none; color: inherit; }
  .zs-act:active, .zs-act:hover { border-color: var(--pm-accent); background: var(--bg-card-2); }
  .zs-act:focus-visible { outline: 3px solid var(--border-focus); outline-offset: 2px; }
  .zs-act-ic { font-size: 24px; line-height: 1; flex-shrink: 0; }
  .zs-act-t { display: block; font-size: 15px; font-weight: 700; }
  .zs-act-s { display: block; font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .zs-sheet-cancel { width: 100%; min-height: 48px; border: none; background: none;
    font-size: 14px; font-weight: 600; color: var(--text-secondary); cursor: pointer; }

  .zs-footer { padding: 14px 16px; text-align: center; border-top: 1px solid var(--bg-card-2); }
  .zs-continue {
    display: inline-block; width: 100%; max-width: 360px;
    padding: 12px 20px; box-sizing: border-box;
    background: var(--pm-accent); color: #fff; font-weight: 700; font-size: var(--size-sm);
    border-radius: 10px; text-decoration: none; transition: filter .15s;
  }
  .zs-continue:active { filter: brightness(0.92); }
</style>
</head>
<body>

<div class="zs-header">
  <div class="zs-logo">PM</div>
  <div>
    <div class="zs-header-title">PackMasters 5S</div>
    <div class="zs-header-sub">Tap your zone to start a quick audit</div>
  </div>
</div>

<div class="zs-body">
  <div id="zoneGrid">
    <div class="zone-grid">
      <a class="zone-row" style="pointer-events:none"><span class="pm-skeleton" style="height:11px;width:30px"></span><span class="pm-skeleton" style="height:12px;flex:1"></span></a>
      <a class="zone-row" style="pointer-events:none"><span class="pm-skeleton" style="height:11px;width:30px"></span><span class="pm-skeleton" style="height:12px;flex:1"></span></a>
    </div>
  </div>
</div>

<div class="zs-footer">
  <div class="zs-sheet" id="zsSheet" hidden role="dialog" aria-modal="true" aria-labelledby="zsSheetTitle">
    <div class="zs-sheet-card">
      <div class="zs-sheet-hd" id="zsSheetTitle"></div>
      <div id="zsSheetActions"></div>
      <button type="button" class="zs-sheet-cancel" onclick="closeZoneSheet()">Cancel</button>
    </div>
  </div>

  <a class="zs-continue" href="<?= deployUrl ?>?action=login" target="_top">
    Continue to Project &rarr;
  </a>
</div>

<script>
(function() {
  var zones = <?!= zonesJson ?>;
  var deployUrl = '<?!= deployUrl ?>';
  var container = document.getElementById('zoneGrid');
  container.innerHTML = '';

  /* Floor derived from zone number: 1-9 GF, 10-19 1F, 20+ 2F */
  var FLOORS = [
    { label: 'Ground Floor', lo: 1,  hi: 9  },
    { label: 'First Floor',  lo: 10, hi: 19 },
    { label: 'Second Floor', lo: 20, hi: 99 }
  ];
  function floorLabel(id) {
    var n = parseInt(String(id).replace(/\D/g, ''), 10) || 0;
    for (var i = 0; i < FLOORS.length; i++) if (n >= FLOORS[i].lo && n <= FLOORS[i].hi) return FLOORS[i];
    return { label: 'Other' };
  }
  var CHEV = '<svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';

  FLOORS.forEach(function(f) {
    var items = zones.filter(function(z) { return floorLabel(z.id).label === f.label; });
    if (!items.length) return;
    var hdr = document.createElement('div');
    hdr.className = 'zs-floor-hdr';
    hdr.textContent = f.label + ' · ' + items.length;
    container.appendChild(hdr);
    var grid = document.createElement('div');
    grid.className = 'zone-grid';
    items.forEach(function(z) {
      /* Tapping a zone opens an action sheet rather than jumping straight to
         QuickAudit: the same zone now has two worker entry points (audit and
         kaizen), and picking the zone first means neither screen re-asks. */
      var a = document.createElement('a');
      a.className = 'zone-row';
      a.href = deployUrl + '?v2=1&action=quickaudit&zone=' + encodeURIComponent(z.id);
      a.target = '_top';
      a.setAttribute('role', 'button');
      a.onclick = function(e) { e.preventDefault(); openZoneSheet(z.id, z.name); };
      a.setAttribute('data-zid', z.id);
      /* The stats slot is rendered empty and filled after the fetch, so the row
         never changes height when the numbers land — a list that reflows under
         a thumb mid-tap sends the worker to the wrong zone. */
      a.innerHTML = '<span class="zid">' + escHtml(z.id) + '</span>' +
                    '<span class="znm">' + escHtml(z.name) + '</span>' +
                    '<span class="zs-stats" data-stats="' + escHtml(z.id) + '"></span>' + CHEV;
      grid.appendChild(a);
    });
    container.appendChild(grid);
  });

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ── Live zone state ───────────────────────────────────────────────────────
     Fetched AFTER the list paints. The names and codes come from config and are
     instant; the numbers cost ~2.3s server-side for all 28 zones, and making a
     worker wait for them before they can tap their zone would be a bad trade.
     Rendered into a fixed-width slot so nothing reflows when they arrive. */
  function paintStats(stats) {
    if (!stats) return;
    Object.keys(stats).forEach(function (id) {
      var slot = document.querySelector('[data-stats="' + id.replace(/"/g, '') + '"]');
      if (!slot) return;
      var d = stats[id] || {};
      var html = '';

      /* Score first and the only coloured thing — it is what the zone is judged
         on. A zone with no audit yet shows a dash, not a zero: they mean
         opposite things and a 0 would read as a catastrophic score. */
      if (d.s === null || d.s === undefined) {
        html += '<span class="zs-score n" title="No audit recorded yet">--</span>';
      } else {
        var cls = d.s >= 80 ? 'g' : d.s >= 60 ? 'a' : 'r';
        html += '<span class="zs-score ' + cls + '" title="Latest 5S score">' + d.s + '%</span>';
      }

      /* Counts only when non-zero. Printing "0" three times per row across 28
         rows is 84 zeroes of noise that teaches people to stop reading. */
      if (d.n) html += '<span class="zs-pill warn" title="' + d.n + ' open NC(s)">NC ' + d.n + '</span>';
      if (d.r) html += '<span class="zs-pill" title="' + d.r + ' active red tag(s)">RT ' + d.r + '</span>';
      /* A missing audit is what a supervisor scans for, so it is marked. */
      if (!d.d) html += '<span class="zs-pending" title="Audit not submitted today"></span>';

      slot.innerHTML = html;
    });
  }

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(paintStats)
      .withFailureHandler(function () { /* names still work; numbers are a bonus */ })
      .getZoneSelectorStats();
  }

  /* Zone action sheet — two worker destinations for the tapped zone. Both
     carry &zone= so the destination screen is already scoped. */
  var sheet = document.getElementById('zsSheet');
  var sheetTitle = document.getElementById('zsSheetTitle');
  var sheetActions = document.getElementById('zsSheetActions');

  function openZoneSheet(id, name) {
    sheetTitle.textContent = id + ' — ' + name;
    var q = '&zone=' + encodeURIComponent(id);
    sheetActions.innerHTML =
      '<a class="zs-act" target="_top" href="' + deployUrl + '?v2=1&action=quickaudit' + q + '">' +
        '<span class="zs-act-ic">&#9989;</span>' +
        '<span><span class="zs-act-t">Quick Audit</span>' +
        '<span class="zs-act-s">Score this zone now</span></span></a>' +
      '<a class="zs-act" target="_top" href="' + deployUrl + '?v2=1&action=kaizen' + q + '">' +
        '<span class="zs-act-ic">&#128161;</span>' +
        '<span><span class="zs-act-t">Kaizen Idea</span>' +
        '<span class="zs-act-s">Suggest an improvement</span></span></a>';
    sheet.hidden = false;
    document.body.style.overflow = 'hidden';
    var first = sheetActions.querySelector('.zs-act'); if (first) first.focus();
  }
  window.closeZoneSheet = function() {
    sheet.hidden = true;
    document.body.style.overflow = '';
  };
  sheet.addEventListener('click', function(e) { if (e.target === sheet) closeZoneSheet(); });
  document.addEventListener('keydown', function(e) { if (e.key === 'Escape' && !sheet.hidden) closeZoneSheet(); });
})();
</script>
</body>
</html>
