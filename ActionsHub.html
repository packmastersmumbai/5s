    rawStatus: newStatus,

    okMsg: (newStatus === 'DONE') ? 'Task done.' : 'Task started.',

/* ── btn helpers ── */

/* ── toast ── */
function showToast(msg, type) {
  if (typeof pmToast === 'function') {
    pmToast(msg, type || 'info');
  } else {
    alert(msg);
  }
}

/* Translate a raw server error into short, actionable floor copy. GAS pushes
   exception strings like "Exception: Service invoked too many times" that mean
   nothing to a gloved worker — map the common ones, generic-fallback the rest,
   never surface a stack. */
function friendlyError_(e) {
  var raw = (e && e.message ? String(e.message) : String(e || '')).toLowerCase();
  if (!raw) return 'Something went wrong. Please try again.';
  if (/network|fetch|timeout|timed out|unavailable|too many times|rate/.test(raw))
    return 'Connection problem. Check your network and try again.';
  if (/permission|not allowed|denied|auth/.test(raw))
    return "You don't have permission for that action.";
  if (/not found|no such|missing/.test(raw))
    return 'That record could no longer be found — it may have changed. Refreshing…';
  if (/lock|busy|concurrent/.test(raw))
    return 'Someone else is editing this. Wait a moment and try again.';
  return 'Could not complete that action. Please try again.';
}

/* Toast with an inline Undo action. Falls back to a plain toast if the toast
   host has no action support (pmToast is fire-and-forget). */
function showUndoToast_(msg, onUndo) {
  if (typeof pmToast === 'function' && pmToast.length >= 3) {
    pmToast(msg, 'success', { actionLabel: 'Undo', onAction: onUndo, duration: 6000 });
    return;
  }
  /* Minimal self-contained undo bar — no dependency on the host toast. */
  var bar = document.createElement('div');
  bar.className = 'ah-undo';
  bar.innerHTML = '<span>' + escHtml(msg) + '</span><button type="button" class="ah-undo-btn">Undo</button>';
  document.body.appendChild(bar);
  var t = setTimeout(function(){ bar.remove(); }, 6000);
  bar.querySelector('.ah-undo-btn').addEventListener('click', function(){
    clearTimeout(t); bar.remove(); onUndo();
  });
}

/* ── CREATE MODAL ── */
var _acType = 'NC';
var _acZonesLoaded = false;

function openCreateModal() {
  _acType = 'NC';
  // reset type buttons
  document.querySelectorAll('.ac-type-btn').forEach(function(b) {
    b.classList.toggle('active', b.getAttribute('data-actype') === 'NC');
  });

  document.getElementById('acZone').value = '';
  document.getElementById('acNcPillar').value = 'S1';
  document.getElementById('acNcDesc').value = '';
  document.getElementById('acNcPerson').value = '';
  document.getElementById('acTaskTitle').value = '';
  document.getElementById('acTaskDesc').value = '';
  document.getElementById('acTaskPriority').value = 'MEDIUM';
  document.getElementById('acTaskAssigned').value = '';
  document.getElementById('acTaskDue').value = '';
  document.getElementById('acRtItem').value = '';
  document.getElementById('acRtQty').value = '1';
  document.getElementById('acRtCat').value = 'Equipment';
  document.getElementById('acRtReason').value = '';
  document.getElementById('acRtAction').value = '';
  _acPhotos = [];
  acRenderPhotos();
  document.getElementById('acPhotoNote').textContent = '';
  // populate zone select from existing filter dropdown (reuse loadZones data)
  if (!_acZonesLoaded) {
    var src = document.getElementById('ahZoneSelect');
    var dst = document.getElementById('acZone');
    // clear all but first placeholder
    while (dst.options.length > 1) { dst.remove(1); }
    for (var i = 1; i < src.options.length; i++) {
      var o = document.createElement('option');
      o.value = src.options[i].value;
      o.textContent = src.options[i].textContent;
      dst.appendChild(o);
    }
    if (src.options.length > 1) { _acZonesLoaded = true; }
  }
  /* Default to the zone the list is already filtered to. The select opened
     blank every time, so submitting without noticing the dropdown produced
     "Please select a zone." and looked like a broken Create button. When the
     list shows all zones there is no safe default, so it stays blank and the
     required-field guard still applies. */
  var curZone = document.getElementById('ahZoneSelect');
  var wanted = curZone ? curZone.value : '';
  document.getElementById('acZone').value =
    (wanted && wanted !== 'ALL') ? wanted : '';
  var btn = document.getElementById('acSubmitBtn');
  btn.disabled = false;
  btn.textContent = 'Create';
  document.getElementById('acCreateModal').classList.add('open');
  document.getElementById('acBackdrop').classList.add('open');
}

function closeCreateModal() {
  document.getElementById('acCreateModal').classList.remove('open');
  document.getElementById('acBackdrop').classList.remove('open');
}

function setCreateType(type, btn) {
  _acType = type;
  document.querySelectorAll('.ac-type-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  _showCreateGroup(type);
}

function _showCreateGroup(type) {
  ['NC','TASK','RED_TAG'].forEach(function(t) {
    var el = document.getElementById('acGrp' + t);
    if (el) { el.style.display = (t === type) ? '' : 'none'; }
  });
}

var _pillarSqcdp = { S1:'S', S2:'Q', S3:'C', S4:'D', S5:'P' };

/* ── Media evidence (images + short video) ────────────────────────────────
   One handler serves the create modal, the RCA start form and the closure
   form. Each picker passes its own state array and re-render function.

   Images: compress -> annotate -> store as a data URL.
   Video:  size-checked only. Re-encoding in-browser costs about the clip's own
           duration and is unreliable on the phones in use, so clips are kept
           small at CAPTURE time and anything over budget is refused with its
           real size rather than silently uploaded or truncated. */
function acHandleMediaPick_(input, store, rerender, noteId, stampFn) {
  var files = Array.prototype.slice.call(input.files || []);
  input.value = '';                       /* allow re-picking the same file */
  if (!files.length) return;

  var note = document.getElementById(noteId);
  var room = AC_MAX_PHOTOS - store.length;
  if (room <= 0) { note.textContent = 'Limit of ' + AC_MAX_PHOTOS + ' items reached.'; return; }

  var queued = files.slice(0, room);
  var skipped = files.length - queued.length;
  var pending = queued.length, problems = [];

  note.textContent = 'Processing ' + pending + ' file(s)\u2026';

  function done(msg) {
    if (msg) problems.push(msg);
    if (--pending > 0) return;
    rerender();
    var tail = [];
    if (skipped) tail.push(skipped + ' skipped (limit ' + AC_MAX_PHOTOS + ')');
    if (problems.length) tail.push(problems.join(' '));
    if (tail.length) note.textContent = tail.join(' \u00b7 ');
  }

  queued.forEach(function(file) {
    if (pmIsVideo(file)) {
      pmPrepareVideo(file, function(res) {
        if (!res.ok) return done(res.error);
        store.push({ dataUrl: res.dataUrl, isVideo: true, ext: pmMediaExt(file),
                     label: res.mb + ' MB' });
        done();
      });
      return;
    }
    var reader = new FileReader();
    reader.onload = function(e) {
      pmCompressImage(e.target.result, function(compressed) {
        openAnnotatorFor_(compressed, stampFn(), function(annotated) {
          store.push({ dataUrl: annotated || compressed, isVideo: false, ext: 'jpg' });
          done();
        });
      });
    };
    reader.onerror = function() { done('Could not read ' + file.name + '.'); };
    reader.readAsDataURL(file);
  });
}

/* Thumbnail markup shared by every strip. Video shows a play badge instead of
   a still, since a video data URL cannot be drawn into an <img>. */
function acThumb_(item, i, removeFn) {
  var inner = item.isVideo
    ? '<div class="ac-vid"><span class="ac-vid-ic">&#9654;</span>' +
      '<span class="ac-vid-sz">' + escHtml(item.label || 'video') + '</span></div>'
    : '<img src="' + item.dataUrl + '" alt="Evidence ' + (i + 1) + '">';
  return '<div class="ac-thumb">' + inner +
    '<button type="button" class="ac-thumb-x" aria-label="Remove item ' + (i + 1) + '"' +
    ' onclick="' + removeFn + '(' + i + ')">&times;</button></div>';
}

/* ── Photo evidence ───────────────────────────────────────────────────────
   Every photo goes through the SAME pipeline the audit forms use:
     pick -> pmCompressImage (1024px long edge, q0.70, one encode)
          -> PMAnnot overlay (shared module, see PhotoAnnot.html)
          -> base64 handed to the server, which writes it to the zone's Drive
             folder under yyyy/MM via uploadPhotoToDrive().
   Compression happens BEFORE annotation so the annotator canvas is already
   bounded; the annotator's own save re-encodes once at 0.78, which is the
   same two-pass budget QuickAudit uses. Result lands in the 5-50 KB band. */
/* Raised from 3: a finding often needs several angles, and evidence is now
   images OR short clips. The ceiling is a practical one — each item crosses the
   google.script.run bridge as base64, and the measured upload budget is ~6 MB
   per file. */
var AC_MAX_PHOTOS = 8;
var _acPhotos = [];          /* [{ dataUrl }] - annotated, compressed, ready to send */

function acPickPhoto() {
  if (_acPhotos.length >= AC_MAX_PHOTOS) return;
  document.getElementById('acPhotoInput').click();
}

function acOnPhotoPicked(input) {
  acHandleMediaPick_(input, _acPhotos, acRenderPhotos, 'acPhotoNote', function() {
    return {
      zone:    document.getElementById('acZone').value || '',
      auditor: (typeof CURRENT_USER !== 'undefined' ? CURRENT_USER : ''),
      date:    new Date().toISOString().slice(0, 10)
    };
  });
}

function acRenderPhotos() {
  var strip = document.getElementById('acPhotoStrip');
  strip.innerHTML = _acPhotos.map(function(ph, i) {
    return acThumb_(ph, i, 'acRemovePhoto');
  }).join('');
  var add = document.getElementById('acPhotoAdd');
  add.disabled = _acPhotos.length >= AC_MAX_PHOTOS;
  add.textContent = _acPhotos.length ? '\uD83D\uDCF7 Add another' : '\uD83D\uDCF7 Add photo';
  var kb = _acPhotos.reduce(function(n, ph) { return n + pmDataUrlKB(ph.dataUrl); }, 0);
  document.getElementById('acPhotoNote').textContent =
    _acPhotos.length ? _acPhotos.length + ' photo(s) \u00b7 ' + kb + ' KB total' : '';
}

function acRemovePhoto(i) { _acPhotos.splice(i, 1); acRenderPhotos(); }

function acEditPhoto(i) {
  var ph = _acPhotos[i];
  if (!ph) return;
  openAnnotatorFor_(ph.dataUrl, {
    zone:    document.getElementById('acZone').value || '',
    auditor: (typeof CURRENT_USER !== 'undefined' ? CURRENT_USER : ''),
    date:    new Date().toISOString().slice(0, 10)
  }, function(annotated) {
    if (annotated) { _acPhotos[i].dataUrl = annotated; acRenderPhotos(); }
  });
}

/** Payload for one evidence item: "<ext>|<base64>". @private */
function acMediaPayload_(item) {
  var b64 = String(item.dataUrl).split(',')[1] || '';
  if (!b64) return '';
  return (item.ext || 'jpg') + '|' + b64;
}

/** Strips the data: prefix - the server expects raw base64. @private */
function acPhotosB64_() {
  return _acPhotos.map(acMediaPayload_).filter(Boolean);
}

function submitCreate() {
  var zoneEl = document.getElementById('acZone');
  var zone = zoneEl.value.trim();
  if (!zone) {
    /* Scroll + focus the offending field: the toast alone read as "nothing
       happened" when the modal was scrolled past the zone select. */
    showToast('Please select a zone.', 'error');
    zoneEl.scrollIntoView({ block: 'center' });
    zoneEl.focus();
    return;
  }

  var btn = document.getElementById('acSubmitBtn');

  if (_acType === 'NC') {
    var desc = document.getElementById('acNcDesc').value.trim();
    if (!desc) { showToast('Description is required for NC.', 'error'); return; }
    var pillar = document.getElementById('acNcPillar').value;
    var sqcdp  = _pillarSqcdp[pillar] || 'S';
    var person = document.getElementById('acNcPerson').value.trim();
    btn.disabled = true; btn.textContent = 'Creating…';
    google.script.run
      .withSuccessHandler(function(ncId) {
        btn.disabled = false; btn.textContent = 'Create';
        if (ncId) {
          showToast('NC created: ' + escHtml(String(ncId)), 'success');
          closeCreateModal();
          fetchAndRender(false, true);
        } else {
          showToast('Server returned no NC ID. Please retry.', 'error');
        }
      })
      .withFailureHandler(function(e) {
        btn.disabled = false; btn.textContent = 'Create';
        showToast(friendlyError_(e), 'error');
      })
      .createCAPA(zone, desc, 'NC', pillar, sqcdp, person, CURRENT_USER, '', acPhotosB64_());

  } else if (_acType === 'TASK') {
    var title = document.getElementById('acTaskTitle').value.trim();
    if (!title) { showToast('Title is required for Task.', 'error'); return; }
    btn.disabled = true; btn.textContent = 'Creating…';
    google.script.run
      .withSuccessHandler(function(result) {
        btn.disabled = false; btn.textContent = 'Create';
        if (result && result.success) {
          showToast('Task created: ' + escHtml(String(result.taskId || '')), 'success');
          closeCreateModal();
          fetchAndRender(false, true);
        } else {
          showToast((result && result.message) || 'Failed to create task.', 'error');
        }
      })
      .withFailureHandler(function(e) {
        btn.disabled = false; btn.textContent = 'Create';
        showToast(friendlyError_(e), 'error');
      })
      .createTask({
        title:       title,
        zoneId:      zone,
        description: document.getElementById('acTaskDesc').value.trim(),
        priority:    document.getElementById('acTaskPriority').value,
        assignedTo:  document.getElementById('acTaskAssigned').value.trim(),
        dueDate:     document.getElementById('acTaskDue').value,
        source:      'MANUAL',
        createdBy:   CURRENT_USER,
        photosB64:   acPhotosB64_()
      });

  } else if (_acType === 'RED_TAG') {
    var item = document.getElementById('acRtItem').value.trim();
    if (!item) { showToast('Item is required for Red Tag.', 'error'); return; }
    btn.disabled = true; btn.textContent = 'Creating…';
    google.script.run
      .withSuccessHandler(function(result) {
        btn.disabled = false; btn.textContent = 'Create';
        if (result && (result.ok || result.success)) {
          showToast('Red Tag raised: ' + escHtml(String(result.tagNo || '')), 'success');
          closeCreateModal();
          fetchAndRender(false, true);
        } else {
          showToast((result && result.message) || 'Failed to raise Red Tag.', 'error');
        }
      })
      .withFailureHandler(function(e) {
        btn.disabled = false; btn.textContent = 'Create';
        showToast(friendlyError_(e), 'error');
      })
      .raiseRedTag({
        zone:     zone,
        item:     item,
        quantity: parseInt(document.getElementById('acRtQty').value, 10) || 1,
        category: document.getElementById('acRtCat').value,
        reason:   document.getElementById('acRtReason').value.trim(),
        action:   document.getElementById('acRtAction').value.trim(),
        taggedBy: CURRENT_USER,
        createdBy: CURRENT_USER,
        photosB64: acPhotosB64_()
      });
  }
}

/* also invalidate zone cache when loadZones refreshes */
var _origLoadZones = loadZones;
loadZones = function() {
  _acZonesLoaded = false;
  _origLoadZones();
};

/* ── patch renderCards to store items for inline detail ── */
var _origRenderCards = renderCards;
renderCards = function(items) {
  window._lastItems = items;
  _origRenderCards(items);
};

loadZones();

/* Tasks is the one page where status is the primary axis of the work -- what
   is open, what is moving, what is done -- so it keeps the tab strip. The
   strip has been in the DOM all along but nothing ever showed it: setTypeTab,
   its only caller, handles type tabs that were deleted last session and so
   never runs. The filter rail that once carried a competing Status picker has
   since been retired entirely, so the strip is now the only status control in
   the app. */
(function () {
  var strip = document.getElementById('ahStatusTabs');
  var show  = (PAGE_TYPE === 'TASK');
  if (strip) strip.style.display = show ? '' : 'none';
  if (!show) return;
  var cur = _filters.status || 'OPEN';
  document.querySelectorAll('.ah-status-tab').forEach(function (b) {
    b.classList.toggle('active', b.getAttribute('data-status') === cur);
  });
})();

fetchAndRender();
