<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaizen Board — PackMasters 5S</title>
<?!= include("CommonStyles") ?>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-main);
  background: var(--bg-page);
  color: var(--text-primary);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── HEADER ─────────────────────────────── */
.hdr {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 13px 20px;
  background: var(--bg-header);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 100;
  flex-wrap: wrap; gap: 10px;
}

.hdr-left { display: flex; align-items: center; gap: 12px; }

.back-btn {
  width: 32px; height: 32px; border-radius: var(--r);
  background: var(--bg-card-2);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  text-decoration: none; color: var(--text-primary); font-size: 16px;
  transition: background var(--trans);
  flex-shrink: 0;
}
.back-btn:active { background: var(--border); }

.hdr-title {
  font-family: var(--font-display);
  font-weight: 700; font-size: 17px; letter-spacing: 0.3px;
  color: var(--pm-primary); line-height: 1;
}
.hdr-sub {
  font-family: var(--font-mono);
  font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--text-muted); margin-top: 3px;
}

.hdr-right { display: flex; align-items: center; gap: 8px; }

.refresh-btn {
  background: var(--bg-card-2);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  padding: 5px 13px; border-radius: var(--r-sm);
  cursor: pointer; font-size: 12px;
  font-family: var(--font-mono); letter-spacing: .3px;
  transition: background var(--trans), color var(--trans), border-color var(--trans);
}
.refresh-btn:hover { background: var(--pm-primary-soft); color: var(--pm-primary); border-color: var(--pm-primary); }
.refresh-btn:active { transform: scale(.97); }

/* ── BOARD ──────────────────────────────── */
.board-wrap {
  display: flex;
  gap: 10px;
  padding: 16px 20px;
  overflow-x: auto;
  min-height: calc(100vh - 64px);
  -webkit-overflow-scrolling: touch;
}

.column {
  min-width: 240px;
  flex: 1;
  background: var(--bg-card-2);
  border-radius: var(--r-lg);
  border: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.col-header {
  padding: 10px 14px;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 13px;
  text-align: center;
  color: #fff;
  border-radius: var(--r-lg) var(--r-lg) 0 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
}

.col-count {
  background: rgba(255,255,255,.22);
  padding: 1px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  font-family: var(--font-mono);
}

.col-body { padding: 8px; flex: 1; overflow-y: auto; min-height: 80px; }

/* ── CARDS ──────────────────────────────── */
.card {
  background: var(--bg-card);
  border-radius: var(--r);
  padding: 12px;
  margin-bottom: 8px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border-light);
  border-left: 3px solid var(--pm-accent);
  transition: box-shadow var(--trans), transform var(--trans);
}
.card:active { transform: scale(.98); box-shadow: var(--shadow-lg); }

.card-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: var(--size-sm);
  color: var(--text-primary);
  margin-bottom: 5px;
  line-height: 1.3;
}

.card-meta {
  font-size: var(--size-xs);
  color: var(--text-muted);
  margin-top: 3px;
  line-height: 1.4;
}

.card-savings {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  background: var(--score-green-bg);
  color: var(--score-green);
  font-size: var(--size-xs);
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 10px;
  margin-top: 6px;
}

.card-actions {
  display: flex;
  gap: 5px;
  margin-top: 8px;
}

.card-actions button {
  flex: 1;
  padding: 6px 4px;
  font-size: var(--size-xs);
  font-family: var(--font-main);
  font-weight: 600;
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  background: var(--bg-card-2);
  color: var(--text-secondary);
  cursor: pointer;
  min-height: 30px;
  transition: background var(--trans), color var(--trans), border-color var(--trans);
}
.card-actions button:hover { background: var(--pm-primary-soft); color: var(--pm-primary); border-color: var(--pm-primary); }
.card-actions button:active { transform: scale(.97); }

/* ── LOADING / EMPTY ────────────────────── */
.loading-state {
  display: flex; align-items: center; justify-content: center;
  height: 60vh; flex-direction: column; gap: 14px;
}
.spin {
  width: 32px; height: 32px;
  border: 3px solid var(--border);
  border-top-color: var(--pm-primary);
  border-radius: 50%;
  animation: pm-spin .9s linear infinite;
}
@keyframes pm-spin { to { transform: rotate(360deg); } }
.loading-label {
  font-family: var(--font-mono);
  font-size: 11px; letter-spacing: 1.5px;
  color: var(--text-muted); text-transform: uppercase;
}

/* ── RESPONSIVE ─────────────────────────── */
@media (max-width: 600px) {
  .board-wrap { flex-direction: column; padding: 12px; }
  .column { min-width: auto; }
}

/* Review dialog: one dialog, fields switched by stage. Review captures a
   decision and a reason; approval captures an owner and a date; completion
   captures what was actually delivered against the estimate. */
.kzb-scrim { position: fixed; inset: 0; background: rgba(15,23,42,.55); z-index: 900; }
.kzb-dlg {
  position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
  width: min(520px, 94vw); max-height: 86vh; overflow-y: auto; z-index: 901;
  background: #fff; border-radius: 14px; padding: 18px;
  box-shadow: 0 24px 60px rgba(0,0,0,.3);
}
.kzb-dlg h3 { font-size: 16px; font-weight: 800; margin: 0 0 2px; }
.kzb-dlg .kzb-sub { font-size: 12.5px; color: #64748b; margin-bottom: 14px; }
.kzb-ctx { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 9px;
  padding: 10px 12px; margin-bottom: 14px; font-size: 13px; }
.kzb-ctx b { display: block; font-size: 14px; margin-bottom: 3px; }
.kzb-ctx span { color: #64748b; font-size: 12px; }
.kzb-fld { margin-bottom: 13px; }
.kzb-fld label { display: block; font-size: 12.5px; font-weight: 700; margin-bottom: 4px; }
.kzb-fld input, .kzb-fld textarea, .kzb-fld select {
  width: 100%; padding: 9px 10px; font-size: 14px; font-family: inherit;
  border: 1px solid #d4d8e2; border-radius: 8px; box-sizing: border-box;
}
.kzb-fld textarea { min-height: 66px; resize: vertical; }
.kzb-hint { font-size: 12px; color: #64748b; margin-top: 3px; }
.kzb-vs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kzb-vs .kzb-est { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px;
  padding: 9px 10px; font-size: 13px; }
.kzb-vs .kzb-est b { display: block; font-family: var(--font-mono, monospace); font-size: 16px; }
.kzb-ft { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
.kzb-ft button { min-height: 44px; padding: 0 18px; border-radius: 9px; cursor: pointer;
  font: inherit; font-weight: 700; border: 1px solid #d4d8e2; background: #fff; }
.kzb-ft .kzb-go { background: #0F172A; border-color: #0F172A; color: #fff; }
.kzb-ft .kzb-go.danger { background: #C92A2A; border-color: #C92A2A; }
.card-actions .kzb-reject { border-color: #e2b3b3; color: #C92A2A; }
</style>
</head>
<body>

<!-- ══════════ HEADER ══════════ -->
<header class="hdr">
  <div class="hdr-left">
    <a class="back-btn" href="<?= deployUrl ?>" target="_top" title="Home">←</a>
    <div>
      <div class="hdr-title">Kaizen Board</div>
      <div class="hdr-sub">Continuous Improvement Ideas</div>
    </div>
  </div>
  <div class="hdr-right">
    <button class="refresh-btn" onclick="loadKaizen()">↻ Refresh</button>
  </div>
</header>

<!-- ══════════ BOARD ══════════ -->
<div id="kzBoard">
  <div class="loading-state">
    <div class="spin"></div>
    <div class="loading-label">Loading Kaizen data</div>
  </div>
</div>

<script>
// Auth guard — read from URL param first (GAS iframe navigation), then localStorage
(function() {
  var params = new URLSearchParams(window.location.search);
  var urlToken = params.get('token');
  if (urlToken) localStorage.setItem('pm5s_token', urlToken);
  var token = localStorage.getItem('pm5s_token');
  if (!token) {
    window.pm5sNav('<?= deployUrl ?>?v2=1&action=login');
    return;
  }
  window.PM5S_TOKEN = token;
})();

function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}


/* Stage-appropriate labels: "Move -> Under Review" names the mechanism,
   "Start review" names the job. */
var KZ_ACTION = {
  SUBMITTED:    'Start review',
  UNDER_REVIEW: 'Approve',
  APPROVED:     'Start implementing',
  IMPLEMENTING: 'Mark complete',
  COMPLETED:    'Verify benefit'
};

var _kzReview = null;
var KZ_USER = (function(){
  try { return new URLSearchParams(window.location.search).get('currentUserName') || ''; }
  catch(e) { return ''; }
})();

function openReview(item, fromKey, nextKey) {
  _kzReview = { item: item, next: nextKey, from: fromKey };
  var body = '', title = '', sub = '', cta = 'Save', danger = false;

  if (fromKey === 'REJECT') {
    title = 'Reject this kaizen'; cta = 'Reject'; danger = true;
    sub = 'The submitter sees this reason, so make it specific.';
    body = fld('kzbRemarks', 'Reason', 'textarea', '', 'Why this cannot proceed, and what would change that.');
  } else if (fromKey === 'SUBMITTED') {
    title = 'Start review'; sub = 'Record who is reviewing it.';
    body = fld('kzbReviewer', 'Reviewer', 'text', KZ_USER, '') +
           fld('kzbRemarks', 'First assessment (optional)', 'textarea', '', '');
  } else if (fromKey === 'UNDER_REVIEW') {
    title = 'Approve kaizen'; sub = 'Approval needs an owner and a date, or nothing happens next.';
    body = fld('kzbAssignee', 'Assign to', 'text', item.assignedTo || '', 'Who will implement it.') +
           fld('kzbTarget', 'Target date', 'date', '', '') +
           fld('kzbRemarks', 'Approval note (optional)', 'textarea', '', '');
  } else if (fromKey === 'APPROVED') {
    title = 'Start implementing'; sub = 'Confirm the owner before work starts.';
    body = fld('kzbAssignee', 'Owner', 'text', item.assignedTo || '', '') +
           fld('kzbRemarks', 'Plan note (optional)', 'textarea', '', '');
  } else if (fromKey === 'IMPLEMENTING') {
    title = 'Mark complete'; sub = 'What was actually done, and what it actually delivered.';
    body = fld('kzbNotes', 'What was implemented', 'textarea', '', 'The countermeasure as it was actually built.') +
           '<div class="kzb-fld"><label>Actual saving (\u20B9 per month)</label><div class="kzb-vs">' +
             '<div class="kzb-est">Estimated<b>\u20B9' + (item.estimatedSavings || 0) + '</b></div>' +
             '<div><input type="number" id="kzbActual" min="0" step="100" placeholder="Actual"></div>' +
           '</div><div class="kzb-hint">Leave blank if it is not yet measurable.</div></div>';
  } else if (fromKey === 'COMPLETED') {
    title = 'Verify the benefit'; sub = 'An independent check that the gain is real and holding.';
    body = fld('kzbVerifier', 'Verified by', 'text', KZ_USER, 'Someone other than the implementer.') +
           fld('kzbActual', 'Confirmed saving (\u20B9/month)', 'number', item.actualSavings || '', '') +
           fld('kzbRemarks', 'Verification note', 'textarea', '', 'What you checked, and when.');
  }

  var host = document.createElement('div');
  host.id = 'kzbHost';
  host.innerHTML =
    '<div class="kzb-scrim" onclick="closeReview()"></div>' +
    '<div class="kzb-dlg" role="dialog" aria-modal="true">' +
      '<h3>' + escHtml(title) + '</h3><div class="kzb-sub">' + escHtml(sub) + '</div>' +
      '<div class="kzb-ctx"><b>' + escHtml(item.title) + '</b>' +
        '<span>' + escHtml(item.kaizenId) + ' \u00B7 ' + escHtml(item.zoneName || '') +
        ' \u00B7 by ' + escHtml(item.submitterName || '') + '</span></div>' +
      body +
      '<div class="kzb-ft"><button type="button" onclick="closeReview()">Cancel</button>' +
      '<button type="button" class="kzb-go' + (danger ? ' danger' : '') + '" onclick="submitReview()">' +
      escHtml(cta) + '</button></div>' +
    '</div>';
  document.body.appendChild(host);
  var first = host.querySelector('input,textarea');
  if (first) first.focus();
}

function fld(id, label, type, value, hint) {
  var input = (type === 'textarea')
    ? '<textarea id="' + id + '">' + escHtml(value) + '</textarea>'
    : '<input type="' + type + '" id="' + id + '" value="' + escHtml(String(value)) + '">';
  return '<div class="kzb-fld"><label for="' + id + '">' + escHtml(label) + '</label>' + input +
         (hint ? '<div class="kzb-hint">' + escHtml(hint) + '</div>' : '') + '</div>';
}

function closeReview() {
  var h = document.getElementById('kzbHost');
  if (h) h.parentNode.removeChild(h);
  _kzReview = null;
}

function v_(id) { var e = document.getElementById(id); return e ? String(e.value).trim() : ''; }

function submitReview() {
  if (!_kzReview) return;
  var r = _kzReview, extra = {};
  if (v_('kzbReviewer')) extra.reviewer = v_('kzbReviewer');
  if (v_('kzbAssignee')) extra.assignedTo = v_('kzbAssignee');
  if (v_('kzbTarget'))   extra.targetDate = v_('kzbTarget');
  if (v_('kzbActual'))   extra.actualSavings = parseInt(v_('kzbActual'), 10) || 0;
  if (v_('kzbNotes'))    extra.implementationNotes = v_('kzbNotes');
  if (v_('kzbVerifier')) extra.verifiedBy = v_('kzbVerifier');

  if (r.from === 'REJECT' && !v_('kzbRemarks')) { alert('Give a reason so the submitter knows why.'); return; }
  if (r.from === 'UNDER_REVIEW' && !v_('kzbAssignee')) { alert('Approval needs an owner.'); return; }

  var btn = document.querySelector('.kzb-go');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving\u2026'; }
  google.script.run
    .withFailureHandler(function(e) { alert('Error: ' + e.message); if (btn) btn.disabled = false; })
    .withSuccessHandler(function() { closeReview(); loadKaizen(); })
    .updateKaizenStatus(r.item.kaizenId, r.next, v_('kzbRemarks'), extra);
}

var COLS = [
  { key: "SUBMITTED",       label: "Submitted",    color: "#6c757d" },
  { key: "UNDER_REVIEW",    label: "Under Review", color: "#6741D9" },
  { key: "APPROVED",        label: "Approved",     color: "#1864AB" },
  { key: "IMPLEMENTING",    label: "Implementing", color: "#E67700" },
  { key: "COMPLETED",       label: "Completed",    color: "#2F9E44" },
  { key: "BENEFIT_VERIFIED",label: "Verified",     color: "#0B7C45" }
];

function loadKaizen() {
  document.getElementById('kzBoard').innerHTML =
    '<div class="loading-state"><div class="spin"></div><div class="loading-label">Loading…</div></div>';
  google.script.run
    .withFailureHandler(function(e) {
      document.getElementById('kzBoard').innerHTML =
        '<div class="loading-state"><div class="loading-label" style="color:var(--score-red)">Error: ' + escHtml(e.message) + '</div></div>';
    })
    .withSuccessHandler(renderBoard)
    .getKaizenData({});
}

function renderBoard(items) {
  var board = document.createElement('div');
  board.className = 'board-wrap';

  COLS.forEach(function(col) {
    var colItems = items.filter(function(i) { return i.status === col.key; });

    var div = document.createElement('div');
    div.className = 'column';

    var header = document.createElement('div');
    header.className = 'col-header';
    header.style.background = col.color;
    header.innerHTML = escHtml(col.label) + ' <span class="col-count">' + colItems.length + '</span>';
    div.appendChild(header);

    var body = document.createElement('div');
    body.className = 'col-body';

    colItems.forEach(function(item) {
      var card = document.createElement('div');
      card.className = 'card';

      var savingsHtml = item.estimatedSavings
        ? '<div class="card-savings">₹' + escHtml(String(item.estimatedSavings)) + '/mo</div>'
        : '';

      card.innerHTML =
        '<div class="card-title">' + escHtml(item.title) + '</div>' +
        '<div class="card-meta">' + escHtml(item.kaizenId) + ' · ' + escHtml(item.category) + ' · ' + escHtml(item.zoneName) + '</div>' +
        '<div class="card-meta">By: ' + escHtml(item.submitterName) + '</div>' +
        savingsHtml;

      /* "Move -> Approved" advanced the stage and recorded nothing: no reviewer,
         no remarks, no owner, no actual saving. That is why 1 of 8 records has
         an actual saving and none has a verification date. Each stage now asks
         for exactly what that stage is supposed to capture. */
      var ci = COLS.findIndex(function(c) { return c.key === col.key; });
      if (ci < COLS.length - 1) {
        var actions = document.createElement('div');
        actions.className = 'card-actions';
        var nb = document.createElement('button');
        nb.textContent = KZ_ACTION[col.key] || ('Move → ' + COLS[ci + 1].label);
        nb.onclick = (function(it, nextKey, fromKey) {
          return function() { openReview(it, fromKey, nextKey); };
        })(item, COLS[ci + 1].key, col.key);
        actions.appendChild(nb);
        if (col.key === 'SUBMITTED' || col.key === 'UNDER_REVIEW') {
          var rj = document.createElement('button');
          rj.textContent = 'Reject';
          rj.className = 'kzb-reject';
          rj.onclick = (function(it) {
            return function() { openReview(it, 'REJECT', 'REJECTED'); };
          })(item);
          actions.appendChild(rj);
        }
        card.appendChild(actions);
      }

      body.appendChild(card);
    });

    div.appendChild(body);
    board.appendChild(div);
  });

  // ── KPI header (implemented %, verified ₹ savings, top contributor) ──
  var total = items.length;
  var done = items.filter(function(i){ var s=String(i.status).toUpperCase(); return s==='COMPLETED'||s==='BENEFIT_VERIFIED'; }).length;
  var saved = items.reduce(function(s,i){ return s + (Number(i.actualSavings)||0); }, 0);
  var byUser = {};
  items.forEach(function(i){ if(i.submitterName){ byUser[i.submitterName]=(byUser[i.submitterName]||0)+1; } });
  var top = Object.keys(byUser).sort(function(a,b){ return byUser[b]-byUser[a]; })[0];
  function tile(v,l){ return '<div style="background:var(--bg-card,#fff);border:1px solid var(--border,#e5e7eb);border-radius:10px;padding:10px 8px;text-align:center"><div style="font-size:17px;font-weight:800;color:var(--pm-primary,#1a5276);line-height:1.1">'+v+'</div><div style="font-size:9px;color:#6b7280;text-transform:uppercase;letter-spacing:.5px;margin-top:3px">'+l+'</div></div>'; }
  var kpi = document.createElement('div');
  kpi.style.cssText = 'display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px';
  kpi.innerHTML = tile(total,'Ideas') + tile((total?Math.round(done/total*100):0)+'%','Implemented')
    + tile('₹'+saved.toLocaleString('en-IN'),'Verified savings')
    + tile(top?escHtml(top)+' ('+byUser[top]+')':'—','Top contributor');

  document.getElementById('kzBoard').innerHTML = '';
  document.getElementById('kzBoard').appendChild(kpi);
  document.getElementById('kzBoard').appendChild(board);
}

loadKaizen();
setInterval(loadKaizen, 300000);
</script>

<script>
window.PM_TOUR_ID = 'kaizenboard';
window.PM_TOUR_STEPS = [
  { selector: '#kzBoard',       title: 'Kaizen Board',   body: 'Cards move left to right through stages: Submitted → Under Review → Approved → Implementing → Completed.', pos: 'bottom' },
  { selector: '.column',        title: 'Stage Column',   body: 'Each column is one stage. The number in the header shows how many ideas are in that stage right now.', pos: 'bottom' },
  { selector: '.card',          title: 'Kaizen Card',    body: 'Each card is one improvement idea. Shows the title, category, zone, and who submitted it.', pos: 'bottom' },
  { selector: '.card-actions',  title: 'Move Forward',   body: 'Supervisors tap the Move button to advance a card to the next stage when it has been reviewed or implemented.', pos: 'top' }
];
</script>
<?!= include('GuidedTour') ?>
