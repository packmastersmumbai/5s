<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PackMasters — Insights &amp; SQCDP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Tokenised 2026-08-20 — these were 142 raw hex literals. Mapped onto the
     canonical CommonStyles palette (included at end of <body>; :root custom
     properties are position-independent, verified in-browser). */
  :root {
    --iv-ink:      var(--text-primary);
    --iv-ink2:     var(--text-secondary);
    --iv-ink3:     var(--text-muted);
    --iv-line:     var(--border);
    --iv-line-lt:  var(--border-light);
    --iv-surface:  var(--bg-card-2);
    --iv-green:    var(--score-green);
    --iv-amber:    var(--score-amber);
    --iv-red:      var(--score-red);
    --iv-blue:     var(--score-blue);
    --iv-purple:   var(--5s-sustain);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Plus Jakarta Sans',sans-serif;background:#f4f5f8;min-height:100vh}

  /* ── Header ── */
  .iv-header{background:#0F172A;color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px}
  [data-theme="dark"] .iv-header{background:var(--bg-card);border-bottom:1px solid var(--iv-line)}
  .iv-back{color:rgba(255,255,255,.7);text-decoration:none;font-size:12px;padding:3px 8px;border:1px solid rgba(255,255,255,.2);border-radius:6px;white-space:nowrap}
  .iv-back:hover{color:#fff}
  .iv-header h1{font-size:14px;font-weight:600;flex:1}
  .iv-meta{font-size:11px;opacity:.6;white-space:nowrap}

  /* ── Zone filter toolbar ── */
  .iv-toolbar{padding:8px 12px;background:#fff;border-bottom:1px solid var(--iv-line);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .iv-updated { font-size: 11px; color: var(--text-muted); margin-left: 8px; white-space: nowrap; }
.iv-filter-label{font-size:11px;font-weight:700;color:#5a6070;letter-spacing:.5px;flex-shrink:0}
  .iv-filter-btn{padding:3px 10px;border-radius:20px;border:1px solid #d0d4de;background:#fff;font-size:11px;font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer;transition:all .12s;font-weight:500;white-space:nowrap;flex-shrink:0}
  .iv-filter-btn.active{background:var(--iv-ink);color:#fff;border-color:var(--iv-ink)}

  /* ── Body ── */
  /* Responsive grid: cards pair up 2-across on desktop, stack on mobile. */
  .iv-body{padding:12px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-content:start;max-width:1400px;margin:0 auto}
  @media(min-width:820px){.iv-body{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
  /* Let wrappers pass their card children straight into the grid. */
  #iv-chart-section,.ncr-row,#iv-ranking-section,#iv-heatmap-section{display:contents}
  /* Wide/tall cards span the full row. */
  #iv-kpi-section,.s-card--wide,.iv-sec{grid-column:1/-1}
  /* Cards size to their content. Row-stretch gave the short pillar card the
     height of the tall trend chart beside it — ~200px of nothing under five
     donuts, which read as a rendering fault rather than a layout choice. */
  .s-card{align-self:start}

  /* ── Section card ── */
  .s-card{background:var(--bg-card);border-radius:12px;border:1px solid var(--iv-line);padding:14px 16px;min-width:0}
  .s-title{font-size:11px;font-weight:700;color:var(--iv-ink2);letter-spacing:.5px;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .s-note{font-size:10px;font-weight:600;letter-spacing:.02em;text-transform:none;color:var(--iv-ink3)}

  /* ── Section headings. The page had none: nine cards floated with nothing
     saying which question each answered. ───────────────────────────────── */
  .iv-sec{display:flex;align-items:center;gap:10px;margin:22px 2px 10px}
  .iv-sec:first-of-type{margin-top:14px}
  .iv-sec h2{font-size:13px;font-weight:700;letter-spacing:-.01em;color:var(--iv-ink);margin:0;white-space:nowrap}
  .iv-sec span{font-size:11px;color:var(--iv-ink3);white-space:nowrap}
  .iv-sec::after{content:'';flex:1;height:1px;background:var(--iv-line)}

  /* ── Headline block ─────────────────────────────────────────────────── */
  .iv-head{display:grid;grid-template-columns:minmax(240px,300px) 1fr;gap:12px;align-items:stretch}
  @media(max-width:720px){.iv-head{grid-template-columns:1fr}}
  .iv-hero{display:flex;align-items:center;gap:16px;padding:16px;border-radius:12px;
    background:var(--bg-card);border:1px solid var(--iv-line)}
  .iv-hero-ring{position:relative;flex:none;width:104px;height:104px}
  .iv-hero-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    gap:1px;font-variant-numeric:tabular-nums}
  .iv-hero-num b{font-size:25px;font-weight:750;letter-spacing:-.03em;color:var(--iv-ink)}
  .iv-hero-num i{font-size:13px;font-style:normal;font-weight:600;color:var(--iv-ink3);align-self:flex-start;margin-top:6px}
  .iv-hero-l{font-size:12px;font-weight:700;color:var(--iv-ink);letter-spacing:.01em}
  .iv-hero-s{font-size:11px;color:var(--iv-ink2);margin-top:4px;line-height:1.45}

  .iv-figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
  /* State rides the VALUE, not a bar down the side: a coloured left border on
     every tile is decoration competing with the number it labels, and the
     number is already coloured. */
  .iv-fig{padding:11px 12px;border-radius:11px;background:var(--bg-card);
    border:1px solid var(--iv-line);
    display:flex;flex-direction:column;justify-content:center;min-width:0}
  .iv-fig.t-red{border-color:color-mix(in oklab,var(--iv-red) 32%,var(--iv-line))}
  .iv-fig.t-amber{border-color:color-mix(in oklab,var(--iv-amber) 32%,var(--iv-line))}
  .iv-fig-l{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--iv-ink3)}
  .iv-fig-v{font-size:21px;font-weight:700;letter-spacing:-.02em;color:var(--iv-ink);
    font-variant-numeric:tabular-nums;margin:3px 0 1px}
  .iv-fig.t-red .iv-fig-v{color:var(--iv-red)}
  .iv-fig.t-amber .iv-fig-v{color:var(--iv-amber)}
  .iv-fig.t-green .iv-fig-v{color:var(--iv-green)}
  .iv-fig-s{font-size:10.5px;color:var(--iv-ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ── Pillar donuts ──────────────────────────────────────────────────── */
  .ivdonuts{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:10px}
  .ivdonut{text-align:center;animation:ivRise .42s cubic-bezier(.16,1,.3,1) both}
  @keyframes ivRise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .ivdonut-c{position:relative;width:76px;height:76px;margin:0 auto 6px}
  .ivdonut-n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:17px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .ivdonut-n i{font-size:10px;font-style:normal;font-weight:600;opacity:.75;margin-left:1px}
  .ivna{font-size:12px;font-weight:600;color:var(--iv-ink3)}
  .ivdonut-k{font-size:11px;font-weight:700;color:var(--iv-ink)}
  .ivdonut-l{font-size:10px;color:var(--iv-ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* A pillar under target earns a mark, so the shortfall is not carried by
     arc length alone. */
  .ivdonut.under .ivdonut-k::after{content:' ▾';color:var(--iv-amber);font-size:9px}

  .ivring-t{stroke:var(--iv-line)}
  /* The arc draws itself once on load: the motion IS the measurement, so the
     eye lands on how far each ring travelled. */
  .ivring-v{transition:stroke-dashoffset .9s cubic-bezier(.22,1,.36,1)}
  @media(prefers-reduced-motion:reduce){
    .ivring-v{transition:none}
    .ivdonut{animation:none}
  }

  /* ── KPI strip ── */
  .kpi-strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
  .kpi-card{background:var(--bg-card);border-radius:10px;border:1px solid var(--iv-line);padding:12px 14px}
  .kpi-label{font-size:10px;font-weight:700;color:var(--iv-ink3);letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px}
  .kpi-value{font-size:22px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--iv-ink);line-height:1}
  .kpi-sub{font-size:10px;color:var(--iv-ink3);margin-top:3px}
  .kpi-card.accent-green{border-left:3px solid var(--iv-green)}
  .kpi-card.accent-red{border-left:3px solid var(--iv-red)}
  .kpi-card.accent-blue{border-left:3px solid var(--iv-purple)}
  .kpi-card.accent-amber{border-left:3px solid var(--iv-amber)}

  /* ── Pillar bars ── */
  .pillar-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
  .pillar-bar-wrap{display:flex;flex-direction:column;gap:5px}
  .pillar-bar-label{display:flex;justify-content:space-between;align-items:center}
  .pillar-name{font-size:12px;font-weight:600;color:var(--iv-ink)}
  .pillar-pct{font-size:12px;font-weight:700;font-family:'JetBrains Mono',monospace}
  .bar-track{height:8px;background:var(--iv-line-lt);border-radius:6px;overflow:hidden}
  .bar-fill{height:100%;border-radius:6px;transition:width .6s ease}

  /* ── Trend canvas ── */
  canvas{display:block;width:100% !important;max-width:100%}
  .trend-wrap{position:relative;height:200px}
  .trend-wrap canvas{position:absolute;top:0;left:0;height:100% !important}

  /* ── Heatmap ── */
  .hm-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .hm-inner{min-width:340px}
  .hm-row{display:flex;gap:3px;align-items:center}
  .hm-label{font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--iv-ink2);width:36px;flex-shrink:0}
  .hm-cell{flex:1;height:26px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;transition:opacity .2s}
  .hm-cell:hover{opacity:.85}
  .hm-header{display:flex;gap:3px;margin-bottom:3px;padding-left:40px}
  .hm-col-label{flex:1;text-align:center;font-size:10px;font-weight:700;color:var(--iv-ink2);letter-spacing:.3px}

  /* ── Zone ranking ── */
  .zone-table{width:100%;border-collapse:collapse}
  .zone-table th{font-size:10px;font-weight:700;color:var(--iv-ink3);letter-spacing:.4px;text-transform:uppercase;padding:5px 8px;text-align:left;border-bottom:1px solid var(--iv-line-lt)}
  .zone-table td{padding:7px 8px;font-size:12px;color:var(--iv-ink);border-bottom:1px solid var(--iv-surface)}
  .zone-table tr:last-child td{border-bottom:none}
  .zone-table tr:hover td{background:#fafbfc}
  .score-pill{display:inline-block;padding:2px 7px;border-radius:10px;font-size:11px;font-weight:700;font-family:'JetBrains Mono',monospace}
  .score-green{background:#ecfdf5;color:#166534}
  .score-amber{background:#fefbe8;color:#92640a}
  .score-red{background:#fef2ee;color:#b83a14}
  .rank-badge{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;font-size:11px;font-weight:700;background:var(--iv-line-lt);color:var(--iv-ink2)}
  .rank-1{background:var(--iv-amber);color:#fff}
  .rank-2{background:var(--iv-ink3);color:#fff}
  .rank-3{background:#c07040;color:#fff}
  .delta-cell{font-size:11px;font-weight:700;font-family:'JetBrains Mono',monospace}
  .delta-up{color:var(--iv-green)}
  .delta-dn{color:var(--iv-red)}

  /* ── SQCDP tiles ── */
  .sqcdp-tiles-grid{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
  @media(min-width:600px){.sqcdp-tiles-grid{grid-template-columns:repeat(3,1fr)}}
  @media(min-width:900px){.sqcdp-tiles-grid{grid-template-columns:repeat(5,1fr)}}
  .sqcdp-tile{border-radius:10px;border:1px solid var(--iv-line);padding:12px;position:relative;background:var(--bg-card)}
  .sqcdp-tile-dim{font-size:10px;font-weight:700;color:var(--iv-ink2);letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px}
  .sqcdp-tile-val{font-size:20px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--iv-ink);line-height:1.1}
  .sqcdp-tile-target{font-size:10px;color:var(--iv-ink3);margin-top:2px}
  .sqcdp-tile-status{display:inline-block;padding:2px 6px;border-radius:6px;font-size:10px;font-weight:700;margin-top:5px}
  .st-GREEN{background:#ecfdf5;color:#166534}
  .st-AMBER{background:#fefbe8;color:#92640a}
  .st-RED{background:#fef2ee;color:#b83a14}
  .st-GRAY{background:var(--iv-line-lt);color:var(--iv-ink2)}
  .sqcdp-tile-detail{font-size:10px;color:var(--iv-ink2);margin-top:5px;line-height:1.4}
  .sqcdp-tile-spc{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--iv-ink3);margin-top:4px;line-height:1.5}
  .sqcdp-tile.worst-metric{box-shadow:inset 0 0 0 2px var(--iv-red)}

  /* ── Plant roll-up ── */
  .plant-rollup{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .plant-stat{text-align:center;padding:10px 14px;background:var(--iv-surface);border-radius:8px}
  .plant-stat-val{font-size:22px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--iv-ink)}
  .plant-stat-label{font-size:10px;color:var(--iv-ink3);margin-top:2px}
  .dim-rollup-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .dim-rollup-cell{border-radius:8px;padding:8px 4px;text-align:center;background:var(--iv-surface)}
  .dim-rollup-name{font-size:10px;font-weight:700;color:var(--iv-ink2);margin-bottom:4px}
  .dim-rollup-bars{display:flex;flex-direction:column;gap:2px}
  .dim-bar-row{display:flex;align-items:center;gap:4px;font-size:9px}
  .dim-bar-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .dim-bar-count{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--iv-ink)}

  /* NCR cards flow as direct grid items via .iv-body grid (display:contents above) */

  /* ── Open NCRs by pillar ── */
  .pillar-nc-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .pillar-nc-cell{background:var(--iv-surface);border-radius:8px;padding:10px 6px;text-align:center}
  .pillar-nc-name{font-size:10px;font-weight:700;color:var(--iv-ink2);letter-spacing:.3px;margin-bottom:4px}
  .pillar-nc-val{font-size:18px;font-weight:700;font-family:'JetBrains Mono',monospace}
  .pnc-s1{color:var(--iv-red)}.pnc-s2{color:var(--iv-purple)}.pnc-s3{color:var(--iv-green)}.pnc-s4{color:var(--iv-amber)}.pnc-s5{color:#c04aaa}

  /* ── SQCDP NC bars ── */
  .sqcdp-grid{display:flex;flex-direction:column;gap:5px}
  .sqcdp-row{display:flex;gap:6px;align-items:center}
  .sqcdp-label{font-size:11px;font-weight:700;color:var(--iv-ink);width:62px;flex-shrink:0}
  .sqcdp-bar-track{flex:1;height:18px;background:var(--iv-line-lt);border-radius:5px;overflow:hidden;position:relative}
  .sqcdp-bar-fill{height:100%;border-radius:5px;transition:width .6s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:6px}
  .sqcdp-bar-fill span{font-size:10px;font-weight:700;color:#fff}
  .sqcdp-count{font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--iv-ink2);width:24px;text-align:right;flex-shrink:0}

  /* ── Pareto section ── */
  .pareto-tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
  .pareto-tab{padding:4px 12px;border-radius:16px;border:1px solid #d0d4de;background:#fff;font-size:11px;font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer;font-weight:600;transition:all .12s}
  .pareto-tab.active{background:var(--iv-ink);color:#fff;border-color:var(--iv-ink)}
  .pareto-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .pareto-cause{font-size:11px;color:var(--iv-ink);width:130px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pareto-track{flex:1;height:16px;background:var(--iv-line-lt);border-radius:4px;overflow:hidden}
  .pareto-fill{height:100%;border-radius:4px;background:var(--iv-purple);transition:width .5s ease}
  .pareto-pct{font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--iv-ink2);width:34px;text-align:right;flex-shrink:0}
  .pareto-empty{font-size:12px;color:var(--iv-ink3);padding:22px 12px;text-align:center;
    display:flex;flex-direction:column;gap:5px;align-items:center}
  .pareto-empty b{font-size:13px;font-weight:650;color:var(--iv-ink2)}
  .pareto-empty span{max-width:34ch;line-height:1.5}

  /* ── Zone picker ── */
  .iv-zonewrap{display:flex;flex-direction:column;gap:8px;min-width:0}
  .iv-zonetoggle{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;
    padding:6px 11px;border-radius:999px;cursor:pointer;
    background:var(--bg-card);border:1px solid var(--iv-line);color:var(--iv-ink);
    font-size:12px;transition:border-color .15s,background .15s}
  .iv-zonetoggle:hover{border-color:var(--iv-ink3)}
  .iv-zt-l{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--iv-ink3)}
  .iv-zonetoggle b{font-weight:650}
  .iv-zt-c{font-size:9px;color:var(--iv-ink3);transition:transform .18s}
  .iv-zonewrap.open .iv-zt-c{transform:rotate(180deg)}
  .iv-zonechips{display:none;flex-wrap:wrap;gap:5px}
  .iv-zonewrap.open .iv-zonechips{display:flex}

  /* ── Utilities ── */
  .iv-loading{text-align:center;padding:40px;color:var(--iv-ink3)}
  .spin{display:inline-block;width:22px;height:22px;border:3px solid #e0e4ec;border-top-color:var(--iv-ink2);border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .iv-error{padding:12px 16px;color:#b83a14;font-size:12px;background:#fef2ee;border-radius:8px;border:1px solid #fecaca}
  .warn-banner{padding:8px 12px;background:#fefbe8;border:1px solid #fde68a;border-radius:8px;font-size:11px;color:#92640a;margin-bottom:10px}
</style>
</head>
<body>

<div class="iv-header">
  <a class="iv-back" href="javascript:history.back()">&#8592; Back</a>
  <h1>Analytics &amp; SQCDP</h1>
  <div class="iv-meta" id="iv-meta">Loading…</div>
</div>

<div class="iv-toolbar">
  <span class="iv-filter-label">ZONE:</span>
  <div id="zone-filters" style="display:flex;gap:6px;flex-wrap:wrap;flex:1">
    <button class="iv-filter-btn active" onclick="setZoneFilter('ALL')">ALL</button>
  </div>
</div>

<div class="iv-toolbar">
  <span class="iv-filter-label">PERIOD:</span>
  <div style="display:flex;gap:6px;flex-wrap:wrap;flex:1">
    <button class="iv-filter-btn active" id="iv-per-month" onclick="setPeriod('month')">Monthly</button>
    <button class="iv-filter-btn" id="iv-per-week" onclick="setPeriod('week')">Weekly</button>
  </div>
  <button class="iv-filter-btn" id="iv-refresh" onclick="refreshNow()" title="Reload from the sheet">
    &#8635; Refresh
  </button>
  <span class="iv-updated" id="iv-updated"></span>
</div>

<div class="iv-body" id="iv-body">
  <div class="iv-loading"><div class="spin"></div></div>
</div>

<script>
/* ── State ── */
var _kpis     = null;
var _trend    = null;
var _sqcdp    = null;   // getSQCDPBoardData full result
var _zoneFilter = 'ALL';
/* Monthly is the reporting view; weekly is the operating view. A single day's
   audits move a monthly average by ~1/30th, which is why the chart looked
   inert even when the data underneath was current. */
var _period      = 'month';
var _trendMonth  = null;   // cached monthly series  (getPillarTrend)
var _trendWeek   = null;   // cached weekly series   (getPillarTrendWeekly)
var _paretoLoaded = {};   // {pillar: data}
var _paretoActivePillar = 'S';

var PILLARS = ['S1','S2','S3','S4','S5'];
var PILLAR_NAMES  = {S1:'Sort',S2:'Set in Order',S3:'Shine',S4:'Standardize',S5:'Sustain'};
/* Categorical series colours, run through the palette validator rather than
   chosen by eye. The set this replaced failed twice: Sort/Set orange-vs-green
   sat at deltaE 5.5 for protanopes, and Sustain/Set at 12.2 for NORMAL vision
   — two of five pillars were not reliably distinguishable on a factory floor.

     light  L 0.43-0.77 · worst CVD pair deltaE 9.5 · normal floor 24.0 — PASS
     dark   L 0.48-0.67 · worst CVD pair deltaE 6.8 · normal floor 20.9 — PASS

   Dark is stepped separately, not lightened from light: an automatic flip left
   three of five outside the lightness band. Both modes carry one WARN (a 6-8
   CVD pair in dark, one sub-3:1 contrast in light) which is legal only with
   secondary encoding — every series here is direct-labelled, never colour
   alone. */
var PILLAR_COLORS_LIGHT = {S1:'#C2255C',S2:'#1C7ED6',S3:'#2B8A3E',S4:'#F08C00',S5:'#6741D9'};
var PILLAR_COLORS_DARK  = {S1:'#DB4A82',S2:'#3286DB',S3:'#2E9A4C',S4:'#C87008',S5:'#8362E6'};
var PILLAR_COLORS = PILLAR_COLORS_LIGHT;

function ivIsDark_() {
  try { return document.documentElement.getAttribute('data-theme') === 'dark'; }
  catch (e) { return false; }
}
function ivSyncPalette_() {
  PILLAR_COLORS = ivIsDark_() ? PILLAR_COLORS_DARK : PILLAR_COLORS_LIGHT;
}
ivSyncPalette_();

/* The trend is a <canvas>: unlike the CSS around it, it does not repaint when
   the theme changes, so a switch left light-mode series and a near-white grid
   on a dark surface. Watch the attribute and redraw. */
(function () {
  try {
    new MutationObserver(function () {
      ivSyncPalette_();
      if (typeof renderChartSections === 'function' && typeof _trend !== 'undefined' && _trend) {
        renderChartSections();
        if (typeof ivDrawRings_ === 'function') ivDrawRings_();
      }
    }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  } catch (e) {}
})();
var SQCDP_DIMS = [
  {key:'S',label:'Safety',color:'#e85c2e'},
  {key:'Q',label:'Quality',color:'#7c56d4'},
  {key:'C',label:'Cost',color:'#d4a010'},
  {key:'D',label:'Delivery',color:'#2ba86e'},
  {key:'P',label:'People',color:'#c04aaa'}
];

/* ── Helpers ── */
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function heatColor(v){if(v===null||v===undefined)return '#e0e4ee';if(v>=90)return '#166534';if(v>=75)return '#2ba86e';if(v>=60)return '#d4a010';if(v>=40)return '#e85c2e';return '#b83a14';}
function scoreClass(s){return s>=80?'score-green':s>=60?'score-amber':'score-red';}
function deltaHtml(d){if(d===null||d===undefined||d==='')return '<span style="color:#c0c8d8">&#8212;</span>';var n=Number(d);if(isNaN(n))return '<span style="color:#c0c8d8">&#8212;</span>';if(n>0)return '<span class="delta-up">&#9650;'+n.toFixed(1)+'</span>';if(n<0)return '<span class="delta-dn">&#9660;'+Math.abs(n).toFixed(1)+'</span>';return '<span style="color:#a0aab8">&#8212;</span>';}

/* ── Trend helpers ── */
function getZones(){if(!_trend)return[];var z={};PILLARS.forEach(function(p){if(_trend[p])Object.keys(_trend[p]).forEach(function(zz){z[zz]=1;});});return Object.keys(z).sort();}
function getMonths(){if(!_trend)return[];var m={};PILLARS.forEach(function(p){if(!_trend[p])return;Object.values(_trend[p]).forEach(function(arr){arr.forEach(function(pt){m[pt.month]=1;});});});return Object.keys(m).sort().slice(-6);}
function avgScore(pillar,months){if(!_trend[pillar])return null;var zones=_zoneFilter==='ALL'?Object.keys(_trend[pillar]):[_zoneFilter];var totals={},counts={};months.forEach(function(m){totals[m]=0;counts[m]=0;});zones.forEach(function(z){if(!_trend[pillar][z])return;_trend[pillar][z].forEach(function(pt){if(totals[pt.month]!==undefined){totals[pt.month]+=pt.score;counts[pt.month]++;}});});return months.map(function(m){return counts[m]?Math.round(totals[m]/counts[m]):null;});}
function latestScore(pillar){if(!_trend[pillar])return null;var zones=_zoneFilter==='ALL'?Object.keys(_trend[pillar]):[_zoneFilter];var vals=[];zones.forEach(function(z){if(!_trend[pillar][z]||!_trend[pillar][z].length)return;var s=_trend[pillar][z].slice().sort(function(a,b){return a.month<b.month?1:-1;});vals.push(s[0].score);});if(!vals.length)return null;return Math.round(vals.reduce(function(s,v){return s+v;},0)/vals.length);}

function setPeriod(p){
  if(_period===p) return;
  _period=p;
  document.getElementById('iv-per-month').classList.toggle('active',p==='month');
  document.getElementById('iv-per-week').classList.toggle('active',p==='week');
  if(p==='week' && !_trendWeek){ loadWeeklyTrend(); return; }   // paints on arrival
  _trend = (p==='week') ? _trendWeek : _trendMonth;
  rerenderCharts();
}

function loadWeeklyTrend(){
  var el=document.getElementById('iv-chart-section');
  if(el) el.innerHTML='<div class="iv-loading"><div class="spin"></div><p style="margin-top:10px;font-size:12px">Loading weekly trend…</p></div>';
  google.script.run
    .withSuccessHandler(function(r){
      _trendWeek=typeof r==='string'?JSON.parse(r):r;
      if(_period==='week'){ _trend=_trendWeek; rerenderCharts(); }
    })
    .withFailureHandler(function(err){
      if(el)el.innerHTML='<div class="iv-error">Weekly trend error: '+escHtml(err.message)+'</div>';
    })
    .getPillarTrendWeekly(12);
}

/* Re-render only the chart section; KPIs and SQCDP are unaffected by period. */
function rerenderCharts(){
  var el=document.getElementById('iv-chart-section');
  if(!el||!_trend) return;

/* Manual reload — drops the server caches first so this really re-reads the
   sheet rather than returning the same cached payload. */
function refreshNow(){

  btn.disabled=true; btn.textContent='↻ Refreshing…';

function stampUpdated(){

}

/* ── Zone filter ── */
/* 28 chips wrapped to two rows before any data was visible, and a wall of
   equal chips is not scannable — you hunt for the one you want. It collapses
   to a single control naming the current zone; opening it reveals the same
   chips, which stay the right affordance ONCE you are choosing. */
function ivToggleZones_() {
  var w = document.getElementById('iv-zonewrap');
  if (!w) return;
  var open = w.classList.toggle('open');
  var b = document.getElementById('iv-zonetoggle');

}

function buildZoneFilters(zones){

    return '<button class="iv-filter-btn'+(z===_zoneFilter?' active':'')+'" onclick="setZoneFilter(\''+escHtml(z)+'\')">'+escHtml(z)+'</button>';
  }).join('');

        ' onclick="ivToggleZones_()">' +

}

function setZoneFilter(z){
  _zoneFilter=z;
  document.querySelectorAll('.iv-filter-btn').forEach(function(b){b.classList.toggle('active',b.textContent===z);});
  var cur=document.getElementById('iv-zonecur');

  /* Close on choose: the picker has done its job and the data below is what
     the user came for. */

  if(w)w.classList.remove('open');
  if(_trend)renderChartSections();

  if(document.getElementById('iv-pareto-body'))openParetoTab(_paretoActivePillar);
}

/* ── KPI strip ── */
/* A ring gauge for one bounded percentage. Not a chart of anything — a single
   figure needs no plot — but the arc makes "how far from target" legible
   before the number is read, which a bare stat tile cannot do. */
function ivRing_(pct, color, size, stroke) {
  size = size || 84; stroke = stroke || 8;
  var r = (size - stroke) / 2, c = 2 * Math.PI * r;
  var off = c * (1 - Math.max(0, Math.min(100, pct)) / 100);
  return '<svg class="ivring" width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" aria-hidden="true">' +
    '<circle class="ivring-t" cx="' + size/2 + '" cy="' + size/2 + '" r="' + r + '" fill="none" stroke-width="' + stroke + '"/>' +
    '<circle class="ivring-v" cx="' + size/2 + '" cy="' + size/2 + '" r="' + r + '" fill="none" stroke-width="' + stroke + '"' +
      ' stroke="' + color + '" stroke-linecap="round"' +
      ' stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + c.toFixed(1) + '"' +
      ' data-off="' + off.toFixed(1) + '" transform="rotate(-90 ' + size/2 + ' ' + size/2 + ')"/>' +
  '</svg>';
}

function renderKPIs(kpis){
  var best=kpis.bestZone?escHtml(kpis.bestZone):'—';
  var worst=kpis.worstZone?escHtml(kpis.worstZone):'—';
  var avg = Number(kpis.plantAvg||0);
  var onT = Number(kpis.zonesOnTarget||0), totZ = Number(kpis.totalZones||28);
  var clos = Number(kpis.closureRate||0);
  /* Status colour, not a series colour: these are states, not identities. */
  var avgCol = avg >= 80 ? 'var(--score-green)' : avg >= 70 ? 'var(--score-amber)' : 'var(--score-red)';
  var closCol = clos >= 80 ? 'var(--score-green)' : clos >= 60 ? 'var(--score-amber)' : 'var(--score-red)';

  /* One headline, then the figures that qualify it. The seven equal cards this
     replaced made a 0 as prominent as the plant average. */
  return '<div class="iv-head">' +
    '<div class="iv-hero">' +
      '<div class="iv-hero-ring">' + ivRing_(avg, avgCol, 104, 10) +
        '<div class="iv-hero-num"><b>' + avg.toFixed(1) + '</b><i>%</i></div>' +
      '</div>' +
      '<div class="iv-hero-txt">' +
        '<div class="iv-hero-l">Plant average</div>' +
        '<div class="iv-hero-s">Best ' + best + ' · Worst ' + worst + '</div>' +
        '<div class="iv-hero-s">' + onT + ' of ' + totZ + ' zones at or above 80%</div>' +
      '</div>' +
    '</div>' +
    '<div class="iv-figs">' +
      ivFig_('Open NCs', kpis.openNCs||0, 'Pending action', (kpis.openNCs>0?'red':'')) +
      ivFig_('Overdue', kpis.overdueNCs||0, 'Past target', (kpis.overdueNCs>0?'amber':'')) +
      ivFig_('Red tags', kpis.activeRedTags||0, 'Awaiting disposal', (kpis.activeRedTags>0?'amber':'')) +
      ivFig_('Closure', clos + '%', 'NCs closed', (clos>=80?'green':clos>=60?'amber':'red')) +
      ivFig_('Avg age', (kpis.avgAgeDays||0) + 'd', 'While open', '') +
    '</div>' +
  '</div>';
}

function ivFig_(label, value, sub, tone) {
  return '<div class="iv-fig' + (tone ? ' t-' + tone : '') + '">' +
    '<div class="iv-fig-l">' + escHtml(label) + '</div>' +
    '<div class="iv-fig-v">' + escHtml(String(value)) + '</div>' +
    '<div class="iv-fig-s">' + escHtml(sub) + '</div>' +
  '</div>';
}

/* ── Pillar bars ── */
/* Five bounded percentages that share a scale and are compared against each
   other and against 80%. A donut per pillar reads the shortfall as an arc gap;
   five tracked bars stacked in a card read as a list of numbers with
   decoration. Each carries its name and value as text, so identity never
   depends on the hue — which the validator requires for the one CVD pair in
   the 6-8 band. */
function renderPillarBars(){
  ivSyncPalette_();
  var html='<div class="s-card"><div class="s-title">Pillar scores' +
           '<span class="s-note">target 80%</span></div><div class="ivdonuts">';
  PILLARS.forEach(function(p, i){
    var score=latestScore(p);
    var pct=score!==null?score:0;
    var col=PILLAR_COLORS[p];
    var miss = score !== null && score < 80;
    html += '<div class="ivdonut' + (miss ? ' under' : '') + '" style="animation-delay:' + (i*60) + 'ms">' +
      '<div class="ivdonut-c">' + ivRing_(pct, col, 76, 7) +
        '<div class="ivdonut-n" style="color:' + col + '">' +
          (score !== null ? pct + '<i>%</i>' : '<span class="ivna">n/a</span>') +
        '</div>' +
      '</div>' +
      '<div class="ivdonut-k">' + p + '</div>' +
      '<div class="ivdonut-l">' + escHtml(PILLAR_NAMES[p]) + '</div>' +
    '</div>';
  });
  html+='</div></div>';return html;
}

/* ── Trend chart ── */
function renderTrendChart(months){
  var id='tc-'+Date.now();
  var html='<div class="s-card"><div class="s-title">Pillar Score Trends (Last 6 Months)</div><div class="trend-wrap"><canvas id="'+id+'"></canvas></div></div>';
  setTimeout(function(){
    var canvas=document.getElementById(id);if(!canvas)return;
    var W=canvas.parentElement.offsetWidth,H=200;
    canvas.width=W;canvas.height=H;
    var ctx=canvas.getContext('2d');
    var PAD={top:12,right:12,bottom:32,left:32};
    var cw=W-PAD.left-PAD.right,ch=H-PAD.top-PAD.bottom;
    ctx.clearRect(0,0,W,H);
    // Pre-compute each pillar series once, then auto-scale the Y axis to the
    // data range (padded, snapped to 5s) so 75-83% scores aren't squashed into
    // a flat band at the top of a fixed 0-100 axis.
    var series=[],allVals=[];
    PILLARS.forEach(function(p){var d=avgScore(p,months);if(!d)return;series.push({p:p,d:d});d.forEach(function(v){if(v!==null)allVals.push(v);});});
    var dMin=allVals.length?Math.min.apply(null,allVals):0;
    var dMax=allVals.length?Math.max.apply(null,allVals):100;
    var yMin=Math.max(0,Math.floor((dMin-3)/5)*5);
    var yMax=Math.min(100,Math.ceil((dMax+3)/5)*5);
    if(yMax-yMin<10){yMin=Math.max(0,yMax-10);}
    function yOf(v){return PAD.top+ch-((v-yMin)/((yMax-yMin)||1))*ch;}
    /* Recessive against either surface: the grid is a reference, not a mark. */
    ctx.strokeStyle=ivIsDark_()?'rgba(255,255,255,.09)':'rgba(15,23,42,.07)';ctx.lineWidth=1;
    for(var t=0;t<=4;t++){
      var gv=yMin+(yMax-yMin)*t/4,gy=yOf(gv);
      ctx.beginPath();ctx.moveTo(PAD.left,gy);ctx.lineTo(PAD.left+cw,gy);ctx.stroke();
      ctx.fillStyle='#a0aab8';ctx.font='9px JetBrains Mono,monospace';ctx.textAlign='right';
      ctx.fillText(Math.round(gv),PAD.left-3,gy+3);
    }
    ctx.fillStyle='#6b7280';ctx.font='9px Plus Jakarta Sans,sans-serif';ctx.textAlign='center';
    months.forEach(function(m,i){
      var x=PAD.left+(i/(months.length-1||1))*cw;
      ctx.fillText(m.slice(0,7),x,H-PAD.bottom+12);
    });
    series.forEach(function(s){
      var p=s.p,data=s.d;
      ctx.beginPath();ctx.strokeStyle=PILLAR_COLORS[p];ctx.lineWidth=2;ctx.lineJoin='round';
      var started=false;
      data.forEach(function(v,i){if(v===null)return;var x=PAD.left+(i/(months.length-1||1))*cw,y=yOf(v);if(!started){ctx.moveTo(x,y);started=true;}else{ctx.lineTo(x,y);}});
      ctx.stroke();
      data.forEach(function(v,i){if(v===null)return;var x=PAD.left+(i/(months.length-1||1))*cw,y=yOf(v);ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fillStyle=PILLAR_COLORS[p];ctx.fill();});
    });
    var lx=PAD.left;
    PILLARS.forEach(function(p){ctx.fillStyle=PILLAR_COLORS[p];ctx.fillRect(lx,H-7,10,4);ctx.fillStyle='#6b7280';ctx.font='9px Plus Jakarta Sans,sans-serif';ctx.textAlign='left';ctx.fillText(p,lx+12,H-3);lx+=36;});
  },50);
  return html;
}

/* ── Heatmap ── */
function renderHeatmap(months,allZones){
  var zones=_zoneFilter==='ALL'?allZones:[_zoneFilter];
  if(!zones.length)return'';
  var html='<div class="s-card"><div class="s-title">Zone × Pillar Heatmap (Latest)</div><div class="hm-scroll"><div class="hm-inner">'+
    '<div class="hm-header">'+PILLARS.map(function(p){return'<div class="hm-col-label">'+p+'</div>';}).join('')+'</div>';
  zones.forEach(function(z){
    html+='<div class="hm-row"><div class="hm-label">'+escHtml(z)+'</div>';
    PILLARS.forEach(function(p){
      var score=null;
      if(_trend[p]&&_trend[p][z]&&_trend[p][z].length){var s=_trend[p][z].slice().sort(function(a,b){return a.month<b.month?1:-1;});score=s[0].score;}
      var bg=heatColor(score),label=score!==null?score:'--';
      html+='<div class="hm-cell" style="background:'+bg+'" title="'+escHtml(z)+' '+p+': '+label+'">'+label+'</div>';
    });

  });

}

/* ── Zone ranking ── */
function renderZoneRanking(zoneScores){

  sorted.forEach(function(z,i){

      '<td><strong>'+escHtml(z.zoneId)+'</strong></td>'+
      '<td><span class="score-pill '+scoreClass(z.overall)+'">'+z.overall+'%</span></td>'+

      '<td style="font-size:11px;color:#6b7280">'+(z.s2!==undefined?z.s2:'--')+'</td>'+

/* ── SQCDP Tiles ── */
function renderSqcdpSection(){

  if(_zoneFilter==='ALL'){
    el.innerHTML=renderPlantRollup();
  } else {
    el.innerHTML=renderZoneTiles(_zoneFilter);

function renderPlantRollup(){
  var plant=_sqcdp.plant||{};
  // Count GREEN/AMBER/RED per dimension across all zones
  var dimCounts={S:{G:0,A:0,R:0},Q:{G:0,A:0,R:0},C:{G:0,A:0,R:0},D:{G:0,A:0,R:0},P:{G:0,A:0,R:0}};
  (_sqcdp.zones||[]).forEach(function(z){
    ['S','Q','C','D','P'].forEach(function(dim){
      var st=(z.sqcdp[dim]||{}).status;
      if(st==='GREEN')dimCounts[dim].G++;
      else if(st==='AMBER')dimCounts[dim].A++;
      else if(st==='RED')dimCounts[dim].R++;
    });
  });
  var warn=_sqcdp.isPartial?'<div class="warn-banner">⚠️ Partial data: '+escHtml((_sqcdp.warnings||[]).join(' '))+'</div>':'';
  var html=warn+
    '<div class="plant-rollup">'+
      '<div class="plant-stat"><div class="plant-stat-val">'+escHtml(String(plant.greenPct||0))+'%</div><div class="plant-stat-label">Plant Green</div></div>'+
      '<div class="plant-stat"><div class="plant-stat-val">'+escHtml(String(plant.greenCount||0))+'/'+escHtml(String(plant.totalDimensions||0))+'</div><div class="plant-stat-label">Green Dimensions</div></div>'+
    '</div>'+
    '<div class="dim-rollup-grid">';
  ['S','Q','C','D','P'].forEach(function(dim){
    var dc=dimCounts[dim];var total=dc.G+dc.A+dc.R;
    html+='<div class="dim-rollup-cell"><div class="dim-rollup-name">'+dim+'</div><div class="dim-rollup-bars">'+
      '<div class="dim-bar-row"><div class="dim-bar-dot" style="background:#2ba86e"></div><div class="dim-bar-count">'+dc.G+'</div></div>'+
      '<div class="dim-bar-row"><div class="dim-bar-dot" style="background:#d4a010"></div><div class="dim-bar-count">'+dc.A+'</div></div>'+
      '<div class="dim-bar-row"><div class="dim-bar-dot" style="background:#e85c2e"></div><div class="dim-bar-count">'+dc.R+'</div></div>'+
    '</div></div>';
  });
  html+='</div>';
  return html;
}

function renderZoneTiles(zoneId){
  var zData=null;
  (_sqcdp.zones||[]).forEach(function(z){if(z.zoneId===zoneId)zData=z;});
  if(!zData)return'<div style="font-size:12px;color:#8090a8;padding:12px 0">No SQCDP data for '+escHtml(zoneId)+'</div>';
  var worst=zData.sqcdp.worstMetric;
  var html='<div class="sqcdp-tiles-grid">';
  ['S','Q','C','D','P'].forEach(function(dim){
    var m=zData.sqcdp[dim]||{};
    var isWorst=worst===dim;
    html+='<div class="sqcdp-tile'+(isWorst?' worst-metric':'')+'">'+
      '<div class="sqcdp-tile-dim">'+escHtml(m.label||dim)+'</div>'+
      '<div class="sqcdp-tile-val">'+escHtml(String(m.value!==undefined?m.value:'—'))+'</div>'+
      '<div class="sqcdp-tile-target">Target: '+escHtml(String(m.target!==undefined?m.target:'—'))+'</div>'+
      '<span class="sqcdp-tile-status st-'+(m.status||'GRAY')+'">'+escHtml(m.status||'—')+'</span>'+
      '<div class="sqcdp-tile-detail">'+escHtml(m.detail||'')+'</div>'+
      spcHtml(dim,m)+
    '</div>';
  });
  html+='</div>';
  return html;
}

function spcHtml(dim,m){
  var spc=m.spc;
  if((dim==='S'||dim==='Q')&&spc&&spc.n){
    return '<div class="sqcdp-tile-spc">μ='+escHtml(String(Math.round(spc.mean*100)/100))+' σ='+escHtml(String(Math.round(spc.stddev*100)/100))+' UCL='+escHtml(String(Math.round(spc.ucl*100)/100))+' n='+escHtml(String(spc.n))+'</div>';
  }
  if(dim==='P'){
    var trend=m.trend;
    return '<div class="sqcdp-tile-spc">'+(trend&&trend!=='GRAY'?escHtml(trend):'Insufficient data')+'</div>';
  }
  return'';
}

/* ── Pareto section ── */
function renderParetoSection(){
  var html='<div class="s-card"><div class="s-title">Top Root Causes (Pareto)</div>'+
    '<div class="pareto-tabs" id="pareto-tabs">'+
    SQCDP_DIMS.map(function(d){
      return'<button class="pareto-tab'+(d.key===_paretoActivePillar?' active':'')+'" onclick="openParetoTab(\''+d.key+'\')">'+d.label+'</button>';
    }).join('')+
    '</div>'+
    '<div id="iv-pareto-body"><div class="pareto-empty">Select a pillar tab to load</div></div>'+
  '</div>';
  return html;
}

function openParetoTab(pillar){
  _paretoActivePillar=pillar;
  document.querySelectorAll('.pareto-tab').forEach(function(b){b.classList.toggle('active',b.textContent.trim()===SQCDP_DIMS.filter(function(d){return d.key===pillar;})[0].label);});
  if(_paretoLoaded[pillar]){renderParetoBars(_paretoLoaded[pillar]);return;}
  var pb=document.getElementById('iv-pareto-body');
  if(pb)pb.innerHTML='<div class="iv-loading"><div class="spin"></div></div>';
  var zid=_zoneFilter==='ALL'?null:_zoneFilter;
  google.script.run
    .withSuccessHandler(function(r){
      var data=typeof r==='string'?JSON.parse(r):r;
      _paretoLoaded[pillar]=data;
      if(_paretoActivePillar===pillar)renderParetoBars(data);
    })
    .withFailureHandler(function(err){
      var pb2=document.getElementById('iv-pareto-body');
      if(pb2)pb2.innerHTML='<div class="iv-error">Pareto load error: '+escHtml(err.message)+'</div>';
    })
    .getParetoByCause(pillar,zid,6);
}

function renderParetoBars(data){
  var pb=document.getElementById('iv-pareto-body');if(!pb)return;
  var causes=data&&data.causes?data.causes:[];
  if(!causes.length){
    /* An empty pillar is a fact, not an error — say which one and where the
       data does live, rather than leaving a blank card that reads as broken. */
    pb.innerHTML='<div class="pareto-empty">' +
      '<b>No root causes recorded</b>' +
      '<span>Nothing has been logged against this dimension yet. ' +
      'Root causes are captured when an NC is closed.</span></div>';
    return;
  }
  var top=causes.slice(0,8);
  var maxPct=top[0]?top[0].percentage||0:100;
  var color=SQCDP_DIMS.filter(function(d){return d.key===_paretoActivePillar;})[0];
  color=color?color.color:'#7c56d4';
  var html='<div>';
  top.forEach(function(c){
    var w=maxPct?Math.round((c.percentage||0)/maxPct*100):0;
    html+='<div class="pareto-bar-row">'+
      '<div class="pareto-cause" title="'+escHtml(c.cause||'')+'">'+escHtml(c.cause||'Unknown')+'</div>'+
      '<div class="pareto-track"><div class="pareto-fill" style="width:'+w+'%;background:'+color+'"></div></div>'+
      '<div class="pareto-pct">'+escHtml(String(Math.round(c.percentage||0)))+'%</div>'+
    '</div>';
  });
  html+='<div style="font-size:10px;color:#a0aab8;margin-top:8px">Total: '+escHtml(String(data.total||0))+' NCs · '+escHtml(data.pillarLabel||'')+'</div>';
  html+='</div>';
  pb.innerHTML=html;
}

/* ── Chart-section renderer (re-runs on zone change) ── */
function renderChartSections(){
  var months=getMonths(),allZones=getZones();
  var el=document.getElementById('iv-chart-section');
  if(el)el.innerHTML=renderPillarBars()+renderTrendChart(months);
  var hm=document.getElementById('iv-heatmap-section');
  if(hm)hm.innerHTML=renderHeatmap(months,allZones);
}

/* ── Full render orchestration ── */
function tryRenderAll(){
  if(!_kpis&&!_trend&&!_sqcdp)return;
  var months=getMonths(),allZones=getZones();
  if(allZones.length)buildZoneFilters(allZones);

  var body=document.getElementById('iv-body');

  // Only scaffold once; then update sub-sections in place
  if(!document.getElementById('iv-kpi-section')){
    body.innerHTML=
      '<div id="iv-kpi-section">'+(_kpis?renderKPIs(_kpis):'<div class="iv-loading"><div class="spin"></div></div>')+'</div>'+
      ivSec_('5S performance','how the pillars are scoring, and where they are heading')+
      '<div id="iv-chart-section">'+(_trend?renderPillarBars()+renderTrendChart(months):'<div class="iv-loading"><div class="spin"></div><p style="margin-top:10px;font-size:12px">Loading trend data…</p></div>')+'</div>'+
      ivSec_('Operational status','today\u2019s SQCDP position and what is driving the NCs')+
      '<div class="s-card"><div class="s-title">SQCDP status</div><div id="iv-sqcdp-section"><div class="iv-loading"><div class="spin"></div></div></div></div>'+
      renderParetoSection()+
      '<div class="ncr-row">'+
        '<div id="iv-pillar-nc">'+(_kpis?renderPillarNCs(_kpis.pillarNCs):'')+'</div>'+
        '<div id="iv-sqcdp-nc">'+(_kpis?renderSqcdpNCs(_kpis.sqcdpHeatmap):'')+'</div>'+
      '</div>'+
      ivSec_('By zone','which areas are carrying the plant and which are behind')+
      '<div id="iv-ranking-section">'+(_kpis?renderZoneRanking(_kpis.zoneScores):'')+'</div>'+
      '<div id="iv-heatmap-section">'+(_trend?renderHeatmap(months,allZones):'')+'</div>';
    if(_sqcdp)renderSqcdpSection();
    openParetoTab(_paretoActivePillar);   // auto-load the active tab's data
    ivDrawRings_();
  } else {
    // Patch individual sections
    if(_kpis){
      document.getElementById('iv-kpi-section').innerHTML=renderKPIs(_kpis);
      var rk=document.getElementById('iv-ranking-section');if(rk)rk.innerHTML=renderZoneRanking(_kpis.zoneScores);
      var pnc=document.getElementById('iv-pillar-nc');if(pnc)pnc.innerHTML=renderPillarNCs(_kpis.pillarNCs);
      var snc=document.getElementById('iv-sqcdp-nc');if(snc)snc.innerHTML=renderSqcdpNCs(_kpis.sqcdpHeatmap);
    }
    if(_trend)renderChartSections();
    if(_sqcdp)renderSqcdpSection();
    ivDrawRings_();
  }

  if(_kpis){
    document.getElementById('iv-meta').textContent=
      (allZones.length||_kpis.totalZones||28)+' zones · Plant avg '+(_kpis.plantAvg||0)+'%';
  }
}

/* A section heading spans the grid; the rule after the title is what turns a
   run of cards into a report with parts. */
function ivSec_(title, note) {
  return '<div class="iv-sec"><h2>' + escHtml(title) + '</h2>' +
         (note ? '<span>' + escHtml(note) + '</span>' : '') + '</div>';
}

/* Rings render at zero and are released on the next frame, so the arc draws
   itself from empty. Doing it in CSS alone would need the final value in the
   stylesheet; doing it here keeps the value with the data.

   requestAnimationFrame twice: once to let the browser paint the zero state,
   once to change it — a single frame would coalesce both into no transition. */
function ivDrawRings_() {
  var els = document.querySelectorAll('.ivring-v[data-off]');
  if (!els.length) return;
  requestAnimationFrame(function () {
    requestAnimationFrame(function () {
      Array.prototype.forEach.call(els, function (el, i) {
        el.style.transitionDelay = (i * 45) + 'ms';
        el.style.strokeDashoffset = el.getAttribute('data-off');
      });
    });
  });
}

/* ── Data loads (three parallel calls) ── */
google.script.run
  .withSuccessHandler(function(r){_kpis=typeof r==='string'?JSON.parse(r):r;tryRenderAll();})
  .withFailureHandler(function(err){
    document.getElementById('iv-body').innerHTML='<div class="iv-error">KPI load error: '+escHtml(err.message)+'</div>';
  })
  .getAnalyticsKPIs();

google.script.run
  .withSuccessHandler(function(r){
    _trendMonth=typeof r==='string'?JSON.parse(r):r;
    if(_period==='month') _trend=_trendMonth;
    tryRenderAll(); stampUpdated();
  })
  .withFailureHandler(function(err){
    var el=document.getElementById('iv-chart-section');
    if(el)el.innerHTML='<div class="iv-error">Trend load error: '+escHtml(err.message)+'</div>';
  })
  .getPillarTrend();

google.script.run
  .withSuccessHandler(function(r){_sqcdp=typeof r==='string'?JSON.parse(r):r;tryRenderAll();})
  .withFailureHandler(function(err){
    var el=document.getElementById('iv-sqcdp-section');
    if(el)el.innerHTML='<div class="iv-error">SQCDP load error: '+escHtml(err.message)+'</div>';
  })
  .getSQCDPBoardData();
</script>
