<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAPA Kanban Board — PackMasters 5S</title>
<?!= include("CommonStyles") ?>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-main);
  background: var(--bg-page);
  color: var(--text-primary);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── HEADER ─────────────────────────────── */
.hdr {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 13px 20px;
  background: var(--bg-header);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 100;
  flex-wrap: wrap; gap: 10px;
}

.hdr-left { display: flex; align-items: center; gap: 12px; }

.back-btn {
  width: 32px; height: 32px; border-radius: var(--r);
  background: var(--bg-card-2);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  text-decoration: none; color: var(--text-primary); font-size: 16px;
  transition: background var(--trans);
  flex-shrink: 0;
}
.back-btn:active { background: var(--border); }

.hdr-title {
  font-family: var(--font-display);
  font-weight: 700; font-size: 17px; letter-spacing: 0.3px;
  color: var(--pm-primary); line-height: 1;
}
.hdr-sub {
  font-family: var(--font-mono);
  font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--text-muted); margin-top: 3px;
}

.hdr-right { display: flex; align-items: center; gap: 8px; }

.item-count {
  font-family: var(--font-mono);
  font-size: 11px; color: var(--text-muted);
}

.refresh-btn {
  background: var(--bg-card-2);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  padding: 5px 13px; border-radius: var(--r-sm);
  cursor: pointer; font-size: 12px;
  font-family: var(--font-mono); letter-spacing: .3px;
  transition: background var(--trans), color var(--trans), border-color var(--trans);
  display: inline-flex; align-items: center; gap: 5px;
}
.refresh-btn:hover { background: var(--pm-primary-soft); color: var(--pm-primary); border-color: var(--pm-primary); }
.refresh-btn:active { transform: scale(.97); }

/* ── FILTERS BAR ────────────────────────── */
.filters {
  padding: 10px 20px;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}

.filters select, .filters input[type="text"] {
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  font-size: var(--size-sm);
  font-family: var(--font-main);
  background: var(--bg-card);
  color: var(--text-primary);
  transition: border-color var(--trans);
}
.filters select:focus, .filters input:focus { outline: none; border-color: var(--pm-primary); }

.filters label {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: var(--size-sm);
  color: var(--text-secondary);
  cursor: pointer;
}

/* ── BOARD ──────────────────────────────── */
.board {
  display: flex;
  gap: 10px;
  padding: 16px 20px;
  overflow-x: auto;
  min-height: calc(100vh - 120px);
  -webkit-overflow-scrolling: touch;
}

.column {
  min-width: 260px;
  max-width: 300px;
  flex: 1;
  background: var(--bg-card-2);
  border-radius: var(--r-lg);
  border: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.col-header {
  padding: 10px 14px;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 13px;
  text-align: center;
  color: #fff;
  position: sticky; top: 0; z-index: 2;
  display: flex; align-items: center; justify-content: center; gap: 7px;
}
.col-header .count {
  background: rgba(255,255,255,.22);
  padding: 1px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  font-family: var(--font-mono);
}

.col-body { padding: 8px; flex: 1; overflow-y: auto; min-height: 100px; }

/* ── CARDS ──────────────────────────────── */
.card {
  background: var(--bg-card);
  border-radius: var(--r);
  padding: 12px;
  margin-bottom: 8px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border-light);
  border-left: 3px solid var(--border);
  cursor: grab;
  transition: transform var(--trans), box-shadow var(--trans);
}
.card:active { cursor: grabbing; transform: scale(1.01); box-shadow: var(--shadow-lg); }
.card.overdue { border-left-color: var(--score-red); }
.card.high    { border-left-color: var(--score-amber); }
.card.medium  { border-left-color: var(--score-blue); }
.card.low     { border-left-color: var(--score-green); }

.card-id {
  font-family: var(--font-mono);
  font-size: var(--size-xs);
  color: var(--text-muted);
  font-weight: 700;
  display: flex; align-items: center; gap: 6px;
  margin-bottom: 4px;
}

.card-zone {
  font-family: var(--font-display);
  font-size: var(--size-sm);
  color: var(--pm-primary);
  font-weight: 700;
  margin: 3px 0;
}

.card-criterion {
  font-size: var(--size-sm);
  color: var(--text-primary);
  margin: 3px 0;
  line-height: 1.3;
}

.card-assignee {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--score-blue-bg);
  color: var(--score-blue);
  padding: 2px 7px;
  border-radius: 10px;
  font-size: var(--size-xs);
  margin-top: 5px;
}

.card-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 6px;
  font-size: var(--size-xs);
  color: var(--text-muted);
}

.badge {
  display: inline-block;
  padding: 2px 6px;
  border-radius: var(--r-sm);
  font-size: 10px;
  font-weight: 700;
  color: #fff;
  font-family: var(--font-mono);
}
.badge-overdue { background: var(--score-red); }
.badge-days    { background: var(--score-amber); }
.badge-ok      { background: var(--score-green); }

.card-actions {
  display: flex;
  gap: 5px;
  margin-top: 8px;
}
.card-actions button {
  flex: 1;
  padding: 6px 4px;
  font-size: var(--size-xs);
  font-family: var(--font-main);
  font-weight: 600;
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  background: var(--bg-card-2);
  color: var(--text-secondary);
  cursor: pointer;
  min-height: 30px;
  transition: background var(--trans), color var(--trans);
}
.card-actions button:active { transform: scale(.97); }
.card-actions .btn-next {
  background: var(--score-green-bg);
  color: var(--score-green);
  border-color: var(--score-green);
}
.card-actions .btn-next:active { background: var(--score-green); color: #fff; }

/* Drop target */
.drag-over { background: var(--score-green-bg) !important; outline: 2px dashed var(--score-green); }

/* ── LOADING / ERROR ────────────────────── */
.loading-state {
  display: flex; align-items: center; justify-content: center;
  height: 60vh; flex-direction: column; gap: 14px;
}
.spin {
  width: 32px; height: 32px;
  border: 3px solid var(--border);
  border-top-color: var(--pm-primary);
  border-radius: 50%;
  animation: pm-spin .9s linear infinite;
}
@keyframes pm-spin { to { transform: rotate(360deg); } }
.loading-label {
  font-family: var(--font-mono);
  font-size: 11px; letter-spacing: 1.5px;
  color: var(--text-muted); text-transform: uppercase;
}

/* ── RESPONSIVE ─────────────────────────── */
@media (max-width: 768px) {
  .board { flex-direction: column; padding: 12px; }
  .column { max-width: 100%; min-width: auto; }
  .card { cursor: pointer; }
}
</style>
</head>
<body>

<!-- ══════════ HEADER ══════════ -->
<header class="hdr">
  <div class="hdr-left">
    <a class="back-btn" href="<?= deployUrl ?>" target="_top" title="Home">←</a>
    <div>
      <div class="hdr-title">CAPA Kanban</div>
      <div class="hdr-sub">Corrective &amp; Preventive Actions</div>
    </div>
  </div>
  <div class="hdr-right">
    <span class="item-count" id="cardCount">0 items</span>
    <button class="refresh-btn" onclick="loadData()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      Refresh
    </button>
  </div>
</header>

<!-- ══════════ FILTERS ══════════ -->
<div class="filters">
  <select id="filterZone"><option value="">All Zones</option></select>
  <select id="filterPillar">
    <option value="">All Pillars</option>
    <option value="S1">S1 — Sort</option>
    <option value="S2">S2 — Set in Order</option>
    <option value="S3">S3 — Shine</option>
    <option value="S4">S4 — Standardize</option>
    <option value="S5">S5 — Sustain</option>
    <option value="S6">S6 — Safety</option>
  </select>
  <label><input type="checkbox" id="filterOverdue"> Overdue only</label>
</div>

<!-- ══════════ BOARD ══════════ -->
<div class="board" id="board">
  <div class="loading-state" id="loadingMsg">
    <div class="spin"></div>
    <div class="loading-label">Loading CAPA data</div>
  </div>
</div>

<script>
// Auth guard — read from URL param first (GAS iframe navigation), then localStorage
(function() {
  var params = new URLSearchParams(window.location.search);
  var urlToken = params.get('token');
  if (urlToken) localStorage.setItem('pm5s_token', urlToken);
  var token = localStorage.getItem('pm5s_token');
  if (!token) {
    window.top.location.href = '<?= deployUrl ?>?v2=1&action=login';
    return;
  }
  window.PM5S_TOKEN = token;
})();

function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

var STATUSES = [
  { key: "OPEN",           label: "Open",          color: "#6c757d" },
  { key: "ROOT_CAUSE",     label: "Root Cause",    color: "#6741D9" },
  { key: "ACTION_PLANNED", label: "Action Planned",color: "#1864AB" },
  { key: "IN_PROGRESS",    label: "In Progress",   color: "#E67700" },
  { key: "VERIFICATION",   label: "Verification",  color: "#2F9E44" },
  { key: "CLOSED",         label: "Closed",        color: "#0B7C45" }
];

var allCards = [];

function loadData(forceRefresh) {
  var filters = {
    zoneId: document.getElementById('filterZone').value,
    pillar: document.getElementById('filterPillar').value,
    overdueOnly: document.getElementById('filterOverdue').checked
  };
  var cacheKey = 'kanban_' + JSON.stringify(filters);

  // Show skeleton immediately if no cache
  var cached = PM5SCache.get(cacheKey);
  if (!cached) {
    document.getElementById('board').innerHTML =
      '<div class="loading-state"><div class="spin"></div><div class="loading-label">Loading CAPA data…</div></div>';
  }

  PM5SCache.load(cacheKey, function(onFresh, onError) {
    google.script.run
      .withSuccessHandler(onFresh)
      .withFailureHandler(onError)
      .getCAPAKanbanData(filters);
  }, function(cards, isStale) {
    renderBoard(cards, isStale);
  }, { ttl: 3 * 60 * 1000, forceRefresh: !!forceRefresh,
    onError: function(e) {
      if (!cached) {
        document.getElementById('board').innerHTML =
          '<div class="loading-state"><div class="loading-label" style="color:var(--score-red)">Error: ' + escHtml(e.message) + '</div></div>';
      }
    }
  });
}

function renderBoard(cards, isStale) {
  allCards = cards;
  var staleHtml = isStale ? '<span class="pm5s-stale-badge">cached</span>' : '';
  document.getElementById('cardCount').textContent = cards.length + ' items' + (isStale ? ' (cached)' : '');
  var board = document.getElementById('board');
  board.innerHTML = '';

  STATUSES.forEach(function(st) {
    var col = document.createElement('div');
    col.className = 'column';
    col.dataset.status = st.key;

    var colCards = cards.filter(function(c) { return c.status === st.key; });

    var header = document.createElement('div');
    header.className = 'col-header';
    header.style.background = st.color;
    header.innerHTML = escHtml(st.label) + ' <span class="count">' + colCards.length + '</span>';
    col.appendChild(header);

    var body = document.createElement('div');
    body.className = 'col-body';
    body.dataset.status = st.key;

    body.addEventListener('dragover', function(e) { e.preventDefault(); this.classList.add('drag-over'); });
    body.addEventListener('dragleave', function() { this.classList.remove('drag-over'); });
    body.addEventListener('drop', function(e) {
      e.preventDefault();
      this.classList.remove('drag-over');
      var ncId = e.dataTransfer.getData('text/plain');
      moveCard(ncId, this.dataset.status);
    });

    colCards.forEach(function(card) {
      body.appendChild(createCardElement(card, st.key));
    });

    col.appendChild(body);
    board.appendChild(col);
  });
}

function createCardElement(card, currentStatus) {
  var div = document.createElement('div');
  div.className = 'card ' + card.priority.toLowerCase();
  if (card.isOverdue) div.className += ' overdue';
  div.draggable = true;
  div.dataset.ncId = card.ncId;

  div.addEventListener('dragstart', function(e) {
    e.dataTransfer.setData('text/plain', card.ncId);
  });

  var badgeClass = card.isOverdue ? 'badge-overdue' : (card.daysAge > 7 ? 'badge-days' : 'badge-ok');
  var badgeText  = card.isOverdue ? 'OVERDUE' : (card.daysAge + 'd');

  div.innerHTML =
    '<div class="card-id">' + escHtml(card.ncId) +
      ' <span class="badge ' + badgeClass + '">' + escHtml(badgeText) + '</span>' +
    '</div>' +
    '<div class="card-zone">' + escHtml(card.zoneId) + ' — ' + escHtml(card.zoneName) + '</div>' +
    '<div class="card-criterion">' + escHtml(card.criterionLabel) + '</div>' +
    (card.assignee
      ? '<div class="card-assignee"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>' + escHtml(card.assignee) + '</div>'
      : '') +
    '<div class="card-meta">' +
      '<span>' + escHtml(card.auditDate) + '</span>' +
      (card.targetDate ? '<span>Due: ' + escHtml(card.targetDate) + '</span>' : '') +
    '</div>';

  var stIdx = STATUSES.findIndex(function(s) { return s.key === currentStatus; });
  var actions = document.createElement('div');
  actions.className = 'card-actions';

  if (stIdx > 0) {
    var prevBtn = document.createElement('button');
    prevBtn.textContent = '◀ ' + STATUSES[stIdx - 1].label.split(' ').pop();
    prevBtn.onclick = (function(id, key) {
      return function(e) { e.stopPropagation(); moveCard(id, key); };
    })(card.ncId, STATUSES[stIdx - 1].key);
    actions.appendChild(prevBtn);
  }
  if (stIdx < STATUSES.length - 1) {
    var nextBtn = document.createElement('button');
    nextBtn.className = 'btn-next';
    nextBtn.textContent = STATUSES[stIdx + 1].label.split(' ').pop() + ' ▶';
    nextBtn.onclick = (function(id, key) {
      return function(e) { e.stopPropagation(); moveCard(id, key); };
    })(card.ncId, STATUSES[stIdx + 1].key);
    actions.appendChild(nextBtn);
  }

  div.appendChild(actions);
  return div;
}

function moveCard(ncId, newStatus) {
  var remarks = '';
  if (newStatus === 'CLOSED') {
    remarks = prompt('Closing remarks (optional):');
    if (remarks === null) return;
  }

  // Optimistic UI: update allCards in memory and re-render immediately
  var prevStatus = null;
  for (var i = 0; i < allCards.length; i++) {
    if (allCards[i].ncId === ncId) {
      prevStatus = allCards[i].status;
      allCards[i].status = newStatus;
      break;
    }
  }
  PM5SCache.invalidatePrefix('kanban_');
  renderBoard(allCards, false);

  google.script.run
    .withFailureHandler(function(e) {
      // Roll back
      for (var i = 0; i < allCards.length; i++) {
        if (allCards[i].ncId === ncId) { allCards[i].status = prevStatus; break; }
      }
      renderBoard(allCards, false);
      if (typeof pmToast === 'function') pmToast('Move failed: ' + e.message, 'error');
      else alert('Error: ' + e.message);
    })
    .withSuccessHandler(function(result) {
      if (!result.success) {
        for (var i = 0; i < allCards.length; i++) {
          if (allCards[i].ncId === ncId) { allCards[i].status = prevStatus; break; }
        }
        renderBoard(allCards, false);
        if (typeof pmToast === 'function') pmToast(result.message, 'error');
      } else {
        loadData(true); // Hard refresh to sync with server
      }
    })
    .updateCAPAKanbanStatus(ncId, newStatus, remarks);
}

// Populate zone filter from server-injected config
try {
  var zoneConfig = (function() {
    try { return JSON.parse('<?= config.zoneConfig ?>'); } catch(e) { return {}; }
  })();
  var sel = document.getElementById('filterZone');
  Object.keys(zoneConfig).sort().forEach(function(id) {
    var opt = document.createElement('option');
    opt.value = id;
    opt.textContent = id + ' — ' + zoneConfig[id].name;
    sel.appendChild(opt);
  });
} catch(e) {}

// Wire filter changes to reload
['filterZone','filterPillar','filterOverdue'].forEach(function(id) {
  document.getElementById(id).addEventListener('change', loadData);
});

loadData();
setInterval(function() {
  if (document.visibilityState !== 'hidden') loadData();
}, 300000);

// ── Mobile swipe between stacked columns ──────────────────────────────────
(function() {
  if (window.matchMedia('(pointer: coarse)').matches === false) return; // desktop only if mouse
  var board = document.getElementById('board');
  var startX = 0, startY = 0, threshold = 60;

  board.addEventListener('pointerdown', function(e) {
    startX = e.clientX; startY = e.clientY;
  }, { passive: true });

  board.addEventListener('pointerup', function(e) {
    var dx = e.clientX - startX;
    var dy = e.clientY - startY;
    if (Math.abs(dx) < threshold || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    // Only act on mobile stacked layout
    if (window.innerWidth > 768) return;

    var columns = Array.from(board.querySelectorAll('.column'));
    if (!columns.length) return;

    // Find which column is most visible (nearest top of viewport)
    var current = columns.reduce(function(best, col) {
      var rect = col.getBoundingClientRect();
      var dist = Math.abs(rect.top);
      return dist < best.dist ? { col: col, dist: dist, idx: columns.indexOf(col) } : best;
    }, { col: columns[0], dist: Infinity, idx: 0 });

    var nextIdx = dx < 0
      ? Math.min(current.idx + 1, columns.length - 1)
      : Math.max(current.idx - 1, 0);

    columns[nextIdx].scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, { passive: true });

  // Prevent accidental horizontal scroll during vertical swipe
  board.addEventListener('touchmove', function(e) {
    if (window.innerWidth > 768) return;
    var dx = Math.abs(e.touches[0].clientX - startX);
    var dy = Math.abs(e.touches[0].clientY - startY);
    if (dx > dy && dx > 10) e.preventDefault();
  }, { passive: false });
})();
</script>
</body>
</html>
