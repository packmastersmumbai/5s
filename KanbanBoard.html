<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PackMasters — Action Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Plus Jakarta Sans',sans-serif;background:oklch(96% 0.014 82);min-height:100vh}

  .kb-header{background:oklch(20% 0.02 260);color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .kb-back{color:rgba(255,255,255,.7);text-decoration:none;font-size:12px;white-space:nowrap;padding:4px 8px;border:1px solid rgba(255,255,255,.2);border-radius:6px;font-family:'Plus Jakarta Sans',sans-serif}
  .kb-back:hover{color:#fff}
  .kb-header h1{font-size:15px;font-weight:600;letter-spacing:.3px}
  .kb-header .kb-meta{font-size:11px;opacity:.7}

  .kb-tabs{display:flex;gap:2px;padding:0 16px;background:oklch(20% 0.02 260);border-bottom:2px solid oklch(30% 0.02 260);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .kb-tabs::-webkit-scrollbar{display:none}
  .kb-tab{padding:10px 16px;font-size:12px;font-weight:600;color:rgba(255,255,255,.55);cursor:pointer;border-bottom:3px solid transparent;transition:all .15s;white-space:nowrap;letter-spacing:.5px}
  .kb-tab:hover{color:rgba(255,255,255,.85)}
  .kb-tab.active{color:#fff;border-bottom-color:#fff}
  .kb-tab[data-dim="S"].active{border-bottom-color:#e85c2e}
  .kb-tab[data-dim="Q"].active{border-bottom-color:#7c56d4}
  .kb-tab[data-dim="C"].active{border-bottom-color:#d4a010}
  .kb-tab[data-dim="D"].active{border-bottom-color:#2ba86e}
  .kb-tab[data-dim="P"].active{border-bottom-color:#c04aaa}
  .kb-tab[data-dim="RT"].active{border-bottom-color:#e85c2e}
  .kb-tab[data-dim="NC"].active{border-bottom-color:#7c56d4}

  .kb-tab .tab-count{display:inline-block;background:rgba(255,255,255,.15);border-radius:10px;padding:1px 7px;font-size:10px;margin-left:6px}
  .kb-tab.active .tab-count{background:rgba(255,255,255,.25)}

  .kb-board{padding:16px;display:none}
  .kb-board.active{display:block}

  .kb-filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
  .kb-filter-label{font-size:11px;color:#5a6070;font-weight:600;letter-spacing:.5px}
  .kb-filter-btn{padding:4px 12px;border-radius:20px;border:1px solid #d0d4de;background:#fff;font-size:11px;font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer;transition:all .12s;font-weight:500}
  .kb-filter-btn.active{background:#1a2235;color:#fff;border-color:#1a2235}

  .kb-cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}

  .kb-card{background:#fff;border-radius:10px;border:1px solid #e8eaf0;padding:14px 16px;transition:transform .12s,box-shadow .12s;animation:cardIn .3s ease both}
  .kb-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(26,34,53,.10)}
  @keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

  .card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px}
  .card-id{font-size:10px;font-family:'JetBrains Mono',monospace;color:#6b7280;font-weight:500}
  .card-status{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;letter-spacing:.4px}
  .status-open{background:#fef2ee;color:#b83a14}
  .status-inprogress{background:#fefbe8;color:#92640a}
  .status-overdue{background:#b83a14;color:#fff}
  .status-closed{background:#ecfdf5;color:#166534}
  .status-repeat{background:#4a2a8a;color:#fff}

  .card-desc{font-size:13px;font-weight:500;color:#1a2235;line-height:1.4;margin-bottom:10px}

  .card-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .meta-pill{font-size:10px;padding:2px 8px;border-radius:6px;font-weight:600;letter-spacing:.3px}
  .pill-zone{background:#eef0f8;color:#3a4a70}
  .pill-pillar{background:#fdf4e0;color:#7a5500}
  .pill-s1{background:#fef2ee;color:#b83a14}
  .pill-s2{background:#eeeafb;color:#5a30b0}
  .pill-s3{background:#ecfdf5;color:#166534}
  .pill-s4{background:#fefbe8;color:#92640a}
  .pill-s5{background:#fdf0fb;color:#8a2a7a}

  .card-footer{display:flex;align-items:center;justify-content:space-between;padding-top:8px;border-top:1px solid #f0f2f5}
  .card-owner{font-size:11px;color:#6b7280;font-weight:500}
  .card-due{font-size:10px;font-family:'JetBrains Mono',monospace}
  .due-ok{color:#166534}
  .due-warn{color:#92640a}
  .due-overdue{color:#b83a14;font-weight:700}

  .card-overdue-badge{font-size:10px;font-weight:700;color:#b83a14;background:#fef2ee;border-radius:6px;padding:2px 7px}

  .rt-card .card-top{margin-bottom:6px}
  .rt-daysopen{font-size:11px;font-weight:700;color:#b83a14}

  .kb-empty{text-align:center;padding:60px 20px;color:#8090a8}
  .kb-empty-icon{font-size:48px;margin-bottom:12px}
  .kb-empty h3{font-size:15px;font-weight:600;margin-bottom:6px}
  .kb-empty p{font-size:12px}

  .kb-loading{text-align:center;padding:60px;color:#8090a8}
  .spin{display:inline-block;width:24px;height:24px;border:3px solid #e0e4ec;border-top-color:#6b7280;border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="kb-header">
  <a class="kb-back" href="?v2=1">&#8592; Home</a>
  <div style="flex:1">
    <h1>PackMasters &#8212; Action Board</h1>
    <div class="kb-meta" id="kb-meta">Loading...</div>
  </div>
  <div class="kb-meta" id="kb-updated"></div>
</div>

<div class="kb-tabs" id="kb-tabs">
  <div class="kb-tab active" data-dim="S" onclick="switchTab('S')">&#128737; SAFETY <span class="tab-count" id="cnt-S">0</span></div>
  <div class="kb-tab" data-dim="Q" onclick="switchTab('Q')">&#128269; QUALITY <span class="tab-count" id="cnt-Q">0</span></div>
  <div class="kb-tab" data-dim="C" onclick="switchTab('C')">&#8377; COST <span class="tab-count" id="cnt-C">0</span></div>
  <div class="kb-tab" data-dim="D" onclick="switchTab('D')">&#128666; DELIVERY <span class="tab-count" id="cnt-D">0</span></div>
  <div class="kb-tab" data-dim="P" onclick="switchTab('P')">&#128100; PEOPLE <span class="tab-count" id="cnt-P">0</span></div>
  <div class="kb-tab" data-dim="RT" onclick="switchTab('RT')">&#128308; RED TAGS <span class="tab-count" id="cnt-RT">0</span></div>
  <div class="kb-tab" data-dim="NC" onclick="switchTab('NC')">&#128203; ALL NCs <span class="tab-count" id="cnt-NC">0</span></div>
</div>

<div id="board-S" class="kb-board active"><div class="kb-loading"><div class="spin"></div></div></div>
<div id="board-Q" class="kb-board"><div class="kb-loading"><div class="spin"></div></div></div>
<div id="board-C" class="kb-board"><div class="kb-loading"><div class="spin"></div></div></div>
<div id="board-D" class="kb-board"><div class="kb-loading"><div class="spin"></div></div></div>
<div id="board-P" class="kb-board"><div class="kb-loading"><div class="spin"></div></div></div>
<div id="board-RT" class="kb-board"><div class="kb-loading"><div class="spin"></div></div></div>
<div id="board-NC" class="kb-board"><div class="kb-loading"><div class="spin"></div></div></div>

<script>
var _data = null;
var _activeTab = 'S';
var _zoneFilter = 'ALL';

function switchTab(dim) {
  _activeTab = dim;
  document.querySelectorAll('.kb-tab').forEach(function(t) {
    t.classList.toggle('active', t.dataset.dim === dim);
  });
  document.querySelectorAll('.kb-board').forEach(function(b) {
    b.classList.toggle('active', b.id === 'board-' + dim);
  });
  if (_data) renderBoard(dim);
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function statusClass(s) {
  if (!s) return 'status-open';
  var m = {'Open':'status-open','In Progress':'status-inprogress','Overdue':'status-overdue',
           'Closed':'status-closed','Repeat NC':'status-repeat'};
  return m[s] || 'status-open';
}

function pillarClass(p) {
  var m = {S1:'pill-s1',S2:'pill-s2',S3:'pill-s3',S4:'pill-s4',S5:'pill-s5'};
  return m[p] || 'pill-pillar';
}

function renderNcCard(nc) {
  var overdueBadge = nc.daysOverdue > 0
    ? '<span class="card-overdue-badge">+' + nc.daysOverdue + ' days</span>' : '';
  var dueClass = nc.daysOverdue > 7 ? 'due-overdue' : nc.daysOverdue > 0 ? 'due-warn' : 'due-ok';
  return '<div class="kb-card">' +
    '<div class="card-top">' +
      '<span class="card-id">' + escHtml(nc.id) + '</span>' +
      '<span class="card-status ' + statusClass(nc.status) + '">' + escHtml(nc.status || 'Open') + '</span>' +
    '</div>' +
    '<div class="card-desc">' + escHtml(nc.description) + '</div>' +
    '<div class="card-meta">' +
      '<span class="meta-pill pill-zone">' + escHtml(nc.zone) + '</span>' +
      '<span class="meta-pill ' + pillarClass(nc.pillar) + '">' + escHtml(nc.pillar) + '</span>' +
      '<span class="meta-pill pill-pillar">' + escHtml(nc.type) + '</span>' +
    '</div>' +
    '<div class="card-footer">' +
      '<span class="card-owner">&#128100; ' + escHtml(nc.owner || '&mdash;') + '</span>' +
      '<div style="display:flex;gap:6px;align-items:center">' +
        overdueBadge +
        '<span class="card-due ' + dueClass + '">&#128197; ' + escHtml(nc.targetDate || '&mdash;') + '</span>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function renderRtCard(rt) {
  var statusCls = rt.status === 'Open' ? 'status-open' : rt.status === 'In Progress' ? 'status-inprogress' : 'status-closed';
  return '<div class="kb-card rt-card">' +
    '<div class="card-top">' +
      '<span class="card-id">' + escHtml(rt.tagNo) + '</span>' +
      '<span class="card-status ' + statusCls + '">' + escHtml(rt.status || 'Open') + '</span>' +
    '</div>' +
    '<div class="card-desc">' + escHtml(rt.item) + '</div>' +
    '<div class="card-meta">' +
      '<span class="meta-pill pill-zone">' + escHtml(rt.zone) + '</span>' +
      '<span class="meta-pill pill-pillar">&#128205; ' + escHtml(rt.reason || '&mdash;') + '</span>' +
    '</div>' +
    '<div class="card-footer">' +
      '<span class="card-owner">&#128100; ' + escHtml(rt.taggedBy || '&mdash;') + '</span>' +
      '<span class="rt-daysopen">' + rt.daysOpen + 'd open</span>' +
    '</div>' +
  '</div>';
}

function renderFilterBar() {
  var zones = ['ALL'];
  if (_data) {
    (_data.ncs || []).forEach(function(n){ if (n.zone && zones.indexOf(n.zone) < 0) zones.push(n.zone); });
    (_data.redTags || []).forEach(function(r){ if (r.zone && zones.indexOf(r.zone) < 0) zones.push(r.zone); });
    zones.sort();
    zones[0] = 'ALL';
  }
  return '<div class="kb-filters">' +
    '<span class="kb-filter-label">ZONE:</span>' +
    zones.map(function(z){
      return '<button class="kb-filter-btn' + (z === _zoneFilter ? ' active' : '') +
        '" onclick="setZoneFilter(\'' + escHtml(z) + '\')">' + escHtml(z) + '</button>';
    }).join('') +
  '</div>';
}

function setZoneFilter(zone) {
  _zoneFilter = zone;
  if (_data) renderBoard(_activeTab);
}

function renderBoard(dim) {
  var el = document.getElementById('board-' + dim);
  var items;
  if (dim === 'RT') {
    items = (_data.redTags || []).slice();
    if (_zoneFilter !== 'ALL') items = items.filter(function(r){ return r.zone === _zoneFilter; });
    if (!items.length) {
      el.innerHTML = renderFilterBar() + '<div class="kb-empty"><div class="kb-empty-icon">&#9989;</div><h3>No Active Red Tags</h3><p>All items resolved</p></div>';
      return;
    }
    el.innerHTML = renderFilterBar() + '<div class="kb-cols">' + items.map(renderRtCard).join('') + '</div>';
    return;
  }
  if (dim === 'NC') {
    items = (_data.ncs || []).filter(function(n){ return n.status !== 'Closed'; });
  } else {
    items = (_data.ncs || []).filter(function(n){ return n.sqcdp === dim && n.status !== 'Closed'; });
  }
  if (_zoneFilter !== 'ALL') items = items.filter(function(n){ return n.zone === _zoneFilter; });
  items.sort(function(a,b){ return (b.daysOverdue || 0) - (a.daysOverdue || 0); });
  if (!items.length) {
    el.innerHTML = renderFilterBar() + '<div class="kb-empty"><div class="kb-empty-icon">&#9989;</div><h3>No Open Actions</h3><p>All ' + dim + ' items resolved</p></div>';
    return;
  }
  el.innerHTML = renderFilterBar() + '<div class="kb-cols">' + items.map(renderNcCard).join('') + '</div>';
}

function updateCounts(data) {
  ['S','Q','C','D','P'].forEach(function(d) {
    var cnt = (data.ncs || []).filter(function(n){ return n.sqcdp === d && n.status !== 'Closed'; }).length;
    document.getElementById('cnt-' + d).textContent = cnt;
  });
  document.getElementById('cnt-RT').textContent = (data.redTags || []).filter(function(r){
    return r.status !== 'Disposed' && r.status !== 'Returned' && r.status !== 'Scrapped';
  }).length;
  document.getElementById('cnt-NC').textContent = (data.ncs || []).filter(function(n){ return n.status !== 'Closed'; }).length;
}

function loadData() {
  google.script.run
    .withSuccessHandler(function(result) {
      _data = typeof result === 'string' ? JSON.parse(result) : result;
      updateCounts(_data);
      renderBoard(_activeTab);
      document.getElementById('kb-meta').textContent =
        (_data.ncs || []).length + ' NCRs · ' + (_data.redTags || []).length + ' Red Tags';
      document.getElementById('kb-updated').textContent = 'Updated ' + new Date().toLocaleTimeString('en-IN');
    })
    .withFailureHandler(function(err) {
      document.getElementById('board-S').innerHTML =
        '<div class="kb-empty"><div class="kb-empty-icon">&#9888;&#65039;</div><h3>Load Error</h3><p>' + escHtml(err.message) + '</p></div>';
    })
    .getKanbanData();
}

loadData();
</script>
</body>
</html>
