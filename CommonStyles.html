<!-- Apps Script iframe fix: target="_parent" makes all links navigate out of the GAS sandbox -->
<base target="_parent">

<!-- Nav shim: when embedded in the GitHub Pages wrapper, the GAS sandbox blocks
     navigating the wrapper frame directly, so links/redirects are relayed to the
     wrapper via postMessage (it owns the iframe and swaps src). Direct/QR access
     is unaffected (top-navigation works there). -->
<script>
(function () {
  var EMBEDDED = false;
  try { EMBEDDED = (window.parent !== window.top); } catch (e) { EMBEDDED = true; }
  window.PM5S_EMBEDDED = EMBEDDED;
  window.pm5sNav = function (url) {
    if (!url) return;
    if (EMBEDDED) { try { window.top.postMessage({ pm5sNav: url }, '*'); return; } catch (e) {} }
    window.top.location.href = url;
  };
  if (EMBEDDED) {
    document.addEventListener('click', function (e) {
      var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
      if (!a) return;
      var h = a.getAttribute('href') || '';
      if (!h || h.charAt(0) === '#' || /^javascript:/i.test(h)) return;
      e.preventDefault();
      window.pm5sNav(a.href);
    }, true);
  }
})();
</script>

<!-- 5S Clean Design System — Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">

<style>
/* ═══════════════════════════════════════════════════════════════════════════
   5S CLEAN — DESIGN TOKENS
   ═══════════════════════════════════════════════════════════════════════════ */
:root {
  /* Canvas — warm off-white, easy on eyes */
  --bg-page:     #F8FAFC;
  --bg-card:     #FFFFFF;
  --bg-card-2:   #F7F6F3;
  --bg-header:   #FFFFFF;

  /* Borders */
  --border:        #E2E8F0;
  --border-light:  #F1F5F9;
  --border-focus:  #1E3A5F;

  /* Brand — Deep Navy */
  --pm-primary:       #0F172A;
  --pm-primary-light: #1E293B;
  --pm-primary-dark:  #152D4A;
  --pm-primary-soft:  rgba(15,23,42,.06);
  --pm-accent:        #2F9E44;
  --pm-accent-light:  #37B24D;

  /* ── 5S Pillar Taxonomy ──
     Each pillar has a distinct, meaningful color.
     Sort (eliminate) → Red · Set in Order (organize) → Orange
     Shine (clean) → Green · Standardize (codify) → Blue · Sustain (commit) → Purple */
  --5s-sort:     #C92A2A;   /* Seiri     — Sort       */
  --5s-set:      #D9480F;   /* Seiton    — Set Order  */
  --5s-shine:    #0B7C45;   /* Seiso     — Shine      */
  --5s-standard: #1864AB;   /* Seiketsu  — Standardize*/
  --5s-sustain:  #6741D9;   /* Shitsuke  — Sustain    */

  /* SQCDP dimension colors */
  --sqcdp-s: #C92A2A;   /* Safety   */
  --sqcdp-q: #1864AB;   /* Quality  */
  --sqcdp-c: #E67700;   /* Cost     */
  --sqcdp-d: #0B7C45;   /* Delivery */
  --sqcdp-p: #6741D9;   /* People   */

  /* Status / score */
  --score-green:    #2F9E44;
  --score-green-bg: #EBFBEE;
  --score-amber:    #E67700;
  --score-amber-bg: #FFF3E0;
  --score-red:      #C92A2A;
  --score-red-bg:   #FFF5F5;
  --score-blue:     #1864AB;
  --score-blue-bg:  #EEF4FF;

  /* Scoring levels 0–4 */
  --score-0: #C92A2A;
  --score-1: #D9480F;
  --score-2: #E67700;
  --score-3: #2F9E44;
  --score-4: #0B7C45;

  /* Typography */
  --font-display: 'Outfit', system-ui, sans-serif;
  --font-main:    'Figtree', 'Noto Sans', 'Noto Sans Devanagari', system-ui, sans-serif;
  --font-mono:    'JetBrains Mono', 'SF Mono', 'Courier New', monospace;

  /* Legacy aliases (keep for backward compat with older pages) */
  --f-display: var(--font-display);
  --f-body:    var(--font-main);
  --f-mono:    var(--font-mono);

  /* Text */
  --text-primary:   #0F172A;
  --text-secondary: #475569;
  --text-light:     #FFFFFF;
  --text-muted:     #94A3B8;

  /* Type scale */
  --size-xs:   11px;
  --size-sm:   13px;
  --size-base: 15px;
  --size-lg:   17px;
  --size-xl:   21px;
  --size-2xl:  28px;

  /* Spacing (4px base grid) */
  --sp-1: 4px;  --sp-2: 8px;   --sp-3: 12px;
  --sp-4: 16px; --sp-5: 20px;  --sp-6: 24px; --sp-8: 32px;

  /* Shape */
  --r:    8px;
  --r-sm: 5px;
  --r-lg: 12px;
  --r-xl: 16px;

  /* Elevation */
  --shadow:    0 1px 3px rgba(0,0,0,.06);
  --shadow-lg: 0 4px 16px rgba(0,0,0,.08);

  /* Tap target */
  --tap-min: 44px;

  /* Transitions */
  --trans: 0.18s ease;
}

/* ── Dark Mode — deep navy / slate palette ────────────────────────────────
   Applied via:  document.documentElement.setAttribute('data-theme','dark')
   Saved in:     localStorage key  'pm5s_theme'  ('dark' | 'light')
   ─────────────────────────────────────────────────────────────────────── */
[data-theme="dark"] {
  --bg-page:         #0d0d1a;
  --bg-card:         #15152a;
  --bg-card-2:       #1b1b32;
  --bg-header:       #15152a;
  --border:          #28284a;
  --border-light:    #1e1e38;
  --border-focus:    #6b8cba;
  --pm-primary-soft: rgba(107,140,186,.18);
  --text-primary:    #dde0f2;
  --text-secondary:  #8892bc;
  --text-muted:      #4e5480;
  --score-green-bg:  rgba(47,158,68,.18);
  --score-amber-bg:  rgba(230,119,0,.18);
  --score-red-bg:    rgba(201,42,42,.18);
  --score-blue-bg:   rgba(24,100,171,.18);
  --shadow:    0 1px 4px rgba(0,0,0,.55), 0 1px 2px rgba(0,0,0,.4);
  --shadow-lg: 0 4px 18px rgba(0,0,0,.65), 0 2px 6px rgba(0,0,0,.45);
}

/* ═══════════════════════════════════════════════════════════════════════════
   RESET & BASE
   ═══════════════════════════════════════════════════════════════════════════ */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  scroll-behavior: smooth;
}

body {
  font-family: var(--font-main);
  font-size: var(--size-base);
  color: var(--text-primary);
  background: var(--bg-page);
  min-height: 100vh;
  line-height: 1.55;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ═══════════════════════════════════════════════════════════════════════════
   HEADER
   ═══════════════════════════════════════════════════════════════════════════ */
.pm-header {
  background: var(--bg-header);
  color: var(--pm-primary);
  padding: 12px 16px;
  position: sticky;
  top: 0;
  z-index: 100;
  border-bottom: 1px solid var(--border);
  box-shadow: 0 1px 0 var(--border-light), 0 2px 8px rgba(0,0,0,.05);
}

.pm-header__brand {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 700;
  letter-spacing: .3px;
  color: var(--pm-primary);
}

.pm-header__zone {
  font-size: 13px;
  color: var(--text-secondary);
  margin-top: 2px;
}

.pm-header__date {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 2px;
}

.pm-header__row {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* ═══════════════════════════════════════════════════════════════════════════
   LANGUAGE TOGGLE
   ═══════════════════════════════════════════════════════════════════════════ */
.lang-toggle {
  display: inline-flex;
  border-radius: 20px;
  overflow: hidden;
  border: 1px solid var(--border);
  font-size: 12px;
}

.lang-toggle__btn {
  padding: 4px 12px;
  background: transparent;
  color: var(--text-secondary);
  border: none;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  min-height: 30px;
  transition: var(--trans);
}

.lang-toggle__btn.active {
  background: var(--pm-primary);
  color: #fff;
}

/* ═══════════════════════════════════════════════════════════════════════════
   MAIN CONTENT
   ═══════════════════════════════════════════════════════════════════════════ */
.pm-content {
  padding: var(--sp-4);
  max-width: 600px;
  margin: 0 auto;
  padding-bottom: 100px;
}

/* ═══════════════════════════════════════════════════════════════════════════
   CARDS
   ═══════════════════════════════════════════════════════════════════════════ */
.pm-card {
  background: var(--bg-card);
  border-radius: var(--r-lg);
  padding: var(--sp-5);
  margin-bottom: var(--sp-4);
  box-shadow: var(--shadow);
  border: 1px solid var(--border-light);
}

.pm-card__title {
  font-family: var(--font-display);
  font-size: var(--size-lg);
  font-weight: 700;
  color: var(--pm-primary);
  margin-bottom: var(--sp-3);
}

/* ═══════════════════════════════════════════════════════════════════════════
   BUTTONS
   ═══════════════════════════════════════════════════════════════════════════ */
.pm-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: var(--tap-min);
  padding: var(--sp-3) var(--sp-5);
  border: none;
  border-radius: var(--r);
  font-family: var(--font-main);
  font-size: var(--size-base);
  font-weight: 600;
  cursor: pointer;
  transition: var(--trans);
  text-decoration: none;
  gap: var(--sp-2);
  letter-spacing: .1px;
}

.pm-btn--primary {
  background: var(--pm-primary);
  color: #fff;
}
.pm-btn--primary:hover  { background: var(--pm-primary-light); }
.pm-btn--primary:active { background: var(--pm-primary-dark); transform: scale(.98); }

.pm-btn--success {
  background: var(--score-green);
  color: #fff;
}
.pm-btn--success:active { background: #268a3b; transform: scale(.98); }

.pm-btn--danger {
  background: var(--score-red);
  color: #fff;
}

.pm-btn--lg {
  min-height: 56px;
  font-size: var(--size-lg);
  border-radius: var(--r-lg);
  margin-bottom: var(--sp-4);
}

.pm-btn:disabled {
  opacity: .45;
  cursor: not-allowed;
  transform: none;
}

.pm-btn--outline {
  background: transparent;
  border: 2px solid var(--pm-primary);
  color: var(--pm-primary);
}

/* ═══════════════════════════════════════════════════════════════════════════
   PILLAR ACCORDION
   ═══════════════════════════════════════════════════════════════════════════ */
.pillar-section {
  margin-bottom: var(--sp-3);
  border-radius: var(--r-lg);
  overflow: hidden;
  border: 1px solid var(--border);
  background: var(--bg-card);
}

.pillar-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: var(--sp-4);
  background: var(--pm-primary);
  color: #fff;
  cursor: pointer;
  min-height: var(--tap-min);
  user-select: none;
  -webkit-user-select: none;
}

.pillar-header__title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: var(--size-base);
}

.pillar-header__badge {
  background: rgba(255,255,255,.2);
  padding: 2px 10px;
  border-radius: 12px;
  font-size: var(--size-sm);
  font-weight: 600;
}

.pillar-header__arrow {
  transition: transform .3s;
  font-size: 18px;
}

.pillar-header.open .pillar-header__arrow {
  transform: rotate(180deg);
}

.pillar-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height .3s ease;
}

.pillar-body.open {
  max-height: 2000px;
}

/* ═══════════════════════════════════════════════════════════════════════════
   CRITERION ROW
   ═══════════════════════════════════════════════════════════════════════════ */
.criterion-row {
  padding: var(--sp-3) var(--sp-4);
  border-bottom: 1px solid var(--border-light);
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
}

.criterion-row:last-child {
  border-bottom: none;
}

.criterion-label {
  font-size: var(--size-sm);
  line-height: 1.4;
  color: var(--text-primary);
}

.criterion-label-hi {
  font-size: var(--size-sm);
  color: var(--text-secondary);
  display: none;
}

body.lang-hi .criterion-label    { display: none; }
body.lang-hi .criterion-label-hi { display: block; }
body.lang-en .criterion-label    { display: block; }
body.lang-en .criterion-label-hi { display: none; }

/* ═══════════════════════════════════════════════════════════════════════════
   PASS / FAIL BUTTONS (DAILY)
   ═══════════════════════════════════════════════════════════════════════════ */
.pf-toggle {
  display: flex;
  gap: var(--sp-2);
}

.pf-btn {
  flex: 1;
  min-height: var(--tap-min);
  border: 2px solid var(--border);
  border-radius: var(--r);
  font-size: var(--size-sm);
  font-weight: 700;
  cursor: pointer;
  transition: var(--trans);
  background: var(--bg-card);
  color: var(--text-secondary);
}

.pf-btn--pass.selected {
  background: var(--score-green-bg);
  border-color: var(--score-green);
  color: var(--score-green);
}

.pf-btn--fail.selected {
  background: var(--score-red-bg);
  border-color: var(--score-red);
  color: var(--score-red);
}

.pf-btn:active { transform: scale(.96); }

/* ═══════════════════════════════════════════════════════════════════════════
   SCORE SELECTOR (QUICK AUDIT) — 0 to 4
   ═══════════════════════════════════════════════════════════════════════════ */
.score-selector {
  display: flex;
  gap: var(--sp-2);
}

.score-btn {
  flex: 1;
  min-height: var(--tap-min);
  min-width: var(--tap-min);
  border: 2px solid var(--border);
  border-radius: var(--r);
  font-family: var(--font-display);
  font-size: var(--size-lg);
  font-weight: 700;
  cursor: pointer;
  transition: var(--trans);
  background: var(--bg-card);
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  justify-content: center;
}

.score-btn.selected[data-score="0"] { background: var(--score-red-bg);   border-color: var(--score-0); color: var(--score-0); }
.score-btn.selected[data-score="1"] { background: #FFF0EA;               border-color: var(--score-1); color: var(--score-1); }
.score-btn.selected[data-score="2"] { background: var(--score-amber-bg); border-color: var(--score-2); color: var(--score-2); }
.score-btn.selected[data-score="3"] { background: #EAFBEF;               border-color: var(--score-3); color: var(--score-3); }
.score-btn.selected[data-score="4"] { background: var(--score-green-bg); border-color: var(--score-4); color: var(--score-4); }

.score-btn:active { transform: scale(.94); }

/* ═══════════════════════════════════════════════════════════════════════════
   NC INLINE FORM
   ═══════════════════════════════════════════════════════════════════════════ */
.nc-notice {
  background: var(--score-red-bg);
  border: 1px solid rgba(201,42,42,.25);
  border-radius: var(--r);
  padding: var(--sp-3);
  margin-top: var(--sp-2);
  font-size: var(--size-sm);
  color: var(--score-red);
  display: none;
}

.nc-notice.visible { display: block; }

/* ═══════════════════════════════════════════════════════════════════════════
   SCORE BAR (FIXED BOTTOM)
   ═══════════════════════════════════════════════════════════════════════════ */
.score-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--bg-card);
  border-top: 1px solid var(--border);
  padding: var(--sp-3) var(--sp-4);
  z-index: 99;
  box-shadow: 0 -2px 12px rgba(0,0,0,.07);
}

.score-bar__progress {
  height: 6px;
  background: var(--border-light);
  border-radius: 3px;
  overflow: hidden;
  margin-bottom: var(--sp-2);
}

.score-bar__fill {
  height: 100%;
  width: 100%;
  border-radius: 3px;
  transform-origin: left;
  transform: scaleX(0);
  transition: transform .3s ease-out, background .3s;
}

.score-bar__text {
  display: flex;
  justify-content: space-between;
  font-size: var(--size-sm);
  font-weight: 600;
}

.score-bar__value {
  font-family: var(--font-display);
  font-size: var(--size-lg);
  font-weight: 700;
}

/* ═══════════════════════════════════════════════════════════════════════════
   TEXTAREA & INPUTS
   ═══════════════════════════════════════════════════════════════════════════ */
.pm-textarea {
  width: 100%;
  min-height: 80px;
  padding: var(--sp-3);
  border: 2px solid var(--border);
  border-radius: var(--r);
  font-family: var(--font-main);
  font-size: var(--size-sm);
  background: var(--bg-card);
  resize: vertical;
  transition: border-color var(--trans);
}

.pm-textarea:focus {
  outline: none;
  border-color: var(--pm-primary);
}

.pm-input {
  width: 100%;
  min-height: var(--tap-min);
  padding: var(--sp-2) var(--sp-3);
  border: 2px solid var(--border);
  border-radius: var(--r);
  font-family: var(--font-main);
  font-size: var(--size-base);
  background: var(--bg-card);
  transition: border-color var(--trans);
}

.pm-input:focus {
  outline: none;
  border-color: var(--pm-primary);
}

/* ═══════════════════════════════════════════════════════════════════════════
   PHOTO UPLOAD
   ═══════════════════════════════════════════════════════════════════════════ */
.photo-upload {
  border: 2px dashed var(--border);
  border-radius: var(--r-lg);
  padding: var(--sp-5);
  text-align: center;
  cursor: pointer;
  transition: var(--trans);
  min-height: var(--tap-min);
  background: var(--bg-card-2);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
}

.photo-upload:active {
  border-color: var(--pm-primary);
  background: var(--score-blue-bg);
}

.photo-upload__icon { font-size: 32px; }
.photo-upload__text { font-size: var(--size-sm); color: var(--text-secondary); }

.photo-preview {
  width: 100%;
  max-height: 200px;
  object-fit: cover;
  border-radius: var(--r);
  margin-top: var(--sp-2);
  display: none;
}

.photo-preview.visible { display: block; }

/* ═══════════════════════════════════════════════════════════════════════════
   SUCCESS SCREEN
   ═══════════════════════════════════════════════════════════════════════════ */
.success-screen {
  text-align: center;
  padding: var(--sp-8) var(--sp-5);
}

.success-screen__icon {
  font-size: 64px;
  margin-bottom: var(--sp-4);
}

.success-screen__title {
  font-family: var(--font-display);
  font-size: var(--size-xl);
  font-weight: 700;
  color: var(--score-green);
  margin-bottom: var(--sp-3);
}

.success-screen__score {
  font-family: var(--font-display);
  font-size: 48px;
  font-weight: 800;
  margin: var(--sp-4) 0;
  color: var(--pm-primary);
}

.success-screen__detail {
  font-size: var(--size-sm);
  color: var(--text-secondary);
  margin-bottom: var(--sp-2);
}

/* ═══════════════════════════════════════════════════════════════════════════
   LOADING & OVERLAY
   ═══════════════════════════════════════════════════════════════════════════ */
.pm-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.4);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 200;
}

.pm-overlay.visible { display: flex; }

.pm-spinner {
  width: 44px;
  height: 44px;
  border: 3px solid rgba(255,255,255,.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: pm-spin .8s linear infinite;
}

@keyframes pm-spin { to { transform: rotate(360deg); } }

.pm-toast {
  position: fixed;
  bottom: calc(80px + env(safe-area-inset-bottom, 0px));
  left: 50%;
  transform: translateX(-50%);
  background: var(--text-primary);
  color: #fff;
  padding: var(--sp-3) var(--sp-5);
  border-radius: var(--r);
  font-size: var(--size-sm);
  z-index: 300;
  opacity: 0;
  transition: opacity .3s;
  max-width: 90%;
  text-align: center;
}

.pm-toast.visible { opacity: 1; }

/* ═══════════════════════════════════════════════════════════════════════════
   OFFLINE BANNER
   ═══════════════════════════════════════════════════════════════════════════ */
.offline-banner {
  background: var(--score-amber);
  color: #fff;
  text-align: center;
  padding: var(--sp-2);
  font-size: var(--size-sm);
  font-weight: 600;
  display: none;
}

.offline-banner.visible { display: block; }

<!-- Shared UI utilities: pmDrawer, pmToast -->
<script>
/* pmToast(msg, type, duration)  type: 'success'|'error'|'warning'|'' */
function pmToast(msg, type, duration) {
  var el = document.getElementById('pmToastEl');
  if (!el) {
    el = document.createElement('div');
    el.id = 'pmToastEl';
    el.className = 'pm-toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.className = 'pm-toast' + (type ? ' pm-toast--' + type : '');
  el.classList.add('visible');
  clearTimeout(el._t);
  el._t = setTimeout(function() { el.classList.remove('visible'); }, duration || 3000);
}

/* pmDrawer(drawerId, open) — open or close a drawer + its backdrop */
function pmDrawer(drawerId, open) {
  var d = document.getElementById(drawerId);
  var b = document.getElementById(drawerId + 'Backdrop');
  if (!d) return;
  if (open) {
    if (b) b.classList.add('open');
    d.classList.add('open');
    document.body.style.overflow = 'hidden';
  } else {
    d.classList.remove('open');
    if (b) b.classList.remove('open');
    document.body.style.overflow = '';
  }
}
</script>

<!-- ── PM5SCache: stale-while-revalidate client-side cache ── -->
<script>
var PM5SCache = (function() {
  var PREFIX = 'pm5s_cache_';
  var DEFAULT_TTL = 5 * 60 * 1000; // 5 minutes

  function key(k) { return PREFIX + k; }

  function get(k) {
    try {
      var raw = localStorage.getItem(key(k));
      if (!raw) return null;
      var entry = JSON.parse(raw);
      return entry; // Always return stale data — caller decides if expired
    } catch(e) { return null; }
  }

  function set(k, data, ttl) {
    try {
      localStorage.setItem(key(k), JSON.stringify({
        data: data,
        ts: Date.now(),
        ttl: ttl || DEFAULT_TTL
      }));
    } catch(e) {}
  }

  function isExpired(entry) {
    if (!entry) return true;
    return (Date.now() - entry.ts) > entry.ttl;
  }

  function isStale(entry) {
    if (!entry) return true;
    // Stale if older than half TTL — good time to background-refresh
    return (Date.now() - entry.ts) > ((entry.ttl || DEFAULT_TTL) / 2);
  }

  /**
   * Load with stale-while-revalidate.
   * Shows cached data instantly, then fetches fresh in background.
   * @param {string} cacheKey
   * @param {function} serverFn — google.script.run chain, called with onFresh callback
   * @param {function} render — called with data immediately (stale) and again when fresh arrives
   * @param {object} opts — { ttl, forceRefresh, onError }
   */
  function load(cacheKey, serverFn, render, opts) {
    opts = opts || {};
    var entry = get(cacheKey);
    var hasCache = entry && entry.data !== undefined;

    if (hasCache && !opts.forceRefresh) {
      // Render stale data immediately — instant feel
      render(entry.data, true /* isStale */);
    }

    // Fetch fresh if no cache, expired, stale (past half-TTL), or forced
    if (!hasCache || isExpired(entry) || isStale(entry) || opts.forceRefresh) {
      serverFn(function(fresh) {
        set(cacheKey, fresh, opts.ttl);
        render(fresh, false);
      }, function(err) {
        if (opts.onError) opts.onError(err);
        // If we had stale data, it's already shown — no need to blank the page
      });
    }
  }

  function invalidate(k) {
    try { localStorage.removeItem(key(k)); } catch(e) {}
  }

  function invalidatePrefix(prefix) {
    try {
      Object.keys(localStorage).forEach(function(k) {
        if (k.indexOf(PREFIX + prefix) === 0) localStorage.removeItem(k);
      });
    } catch(e) {}
  }

  return { get: get, set: set, isExpired: isExpired, load: load, invalidate: invalidate, invalidatePrefix: invalidatePrefix };
})();
</script>

<!-- Plan G: Offline banner HTML (injected once; visible class toggled by JS) -->
<div id="pm5sOfflineBanner" class="offline-banner">
  <span>&#128225;</span>
  <span class="offline-banner__text">You're offline — submissions will sync when WiFi returns</span>
  <button class="offline-banner__dismiss" onclick="document.getElementById('pm5sOfflineBanner').classList.remove('visible');document.body.classList.remove('has-offline-banner');">&#215;</button>

<!-- Plan G: Queue status panel HTML -->
<div id="pm5sQueuePanel" class="queue-status-panel">
  <span id="pm5sQueueCount">0</span>&nbsp;submission(s) queued — will sync when online
  <button class="queue-status-panel__sync-btn" onclick="if(typeof offlineQueue!=='undefined')offlineQueue.syncToServer();">Sync Now</button>

<!-- Plan G: Offline indicator JS + SW registration (best-effort) -->
<script>
function updateOfflineIndicator_() {
  var banner = document.getElementById('pm5sOfflineBanner');
  if (!banner) return;
  if (!navigator.onLine) {
    banner.classList.add('visible');
    document.body.classList.add('has-offline-banner');
  } else {
    banner.classList.remove('visible');
    document.body.classList.remove('has-offline-banner');
  }
}

async function updateQueueStatus_() {
  if (typeof offlineQueue === 'undefined') return;
  try {
    var stats = await offlineQueue.getQueueStats();
    var panel = document.getElementById('pm5sQueuePanel');
    var countEl = document.getElementById('pm5sQueueCount');
    if (!panel || !countEl) return;
    if (stats.pending > 0) {
      countEl.textContent = stats.pending;
      panel.classList.add('visible');
    } else {
      panel.classList.remove('visible');
    }
  } catch(e) { /* IndexedDB not available */ }
}

/* Run immediately + on connectivity changes */
updateOfflineIndicator_();
window.addEventListener('online',  updateOfflineIndicator_);
window.addEventListener('offline', updateOfflineIndicator_);

/* Poll queue status every 15s */
setInterval(updateQueueStatus_, 15000);
document.addEventListener('DOMContentLoaded', updateQueueStatus_);

/* Service Worker registration — best-effort, silently fails on GAS sandbox */
try {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js', { scope: '/' })
      .then(function(reg) { console.log('[SW] Registered', reg.scope); })
      .catch(function(err) { console.info('[SW] Not supported on this domain (GAS sandbox):', err.message); });
  }
} catch(e) { /* silently ignore */ }
</script>

<!-- Plan G: OfflineQueueService (IndexedDB) -->
<script>
/* ============================================================
   OfflineQueue — Plan G: Offline Mode
   IndexedDB queue for offline form submissions.
   ============================================================ */

var DB_NAME = 'pm5s';
var STORE_SUBMISSIONS = 'submissions';
var DB_VERSION = 1;

function getOrCreateDB_() {
  return new Promise(function(resolve, reject) {
    var request = indexedDB.open(DB_NAME, DB_VERSION);
    request.onerror = function() { reject(request.error); };
    request.onsuccess = function() { resolve(request.result); };
    request.onupgradeneeded = function(event) {
      var db = event.target.result;
      if (!db.objectStoreNames.contains(STORE_SUBMISSIONS)) {
        var store = db.createObjectStore(STORE_SUBMISSIONS, { keyPath: 'id', autoIncrement: true });
        store.createIndex('status', 'status', { unique: false });
        store.createIndex('timestamp', 'timestamp', { unique: false });
        store.createIndex('formType', 'formType', { unique: false });
        store.createIndex('zone', 'zone', { unique: false });
      }
    };
  });
}

class OfflineQueueService {
  constructor() {
    this.db = null;
    this.isOnline = navigator.onLine;
    this._initOnlineListener();
  }

  async _initDB() {
    if (!this.db) this.db = await getOrCreateDB_();
    return this.db;
  }

  async queueSubmission(formType, plainData) {
    try {
      var db = await this._initDB();
      var params = new URLSearchParams(window.location.search);
      var ownerEl = document.getElementById('owner') || document.getElementById('rtOwner') ||
                    document.getElementById('walkerName') || document.getElementById('kzName') ||
                    document.querySelector('[name="owner"]');
      var submission = {
        status: 'pending', formType: formType,
        zone: plainData.zone || plainData.zoneId || params.get('zone') || '',
        owner: (ownerEl && ownerEl.value) || params.get('currentUser') || 'unknown',
        timestamp: Date.now(), expiresAt: Date.now() + 86400000,
        attemptCount: 0, lastAttempt: null, errorMessage: null, data: plainData
      };
      var store = db.transaction(STORE_SUBMISSIONS, 'readwrite').objectStore(STORE_SUBMISSIONS);
      var req = store.add(submission);
      return new Promise(function(resolve, reject) {
        req.onerror = function() { reject(req.error); };
        req.onsuccess = function() { console.log('[OfflineQueue] Queued ' + formType + ' (id=' + req.result + ')'); resolve(req.result); };
      });
    } catch(e) { console.error('[OfflineQueue] queueSubmission failed:', e); throw e; }
  }

  async getPendingSubmissions() {
    try {
      var db = await this._initDB();
      var index = db.transaction(STORE_SUBMISSIONS, 'readonly').objectStore(STORE_SUBMISSIONS).index('status');
      return new Promise(function(resolve, reject) {
        var req = index.getAll('pending');
        req.onerror = function() { reject(req.error); };
        req.onsuccess = function() { resolve(req.result); };
      });
    } catch(e) { console.error('[OfflineQueue] getPending failed:', e); return []; }
  }

  async markSynced(id) {
    try {
      var db = await this._initDB();
      var store = db.transaction(STORE_SUBMISSIONS, 'readwrite').objectStore(STORE_SUBMISSIONS);
      return new Promise(function(resolve, reject) {
        var getReq = store.get(id);
        getReq.onerror = function() { reject(getReq.error); };
        getReq.onsuccess = function() {
          var rec = getReq.result; if (!rec) { resolve(null); return; }
          rec.status = 'synced'; rec.syncedAt = Date.now();
          var putReq = store.put(rec);
          putReq.onerror = function() { reject(putReq.error); };
          putReq.onsuccess = function() { resolve(rec); };
        };
      });
    } catch(e) { console.error('[OfflineQueue] markSynced failed:', e); }
  }

  async markFailed(id, errorMessage) {
    try {
      var db = await this._initDB();
      var store = db.transaction(STORE_SUBMISSIONS, 'readwrite').objectStore(STORE_SUBMISSIONS);
      return new Promise(function(resolve, reject) {
        var getReq = store.get(id);
        getReq.onerror = function() { reject(getReq.error); };
        getReq.onsuccess = function() {
          var rec = getReq.result; if (!rec) { resolve(null); return; }
          rec.status = 'failed'; rec.errorMessage = errorMessage;
          rec.attemptCount = (rec.attemptCount || 0) + 1; rec.lastAttempt = Date.now();
          var putReq = store.put(rec);
          putReq.onerror = function() { reject(putReq.error); };
          putReq.onsuccess = function() { resolve(rec); };
        };
      });
    } catch(e) { console.error('[OfflineQueue] markFailed failed:', e); }
  }

  async cleanupExpired() {
    try {
      var db = await this._initDB();
      var store = db.transaction(STORE_SUBMISSIONS, 'readwrite').objectStore(STORE_SUBMISSIONS);
      var now = Date.now();
      return new Promise(function(resolve, reject) {
        var req = store.getAll();
        req.onerror = function() { reject(req.error); };
        req.onsuccess = function() {
          var expired = req.result.filter(function(s) { return s.expiresAt < now; });
          expired.forEach(function(s) { store.delete(s.id); });
          resolve(expired.length);
        };
      });
    } catch(e) { console.error('[OfflineQueue] cleanupExpired failed:', e); return 0; }
  }

  async getQueueStats() {
    try {
      var db = await this._initDB();
      var store = db.transaction(STORE_SUBMISSIONS, 'readonly').objectStore(STORE_SUBMISSIONS);
      return new Promise(function(resolve, reject) {
        var req = store.getAll();
        req.onerror = function() { reject(req.error); };
        req.onsuccess = function() {
          var all = req.result;
          var pending = all.filter(function(s) { return s.status === 'pending'; });
          var failed  = all.filter(function(s) { return s.status === 'failed'; });
          var synced  = all.filter(function(s) { return s.status === 'synced'; });
          resolve({ total: all.length, pending: pending.length, failed: failed.length, synced: synced.length,
            oldestPending: pending.length > 0 ? pending[0].timestamp : null });
        };
      });
    } catch(e) { console.error('[OfflineQueue] getQueueStats failed:', e); return { total: 0, pending: 0, failed: 0, synced: 0 }; }
  }

  async syncToServer() {
    if (!navigator.onLine) { console.log('[OfflineQueue] Offline — skipping sync'); return; }
    try {
      var pending = await this.getPendingSubmissions();
      if (pending.length === 0) { console.log('[OfflineQueue] Nothing to sync'); return; }
      console.log('[OfflineQueue] Syncing ' + pending.length + ' submissions');
      var self = this;
      google.script.run
        .withSuccessHandler(async function(resp) {
          if (!resp) return;
          var errMap = {};
          (resp.errors || []).forEach(function(e) { if (e.id) errMap[e.id] = e.message; });
          for (var i = 0; i < pending.length; i++) {
            var sub = pending[i];
            if (errMap[sub.id]) { await self.markFailed(sub.id, errMap[sub.id]); }
            else { await self.markSynced(sub.id); }
          }
          if ((resp.synced || 0) > 0 && typeof pmToast === 'function') pmToast('Synced ' + resp.synced + ' submission' + (resp.synced > 1 ? 's' : ''), 'success');
          if ((resp.failed || 0) > 0 && typeof pmToast === 'function') pmToast(resp.failed + ' submission(s) failed to sync', 'error');
          updateQueueStatus_();
        })
        .withFailureHandler(function(e) {
          console.error('[OfflineQueue] Server sync failed:', e);
          if (typeof pmToast === 'function') pmToast('Sync failed — will retry when online', 'warning');
        })
        .syncOfflineSubmissions(JSON.stringify(pending));
    } catch(e) { console.error('[OfflineQueue] syncToServer failed:', e); }
  }

  _initOnlineListener() {
    var self = this;
    window.addEventListener('online', function() {
      console.log('[OfflineQueue] Online detected');
      self.isOnline = true; self.cleanupExpired(); self.syncToServer();
      if (typeof updateOfflineIndicator_ === 'function') updateOfflineIndicator_();
    });
    window.addEventListener('offline', function() {
      console.log('[OfflineQueue] Offline detected');
      self.isOnline = false;
      if (typeof updateOfflineIndicator_ === 'function') updateOfflineIndicator_();
    });
  }
}

var offlineQueue = new OfflineQueueService();
</script>
