<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PackMasters — Analytics</title>
<?!= include("CommonStyles") ?>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Plus Jakarta Sans',sans-serif;background:#f4f5f8;min-height:100vh}

  .av-header{background:#1a2235;color:#fff;padding:12px 20px;display:flex;align-items:center;gap:12px}
  .av-back{color:rgba(255,255,255,.7);text-decoration:none;font-size:12px;padding:4px 8px;border:1px solid rgba(255,255,255,.2);border-radius:6px;white-space:nowrap}
  .av-back:hover{color:#fff}
  .av-header h1{font-size:15px;font-weight:600;flex:1}
  .av-meta{font-size:11px;opacity:.6}

  .av-body{padding:16px;display:flex;flex-direction:column;gap:16px}

  /* KPI Strip */
  .kpi-strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
  .kpi-card{background:#fff;border-radius:12px;border:1px solid #e0e4ee;padding:16px 18px}
  .kpi-label{font-size:10px;font-weight:700;color:#8090a8;letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px}
  .kpi-value{font-size:26px;font-weight:700;font-family:'JetBrains Mono',monospace;color:#1a2235;line-height:1}
  .kpi-sub{font-size:11px;color:#8090a8;margin-top:4px}
  .kpi-delta{font-size:11px;font-weight:700;margin-top:4px}
  .delta-up{color:#2ba86e}
  .delta-dn{color:#e85c2e}
  .kpi-card.accent-green{border-left:3px solid #2ba86e}
  .kpi-card.accent-red{border-left:3px solid #e85c2e}
  .kpi-card.accent-blue{border-left:3px solid #7c56d4}
  .kpi-card.accent-amber{border-left:3px solid #d4a010}

  /* Section card */
  .section-card{background:#fff;border-radius:12px;border:1px solid #e0e4ee;padding:20px}
  .section-title{font-size:12px;font-weight:700;color:#5a6070;letter-spacing:.5px;text-transform:uppercase;margin-bottom:16px}

  /* SQCDP Heatmap */
  .sqcdp-grid{display:flex;flex-direction:column;gap:6px}
  .sqcdp-row{display:flex;gap:8px;align-items:center}
  .sqcdp-label{font-size:11px;font-weight:700;color:#1a2235;width:80px;flex-shrink:0}
  .sqcdp-bar-track{flex:1;height:20px;background:#f0f2f5;border-radius:6px;overflow:hidden;position:relative}
  .sqcdp-bar-fill{height:100%;border-radius:6px;transition:width .6s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:8px}
  .sqcdp-bar-fill span{font-size:10px;font-weight:700;color:#fff}
  .sqcdp-count{font-size:11px;font-family:'JetBrains Mono',monospace;color:#6b7280;width:28px;text-align:right;flex-shrink:0}

  /* Zone Ranking */
  .zone-table{width:100%;border-collapse:collapse}
  .zone-table th{font-size:10px;font-weight:700;color:#8090a8;letter-spacing:.5px;text-transform:uppercase;padding:6px 10px;text-align:left;border-bottom:1px solid #f0f2f5}
  .zone-table td{padding:8px 10px;font-size:12px;color:#1a2235;border-bottom:1px solid #f7f8fa}
  .zone-table tr:last-child td{border-bottom:none}
  .zone-table tr:hover td{background:#fafbfc}
  .score-pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;font-family:'JetBrains Mono',monospace}
  .score-green{background:#ecfdf5;color:#166534}
  .score-amber{background:#fefbe8;color:#92640a}
  .score-red{background:#fef2ee;color:#b83a14}
  .rank-badge{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:700;background:#f0f2f5;color:#6b7280}
  .rank-1{background:#d4a010;color:#fff}
  .rank-2{background:#a0aab8;color:#fff}
  .rank-3{background:#c07040;color:#fff}
  .delta-cell{font-size:11px;font-weight:700;font-family:'JetBrains Mono',monospace}

  /* Pillar NC breakdown */
  .pillar-nc-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .pillar-nc-cell{background:#f7f8fa;border-radius:8px;padding:12px 8px;text-align:center}
  .pillar-nc-name{font-size:10px;font-weight:700;color:#6b7280;letter-spacing:.3px;margin-bottom:6px}
  .pillar-nc-val{font-size:20px;font-weight:700;font-family:'JetBrains Mono',monospace}
  .pillar-s1{color:#e85c2e}
  .pillar-s2{color:#7c56d4}
  .pillar-s3{color:#2ba86e}
  .pillar-s4{color:#d4a010}
  .pillar-s5{color:#c04aaa}

  .av-loading{text-align:center;padding:60px;color:#8090a8}
  .spin{display:inline-block;width:24px;height:24px;border:3px solid #e0e4ec;border-top-color:#6b7280;border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .av-error{text-align:center;padding:40px;color:#b83a14}
</style>
</head>
<body>

<div class="av-header">
  <a class="av-back" href="javascript:history.back()">&#8592; Back</a>
  <h1>5S Analytics</h1>
  <div class="av-meta" id="av-meta">Loading...</div>
</div>

<div class="av-body" id="av-body">
  <div class="av-loading"><div class="spin"></div></div>
</div>

<script>
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function scoreClass(s) {
  if (s >= 80) return 'score-green';
  if (s >= 60) return 'score-amber';
  return 'score-red';
}

function deltaHtml(d) {
  if (d === null || d === undefined || d === '') return '<span style="color:#c0c8d8">—</span>';
  var n = Number(d);
  if (isNaN(n)) return '<span style="color:#c0c8d8">—</span>';
  if (n > 0) return '<span class="delta-up">&#9650;' + n.toFixed(1) + '</span>';
  if (n < 0) return '<span class="delta-dn">&#9660;' + Math.abs(n).toFixed(1) + '</span>';
  return '<span style="color:#a0aab8">&#8212;</span>';
}

function renderKPIs(kpis) {
  var onTarget = kpis.zonesOnTarget || 0;
  var total = kpis.totalZones || 28;
  return '<div class="kpi-strip">' +
    '<div class="kpi-card accent-green">' +
      '<div class="kpi-label">Plant Avg</div>' +
      '<div class="kpi-value">' + (kpis.plantAvg || 0) + '<span style="font-size:14px;font-weight:400">%</span></div>' +
      '<div class="kpi-sub">Overall 5S score</div>' +
    '</div>' +
    '<div class="kpi-card accent-blue">' +
      '<div class="kpi-label">Zones on Target</div>' +
      '<div class="kpi-value">' + onTarget + '<span style="font-size:14px;font-weight:400">/' + total + '</span></div>' +
      '<div class="kpi-sub">&#8805;80% score</div>' +
    '</div>' +
    '<div class="kpi-card accent-red">' +
      '<div class="kpi-label">Open NCRs</div>' +
      '<div class="kpi-value">' + (kpis.openNCs || 0) + '</div>' +
      '<div class="kpi-sub">Pending action</div>' +
    '</div>' +
    '<div class="kpi-card accent-amber">' +
      '<div class="kpi-label">Overdue NCRs</div>' +
      '<div class="kpi-value">' + (kpis.overdueNCs || 0) + '</div>' +
      '<div class="kpi-sub">Past target date</div>' +
    '</div>' +
    '<div class="kpi-card">' +
      '<div class="kpi-label">Active Red Tags</div>' +
      '<div class="kpi-value">' + (kpis.activeRedTags || 0) + '</div>' +
      '<div class="kpi-sub">Pending disposal</div>' +
    '</div>' +
  '</div>';
}

function renderSqcdp(heatmap) {
  if (!heatmap) return '';
  var dims = [
    {key:'S',label:'Safety',color:'#e85c2e'},
    {key:'Q',label:'Quality',color:'#7c56d4'},
    {key:'C',label:'Cost',color:'#d4a010'},
    {key:'D',label:'Delivery',color:'#2ba86e'},
    {key:'P',label:'People',color:'#c04aaa'}
  ];
  var max = Math.max.apply(null, dims.map(function(d){ return heatmap[d.key] || 0; })) || 1;
  var html = '<div class="section-card"><div class="section-title">NCRs by SQCDP Dimension</div><div class="sqcdp-grid">';
  dims.forEach(function(d) {
    var cnt = heatmap[d.key] || 0;
    var pct = Math.round((cnt / max) * 100);
    html += '<div class="sqcdp-row">' +
      '<div class="sqcdp-label">' + d.label + '</div>' +
      '<div class="sqcdp-bar-track"><div class="sqcdp-bar-fill" style="width:' + pct + '%;background:' + d.color + '"><span>' + cnt + '</span></div></div>' +
      '<div class="sqcdp-count">' + cnt + '</div>' +
    '</div>';
  });
  html += '</div></div>';
  return html;
}

function renderPillarNCs(pillarNCs) {
  if (!pillarNCs) return '';
  var pillars = [
    {key:'S1',label:'Sort',cls:'pillar-s1'},
    {key:'S2',label:'Set',cls:'pillar-s2'},
    {key:'S3',label:'Shine',cls:'pillar-s3'},
    {key:'S4',label:'Std',cls:'pillar-s4'},
    {key:'S5',label:'Sustain',cls:'pillar-s5'}
  ];
  var html = '<div class="section-card"><div class="section-title">Open NCRs by 5S Pillar</div><div class="pillar-nc-grid">';
  pillars.forEach(function(p) {
    html += '<div class="pillar-nc-cell">' +
      '<div class="pillar-nc-name">' + p.label + '</div>' +
      '<div class="pillar-nc-val ' + p.cls + '">' + (pillarNCs[p.key] || 0) + '</div>' +
    '</div>';
  });
  html += '</div></div>';
  return html;
}

function renderZoneRanking(zoneScores) {
  if (!zoneScores || !zoneScores.length) return '';
  var sorted = zoneScores.slice().sort(function(a,b){ return b.overall - a.overall; });
  var html = '<div class="section-card"><div class="section-title">Zone Rankings</div>' +
    '<div style="overflow-x:auto"><table class="zone-table">' +
    '<thead><tr>' +
      '<th>Rank</th><th>Zone</th><th>Score</th>' +
      '<th>S1</th><th>S2</th><th>S3</th><th>S4</th><th>S5</th>' +
      '<th>&#916; MoM</th>' +
    '</tr></thead><tbody>';
  sorted.forEach(function(z, i) {
    var rankCls = i === 0 ? 'rank-1' : i === 1 ? 'rank-2' : i === 2 ? 'rank-3' : '';
    html += '<tr>' +
      '<td><span class="rank-badge ' + rankCls + '">' + (i+1) + '</span></td>' +
      '<td><strong>' + escHtml(z.zoneId) + '</strong></td>' +
      '<td><span class="score-pill ' + scoreClass(z.overall) + '">' + z.overall + '%</span></td>' +
      '<td><span style="font-size:11px;color:#6b7280">' + (z.s1||'--') + '</span></td>' +
      '<td><span style="font-size:11px;color:#6b7280">' + (z.s2||'--') + '</span></td>' +
      '<td><span style="font-size:11px;color:#6b7280">' + (z.s3||'--') + '</span></td>' +
      '<td><span style="font-size:11px;color:#6b7280">' + (z.s4||'--') + '</span></td>' +
      '<td><span style="font-size:11px;color:#6b7280">' + (z.s5||'--') + '</span></td>' +
      '<td class="delta-cell">' + deltaHtml(z.delta) + '</td>' +
    '</tr>';
  });
  html += '</tbody></table></div></div>';
  return html;
}

function render(kpis) {
  var body = document.getElementById('av-body');
  body.innerHTML =
    renderKPIs(kpis) +
    renderSqcdp(kpis.sqcdpHeatmap) +
    renderPillarNCs(kpis.pillarNCs) +
    renderZoneRanking(kpis.zoneScores);

  document.getElementById('av-meta').textContent =
    kpis.totalZones + ' zones · Plant avg ' + kpis.plantAvg + '%';
}

google.script.run
  .withSuccessHandler(function(result) {
    var kpis = typeof result === 'string' ? JSON.parse(result) : result;
    render(kpis);
  })
  .withFailureHandler(function(err) {
    document.getElementById('av-body').innerHTML =
      '<div class="av-error">&#9888;&#65039; Load error: ' + escHtml(err.message) + '</div>';
  })
  .getAnalyticsKPIs();
</script>
</body>
</html>
