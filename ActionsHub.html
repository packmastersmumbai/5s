<script>
/* ── helpers ── */
function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── state ── */
var CURRENT_USER = '<?= (typeof params !== "undefined" && params && params.currentUser) ? params.currentUser : "" ?>';
/* params.only arrives from the per-type routes (audits / issues / tasks /
   walks / kaizenlist) and pins this page to one record type. The shared filter
   rail then owns zone, status and priority for every page alike, so the hub no
   longer keeps its own copies of those controls. */
var PAGE_TYPE = '<?= (typeof params !== "undefined" && params && params.only) ? String(params.only).replace(/[^A-Z_]/g, "") : "" ?>';
/* The per-page status default. It used to be read off the filter rail, which
   has since been retired, so it is stated here instead of inferred from a
   control that no longer exists.

   TASK keeps OPEN because the Tasks strip opens on Open and the two must
   agree. Everything else defaults to every status: an audit or a walk is
   finished the moment it is recorded, and all 34 NCs are closed, so filtering
   to OPEN showed an empty page on three of the five. */
var STATUS_DEFAULT = (PAGE_TYPE === 'TASK') ? 'OPEN' : '';
var _filters = { type: PAGE_TYPE, status: STATUS_DEFAULT, priority: '', zoneId: '' };

/* Adopt whatever the rail already holds, then follow it. Without this a filter
   set on Tasks would be visibly active in the rail while this list ignored it. */
(function () {
  function adopt(f) {
    if (!f) return;
    _filters.zoneId = f.zone || '';
    _filters.status = (f.status === undefined) ? STATUS_DEFAULT : f.status;
    _filters.priority = f.priority || '';
    _filters.type = PAGE_TYPE;          // the page's type always wins
    if (typeof applyFiltersAndRender_ === 'function' && window._allItems) {
      applyFiltersAndRender_();
    }
  }
  try { if (window.PM5S_FILTERS) adopt(window.PM5S_FILTERS); } catch (e) {}
  window.addEventListener('pm5s:filters', function (e) { adopt(e.detail); });
})();
var _lastCounts = { byType:{NC:0,TASK:0,RED_TAG:0,KAIZEN:0,GEMBA:0,AUDIT:0}, byStatus:{OPEN:0,IN_PROGRESS:0,CLOSED:0}, byPriority:{}, total:0 };
var _rcaPendingId = null;

/* ── tabs / chips ── */
function setTypeTab(btn) {
  document.querySelectorAll('.ah-type-tab').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  var t = btn.getAttribute('data-type');
  var isAudits = (t === 'AUDITS');
  var isWalks = (t === 'WALKS');
  var isSummary = (t === 'SUMMARY');
  var own = isAudits || isWalks || isSummary;   // views with their own renderer
  /* Status lives in the shared filter rail now; showing it here too meant two
     controls for one value that could disagree on screen. */
  var st = document.getElementById('ahStatusTabs');
  var fr = document.querySelector('.ah-filter-row');
  var ft = document.getElementById('ahFilterToggle');
  if (st) st.style.display = own ? 'none' : '';
  /* NOTE: never set inline display on .ah-filter-row — it would override the
     .open class and permanently break the Filters toggle. Use a class instead. */
  if (fr) fr.classList.toggle('hidden', own);
  if (ft) ft.style.display = own ? 'none' : '';
  if (isAudits) { renderAuditsView(); return; }
  if (isWalks) { renderWalksView(); return; }
  if (isSummary) { renderSummaryView(); return; }
  _filters.type = t === 'ALL' ? '' : t;
  fetchAndRender();
}

/* ── Summary view: open NC/Task/RedTag counts by user and by zone ── */
function renderSummaryView() {
  document.getElementById('ahContent').innerHTML = '<div class="ah-loading">Loading summary…</div>';
  google.script.run
    .withSuccessHandler(function(res) {
      var byUser = (res && res.byUser) || [];
      var byZone = (res && res.byZone) || [];

      /* Sort by what is still open, not by total: a row with 45 open is the
         one that needs attention, whatever its total. */
      function byOpenDesc(a, b) { return (b.open - a.open) || (b.total - a.total); }
      byUser = byUser.slice().sort(byOpenDesc);
      byZone = byZone.slice().sort(byOpenDesc);

      function num(v, cls, label) {
        return '<span class="ah-sum-num ' + cls + (v ? '' : ' zero') + '">' +
          '<b class="ah-sum-num__v">' + v + '</b>' +
          '<span class="ah-sum-num__l">' + label + '</span></span>';
      }
      function typeBits(t) {
        var out = [];
        if (t.NC)      out.push('<b>' + t.NC + '</b> NC');
        if (t.TASK)    out.push('<b>' + t.TASK + '</b> Task' + (t.TASK === 1 ? '' : 's'));
        if (t.RED_TAG) out.push('<b>' + t.RED_TAG + '</b> Red Tag' + (t.RED_TAG === 1 ? '' : 's'));
        if (t.KAIZEN)  out.push('<b>' + t.KAIZEN + '</b> Kaizen');
        if (t.GEMBA)   out.push('<b>' + t.GEMBA + '</b> Walk' + (t.GEMBA === 1 ? '' : 's'));
        if (t.AUDIT)   out.push('<b>' + t.AUDIT + '</b> Audit' + (t.AUDIT === 1 ? '' : 's'));
        return out.join('') ? out.join('<span aria-hidden="true">&middot;</span>') : '';
      }
      function row(b) {
        var pctOpen = b.total ? Math.round((b.open / b.total) * 100) : 0;
        return '<div class="ah-sum-row">' +
          '<span>' +
            '<span class="ah-sum-row__name">' + escHtml(b.label) + '</span>' +
            '<span class="ah-sum-row__types">' + typeBits(b.byType || {}) + '</span>' +
          '</span>' +
          '<span class="ah-sum-nums">' +
            num(b.open, 'open', 'Open') +
            num(b.inProgress, 'prog', 'Doing') +
            num(b.closed, 'closed', 'Closed') +
            num(b.total, 'total', 'Total') +
          '</span>' +
          '<span class="ah-sum-bar" title="' + pctOpen + '% still open">' +
            '<span style="width:' + pctOpen + '%"></span></span>' +
        '</div>';
      }
      function section(title, sub, rows) {
        return '<div class="ah-sum-section"><h3>' + title + '</h3>' +
          '<p class="ah-sum-section__sub">' + sub + '</p>' +
          (rows.length ? rows.map(row).join('') : '<div class="ah-empty">No actions yet.</div>') +
          '</div>';
      }
      function totals(list) {
        var o = 0, t = 0;
        list.forEach(function(b) { o += b.open; t += b.total; });
        return { open: o, total: t };
      }
      var tu = totals(byUser), tz = totals(byZone);
      var html =
        section('By owner', byUser.length + ' owners &middot; ' + tu.open + ' of ' + tu.total + ' still open', byUser) +
        section('By zone',  byZone.length + ' zones &middot; '  + tz.open + ' of ' + tz.total + ' still open', byZone);
      document.getElementById('ahContent').innerHTML = html;
    })
    .withFailureHandler(function(e) {
      document.getElementById('ahContent').innerHTML = '<div class="ah-empty">' + escHtml(friendlyError_(e)) + '</div>';
    })
    .getActionsSummary({});
}

/* ── Walks view (Gemba walks, newest first) ──
   Same tile idiom as Audits: a walk is a scored record you scan, and the two
   sit side by side as tabs, so they must read as siblings. The number that
   leads is compliance %, and the findings count is what makes a walk worth
   opening -- so it gets its own line rather than hiding in the stats row. */
function renderWalksView() {
  document.getElementById('ahContent').innerHTML = '<div class="ah-loading">Loading walks…</div>';
  google.script.run
    .withSuccessHandler(function(res) {
      var walks = (res || []).slice().sort(function(a, b) {
        return String(b.timestamp || '').localeCompare(String(a.timestamp || ''));
      });
      if (!walks.length) {
        document.getElementById('ahContent').innerHTML = '<div class="ah-empty">No Gemba walks recorded yet.</div>';
        return;
      }
      var html = '<div class="au-grid">' + walks.map(function(w) {
        var pct = Number(w.compliancePct || 0);
        var pcls = pct >= 80 ? 'g' : pct >= 60 ? 'a' : 'r';
        var no = Number(w.noCount || 0);
        return '<button type="button" class="au-tile" ' +
          'onclick="openWalkRecord_(' + escHtml(JSON.stringify(w.walkId)) + ')">' +
          '<span class="au-score ' + pcls + '">' + pct + '<i>%</i></span>' +
          '<span class="au-body">' +
            '<span class="au-zone">' + escHtml(w.zoneId || '') + '</span>' +
            '<span class="au-name">' + escHtml(w.zoneName || '') + '</span>' +
            '<span class="au-meta">' + escHtml(w.walkType || '') +
              (w.timestamp ? ' &middot; ' + escHtml(String(w.timestamp)) : '') + '</span>' +
            '<span class="au-stats">' +
              '<span title="checks asked">&#9989; ' + (w.totalQuestions || 0) + '</span>' +
              '<span title="findings">' + (no > 0 ? '&#10060; ' + no : '&#128077; 0') + '</span>' +
            '</span>' +
            '<span class="au-by" title="walked by">' + escHtml(auditorName_(w.walkerName)) + '</span>' +
          '</span></button>';
      }).join('') + '</div>';
      document.getElementById('ahContent').innerHTML = html;
    })
    .withFailureHandler(function(e) {
      document.getElementById('ahContent').innerHTML = '<div class="ah-empty">' + escHtml(friendlyError_(e)) + '</div>';
    })
    .getGembaWalkData({});
}

/* The walk record page already renders every finding with its question text,
   SQCDP leg and category. Open it rather than duplicating that here. */
function openWalkRecord_(walkId) {
  top.location.href = '?v2=1&action=record&type=gemba&id=' + encodeURIComponent(walkId);
}

/* ── Audits view (per-criterion filled audits with photos) ── */
/* Audits recorded the raw account: "system" or a full address. Neither names
   a person, and an address is too long for the tile. */
function auditorName_(raw) {
  var v = String(raw || '').trim();
  if (!v) return 'Unknown auditor';
  if (/^(system|admin|tbm|bbm)$/i.test(v)) return 'Automated';
  if (/^packmasters[.]mumbai@/i.test(v)) return 'PackMasters';
  if (v.indexOf('@') > 0) v = v.slice(0, v.indexOf('@')).replace(/[._-]+/g, ' ');
  return v.replace(/[^\s]+/g, function (w) {
    return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
  });
}

function renderAuditsView() {
  document.getElementById('ahContent').innerHTML = '<div class="ah-loading">Loading audits…</div>';
  google.script.run
    .withSuccessHandler(function(res) {
      var audits = (res && res.audits) || [];
      if (!audits.length) {
        document.getElementById('ahContent').innerHTML = '<div class="ah-empty">No submitted audits yet.</div>';
        return;
      }
      /* Audits were one-line cards stacked full-width: a wall of near-identical
         rows that wasted the whole right-hand side of a desktop screen and made
         the score — the one number you scan for — the same weight as the rest.
         Now a responsive grid of tiles, score leading. */
      var html = '<div class="au-grid">' + audits.map(function(a) {
        var pcls = a.pct >= 80 ? 'g' : a.pct >= 60 ? 'a' : 'r';
        var d = a.timestamp ? new Date(a.timestamp) : null;
        var when = d && !isNaN(d) ? fmtDate_(a.timestamp) : '';
        var time = d && !isNaN(d)
          ? (('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2)) : '';
        return '<button type="button" class="au-tile" ' +
          'onclick="openAuditDetail(' + escHtml(JSON.stringify(a.submissionId)) + ')">' +
          '<span class="au-score ' + pcls + '">' + a.pct + '<i>%</i></span>' +
          '<span class="au-body">' +
            '<span class="au-zone">' + escHtml(a.zoneId) + '</span>' +
            '<span class="au-name">' + escHtml(a.zoneName || '') + '</span>' +
            '<span class="au-meta">' + escHtml(when) + (time ? ' &middot; ' + time : '') + '</span>' +
            '<span class="au-stats">' +
              '<span title="criteria scored">&#9989; ' + a.count + '</span>' +
              '<span title="photos attached">&#128247; ' + a.photos + '</span>' +
            '</span>' +
            '<span class="au-by" title="auditor">' + escHtml(auditorName_(a.auditor)) + '</span>' +
          '</span></button>';
      }).join('') + '</div>';
      document.getElementById('ahContent').innerHTML = html;
    })
    .withFailureHandler(function(e) {
      document.getElementById('ahContent').innerHTML = '<div class="ah-empty">' + escHtml(friendlyError_(e)) + '</div>';
    })
    .getRecentAudits(50);
}

/* ── Photo lightbox: each criterion's photo array is registered as a
   "gallery" so prev/next navigates within that criterion's own photos. ── */
var _ahGalleries = [];
var _ahLbState = { gallery: -1, idx: 0 };
function _ahRegisterGallery(urls) { return _ahGalleries.push(urls) - 1; }
function openAhLightbox(galleryIdx, photoIdx) {
  _ahLbState = { gallery: galleryIdx, idx: photoIdx };
  _ahRenderLightbox();
  document.getElementById('ahLightbox').classList.add('open');
}
function _ahRenderLightbox() {
  var urls = _ahGalleries[_ahLbState.gallery] || [];
  if (!urls.length) return;
  document.getElementById('ahLbImg').src = urls[_ahLbState.idx];
  document.getElementById('ahLbCount').textContent = (_ahLbState.idx + 1) + ' / ' + urls.length;
  var multi = urls.length > 1;
  document.getElementById('ahLbPrev').style.display = multi ? '' : 'none';
  document.getElementById('ahLbNext').style.display = multi ? '' : 'none';
}
function ahLbStep(ev, dir) {
  if (ev) ev.stopPropagation();
  var urls = _ahGalleries[_ahLbState.gallery] || [];
  if (!urls.length) return;
  _ahLbState.idx = (_ahLbState.idx + dir + urls.length) % urls.length;
  _ahRenderLightbox();
}
function closeAhLightbox(ev) {
  if (ev && ev.target !== ev.currentTarget && !ev.target.classList.contains('ah-lb-close')) return;
  document.getElementById('ahLightbox').classList.remove('open');
}
document.addEventListener('keydown', function(e) {
  var lb = document.getElementById('ahLightbox');
  if (!lb || !lb.classList.contains('open')) return;
  if (e.key === 'Escape') closeAhLightbox();
  else if (e.key === 'ArrowLeft') ahLbStep(null, -1);
  else if (e.key === 'ArrowRight') ahLbStep(null, 1);
});

function openAuditDetail(submissionId) {
  _ahGalleries = []; // reset gallery registry for this audit's photos
  document.getElementById('recordDetailBody').innerHTML = '<div class="ah-loading">Loading…</div>';
  document.getElementById('rdModalTitle').textContent = 'Filled Audit';
  document.getElementById('rdBackdrop').classList.add('open');
  document.getElementById('recordDetailModal').classList.add('open');
  google.script.run
    .withSuccessHandler(function(d) {
      if (!d || !d.found) { document.getElementById('recordDetailBody').innerHTML = '<div class="ah-empty">Not found.</div>'; return; }
      /* Header + per-pillar roll-up. The detail used to render bare criterion
         ids because getAuditDetail returned label:"" for every item (schema
         keys 'S1-C1', line items store the zone's 'S1-1'). With labels flowing
         there is enough to summarise. */
      var _sum = 0, _max = 0, _byP = {};
      d.items.forEach(function(it){
        if (it.score === null || it.score === undefined) return;
        _sum += it.score; _max += 4;
        var p = it.pillar || '?';
        if (!_byP[p]) _byP[p] = { s: 0, n: 0 };
        _byP[p].s += it.score; _byP[p].n++;
      });
      var _pct = _max ? Math.round(100 * _sum / _max) : 0;
      var _fails = d.items.filter(function(it){ return it.score !== null && it.score <= 1; }).length;
      var _pcls = _pct >= 80 ? 'g' : _pct >= 60 ? 'a' : 'r';

      var h = '<div style="margin-bottom:10px;font-size:13px;color:var(--text-muted)">' +
        escHtml(d.header.zoneId) + ' · ' + escHtml(d.header.zoneName) + ' · ' +
        (d.header.timestamp ? new Date(d.header.timestamp).toLocaleString() : '') + ' · ' + escHtml(d.header.auditor) + '</div>';

      h += '<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 12px;margin-bottom:12px;' +
           'background:var(--bg-card-2);border-radius:10px">' +
           '<span class="ah-pct ' + _pcls + '" style="font-size:22px;font-weight:800">' + _pct + '%</span>' +
           '<span style="font-size:13px;color:var(--text-secondary)">' + _sum + ' / ' + _max + ' pts</span>' +
           '<span style="font-size:13px;color:var(--text-secondary)">' + d.items.length + ' criteria</span>' +
           (_fails ? '<span style="font-size:13px;font-weight:700;color:var(--score-red)">' + _fails + ' failing</span>' : '') +
           '<span style="margin-left:auto;display:flex;gap:6px">' +
           Object.keys(_byP).sort().map(function(p){
             var pc = Math.round(100 * _byP[p].s / (_byP[p].n * 4));
             var col = pc >= 80 ? 'var(--score-green)' : pc >= 60 ? 'var(--score-amber)' : 'var(--score-red)';
             return '<span title="' + escHtml(p) + ' — ' + pc + '%" style="font-family:var(--font-mono);font-size:11px;' +
                    'font-weight:700;padding:3px 8px;border-radius:6px;color:#fff;background:' + col + '">' +
                    escHtml(p) + ' ' + pc + '</span>';
           }).join('') + '</span></div>';
      h += d.items.map(function(it) {
        var sc = (it.score === null || it.score === undefined) ? '—' : it.score;
        var scls = it.score <= 1 ? 'r' : it.score <= 2 ? 'a' : 'g';
        var urls = (it.photoUrls && it.photoUrls.length) ? it.photoUrls : (it.photoUrl ? [it.photoUrl] : []);
        var galleryIdx = urls.length ? _ahRegisterGallery(urls) : -1;
        var photo = urls.length
          ? '<div class="ah-au-photos">' + urls.map(function(u, pi) {
              return '<img class="ah-au-thumb" src="' + escHtml(u) + '" title="Click to enlarge"' +
                ' onclick="openAhLightbox(' + galleryIdx + ',' + pi + ')">';
            }).join('') + '</div>'
          : '';
        var titleLine = escHtml(it.criterionId) +
          (it.label ? ' · ' + escHtml(it.label) : '') +
          ' <span style="color:var(--text-muted);font-weight:400">(' + escHtml(it.pillar) + ')</span>';
        /* Three columns that hold their proportions: a fixed score chip, the
           criterion text taking the slack, and the evidence at a size worth
           looking at. min-width:0 stops a long criterion from pushing the
           photo column off the row. */
        return '<div class="ah-au-row">' +
          '<span class="ah-pct ' + scls + '" style="min-width:34px;font-weight:700">' + sc + '</span>' +
          '<div class="ah-au-txt"><div style="font-weight:600;font-size:13.5px">' + titleLine + '</div>' +
          (it.labelHi ? '<div style="font-size:12.5px;color:var(--text-secondary);margin-top:2px">' + escHtml(it.labelHi) + '</div>' : '') +
          (it.remark ? '<div style="font-size:12.5px;color:var(--text-muted);margin-top:3px;font-style:italic">' + escHtml(it.remark) + '</div>' : '') +
          '</div>' + photo + '</div>';
      }).join('');
      h = '<div id="auShare" class="au-share-row"><span class="au-share-msg">Preparing report…</span></div>' + h;
      document.getElementById('recordDetailBody').innerHTML = h;
      auditShareLinks_(submissionId);
    })
    .withFailureHandler(function(e) { document.getElementById('recordDetailBody').innerHTML = '<div class="ah-empty">' + escHtml(friendlyError_(e)) + '</div>'; })
    .getAuditDetail(submissionId);
}

/* Opens an external URL from inside the GAS sandbox iframe.
   window.open works from a user gesture; if a popup blocker stops it, fall
   back to navigating the top frame, which the sandbox does permit. */
function pmNav_(url) {
  if (!url) return;
  var w = null;
  try { w = window.open(url, '_blank', 'noopener,noreferrer'); } catch (e) {}
  if (w) return;
  try { window.top.location.href = url; }
  catch (e) { location.href = url; }
}

function auditShareLinks_(submissionId) {
  google.script.run
    .withSuccessHandler(function(r) {
      var el = document.getElementById('auShare');
      if (!el) return;
      if (r && r.success) {
        /* target="_blank" is blocked inside the GAS sandbox iframe, so both
           links silently did nothing. window.open from a click handler escapes
           the sandbox; pmNav_ falls back to a top-level navigation when the
           popup is blocked. Verified 2026-09-02: the URLs themselves were
           always valid — only the navigation was failing. */
        var h = '';
        if (r.pdfUrl) h += '<button type="button" class="au-share pdf" ' +
          'onclick="pmNav_(' + escHtml(JSON.stringify(r.pdfUrl)) + ')">&#128196; View PDF</button>';
        if (r.waUrl)  h += '<button type="button" class="au-share wa" ' +
          'onclick="pmNav_(' + escHtml(JSON.stringify(r.waUrl)) + ')">&#128241; Share on WhatsApp</button>';
        el.innerHTML = h;
      } else { el.innerHTML = '<span class="au-share-msg">Report unavailable</span>'; }
    })
    .withFailureHandler(function() {
      var el = document.getElementById('auShare');
      if (el) el.innerHTML = '<span style="font-size:12px;color:var(--text-muted)">Report unavailable</span>';
    })
    .generateAuditPdf(submissionId);
}

}

/* ── collapsible priority/zone filter row ── */
function toggleFilterRow() {
  var row = document.querySelector('.ah-filter-row');
  var btn = document.getElementById('ahFilterToggle');
  if (!row || !btn) return;
  // Desktop starts open with no .open class, so a bare toggle('open') would
  // need two clicks to hide. Decide from what is actually on screen.
  var visible = row.offsetParent !== null;
  var open = !visible;
  row.classList.toggle('open', open);
  row.classList.toggle('collapsed', !open);
  btn.classList.toggle('on', open);
}
function updateFilterCount_() {
  var n = (_filters.priority ? 1 : 0) + (_filters.zoneId ? 1 : 0);
  var badge = document.getElementById('ahFilterCount');
  var btn = document.getElementById('ahFilterToggle');
  var row = document.querySelector('.ah-filter-row');
  if (!badge || !btn) return;
  badge.textContent = n;
  badge.style.display = n > 0 ? '' : 'none';
  btn.classList.toggle('on', n > 0 || (row && row.classList.contains('open')));
}

/* ── zone dropdown population ── */
function loadZones() {
  google.script.run
    .withSuccessHandler(function(zones) {
      var sel = document.getElementById('ahZoneSelect');
      if (!zones) return;
      zones.forEach(function(z) {

      });

    .withFailureHandler(function() {})
    .getAllZoneIds();

/* ── fetch ── */
/* ── Client-side filtering ────────────────────────────────────────────────
   Every tab click and every chip used to issue its own google.script.run call.
   The server work is small (~450ms to build the list) but each round trip costs
   3-16s of GAS transport, so switching tabs felt broken even though nothing was
   wrong. The full zone-scoped set is fetched ONCE and every status / type /
   priority change is then applied in the browser — those are pure predicates
   over data already in hand.

   Only the ZONE filter still refetches: it changes which records exist, and the
   server applies it before building the counts. */
var _allItems = null;      // full set for the current zone
var _allCounts = null;

function fetchAndRender(quiet, force) {
  /* The whole plant is fetched once; zone is now a local filter like the rest,
     so the cache is valid for every zone and only a WRITE invalidates it. */
  if (!force && _allItems) {
    applyFiltersAndRender_();
    return;
  }

  if (!quiet) {
    document.getElementById('ahContent').innerHTML = '<div class="ah-loading">Loading…</div>';
  }

  google.script.run
    .withSuccessHandler(function(data) {
      if (!data) {
        document.getElementById('ahContent').innerHTML = '<div class="ah-empty">No data returned.</div>';
        return;
      }
      _allItems = data.items || [];
      _allCounts = data.counts || {};
      applyFiltersAndRender_();
    })
    .withFailureHandler(function(e) {
      document.getElementById('ahContent').innerHTML =
        '<div class="ah-loading" style="color:var(--score-red)">' + escHtml(friendlyError_(e)) + '</div>';
    })
    /* getActionListFast serves the whole plant from one CacheService entry and
       slices this page's type out of it, so a page load is a ~48ms cache read
       instead of a ~2.1s rebuild across six sheets. The PIN screen warms that
       entry while the user is still tapping, so the first page after sign-in
       usually finds it hot. Zone, priority and status stay client-side. */
    .getActionListFast(PAGE_TYPE ? { type: PAGE_TYPE } : {});
}

/* Zone tabs are rendered from the cached set, so switching zone is instant and
   the counts always match what the list will show. Zone is applied LOCALLY —
   the cache holds every zone, so there is no refetch. */
function buildZoneTabs_() {
  var wrap = document.getElementById('ahZoneTabs');
  if (!wrap || !_allItems) return;

  /* Count per zone under the OTHER active filters, so a tab never promises
     rows that the current status/priority selection would hide. */
  var counts = {}, names = {};
  _allItems.forEach(function(i) {
    if (_filters.status   && i.status   !== _filters.status)   return;
    if (_filters.type     && i.type     !== _filters.type)     return;
    if (_filters.priority && i.priority !== _filters.priority) return;
    var z = i.zoneId || '';
    if (!z) return;
    counts[z] = (counts[z] || 0) + 1;
    if (i.zone && !names[z]) names[z] = i.zone;
  });

  var zones = Object.keys(counts).sort();
  var total = zones.reduce(function(n, z) { return n + counts[z]; }, 0);
  var cur = _filters.zoneId || '';

  var html = '<button class="ah-zone-tab' + (cur === '' ? ' active' : '') + '"' +
    ' role="tab" aria-selected="' + (cur === '' ? 'true' : 'false') + '"' +
    ' onclick="setZoneTab(\'\')">All zones<span class="ah-zt-n">' + total + '</span></button>';

  zones.forEach(function(z) {
    var on = (cur === z);
    html += '<button class="ah-zone-tab' + (on ? ' active' : '') + '"' +
      ' role="tab" aria-selected="' + (on ? 'true' : 'false') + '"' +
      ' title="' + escHtml(names[z] || z) + '"' +
      ' onclick="setZoneTab(' + escHtml(JSON.stringify(z)) + ')">' +
      escHtml(z) + '<span class="ah-zt-n">' + counts[z] + '</span></button>';
  });

  /* A zone that currently has no rows still needs its tab while selected,
     otherwise the control you just used disappears under you. */
  if (cur && zones.indexOf(cur) < 0) {
    html += '<button class="ah-zone-tab active" role="tab" aria-selected="true"' +
      ' onclick="setZoneTab(' + escHtml(JSON.stringify(cur)) + ')">' +
      escHtml(cur) + '<span class="ah-zt-n">0</span></button>';
  }
  wrap.innerHTML = html;
}

function setZoneTab(z) {
  _filters.zoneId = z;
  /* Keep the Filters-row dropdown in step — it is the same filter. */
  var sel = document.getElementById('ahZoneSelect');
  if (sel) sel.value = z;
  updateFilterCount_();
  applyFiltersAndRender_();          // local: the cache spans every zone
  var active = document.querySelector('.ah-zone-tab.active');
  if (active && active.scrollIntoView) active.scrollIntoView({ block: 'nearest', inline: 'center' });
}

/* Applies the current status/type/priority filters to the cached set and
   recomputes the badges. Each badge excludes only its own dimension, matching
   the server-side contract in getUnifiedActionList. */
function applyFiltersAndRender_() {
  if (!_allItems) return;
  var st = _filters.status || '', ty = _filters.type || '', pr = _filters.priority || '';

  var zn = _filters.zoneId || '';
  /* Completed events -- a walk and an audit record what was found, they are
     not work anyone chases. Each has its own view tab (Walks, Audits), so they
     are excluded from the working list entirely instead of sitting under
     Closed pretending to be finished work. */
  var LOGGED_TYPES = { GEMBA: 1, AUDIT: 1 };

  /* ...but only while this list is the mixed working list. Audits and Walks
     are now pages of their own, and on those pages this blanket exclusion
     dropped every single row: 27 audits and 11 walks loaded into _allItems and
     were then filtered straight back out, so both pages rendered empty no
     matter what the status filter said. The dedicated renderAuditsView /
     renderWalksView that justified the exclusion are unreachable -- their only
     caller is setTypeTab, a handler for type tabs deleted last session. */
  var IS_LOGGED_PAGE = !!LOGGED_TYPES[PAGE_TYPE];

  var match = function(i, skip) {
    if (!IS_LOGGED_PAGE && LOGGED_TYPES[i.type]) return false;
    if (skip !== 'status' && st && i.status !== st) return false;
    if (skip !== 'type'     && ty && i.type     !== ty) return false;
    if (skip !== 'priority' && pr && i.priority !== pr) return false;
    /* Zone is filtered here rather than server-side so switching zone costs
       nothing — the cached set already spans the whole plant. */
    if (skip !== 'zone'     && zn && i.zoneId   !== zn) return false;
    return true;
  };

  var counts = {
    byStatus:   { OPEN: 0, IN_PROGRESS: 0, CLOSED: 0 },
    byType:     { NC: 0, TASK: 0, RED_TAG: 0, KAIZEN: 0, GEMBA: 0, AUDIT: 0 },
    byPriority: { CRITICAL: 0, HIGH: 0, MEDIUM: 0, LOW: 0 },
    byTypeStatus: (_allCounts && _allCounts.byTypeStatus) || {},
    total: 0
  };
  _allItems.forEach(function(i) {
    if (match(i, 'status')   && counts.byStatus[i.status]     !== undefined) counts.byStatus[i.status]++;
    if (match(i, 'type')     && counts.byType[i.type]         !== undefined) counts.byType[i.type]++;
    if (match(i, 'priority') && counts.byPriority[i.priority] !== undefined) counts.byPriority[i.priority]++;
  });

  var shown = _allItems.filter(function(i) { return match(i, null); });
  counts.total = shown.length;

  updateBadges(counts);
  buildZoneTabs_();
  renderCards(shown);
}

/* ── badge updates ── */
function updateBadges(counts) {
  _lastCounts = counts;
  var bs = counts.byStatus || {};
  var total = counts.total || 0;

  /* per-type counts now live on the collapsible section headers, not tabs */
  var setTxt = function(id, v) {
    var el = document.getElementById(id);
    if (!el) return;
    el.textContent = v;
    el.classList.remove('is-pending');   // real number now; stop dimming it
  };
  setTxt('cntAll', total);

  // Status badges reflect the selected type tab (fall back to all-types totals)
  var ss = bs;
  if (_filters.type && counts.byTypeStatus && counts.byTypeStatus[_filters.type]) {
    ss = counts.byTypeStatus[_filters.type];
  }
  setTxt('cntOPEN',        ss.OPEN        || 0);
  setTxt('cntIN_PROGRESS', ss.IN_PROGRESS || 0);
  setTxt('cntCLOSED',      ss.CLOSED      || 0);
}

/* ── render cards ── */
function renderCards(items) {
  if (!items || items.length === 0) {
    document.getElementById('ahContent').innerHTML =
      '<div class="ah-empty">✓ No actions match these filters.</div>';
    return;
  }

  /* Any open inline expander is discarded by this re-render */
  _openRow = null;

  /* Group into collapsible sections by record type */
  var groups = { NC: [], TASK: [], RED_TAG: [], KAIZEN: [], GEMBA: [], AUDIT: [] };
  items.forEach(function(a) { (groups[a.type] = groups[a.type] || []).push(a); });

  /* AUDIT and GEMBA were omitted here for the same reason they were excluded
     from match(): their own renderers were meant to draw them. Those renderers
     are unreachable, so on the Audits and Walks pages the rows survived the
     filter, were grouped, and were then simply never emitted -- the section
     loop had no entry to print them under. */
  var order = ['NC', 'TASK', 'RED_TAG', 'KAIZEN', 'AUDIT', 'GEMBA'];

  /* A per-type page holds exactly one type, so its section header would read
     "Audit 27" above 27 audits on a page already titled Audits -- a collapsible
     wrapper around the only thing on it. Single-type pages render the table
     bare; the mixed list still groups. */
  if (PAGE_TYPE) {
    var flat = [];
    order.forEach(function (t) { flat = flat.concat(groups[t] || []); });
    document.getElementById('ahContent').innerHTML = buildTable_(flat);
    return;
  }
  var emoji = { NC: '&#128995;', TASK: '&#128203;', RED_TAG: '&#128308;',
                KAIZEN: '&#128161;', GEMBA: '&#128065;', AUDIT: '&#128202;' };
  var html = '';
  order.forEach(function(t) {
    var rows = groups[t] || [];
    if (!rows.length) return;
    var collapsed = _collapsed[t] ? ' collapsed' : '';
    html += '<div class="ah-sec' + collapsed + '" data-sec="' + t + '">' +
      '<div class="ah-sec-hd" onclick="toggleSection(\'' + t + '\')">' +
        '<span class="ah-sec-caret">&#9662;</span>' +
        '<span class="ah-sec-em">' + emoji[t] + '</span>' +
        '<span class="ah-sec-nm">' + escHtml(typeName(t)) + '</span>' +
        '<span class="ah-sec-ct">' + rows.length + '</span>' +
      '</div><div class="ah-sec-bd">' + buildTable_(rows) + '</div></div>';
  });
  document.getElementById('ahContent').innerHTML = html;
}

/* one table for a set of rows (no Type column — the section header carries it) */
/* Age is the signal operators scan for, so it carries colour rather than
   sitting as grey text: the longer a record has been open the hotter the chip.
   Bands are calendar days since creation. Colour is never the only cue - the
   number stays, and the title cell keeps its own overdue warning - so this
   still reads for a colour-blind auditor. */
function ageBand_(d) {
  if (d == null) return null;
  if (d <= 3)  return { k: 'fresh', t: '0-3 days old' };
  if (d <= 7)  return { k: 'ok',    t: '4-7 days old' };
  if (d <= 14) return { k: 'warn',  t: '8-14 days old' };
  if (d <= 30) return { k: 'hot',   t: '15-30 days old' };
  return { k: 'stale', t: 'over 30 days old' };
}
/* Overdue belongs in the Due column, not glued to the front of the record
   name: prefixing the title pushed the actual name sideways and made every
   list scan start with a number instead of the thing being read. The row
   still carries data-overdue for its red left rail, and the Due cell now
   shows the date with the lateness under it. */
function dueCell_(a, overdue) {
  var due = a.dueDate ? escHtml(a.dueDate) : '&mdash;';
  if (!overdue) return '<span class="ah-due">' + due + '</span>';
  /* Date only — the day COUNT is deliberately not repeated here. Age already
     answers "how long has this existed", and two large numbers side by side
     read as the same fact twice even though they are not: measured on live
     data, age and days-past-due differ on 183 of 184 overdue records
     (RT-0001: 83d old, 73d late). The date plus a red marker says "late";
     the exact lateness is one hover away and in the detail view. */
  var late = (a.daysPastDue > 0) ? a.daysPastDue + ' days past due' : 'past due';
  return '<span class="ah-due late" title="' + escHtml(late) + '">&#9888; ' + due + '</span>';
}

function ageCell_(d) {
  var b = ageBand_(d);
  if (!b) return '<span class="ah-age-na">&mdash;</span>';
  return '<span class="ah-age ' + b.k + '" title="' + b.t + '">' + escHtml(String(d)) + 'd</span>';
}

/* Priority as colour + shape. A word per row read as text to be parsed;
   an icon column reads as a pattern, and the four levels stay distinguishable
   without relying on colour alone (the glyph differs too). */
function priIcon_(p) {
  var P = {
    CRITICAL: ['&#9650;', 'Critical'],
    HIGH:     ['&#9650;', 'High'],
    MEDIUM:   ['&#9679;', 'Medium'],
    LOW:      ['&#9662;', 'Low']
  };
  var k = String(p || '').toUpperCase();
  if (!P[k]) return '';
  return '<span class="pri-ic ' + k + '" title="' + P[k][1] + ' priority" role="img" ' +
         'aria-label="' + P[k][1] + ' priority">' + P[k][0] + '</span>';
}

/* Photo evidence: an icon, with the count only when there is more than one. */
function eviCell_(a) {
  var n = (a.photos && a.photos.length) || 0;
  if (!n) return '';
  var lbl = n + (n === 1 ? ' photo' : ' photos');
  return '<span class="ah-evi" title="' + lbl + '" role="img" aria-label="' + lbl + '">' +
         '&#128247;' + (n > 1 ? '<span class="ah-evi-n">' + n + '</span>' : '') + '</span>';
}

/* Audit dates arrive as ISO strings; the list wants a date, not a timestamp. */
function shortDate_(v) {
  if (!v) return '—';
  var d = new Date(v);
  if (isNaN(d.getTime())) return String(v).substring(0, 11);
  var M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return d.getDate() + '-' + M[d.getMonth()] + '-' + d.getFullYear();
}

function buildTable_(rows) {
  var sel = _selectMode;
  var selCol = sel ? '<col class="c-sel">' : '';
  var selHead = sel ? '<th class="ah-sel-th"><input type="checkbox" class="ah-sel-box ah-sel-all"' +
    ' aria-label="Select all in this section" onchange="onSelAll_(this)"></th>' : '';
  /* Audits carry no owner and no due date -- every one reads "Unassigned" with
     a blank Due -- so on that page those two columns were a pair of permanent
     em-dashes. They give way to what an audit does have: how many criteria
     were scored. */
  var isAudit = (PAGE_TYPE === 'AUDIT');
  var col3 = isAudit
    ? '<col class="c-owner"><col class="c-due">'
    : '<col class="c-owner"><col class="c-due">';
  var head3 = isAudit
    ? '<th class="hide-sm">Criteria</th><th class="hide-sm">Taken</th>'
    : '<th class="hide-sm">Owner</th><th class="hide-sm">Due</th>';

  /* Status is gone: each page IS one status context, and Tasks carries the
     Open/In progress/Closed strip. Repeating it per row restated on 101 lines
     what the tab above already said once. */
  var html = '<div class="ah-table-wrap"><table class="ah-table' + (sel ? ' selecting' : '') + '">' +
    '<colgroup>' + selCol + '<col class="c-title"><col class="c-zone">' + col3 +
    '<col class="c-age"><col class="c-pri"><col class="c-evi"><col class="c-acts"></colgroup>' +
    '<thead><tr>' + selHead +
    '<th>Title</th><th class="hide-sm">Zone</th>' + head3 +
    '<th class="hide-sm">Age</th><th>Pri</th><th><span class="sr-only">Photos</span></th><th></th>' +
    '</tr></thead><tbody>';

  rows.forEach(function(a) {
    var priClass = escHtml(a.priority || '');
    var overdue = a.isOverdue && a.status !== 'CLOSED';
    var openArgs = escHtml(JSON.stringify(a.type)) + ',' + escHtml(JSON.stringify(a.id));
    /* urgency-first: overdue rows carry a loud left rail (data-overdue) that reads
       across a bay; priority tints it when not overdue. */
    html += '<tr class="ah-tr ' + priClass + '"' + (overdue ? ' data-overdue="1"' : '') +
      ' data-id="' + escHtml(a.id) + '" data-type="' + escHtml(a.type) + '">';
    if (sel) {
      /* only records that CAN be closed are selectable (already-closed excluded) */
      var closable = a.status !== 'CLOSED';
      html += '<td class="ah-sel-td">' + (closable
        ? '<input type="checkbox" class="ah-sel-box" aria-label="Select ' + escHtml(a.title) + '" onchange="onSelToggle_()">'
        : '') + '</td>';
    }
    /* title cell = the real expander trigger: keyboard + screen-reader reachable */
    html += '<td class="ah-td title" role="button" tabindex="0" aria-expanded="false"' +
      ' onclick="toggleRowDetail(' + openArgs + ',this)"' +
      ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();toggleRowDetail(' + openArgs + ',this);}"' +
      ' title="' + escHtml(a.title) + '">' +
      '<span class="ah-ttl-txt">' + escHtml(rowTitle_(a)) + '</span>' +
      '<span class="ah-ttl-id">' + escHtml(rowId_(a)) + '</span></td>';
    html += '<td class="ah-td muted hide-sm" data-label="Zone">' + escHtml(a.zone || '') + '</td>';
    if (isAudit) {
      html += '<td class="ah-td muted hide-sm" data-label="Criteria">' +
        escHtml(a.description || '') + '</td>';
      html += '<td class="ah-td muted hide-sm" data-label="Taken">' +
        escHtml(shortDate_(a.createdDate)) + '</td>';
    } else {
      html += '<td class="ah-td muted hide-sm" data-label="Owner">' + escHtml(a.owner || '—') + '</td>';
      html += '<td class="ah-td hide-sm" data-label="Due">' + dueCell_(a, overdue) + '</td>';
    }
    html += '<td class="ah-td hide-sm" data-label="Age">' + ageCell_(a.ageDays) + '</td>';
    /* Priority reads as colour and shape, scannable down the column at a
       glance; the word is kept for screen readers and as the tooltip. */
    html += '<td class="ah-td" data-label="Priority">' + priIcon_(a.priority) + '</td>';
    /* The photo flag used to ride inside the Status cell, which no longer
       exists. It gets its own narrow column so the camera stays in one place
       down the list instead of trailing whatever text preceded it. */
    html += '<td class="ah-td" data-label="Photos">' + eviCell_(a) + '</td>';
    /* Actions live in the expander only. Repeating them on every row put four
       controls beside every record, competing with the record itself and
       duplicating exactly what the expander already offers. The chevron says
       the row opens; the actions are one tap away. */
    html += '<td class="ah-td acts"><span class="ah-row-chev" aria-hidden="true">&#8250;</span></td>';
    html += '</tr>';
  });
  return html + '</tbody></table></div>';
}

/* The list groups by type, so "Non-conformance:" on every row inside the NC
   section is ~22 characters of label the grouping already provides. And three
   rows can share a title, zone, owner and due date -- real repeat findings that
   looked like the same record drawn three times. The id disambiguates them. */
/* Every other record has a human id (NC-2026..., TK-2026...). An audit is keyed
   by submission UUID, which is 36 characters of noise to a reader and tells
   them nothing -- show when it was taken instead, which is how people actually
   refer to an audit. */
function rowId_(a) {
  if (a.type !== 'AUDIT') return a.id || '';
  var d = a.createdDate ? new Date(a.createdDate) : null;
  return (d && !isNaN(d)) ? fmtDate_(a.createdDate) : '';
}

function rowTitle_(a) {
  var t = String(a.title || '');
  if (a.type === 'NC')   t = t.replace(/^Non-conformance:\s*/i, '');
  if (a.type === 'TASK') t = t.replace(/^Action:\s*/i, '');
  return t || String(a.title || '');
}

/* collapse state persists across re-renders */
var _collapsed = {};
function toggleSection(t) {
  _collapsed[t] = !_collapsed[t];
  var el = document.querySelector('.ah-sec[data-sec="' + t + '"]');
  if (el) el.classList.toggle('collapsed', !!_collapsed[t]);
}

/* Action buttons per type/status. The PRIMARY transition (Start/Done/Close/
   Advance) is wrapped separately from the secondary Edit/Delete pair so CSS can
   keep the primary big and thumb-safe while Edit/Delete recede — Delete is never
   thumb-adjacent to the primary action (critique P2). Each button carries a text
   label span (visually hidden on the dense desktop icon skin, shown on cards). */
function buildActionIcons(a) {
  var si = escHtml(JSON.stringify(a.id));
  var aj = escHtml(JSON.stringify(a));
  var ib = function(cls, icon, label, onclick) {
    return '<button class="ah-ibtn ' + cls + '" title="' + label + '" aria-label="' + label +
      '" onclick="event.stopPropagation();' + onclick + '">' +
      '<span class="ah-ibtn-ic" aria-hidden="true">' + icon + '</span>' +
      '<span class="ah-ibtn-lbl">' + label + '</span></button>';
  };
  var primary = '';
  if (a.status !== 'CLOSED') {
    if (a.type === 'NC') {
      if (a.status === 'OPEN') primary += ib('start', '&#9654;', 'Start', 'openRcaModal(' + si + ')');
      primary += ib('close', '&#10003;', 'Close', 'doNcClose(' + si + ',this)');
    } else if (a.type === 'TASK') {
      var raw = (a.rawStatus || '').toUpperCase();
      if (raw === 'BACKLOG' || raw === 'THIS_WEEK' || raw === 'OPEN' || a.status === 'OPEN')
        primary += ib('start', '&#9654;', 'Start', 'doTaskStatus(' + si + ',\'IN_PROGRESS\',this)');
      primary += ib('done', '&#10003;', 'Done', 'doTaskStatus(' + si + ',\'DONE\',this)');
    } else if (a.type === 'RED_TAG') {
      var np = nextRedTagPhase((a.rawStatus || a.status || '').toUpperCase());
      if (np) primary += ib('phase', '&#10003;', (np.label.replace(/<[^>]+>|&#\d+;/g, '').trim() || 'Advance'), 'doRedTagPhase(' + si + ',\'' + np.phase + '\',this)');
    }
  }
  var secondary = ib('edit', '&#9998;', 'Edit', 'openEditModal(' + aj + ')') +
                  ib('del', '&#128465;', 'Delete', 'doDelete(' + escHtml(JSON.stringify(a.type)) + ',' + si + ',this)');
  return '<span class="ah-acts-primary">' + primary + '</span>' +
         '<span class="ah-acts-secondary">' + secondary + '</span>';
}

function typeName(t) {
  if (t === 'NC') return 'NC';
  if (t === 'TASK') return 'Task';
  if (t === 'RED_TAG') return 'Red Tag';
  if (t === 'KAIZEN') return 'Kaizen';
  if (t === 'GEMBA') return 'Gemba Walk';
  if (t === 'AUDIT') return 'Audit';
  return t;
}

/* Red Tag rows show their real PHASE, not just the coarse Open/In-Progress
   mapping — the phase is what determines which button comes next. */
var RT_PHASE_LABEL = { IDENTIFIED: 'Identified', EVALUATED: 'Evaluated',
                       DISPOSED: 'Disposed', CLOSED: 'Closed' };

/* Evidence thumbnails. Photos are attached at raise / start / closure and were
   being written to the sheet all along, but the Actions list never carried a
   photo field, so nothing could render them. Thumbnails open the existing
   lightbox. */
/* Dates arrive as raw ISO strings ("2026-07-03T04:46:31.233Z"). Rendering
   those verbatim put a timestamp with milliseconds in front of an operator who
   only needs the day. */
function fmtDate_(v) {
  if (!v) return '';
  var str = String(v);
  var d = new Date(str);
  if (isNaN(d.getTime())) return str.slice(0, 10);
  var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear();
}

/* A labelled field. The old grid showed a bare emoji and a value, so "🕵 By
   someone@x" and "📅 2026-06-26" carried no field name at all — you had to
   infer what each number meant. Every value now names itself. */
function field_(label, value, opts) {
  if (value === null || value === undefined || value === '') return '';
  opts = opts || {};
  return '<div class="rc-f' + (opts.wide ? ' wide' : '') + '">' +
    '<dt class="rc-f-k">' + escHtml(label) + '</dt>' +
    '<dd class="rc-f-v' + (opts.mono ? ' mono' : '') + '">' + escHtml(String(value)) + '</dd></div>';
}

/* A titled block. Sections were bare text with no container, so the page read
   as one undifferentiated column. */
function section_(title, body) {
  if (!body) return '';
  return '<section class="rc-sec">' +
    '<h4 class="rc-sec-t">' + escHtml(title) + '</h4>' + body + '</section>';
}

function photoStrip_(photos) {
  if (!photos || !photos.length) return '';
  return '<div class="ah-evi">' +
    '<div class="ah-evi-hd">Evidence &middot; ' + photos.length + '</div>' +
    '<div class="ah-evi-row">' + photos.map(function(u, i) {
      /* Drive renders a poster frame for video at the same thumbnail URL, so
         the tile looks the same; the play badge and the viewer differ. */
      var vid = _isVideoUrl_(u);
      return '<span class="ah-evi-cell' + (vid ? ' vid' : '') + '"' +
        ' onclick="event.stopPropagation();' +
        (vid ? 'openVideo_' : 'openLightbox_') + '(' + escHtml(JSON.stringify(u)) + ')">' +
        '<img class="ah-evi-thumb" src="' + escHtml(u) + '" loading="lazy"' +
        ' alt="Evidence ' + (i + 1) + (vid ? ' (video)' : '') + '">' +
        (vid ? '<span class="ah-evi-play" aria-hidden="true">&#9654;</span>' : '') +
        '</span>';
    }).join('') + '</div></div>';
}

/* A stored video keeps its extension in the Drive filename, but the thumbnail
   URL only carries the file id — so the marker is added at upload time as
   "#v" on the URL. Anything else is treated as an image. */
function _isVideoUrl_(u) { return /#v$/.test(String(u)); }

/** Opens a clip in Drive's own player — no codec handling on our side. */
function openVideo_(url) {
  var id = String(url).match(/[?&]id=([^&#]+)/);
  window.open(id ? 'https://drive.google.com/file/d/' + id[1] + '/view'
                 : String(url).replace(/#v$/, ''),
              '_blank', 'noopener,noreferrer');
}

/* Opens a photo full-size. Falls back to a new tab if the page has no
   lightbox element (the Actions page ships one; other hosts may not). */
function openLightbox_(url) {
  var lb = document.querySelector('.ah-lightbox');
  var img = lb && lb.querySelector('img');
  if (!lb || !img) { window.open(url, '_blank', 'noopener,noreferrer'); return; }
  img.src = url;
  lb.classList.add('open');
  lb.onclick = function() { lb.classList.remove('open'); img.src = ''; };
}

function statusCell_(a) {
  var base = '<span class="status-lbl ' + escHtml(a.status) + '">' +
             escHtml(statusLabel(a.status)) + '</span>';
  if (a.type !== 'RED_TAG') return base;
  var raw = String(a.rawStatus || '').toUpperCase();
  var phase = RT_PHASE_LABEL[raw];
  if (!phase || raw === 'CLOSED') return base;
  return base + '<span class="ah-phase" title="Red Tag stage ' +
    (raw === 'IDENTIFIED' ? '1' : raw === 'EVALUATED' ? '2' : '3') + ' of 3">' +
    escHtml(phase) + '</span>';
}

function statusLabel(s) {
  if (s === 'IN_PROGRESS') return 'In Progress';
  if (s === 'OPEN') return 'Open';
  if (s === 'CLOSED') return 'Closed';
  return s;
}

/* ── Edit modal ── */
function openEditModal(a) {
  var b = document.getElementById('editBody');
  var rows = '';
  function field(label, id, val, type) {
    return '<label style="display:block;font-size:12px;color:var(--text-muted);margin:8px 0 2px">' + label + '</label>' +
      (type === 'textarea'
        ? '<textarea id="' + id + '" rows="2" style="width:100%;padding:6px;border:1px solid var(--border);border-radius:6px">' + escHtml(val || '') + '</textarea>'
        : '<input id="' + id + '" type="' + (type || 'text') + '" value="' + escHtml(val || '') + '" style="width:100%;padding:6px;border:1px solid var(--border);border-radius:6px">');
  }
  if (a.type === 'NC') {
    rows += field('Description', 'edDesc', a.title, 'textarea');
    rows += field('Responsible', 'edOwner', a.owner);
    rows += field('Target date (YYYY-MM-DD)', 'edDue', a.dueDate);
  } else if (a.type === 'TASK') {
    rows += field('Title', 'edTitle', a.title);
    rows += field('Description', 'edDesc', a.description, 'textarea');
    rows += field('Assigned to', 'edOwner', a.owner);
    rows += field('Due date (YYYY-MM-DD)', 'edDue', a.dueDate);
    rows += field('Priority (urgent/high/medium/low)', 'edPri', a.priority);
  } else {
    rows += field('Item description', 'edDesc', a.title, 'textarea');
    rows += field('Owner', 'edOwner', a.owner);
    rows += field('Deadline (YYYY-MM-DD)', 'edDue', a.dueDate);
  }
  b.innerHTML = rows;
  b.setAttribute('data-type', a.type);
  b.setAttribute('data-id', a.id);
  document.getElementById('edModalTitle').textContent = 'Edit ' + typeName(a.type);
  document.getElementById('editBackdrop').classList.add('open');
  document.getElementById('editModal').classList.add('open');
}
function closeEditModal() {
  document.getElementById('editModal').classList.remove('open');
  document.getElementById('editBackdrop').classList.remove('open');
}
function submitEdit() {
  var b = document.getElementById('editBody');
  var type = b.getAttribute('data-type'), id = b.getAttribute('data-id');
  function v(x) { var el = document.getElementById(x); return el ? el.value : undefined; }
  var fn, updates;
  if (type === 'NC') {
    fn = 'editCAPA'; updates = { description: v('edDesc'), responsible: v('edOwner'), targetDate: v('edDue') };
  } else if (type === 'TASK') {
    fn = 'editTask'; updates = { title: v('edTitle'), description: v('edDesc'), assignedTo: v('edOwner'), dueDate: v('edDue'), priority: v('edPri') };
  } else {
    fn = 'editRedTag'; updates = { itemDescription: v('edDesc'), owner: v('edOwner'), deadline: v('edDue') };
  }
  google.script.run
    .withSuccessHandler(function(r) { closeEditModal(); fetchAndRender(false, true); })
    .withFailureHandler(function(e) { showToast(friendlyError_(e), 'error'); })
    [fn](id, updates);
}
/* Any status-changing action (Start/Done/Advance/Close/Delete) can be
   triggered either from a table row or from inside a now-stale open detail
   modal — close whichever is open so the refreshed table is what's visible.
   No-op (safe) when called from a table row with nothing open. */
function closeAllDetailModals_() {
  closeInlineDetail();
  closeNcDetail();
}

function doDelete(type, id, btn) {
  if (!confirm('Delete this ' + typeName(type) + '?')) return;
  if (btn) { btn.disabled = true; btn.textContent = '…'; }
  var fn = type === 'NC' ? 'deleteCAPA' : type === 'TASK' ? 'deleteTask' : 'deleteRedTag';
  google.script.run
    .withSuccessHandler(function(r) {
      closeAllDetailModals_(); fetchAndRender(false, true);
      /* Real Undo: delete is a soft status flip, restore reverses it. */
      var prev = r && r.prevStatus;
      showUndoToast_(typeName(type) + ' deleted.', function(){
        google.script.run
          .withSuccessHandler(function(){ showToast(typeName(type) + ' restored.', 'success'); fetchAndRender(false, true); })
          .withFailureHandler(function(e){ showToast(friendlyError_(e), 'error'); })
          .restoreRecord_(type, id, prev);
      });
    })
    .withFailureHandler(function(e) { showToast(friendlyError_(e), 'error'); if (btn) { btn.disabled = false; btn.textContent = '🗑 Delete'; } })
    [fn](id);
}

function nextRedTagPhase(raw) {
  if (raw === 'IDENTIFIED') return { phase: 'EVALUATED', label: '&#10003; Evaluate' };
  if (raw === 'EVALUATED')  return { phase: 'DISPOSED',  label: '&#10003; Dispose'  };
  if (raw === 'DISPOSED')   return { phase: 'CLOSED',    label: '&#10003; Close'    };
  return null;
}

/* ── inline row expander ──────────────────────────────────────────────────
   Clicking a row title expands its detail directly beneath the row instead of
   opening a modal, so the record stays in the context of its section. One row
   open at a time; clicking the same row again collapses it. */
var _openRow = null;

/* ── bulk select mode ─────────────────────────────────────────────────────
   A "Select" toggle turns on a checkbox column; picking rows and hitting
   "Close selected" runs the existing single-record close call per row. Only
   same-transition (close) and only not-already-closed rows — no combinatorial
   action matrix. Reuses doNcClose/doTaskStatus/doRedTagPhase, no bulk endpoint. */
var _selectMode = false;

function toggleSelectMode() {
  _selectMode = !_selectMode;
  var btn = document.getElementById('ahSelectToggle');
  if (btn) {
    btn.classList.toggle('on', _selectMode);
    btn.setAttribute('aria-pressed', _selectMode ? 'true' : 'false');
  }
  /* Name the state, not the action: an unlabelled toggle gave no clue that
     the checkbox column was a mode you had entered and could leave. */
  var lbl = document.getElementById('ahSelectLabel');
  if (lbl) lbl.textContent = _selectMode ? 'Exit multi-select' : 'Multi-select';
  var bar = document.getElementById('ahBulkBar');
  if (bar) {
    /* Show the bar as soon as select mode is ON, at 0 selected, so the exit
       route ("Cancel") and the action buttons are visible from the moment the
       mode is entered. It used to appear only after the first checkbox was
       ticked, which left the user in a changed mode with no visible way out. */
    bar.hidden = !_selectMode;
    if (_selectMode) {
      var cnt = document.getElementById('ahBulkCount');
      if (cnt) cnt.textContent = '0 selected';
      _setBulkActionsEnabled_(false);
    }
  }
  /* Select mode only changes how the cached rows are drawn, so repaint from
     the cache. fetchAndRender() dropped to a server round-trip, leaving the
     checkbox column missing for as long as the fetch took -- long enough to
     read as "multi-select does nothing". */
  if (_allItems) applyFiltersAndRender_(); else fetchAndRender();
}

/** Bulk actions are meaningless with an empty selection. @private */
function _setBulkActionsEnabled_(on) {
  ['ahBulkClose', 'ahBulkDelete'].forEach(function(id) {
    var b = document.getElementById(id);
    if (b) b.disabled = !on;
  });
}

function selectedRows_() {
  /* :not(.ah-sel-all) matters: the header select-all box is also an .ah-sel-box,
     and its closest('tr') is the header row, which carries no data-id. Counting
     it inflated the "N selected" label by one and would have dispatched a bulk
     call with a null id. The data-id guard is a second belt on the same seam. */
  return Array.prototype.slice.call(document.querySelectorAll('.ah-sel-box:not(.ah-sel-all):checked'))
    .map(function(box){ var tr = box.closest('tr'); return tr && tr.getAttribute('data-id')
      ? { id: tr.getAttribute('data-id'), type: tr.getAttribute('data-type') } : null; })
    .filter(Boolean);
}

function onSelToggle_() {
  var n = selectedRows_().length;
  var cnt = document.getElementById('ahBulkCount');
  if (cnt) cnt.textContent = n + ' selected';
  /* The bar's visibility now tracks select MODE, not the selection count —
     see toggleSelectMode. Only the actions gate on having something picked. */
  _setBulkActionsEnabled_(n > 0);
  /* keep each section header box in sync with its own rows */
  document.querySelectorAll('.ah-table.selecting').forEach(function(tbl) {
    var all = tbl.querySelectorAll('.ah-sel-box:not(.ah-sel-all)');
    var on  = tbl.querySelectorAll('.ah-sel-box:not(.ah-sel-all):checked');
    var head = tbl.querySelector('.ah-sel-all');
    if (!head) return;
    head.checked = all.length > 0 && on.length === all.length;
    head.indeterminate = on.length > 0 && on.length < all.length;
  });
}

/* Header checkbox toggles only the rows of ITS OWN table: each type section is
   a separate <table>, and a global select-all would silently arm rows the user
   cannot see under a collapsed section. */
function onSelAll_(box) {
  var tbl = box.closest('table');
  if (!tbl) return;
  tbl.querySelectorAll('.ah-sel-box:not(.ah-sel-all)').forEach(function(b) { b.checked = box.checked; });
  onSelToggle_();
}

/* In-app confirm: window.confirm() is unreliable inside the GAS sandbox iframe
   (documented in CLAUDE.md), and a swallowed prompt on a DESTRUCTIVE bulk path
   would delete without asking. Promise-based so callers read linearly. */
function ahConfirm_(opts) {
  return new Promise(function(resolve) {
    var wrap = document.createElement('div');
    wrap.className = 'ah-cfm';
    wrap.innerHTML =
      '<div class="ah-cfm-card" role="dialog" aria-modal="true">' +
        '<div class="ah-cfm-t">' + escHtml(opts.title) + '</div>' +
        '<div class="ah-cfm-b">' + escHtml(opts.body) + '</div>' +
        '<div class="ah-cfm-acts">' +
          '<button class="ah-cfm-no">Cancel</button>' +
          '<button class="ah-cfm-yes' + (opts.danger ? ' danger' : '') + '">' + escHtml(opts.ok) + '</button>' +
        '</div></div>';
    function done(v) {
      document.removeEventListener('keydown', onKey, true);
      if (wrap.parentNode) wrap.parentNode.removeChild(wrap);
      resolve(v);
    }
    function onKey(e) { if (e.key === 'Escape') { e.preventDefault(); done(false); } }
    wrap.querySelector('.ah-cfm-no').onclick = function() { done(false); };
    wrap.querySelector('.ah-cfm-yes').onclick = function() { done(true); };
    wrap.onclick = function(e) { if (e.target === wrap) done(false); };
    document.addEventListener('keydown', onKey, true);
    document.body.appendChild(wrap);
    wrap.querySelector('.ah-cfm-no').focus();
  });
}

/* One engine for every bulk transition. Runs the per-row call the existing
   single-record buttons already use - no bulk endpoint - so a partial failure
   leaves the successful rows applied and reports the count honestly. */
function runBulk_(sel, btn, verb, pick) {
  var origText = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = verb + '\u2026'; }
  var done = 0, failed = 0;
  function finish() {
    if (done + failed < sel.length) return;
    showToast(done + ' ' + verb.toLowerCase() + 'd' + (failed ? ', ' + failed + ' failed' : ''),
              failed ? 'error' : 'success');
    if (btn) { btn.disabled = false; btn.textContent = origText; }
    _selectMode = false;
    var b = document.getElementById('ahSelectToggle'); if (b) b.classList.remove('on');
    var bar = document.getElementById('ahBulkBar'); if (bar) bar.hidden = true;
    fetchAndRender(false, true);
  }
  sel.forEach(function(r) {
    var c = pick(r);
    google.script.run
      .withSuccessHandler(function(res){ (res && (res.success || res.ok) !== false) ? done++ : failed++; finish(); })
      .withFailureHandler(function(){ failed++; finish(); })
      [c.fn].apply(null, c.args);
  });
}

function doBulkDelete() {
  var sel = selectedRows_();
  if (!sel.length) return;
  ahConfirm_({
    title: 'Delete ' + sel.length + ' record' + (sel.length > 1 ? 's' : '') + '?',
    body: 'They are removed from the active lists. This is a soft delete, so an admin can restore them.',
    ok: 'Delete', danger: true
  }).then(function(go) {
    if (!go) return;
    runBulk_(sel, document.getElementById('ahBulkDelete'), 'Delete', function(r) {
      return { fn: r.type === 'NC' ? 'deleteCAPA' : r.type === 'TASK' ? 'deleteTask' : 'deleteRedTag',
               args: [r.id] };
    });
  });
}

function doBulkClose() {
  var sel = selectedRows_();
  if (!sel.length) return;
  ahConfirm_({
    title: 'Close ' + sel.length + ' record' + (sel.length > 1 ? 's' : '') + '?',
    body: 'Each is moved to its closed state.',
    ok: 'Close them'
  }).then(function(go) {
    if (!go) return;
    runBulk_(sel, document.getElementById('ahBulkClose'), 'Close', function(r) {
      if (r.type === 'NC')    return { fn: 'updateCAPAStatus',  args: [r.id, 'CLOSED', '', ''] };
      if (r.type === 'TASK')  return { fn: 'updateTaskStatus',  args: [r.id, 'DONE', ''] };
      return { fn: 'advanceRedTagPhase', args: [r.id, 'CLOSED', ''] };
    });
  });
}

function toggleRowDetail(type, id, el) {
  var tr = el && el.closest ? el.closest('tr') : null;
  if (!tr) { openDetail(type, id); return; }   // fall back to the modal

  /* collapse any currently-open expander (including this one → toggle off).
     Search globally: each type section is its own <table>, so tr.parentNode
     would miss an expander open in a different section. */
  var existing = document.querySelector('tr.ah-detail-row');
  var wasThis = existing && existing.previousElementSibling === tr;
  if (existing) existing.parentNode.removeChild(existing);
  /* reset every open trigger's state, then re-set only if we're opening */
  document.querySelectorAll('.ah-tr.expanded').forEach(function(r) {
    r.classList.remove('expanded');
    var trig = r.querySelector('.ah-td.title'); if (trig) trig.setAttribute('aria-expanded', 'false');
  });
  if (wasThis) { _openRow = null; return; }

  var cols = tr.children.length;
  var det = document.createElement('tr');
  det.className = 'ah-detail-row';
  det.innerHTML = '<td class="ah-detail-cell" colspan="' + cols + '">' +
    '<div class="ah-detail-box" id="ahDetailBox">' +
    '<div class="ah-loading" style="padding:14px 0">Loading…</div></div></td>';
  tr.parentNode.insertBefore(det, tr.nextSibling);
  tr.classList.add('expanded');
  el.setAttribute('aria-expanded', 'true');
  _openRow = id;

  if (type === 'NC') {
    google.script.run
      .withSuccessHandler(function(d) { renderNcDetail(d, 'ahDetailBox'); })
      .withFailureHandler(function(e) {
        var b = document.getElementById('ahDetailBox');
        if (b) b.innerHTML = '<div class="ah-loading" style="color:var(--score-red)">' + escHtml(friendlyError_(e)) + '</div>';
      })
      .getNcDetail(id);
  } else if (type === 'AUDIT') {
    /* The Audits tab already renders full per-criterion detail (scores, Hindi
       labels, remarks, photos, share links) inside openAuditDetail's modal.
       Reuse it rather than growing a second renderer that would drift out of
       step -- so the inline expander is dropped and the modal opens instead. */
    var det0 = document.querySelector('tr.ah-detail-row');
    if (det0) det0.parentNode.removeChild(det0);
    tr.classList.remove('expanded');
    el.setAttribute('aria-expanded', 'false');
    _openRow = null;
    openAuditDetail(id);
    return;
  } else if (type === 'KAIZEN' || type === 'GEMBA') {
    /* Neither is a task, so the task detail body would render mostly blanks.
       Both already have a proper read-only record page (findings, savings,
       photos) -- show the essentials here and send the reader there for the
       rest. Relative URL: this page is served from the same /exec. */
    var box2 = document.getElementById('ahDetailBox');
    var it = findItem_(id) || {};
    var rt = (type === 'KAIZEN') ? 'kaizen' : 'gemba';
    var url = '?v2=1&action=record&type=' + rt + '&id=' + encodeURIComponent(id);
    if (box2) {
      box2.innerHTML =
        '<div class="rc-hero"><span class="rc-id">' + escHtml(id) + '</span></div>' +
        (it.description ? '<div class="rc-desc">' + escHtml(it.description) + '</div>' : '') +
        '<div class="ah-card__actions">' +
          '<button class="ah-ibtn start" data-url="' + escHtml(url) + '"' +
            ' onclick="event.stopPropagation();top.location.href=this.dataset.url;">' +
            '<span class="ah-ibtn-ic" aria-hidden="true">&#128196;</span>' +
            '<span class="ah-ibtn-lbl">' +
              (type === 'GEMBA' ? 'Open walk — every finding' : 'Open full record') +
            '</span></button>' +
        '</div>';
    }
  } else {
    var box = document.getElementById('ahDetailBox');
    if (box) box.innerHTML = buildTaskDetailBody_(findItem_(id));
  }
}

/* ── open detail (modal — kept for non-table callers) ── */
function openDetail(type, id) {
  if (type === 'NC') {
    openNcDetail(id);
  } else {
    openInlineDetail(type, id);
  }
}

/* ── NC detail modal ── */
function openNcDetail(id) {
  var modal    = document.getElementById('recordDetailModal');
  var backdrop = document.getElementById('rdBackdrop');
  var body     = document.getElementById('recordDetailBody');
  body.innerHTML = '<div class="ah-loading" style="padding:30px 0">Loading…</div>';
  modal.classList.add('open');
  backdrop.classList.add('open');
  google.script.run
    .withSuccessHandler(renderNcDetail)
    .withFailureHandler(function(e) {
      document.getElementById('recordDetailBody').innerHTML =
        '<div class="ah-loading" style="color:var(--score-red)">' + escHtml(friendlyError_(e)) + '</div>';
    })
    .getNcDetail(id);
}

function closeNcDetail() {
  document.getElementById('recordDetailModal').classList.remove('open');
  document.getElementById('rdBackdrop').classList.remove('open');
}

/* Renders into the modal body (default) or any element id passed as targetId,
   so the inline expander and the modal share one renderer. */
function renderNcDetail(d, targetId) {
  var body = document.getElementById(targetId || 'recordDetailBody');
  if (!body) return;
  if (!d) { body.innerHTML = '<div class="ah-loading">Record not found.</div>'; return; }
  function cell(icon, val, wide) {
    if (val === null || val === undefined || val === '') return '';
    return '<div class="rc-cell' + (wide ? ' wide' : '') + '"><span class="rc-ic">' + icon +
      '</span><span class="rc-v">' + escHtml(String(val)) + '</span></div>';
  }
  function para(key, val) {
    if (val === null || val === undefined || val === '') return '';
    return '<div class="rc-para"><span class="rc-k">' + escHtml(key) + '</span>' +
           '<span class="rc-pv">' + escHtml(String(val)) + '</span></div>';
  }
  var zone = d.zoneName || d.zoneId;
  /* Status, zone, owner and the description-as-title are all on the row this
     expander opens directly under, so they are NOT repeated here. Repeat is
     kept — it is a flag the row cannot show. Pillar / score / target come from
     the full-detail fetch and appear nowhere else. */
  var badges = '';
  if (d.isRepeat) badges += '<span class="rc-repeat">&#128257; Repeat' + (d.recurrenceCount ? ' ×' + escHtml(String(d.recurrenceCount)) : '') + '</span>';
  var html = '<div class="rc-hero">' +
    '<span class="rc-id">' + escHtml(d.id) + '</span>' +
    '<span class="rc-badges">' + badges + '</span></div>';

  /* THE FINDING — what was observed. Leads because it is the reason the record
     exists; everything below is context or response. */
  var score = (d.scoreGiven === null || d.scoreGiven === undefined || d.scoreGiven === '')
                ? '' : (d.scoreGiven + ' / 4');
  html += section_('The finding',
    '<dl class="rc-fields">' +
      /* Rows created before v250 stored the PILLAR in the criterion column, so
         both fields render the same value ("S1 / S1"). Show Criterion only when
         it is a real criterion id (S1-C2), otherwise fall through to Pillar. */
      field_('Criterion', /-/.test(d.criterionId || '') ? d.criterionId : '', { mono: true }) +
      field_('Pillar', d.pillar) +
      field_('Score', score) +
      field_('Due', fmtDate_(d.targetDate)) +
    '</dl>');

  if (d.zoneId && d.auditDate) {
    /* The session token lives only in the page URL — this page keeps no copy —
       so it is read back from there and carried forward, otherwise the gated
       audit page bounces to login. Inside the GAS sandbox the top frame holds
       the real /exec URL, so read that and fall back to our own. */
    var tok = '';
    try {
      var href = (window.top !== window ? document.referrer : location.href) || location.href;
      var m = href.match(/[?&]token=([^&#]+)/);
      if (m) tok = m[1];
    } catch (e) {}
    var auditHref = '?v2=1&action=audithistory&zone=' + encodeURIComponent(d.zoneId) +
      (tok ? '&token=' + tok : '');
    html += '<div class="rc-src"><a href="' + escHtml(auditHref) + '" target="_top">' +
      '&#128203; View source audit &middot; ' + escHtml(d.zoneId) + ' &middot; ' +
      escHtml(fmtDate_(d.auditDate)) + '</a></div>';
  }

  /* EVIDENCE — the NC path fetches its own detail and never rendered photos,
     which is why images attached to an NC were invisible while the same photos
     showed fine on Tasks and Red Tags. */
  html += photoStrip_(d.photoUrls);

  /* THE RESPONSE — what is being done about it. */
  html += section_('Root cause analysis',
    para('Root cause', d.rootCause) +
    para('Corrective action', d.correctiveAction) +
    para('Preventive action', d.preventiveAction));

  /* THE TRAIL — who and when. Dates formatted, every value labelled. */
  html += section_('Audit & verification',
    '<dl class="rc-fields">' +
      field_('Raised by', d.auditor) +
      field_('Audit date', fmtDate_(d.auditDate)) +
      field_('Created', fmtDate_(d.createdDate)) +
      field_('Closed', fmtDate_(d.closureDate)) +
      field_('Verified by', d.verifiedBy) +
    '</dl>' + para('Remarks', d.verificationRemarks));

  var ncAction = { type: 'NC', id: d.id, title: d.description, status: d.status, zone: zone };
  html += '<div class="ah-card__actions">' + buildActionIcons(ncAction) + '</div>';
  body.innerHTML = html;
}

/* ── Inline detail (TASK / RED_TAG) ── */
/* Detail body for a TASK / RED_TAG row. Shared by the inline expander and the
   modal so both render identically. */
function buildTaskDetailBody_(item) {
  if (!item) return '<div class="ah-loading">Detail not available.</div>';
  function cell(icon, val, wide) {
    if (val === null || val === undefined || val === '') return '';
    return '<div class="rc-cell' + (wide ? ' wide' : '') + '"><span class="rc-ic">' + icon +
      '</span><span class="rc-v">' + escHtml(String(val)) + '</span></div>';
  }
  /* The expander sits DIRECTLY under its row, which already shows title, zone,
     owner, due, age, priority and status. Repeating all of that was the bulk
     of the redundancy — so this renders only what the row cannot: the record
     id, the description, and the actions. */
  var h = '<div class="rc-hero"><span class="rc-id">' + escHtml(item.id) + '</span></div>';

  if (item.description) h += '<div class="rc-desc">' + escHtml(item.description) + '</div>';

  h += photoStrip_(item.photos);

  h += '<div class="ah-card__actions">' + buildActionIcons(item) + '</div>';
  return h;
}

function findItem_(id) {
  if (!window._lastItems) return null;
  for (var i = 0; i < _lastItems.length; i++) if (_lastItems[i].id === id) return _lastItems[i];
  return null;
}

function openInlineDetail(type, id) {

function onRcaInput() {
  var len = document.getElementById('rcaRootCause').value.length;

  if (rootCause.length < 50) {

  }
  var btn = document.getElementById('rcaSubmitBtn');

    .updateCAPAStatus(id, 'IN_PROGRESS', '', startRemark, {
      root_cause: rootCause,
      corrective_action: correctiveAction,
      responsible: document.getElementById('rcaOwner').value.trim(),
      target_date: document.getElementById('rcaTarget').value,
      start_photos_b64: _rcaPhotos.map(acMediaPayload_).filter(Boolean)
    });

var _ncvRaisedBy = '';

/* Enables submit only when the three required fields are filled, and warns
   BEFORE submission if the verifier looks like the person responsible - the
   server enforces 4-eyes and would otherwise reject after a round trip. */
function onNcvInput() {

    !(corrective && preventive && verifier) || clash;

function ncvPickPhoto() {

}

function ncvOnPhotoPicked(input) {

      zone:    '',

function ncvRenderPhotos() {
  document.getElementById('ncvPhotoStrip').innerHTML = _ncvPhotos.map(function(ph, i) {
    return acThumb_(ph, i, 'ncvRemovePhoto');
  }).join('');
  var add = document.getElementById('ncvPhotoAdd');
  add.disabled = _ncvPhotos.length >= AC_MAX_PHOTOS;
  var kb = _ncvPhotos.reduce(function(n, ph) { return n + pmDataUrlKB(ph.dataUrl); }, 0);
  document.getElementById('ncvPhotoNote').textContent =
    _ncvPhotos.length ? _ncvPhotos.length + ' photo(s) \u00b7 ' + kb + ' KB total' : '';
}

function ncvRemovePhoto(i) { _ncvPhotos.splice(i, 1); ncvRenderPhotos(); }

function submitNcVerify() {
  if (!_ncvPendingId) return;
  var id         = _ncvPendingId;
  var corrective = document.getElementById('ncvCorrective').value.trim();
  var preventive = document.getElementById('ncvPreventive').value.trim();
  var verifier   = document.getElementById('ncvVerifiedBy').value.trim();
  var vdate      = document.getElementById('ncvDate').value;
  var remarks    = document.getElementById('ncvRemarks').value.trim();
  if (!corrective || !preventive || !verifier) {

    return;
  }
  var btn = document.getElementById('ncvSubmitBtn');
  btn.disabled = true; btn.textContent = 'Closing\u2026';

  /* The verification date is carried in the remark rather than a column of its
     own: NC_CAPA has closure_date (stamped server-side) and
     verification_remarks, but no verification_date field. Keeping it in the
     remark means it survives without a schema migration. */
  var fullRemarks = (vdate ? 'Verified ' + vdate + (remarks ? ' \u2014 ' : '') : '') + remarks;

  google.script.run
    .withSuccessHandler(function(result) {
      btn.disabled = false; btn.textContent = '\u2713 Verify & Close';
      if (result && result.success) {
        showToast('NC closed and verified.', 'success');
        closeNcVerifyModal();
        closeAllDetailModals_(); fetchAndRender(false, true);
      } else {
        showToast((result && result.message) || 'Failed to close NC.', 'error');
      }
    })
    .withFailureHandler(function(e) {
      btn.disabled = false; btn.textContent = '\u2713 Verify & Close';
      showToast(friendlyError_(e), 'error');
    })
    .updateCAPAStatus(id, 'CLOSED', verifier, fullRemarks, {
      corrective_action: corrective,
      preventive_action: preventive,
      closure_photos_b64: _ncvPhotos.map(acMediaPayload_).filter(Boolean)
    });
}

/* ── Optimistic status updates ────────────────────────────────────────────
   A status button used to: disable itself, wait for the write (~9s, of which
   ~6s was an external DWM/Telegram call), then blank the whole list to
   "Loading…" and wait again for a full re-fetch (~5s). 14s of dead time for a
   one-field change, and the list you were reading disappeared meanwhile.

   Now the row is updated in place immediately and the write goes out in the
   background. The server response only confirms; on failure the row is rolled
   back to exactly what it was and the error is shown.

   Rollback is IDENTITY-based (find the row by data-id), never index-based: a
   background refresh may have reordered the list by the time the reply lands.
   The slow notifications were moved server-side into 09b_DeferredNotify.js. */
var _pendingOps = 0;

/** The <tr> for a record id, or null if it is no longer on screen. @private */
function rowFor_(id) {
  return document.querySelector('.ah-tr[data-id="' + String(id).replace(/"/g, '\\"') + '"]');
}

/** Repaints one row's status pill + action buttons without a re-fetch. @private */
function paintRowStatus_(id, status, rawStatus) {
  var tr = rowFor_(id);
  if (!tr) return null;
  var before = tr.innerHTML;
  var cell = tr.querySelector('[data-label="Status"]');
  if (cell) {
    cell.innerHTML = '<span class="status-lbl ' + escHtml(status) + '">' +
      escHtml(statusLabel(status)) + '</span>';
  }
  /* Closed/done records stop being overdue - clear the rail and the Due flag. */
  if (status === 'CLOSED') {
    tr.removeAttribute('data-overdue');
    var due = tr.querySelector('.ah-due-late');
    if (due) due.parentNode.removeChild(due);
  }
  tr.classList.add('ah-tr-pending');
  return before;
}

/** Restores a row after a failed write. @private */
function rollbackRow_(id, html) {
  var tr = rowFor_(id);
  if (tr && html != null) {
    tr.innerHTML = html;
    tr.classList.remove('ah-tr-pending');
    tr.classList.remove('ah-tr-leaving');
  }
}

/**
 * Runs a status change optimistically.
 * @param {Object} o {id, status, rawStatus, fn, args, okMsg, failMsg}
 */
function optimisticStatus_(o) {
  var snapshot = paintRowStatus_(o.id, o.status, o.rawStatus);
  _pendingOps++;
  closeAllDetailModals_();

  /* A started record leaves the Open tab, which looked like the row had simply
     vanished. Mark it as departing so it visibly slides out rather than being
     yanked, and name its destination in the toast. */
  var leavingTab = (_filters.status && _filters.status !== o.status);
  if (leavingTab) {
    var tr = rowFor_(o.id);
    if (tr) tr.classList.add('ah-tr-leaving');
  }

  google.script.run
    .withSuccessHandler(function(result) {
      _pendingOps--;
      var ok = result && (result.success || result.ok);
      if (ok) {
        var tr = rowFor_(o.id);
        if (tr) tr.classList.remove('ah-tr-pending');
        showToast(o.okMsg + (leavingTab ? ' Moved to ' + statusLabel(o.status) + '.' : ''),
                  'success');
        /* Reconcile quietly once the queue is idle: counts/badges and any
           server-side derived fields still need to catch up, but the user is
           no longer waiting on it. */
        if (_pendingOps === 0) scheduleQuietRefresh_();
      } else {
        rollbackRow_(o.id, snapshot);
        showToast((result && result.message) || o.failMsg, 'error');
      }
    })
    .withFailureHandler(function(e) {
      _pendingOps--;
      var back = rowFor_(o.id);
      if (back) back.classList.remove('ah-tr-leaving');
      rollbackRow_(o.id, snapshot);
      showToast(friendlyError_(e), 'error');
    })[o.fn].apply(null, o.args);
}

/* Refresh without blanking the list: the old path replaced #ahContent with a
   "Loading…" spinner, so a reconcile threw away whatever the user was reading. */
var _quietTimer = null;
function scheduleQuietRefresh_() {
  clearTimeout(_quietTimer);
  _quietTimer = setTimeout(function() { fetchAndRender(true, true); }, 400);
}

/* ── TASK status ── */
function doTaskStatus(id, newStatus, btn) {
